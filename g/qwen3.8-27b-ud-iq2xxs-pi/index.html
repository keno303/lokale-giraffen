<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Giraffe in the Savanna — Three.js</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a140a; }
  canvas { display: block; }
  #hud {
    position: fixed; top: 12px; left: 12px; z-index: 10; pointer-events: none;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12.5px; color: #332410;
    background: rgba(255, 247, 220, 0.66);
    padding: 10px 14px; border-radius: 10px;
    box-shadow: 0 2px 14px rgba(0,0,0,0.25);
  }
  #hud b { font-size: 15px; display: block; margin-bottom: 3px; }
  #hud .row { margin-top: 4px; }
  #info {
    position: fixed; inset: 0; display: none;
    z-index: 20; background: rgba(20,14,6,0.92);
    color: #f2e8c9; font-family: ui-monospace, monospace; font-size: 14px;
    padding: 40px; white-space: pre-wrap;
  }
</style>
</head>
<body>
<div id="hud">
  <b>🦒 Giraffe in the Savanna</b>
  <div class="row">Aim with the mouse — she walks toward the pointer</div>
  <div class="row"><b>Space</b> stand / walk &nbsp; <b>↑/↓ or W/S</b> speed &nbsp; <span id="state">·</span></div>
</div>
<div id="info"></div>
<noscript><div style="color:#fff;padding:40px;font-family:monospace">This page requires JavaScript.</div></noscript>
<script src="three.min.js"></script>
<script>
"use strict";
(function () {

  const infoEl = document.getElementById("info");
  function fail(msg) {
    infoEl.textContent = msg;
    infoEl.style.display = "block";
  }

  // If the local (serverless, no-build) three.min.js is missing, fall back to the CDN.
  if (typeof THREE === "undefined") {
    const s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.147.0/three.min.js";
    s.onload = boot;
    s.onerror = () => fail("Could not load three.js — neither the local three.min.js nor the CDN was reachable.");
    document.head.appendChild(s);
    return;
  }

  function boot() {
    try {
      start();
    } catch (e) {
      console.error(e);
      fail("Error: " + (e && e.message ? e.message : String(e)));
    }
  }

  function start() {
    /* ---------- renderer / scene / camera ---------- */
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    if (!renderer.getContext()) {
      fail("WebGL is not available in this browser.");
      return;
    }
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.02;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = makeSkyTexture();
    scene.fog = new THREE.Fog(0xe6d6a8, 35, 115);

    const camera = new THREE.PerspectiveCamera(48, window.innerWidth / window.innerHeight, 0.1, 400);
    camera.position.set(12, 8, 22);

    /* ---------- lighting ---------- */
    scene.add(new THREE.HemisphereLight(0xcfe4ff, 0x8a6f42, 0.55));
    scene.add(new THREE.AmbientLight(0xfff2d0, 0.12));
    const sun = new THREE.DirectionalLight(0xffdfae, 1.3);
    sun.position.set(40, 38, -24);
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.bias = -0.0008;
    sun.shadow.camera.near = 5;
    sun.shadow.camera.far = 140;
    sun.shadow.camera.left = -55; sun.shadow.camera.right = 55;
    sun.shadow.camera.top = 55;   sun.shadow.camera.bottom = -55;
    scene.add(sun, sun.target);

    /* ---------- sky & ground ---------- */
    function makeSkyTexture() {
      const c = document.createElement("canvas");
      c.width = 16; c.height = 256;
      const g = c.getContext("2d");
      const grad = g.createLinearGradient(0, 0, 0, 256);
      grad.addColorStop(0.00, "#5f8ecf");
      grad.addColorStop(0.45, "#a8c6e0");
      grad.addColorStop(0.78, "#efd9a4");
      grad.addColorStop(1.00, "#f6e7b8");
      g.fillStyle = grad;
      g.fillRect(0, 0, 16, 256);
      const tex = new THREE.CanvasTexture(c);
      tex.encoding = THREE.sRGBEncoding;
      return tex;
    }

    function makeGroundTexture() {
      const s = 1024;
      const c = document.createElement("canvas");
      c.width = c.height = s;
      const g = c.getContext("2d");
      g.fillStyle = "#a08c5a";
      g.fillRect(0, 0, s, s);
      const palette = [
        "#8d7c4b", "#ab9866", "#7c6a3e", "#b3a274", "#9a8a54", "#75633a"
      ];
      for (let i = 0; i < 9000; i++) {
        g.globalAlpha = 0.4 + Math.random() * 0.5;
        g.fillStyle = palette[(Math.random() * palette.length) | 0];
        g.beginPath();
        g.ellipse(Math.random() * s, Math.random() * s,
          Math.random() * 22 + 2, Math.random() * 12 + 2,
          Math.random() * Math.PI, 0, Math.PI * 2);
        g.fill();
      }
      g.globalAlpha = 1;
      for (let i = 0; i < 2500; i++) {
        const x = Math.random() * s, y = Math.random() * s;
        if (Math.random() < 0.6) {
          g.strokeStyle = Math.random() < 0.5 ? "#7a7c46" : "#5d5c3a";
          g.lineWidth = 1;
          g.beginPath();
          g.moveTo(x, y);
          g.lineTo(x + (Math.random() * 6 - 3), y - (4 + Math.random() * 6));
          g.stroke();
        }
      }
      const tex = new THREE.CanvasTexture(c);
      tex.encoding = THREE.sRGBEncoding;
      tex.anisotropy = 4;
      return tex;
    }

    const ground = new THREE.Mesh(
      new THREE.CircleGeometry(60, 72),
      new THREE.MeshStandardMaterial({ map: makeGroundTexture(), roughness: 1 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    /* ---------- scattered savanna (trees, rocks, grass) ---------- */
    const barkMat   = new THREE.MeshStandardMaterial({ color: 0x6d5238, roughness: 1 });
    const leafMatA  = new THREE.MeshStandardMaterial({ color: 0x5a6b3a, roughness: 1 });
    const leafMatB  = new THREE.MeshStandardMaterial({ color: 0x4d5c33, roughness: 1 });
    const rockMat   = new THREE.MeshStandardMaterial({ color: 0x9b8f7d, roughness: 1 });
    const grassMat  = new THREE.MeshStandardMaterial({ color: 0x75864a, roughness: 1 });

    function randPolar(min, max) {
      const r = Math.sqrt(Math.random() * (max * max - min * min) + min * min);
      const a = Math.random() * Math.PI * 2;
      return { x: Math.cos(a) * r, z: Math.sin(a) * r };
    }

    (function makeTree(x, z, s) {
      const g = new THREE.Group();
      const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.12 * s, 0.3 * s, 3.2 * s, 8), barkMat);
      trunk.position.y = 1.6 * s;
      trunk.castShadow = trunk.receiveShadow = true;
      g.add(trunk);
      for (let i = 0; i < 3; i++) {
        const m = new THREE.Mesh(new THREE.SphereGeometry((1.4 + Math.random() * 0.6) * s, 12, 8),
          Math.random() < 0.5 ? leafMatA : leafMatB);
        m.scale.set(1.5 + Math.random() * 0.7, 0.45, 1.5 + Math.random() * 0.7);
        m.position.set((Math.random() - 0.5) * 2.4 * s, (2.9 + i * 0.35) * s, (Math.random() - 0.5) * 2.4 * s);
        m.castShadow = m.receiveShadow = true;
        g.add(m);
      }
      g.position.set(x, 0, z);
      scene.add(g);
    });

    const rockGeo = new THREE.DodecahedronGeometry(0.5);
    for (let i = 0; i < 12; i++) {
      const p = randPolar(10, 50);
      const rock = new THREE.Mesh(rockGeo, rockMat);
      const sc = 0.35 + Math.random() * 1.1;
      rock.scale.set(sc * (0.8 + Math.random() * 0.6), sc * (0.7 + Math.random() * 0.5), sc * (0.8 + Math.random() * 0.6));
      rock.rotation.set(Math.random() * 0.4, Math.random() * 3, Math.random() * 0.4);
      rock.position.y = sc * 0.25;
      rock.castShadow = rock.receiveShadow = true;
      scene.add(rock);
    }

    // grass tufts, instanced (1 draw call)
    (function makeGrass() {
      const geo = new THREE.ConeGeometry(0.05, 0.42, 5);
      const N = 340;
      const im = new THREE.InstancedMesh(geo, grassMat, N);
      const m = new THREE.Matrix4();
      const q = new THREE.Quaternion();
      const col = new THREE.Color();
      for (let i = 0; i < N; i++) {
        const p = randPolar(6, 56);
        const sc = 0.6 + Math.random() * 1.1;
        q.setFromEuler(new THREE.Euler((Math.random() - 0.5) * 0.3, Math.random() * 3, (Math.random() - 0.5) * 0.5));
        m.compose(new THREE.Vector3(p.x, 0.19 * sc, p.z), q, new THREE.Vector3(sc, sc, sc));
        im.setMatrixAt(i, m);
        col.setHex(0x75864a).offsetHSL(0, 0, Math.random() * 0.14 - 0.05).getHex();
        im.setColorAt(i, col);
      }
      im.castShadow = true;
      scene.add(im);
    })();

    /* ---------- giraffe coat textures (procedural spots) ---------- */
    function makeSpotsTexture(o) {
      const w = 1024;
      const c = document.createElement("canvas");
      c.width = c.height = w;
      const g = c.getContext("2d");
      g.fillStyle = o.base;
      g.fillRect(0, 0, w, w);
      // soft mottling
      for (let i = 0; i < 420; i++) {
        g.globalAlpha = 0.05 + Math.random() * 0.08;
        g.fillStyle = Math.random() < 0.5 ? "#ffffff" : "#8a6a3a";
        g.beginPath();
        g.ellipse(Math.random() * w, Math.random() * w,
          Math.random() * 60 + 10, Math.random() * 30 + 6,
          Math.random() * Math.PI, 0, Math.PI * 2);
        g.fill();
      }
      g.globalAlpha = 1;
      const count = Math.round(180 * (o.density || 1));
      for (let i = 0; i < count; i++) {
        const x = Math.random() * w, y = Math.random() * w;
        const r = (Math.random() * Math.random()) * (o.rmax || 46) + (o.rmin || 12);
        g.fillStyle = Math.random() < 0.7 ? o.spot : o.spot2;
        for (let k = 0; k < 5; k++) {
          const a = Math.random() * Math.PI * 2, d = Math.random() * r * 0.5;
          g.beginPath();
          g.ellipse(x + Math.cos(a) * d, y + Math.sin(a) * d,
            r * 0.55 + Math.random() * r * 0.4, r * 0.45 + Math.random() * r * 0.35,
            Math.random() * Math.PI, 0, Math.PI * 2);
          g.fill();
        }
        // darker core
        g.fillStyle = "rgba(0,0,0,0.18)";
        g.beginPath();
        g.ellipse(x, y, r * 0.45, r * 0.4, 0, 0, Math.PI * 2);
        g.fill();
      }
      const tex = new THREE.CanvasTexture(c);
      tex.encoding = THREE.sRGBEncoding;
      tex.anisotropy = 4;
      return tex;
    }

    const spotsBody = makeSpotsTexture({ base: "#d8a95e", spot: "#5f3418", spot2: "#4a2c16", rmax: 52, rmin: 14, density: 1.35 });
    const spotsNeck = makeSpotsTexture({ base: "#d5a75c", spot: "#5f3418", spot2: "#4a2c16", rmax: 36, rmin: 10, density: 1.15 });

    const coat      = new THREE.MeshStandardMaterial({ map: spotsBody, roughness: 0.95 });
    const neckCoat  = new THREE.MeshStandardMaterial({ map: spotsNeck, roughness: 0.95 });
    const headMat   = new THREE.MeshStandardMaterial({ color: 0xd5a75c, roughness: 0.95 });
    const darkMat   = new THREE.MeshStandardMaterial({ color: 0x241a12, roughness: 0.85 });
    const maneMat   = new THREE.MeshStandardMaterial({ color: 0x2f2013, roughness: 0.9 });
    const eyeWhite  = new THREE.MeshStandardMaterial({ color: 0xf2eedd, roughness: 0.6 });
    const eyeBlack  = new THREE.MeshBasicMaterial({ color: 0x141414 });
    const hoofMat   = new THREE.MeshStandardMaterial({ color: 0x221711, roughness: 0.55 });

    /* ---------- giraffe rig ---------- */
    const giraffe = new THREE.Group();
    const BASE_HIP_Y = 2.15;            // root height: body centerline
    giraffe.position.set(0, BASE_HIP_Y, 6);
    scene.add(giraffe);

    // torso (long axis along z: chest at -z, rump at +z)
    const body = new THREE.Group();
    giraffe.add(body);

    const torso = new THREE.Mesh(new THREE.CapsuleGeometry(0.5, 1.5, 6, 14), coat);
    torso.rotation.x = Math.PI / 2;
    body.add(torso);
    function addSphere(geo, mat, x, y, z, sx, sy, sz) {
      const m = new THREE.Mesh(geo, mat);
      m.position.set(x, y, z);
      m.scale.set(sx, sy, sz);
      body.add(m);
      return m;
    }
    const chestSphere = new THREE.SphereGeometry(0.45, 14, 12);
    addSphere(chestSphere, coat, 0, 0.05, -0.35, 1.15, 1.05, 1.25);
    addSphere(new THREE.SphereGeometry(0.47, 14, 12), coat, 0, -0.18, 0.10, 1.0, 0.85, 1.35);
    addSphere(new THREE.SphereGeometry(0.48, 14, 12), coat, 0, -0.05, 0.55, 1.05, 1.05, 1.2);
    addSphere(new THREE.SphereGeometry(0.36, 12, 10), coat,  0.30, -0.12, 0.42, 1, 1, 1); // hip pad R
    addSphere(new THREE.SphereGeometry(0.36, 12, 10), coat, -0.30, -0.12, 0.42, 1, 1, 1); // hip pad L
    addSphere(new THREE.SphereGeometry(0.38, 12, 10), coat,  0.28, 0.02, -0.38, 1, 1, 1); // shoulder R
    addSphere(new THREE.SphereGeometry(0.38, 12, 10), coat, -0.28, 0.02, -0.38, 1, 1, 1); // shoulder L

    /* legs: hip (swing around x), knee (flex around x), cannon, hoof.
       Standing height: hips at -0.39 with root at 2.15 -> hips at 1.76, feet at 0.03 above ground. */
    function makeLeg(x, z) {
      const hip = new THREE.Group();
      hip.position.set(x, -0.39, z);
      body.add(hip);

      const upper = new THREE.Mesh(new THREE.CylinderGeometry(0.30, 0.19, 0.95, 12, 1, true), coat);
      upper.position.y = -0.475;
      hip.add(upper);

      const knee = new THREE.Group();
      knee.position.y = -0.95;
      hip.add(knee);
      knee.add(new THREE.Mesh(new THREE.SphereGeometry(0.21, 12, 10), coat)); // elbow pad

      const cannon = new THREE.Group();
      cannon.rotation.x = 0.0;  // cannon aligned with knee (foot trajectory validated numerically)
      knee.add(cannon);
      cannon.add((function () {
        const m = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.115, 0.78, 12, 1, true), coat);
        m.position.y = -0.39;
        return m;
      })());
      const ankle = new THREE.Mesh(new THREE.SphereGeometry(0.125, 12, 10), coat);
      ankle.position.y = -0.78;
      cannon.add(ankle);
      const hoof = new THREE.Mesh(new THREE.SphereGeometry(0.105, 10, 10), hoofMat);
      hoof.scale.set(0.8, 1.0, 1.35);
      hoof.position.y = -0.80;
      cannon.add(hoof);

      hip.userData.knee = knee;
      return hip;
    }

    const legs = {
      FL: makeLeg(-0.34, -0.38),   // front left
      FR: makeLeg( 0.34, -0.38),   // front right
      BL: makeLeg(-0.36,  0.40),   // back left
      BR: makeLeg( 0.36,  0.40)    // back right
    };

    /* neck chain */
    const neckRoot = new THREE.Group();
    neckRoot.position.set(0, 0.30, -0.55);
    neckRoot.rotation.x = -0.16;
    body.add(neckRoot);

    const lowerNeck = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.29, 1.0, 12, 1, true), neckCoat);
    lowerNeck.position.y = 0.5;
    const neckJoint = new THREE.Mesh(new THREE.SphereGeometry(0.255, 12, 10), neckCoat);
    neckJoint.position.y = 1.0;
    neckRoot.add(neckJoint);
    neckRoot.add(lowerNeck);
    // mane strip on the back of the neck
    const maneA = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.04, 0.5), maneMat);
    maneA.position.set(0.03, 0.30, 0.13);
    maneA.rotation.x = -0.30;
    neckRoot.add(maneA);

    const midNeck = new THREE.Group();
    midNeck.position.y = 1.0;
    midNeck.rotation.x = -0.14;
    neckRoot.add(midNeck);
    const upperNeck = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.26, 0.72, 12, 1, true), neckCoat);
    upperNeck.position.y = 0.36;
    midNeck.add(upperNeck);
    const maneB = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.04, 0.35), maneMat);
    maneB.position.set(0.025, 0.20, 0.13);
    maneB.rotation.x = -0.30;
    midNeck.add(maneB);
    const maneC = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.04, 0.3), maneMat);
    maneC.position.set(0.02, 0.55, 0.125);
    maneC.rotation.x = -0.30;
    midNeck.add(maneC);

    const head = new THREE.Group();
    head.position.y = 0.72;
    midNeck.add(head);

    /* head */
    addSphereToHead(new THREE.SphereGeometry(0.26, 14, 12), headMat, 0, 0.08, -0.05, 1.15, 0.82, 1.0);   // cranium
    addSphereToHead(new THREE.SphereGeometry(0.155, 12, 10), headMat, 0, -0.10, -0.34, 1.15, 0.85, 1.05); // muzzle
    addSphereToHead(new THREE.SphereGeometry(0.13, 12, 10),  headMat, 0, -0.24, -0.20, 1.05, 0.68, 0.85); // jaw
    function addSphereToHead(geo, mat, x, y, z, sx, sy, sz) {
      const m = new THREE.Mesh(geo, mat);
      m.position.set(x, y, z);
      m.scale.set(sx, sy, sz);
      head.add(m);
      return m;
    }
    // nostrils
    const nostrilGeo = new THREE.SphereGeometry(0.035, 8, 8);
    for (const sx of [-1, 1]) {
      const n = new THREE.Mesh(nostrilGeo, darkMat);
      n.position.set(0.045 * sx, -0.16, -0.48);
      head.add(n);
    }
    // eyes (blink = squash)
    function makeEye(sx) {
      const eye = new THREE.Group();
      eye.position.set(0.17 * sx, 0.16, -0.34);
      const sclera = new THREE.Mesh(new THREE.SphereGeometry(0.058, 10, 10), eyeWhite);
      sclera.scale.set(0.95, 1, 0.85);
      eye.add(sclera);
      const pupil = new THREE.Mesh(new THREE.SphereGeometry(0.042, 10, 10), eyeBlack);
      pupil.position.z = -0.04;
      pupil.scale.set(0.85, 0.9, 0.8);
      eye.add(pupil);
      head.add(eye);
      return eye;
    }
    const eyeL = makeEye(-1);
    const eyeR = makeEye(1);
    // ossicons (horns)
    const ossiGeo = new THREE.ConeGeometry(0.03, 0.34, 8);
    const ossiBaseGeo = new THREE.SphereGeometry(0.05, 10, 10);
    for (const sx of [-1, 1]) {
      const og = new THREE.Mesh(ossiGeo, darkMat);
      og.position.set(0.05 * sx, 0.33, -0.14);
      og.rotation.z = -0.12 * sx;
      head.add(og);
      const ob = new THREE.Mesh(ossiBaseGeo, darkMat);
      ob.position.set(0.05 * sx, 0.30, -0.14);
      head.add(ob);
    }
    // ears
    const earGeo = new THREE.SphereGeometry(0.11, 10, 10);
    for (const sx of [-1, 1]) {
      const ear = new THREE.Mesh(earGeo, coat);
      ear.scale.set(1.2, 0.75, 0.5);
      ear.position.set(0.18 * sx, 0.22, 0.05);
      ear.rotation.set(-0.2, 0.5 * sx, -0.25 * sx);
      head.add(ear);
    }
    // head mane
    const headMane = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.05, 0.45), maneMat);
    headMane.position.set(0, 0.30, 0.05);
    headMane.rotation.x = -0.25;
    head.add(headMane);

    /* tail */
    const tailG = new THREE.Group();
    tailG.position.set(0, -0.12, 0.78);
    tailG.rotation.x = -0.55;
    body.add(tailG);
    const tailSeg = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.09, 0.6, 8), coat);
    tailSeg.position.y = -0.3;
    tailG.add(tailSeg);
    const tuft = new THREE.Mesh(new THREE.SphereGeometry(0.085, 10, 10), darkMat);
    tuft.scale.set(0.9, 1.3, 0.9);
    tuft.position.y = -0.62;
    tailG.add(tuft);

    /* ---------- state & input ---------- */
    const state = {
      pos: new THREE.Vector3(0, BASE_HIP_Y, 6),
      yaw: 0,
      targetYaw: 0,
      speed: 0,
      targetSpeed: 1.0,
      walking: true,
      stridePhase: 0,
      nextBlink: 2.5,
      blink: 0
    };
    const hudState = document.getElementById("state");

    const ray = new THREE.Raycaster();
    const ndc = new THREE.Vector2();
    function steerFromScreen(cx, cy) {
      ndc.set((cx / window.innerWidth) * 2 - 1, -(cy / window.innerHeight) * 2 + 1);
      ray.setFromCamera(ndc, camera);
      if (ray.ray.direction.y < 0) {
        const d = -ray.ray.origin.y / ray.ray.direction.y;
        if (d > 0) {
          const p = ray.ray.origin.clone().addScaledVector(ray.ray.direction, d);
          const dir = p.clone().sub(state.pos);
          dir.y = 0;
          if (dir.lengthSq() > 2.5) {
            state.targetYaw = Math.atan2(dir.x, -dir.z);
          }
        }
      }
    }
    window.addEventListener("mousemove", (e) => steerFromScreen(e.clientX, e.clientY));
    window.addEventListener("touchmove", (e) => {
      const t = e.touches[0];
      if (t) steerFromScreen(t.clientX, t.clientY);
    }, { passive: true });

    window.addEventListener("keydown", (e) => {
      if (e.code === "Space") {
        state.walking = !state.walking;
        e.preventDefault();
      } else if (e.code === "KeyW" || e.code === "ArrowUp") {
        state.targetSpeed = Math.min(2.2, state.targetSpeed + 0.4);
      } else if (e.code === "KeyS" || e.code === "ArrowDown") {
        state.targetSpeed = Math.max(0.25, state.targetSpeed - 0.4);
      }
    });
    window.addEventListener("blur", () => { state.targetSpeed = Math.max(0.25, state.targetSpeed); });

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    /* ---------- animation ---------- */
    const camMode = new URLSearchParams(location.search).get("cam") || "follow";
    const clock = new THREE.Clock();
    let t = 0;
    let fpsShown = 60, fpsAcc = 0, fpsTimer = 0;

    function tick() {
      const dt = Math.min(clock.getDelta(), 0.05);
      t += dt;

      // FPS
      fpsAcc += dt; fpsTimer += dt;
      if (fpsTimer > 0.5) {
        fpsShown = Math.round(1 / (fpsAcc / fpsTimer));
        fpsTimer = 0; fpsAcc = 0;
        hudState.textContent =
          (state.walking ? "walking" : "standing") + " · " + state.speed.toFixed(2) + " m/s · " + fpsShown + " fps";
      }

      // steering: yaw eases toward the mouse point on the ground
      let dy = state.targetYaw - state.yaw;
      dy = Math.atan2(Math.sin(dy), Math.cos(dy));
      state.yaw += dy * Math.min(1, 2.5 * dt);

      // speed eases
      state.speed += (state.targetSpeed - state.speed) * Math.min(1, 3 * dt);

      // move forward (forward = -z at yaw 0)
      const fwd = new THREE.Vector3(Math.sin(state.yaw), 0, -Math.cos(state.yaw));
      if (state.walking) {
        state.pos.addScaledVector(fwd, state.speed * dt);
      }
      // keep her inside the arena
      const r = Math.hypot(state.pos.x, state.pos.z);
      if (r > 17) {
        const k = ((r - 17) / r) * 0.05;
        state.pos.x -= state.pos.x * k;
        state.pos.z -= state.pos.z * k;
      }

      // stride phase (frequency = speed / stride length)
      state.stridePhase += dt * (state.walking ? (Math.PI * 2 * state.speed / 1.9) : 0.2);

      /* giraffe transform */
      const w = state.stridePhase;
      const amp = state.walking ? 1 : 0.18;
      const bob = 0.025 * Math.sin(2 * w) * (state.walking ? 1 : 0.4);
      giraffe.rotation.y = state.yaw;
      giraffe.position.y = BASE_HIP_Y + bob + 0.02 * Math.sin(t * 1.3);
      body.rotation.x = -0.05 + 0.02 * Math.sin(w) * (state.walking ? 1 : 0.3);
      body.rotation.z = 0.012 * Math.sin(2 * w) * (state.walking ? 1 : 0.5);

      /* walk cycle: diagonal gait (FL+BR, FR+RL) */
      /* walk cycle (diagonal gait: FL+BR, FR+RL) — parameters validated numerically:
           hip swing 0.28 rad, knee flex 0.50 rad lagging hip by 33.8 deg, rest knee bend 0.10.
           Foot stays in [0.03, 0.38] m above ground; stride ~1.6 m. */
      const speedScale = Math.min(1.35, Math.max(0.85, Math.sqrt(state.speed / 1.0)));
      const A1 = 0.28 * amp * speedScale;
      const A2 = 0.50 * amp * speedScale;
      for (const name in legs) {
        const p = (name === "FR" || name === "RL") ? Math.PI : 0;
        const leg = legs[name];
        leg.rotation.x = A1 * Math.sin(w + p);                                   // hip swing
        leg.rotation.z = 0.05 * Math.sin(w + p + 0.5) * amp;                    // shoulder abduction
        leg.userData.knee.rotation.x =
          0.10 + A2 * Math.sin(w + p + 0.59);                                // knee flex/extend
      }

      /* neck & head */
      neckRoot.rotation.x = -0.16 +
        (state.walking ? 0.05 * Math.sin(0.5 * w) : 0.03 * Math.sin(0.7 * t));
      neckRoot.rotation.y = 0.05 * Math.sin(0.3 * t);
      head.rotation.y = -neckRoot.rotation.y * 0.8 + 0.04 * Math.sin(0.23 * t);
      head.rotation.x = 0.03 * Math.sin(0.4 * t + 1) + 0.02 * Math.sin(2 * w) * amp;
      head.rotation.z = 0.02 * Math.sin(0.3 * t + 2);

      /* tail */
      tailG.rotation.x = -0.55 + 0.10 * Math.sin(0.5 * w + 2) * (state.walking ? 1 : 0.5);
      tailG.rotation.y = 0.30 * Math.sin(0.6 * w + 1.5);

      /* blink */
      if (t > state.nextBlink) {
        state.nextBlink = t + 2.2 + Math.random() * 2.8;
        state.blink = 0.14;
      }
      if (state.blink > 0) state.blink -= dt;
      const eyeOpen = state.blink <= 0 ? 1 : state.blink / 0.14;
      eyeL.scale.y = eyeOpen;
      eyeR.scale.y = eyeOpen;

      /* camera: trail behind her (or fixed debug views via ?cam=side|close|top) */
      if (camMode === "side") {
        const sideC = new THREE.Vector3(Math.cos(state.yaw), 0, Math.sin(state.yaw));
        camera.position.copy(state.pos).addScaledVector(sideC, 8.5);
        camera.position.y = 2.6;
        camera.lookAt(state.pos.x, 2.4, state.pos.z);
      } else if (camMode === "close") {
        const hp = new THREE.Vector3();
        head.getWorldPosition(hp);
        camera.position.copy(hp).addScaledVector(fwd, 2.6);
        camera.position.y = hp.y + 0.4;
        camera.lookAt(hp.x, hp.y - 0.1, hp.z);
      } else if (camMode === "top") {
        camera.position.copy(state.pos);
        camera.position.y = 14;
        camera.lookAt(state.pos.x, 0, state.pos.z);
      } else {
        const back = new THREE.Vector3(-fwd.x, 0, -fwd.z);
        const side = new THREE.Vector3(fwd.z, 0, -fwd.x);
        const camPos = new THREE.Vector3()
          .copy(state.pos)
          .addScaledVector(back, 6.0)
          .addScaledVector(side, 0.9);
        camPos.y += 3.0;
        const k = 1 - Math.pow(0.0015, dt * 6);
        camera.position.lerp(camPos, Math.min(1, k));
        camera.lookAt(state.pos.x + fwd.x * 0.5, 2.5, state.pos.z + fwd.z * 0.5);
      }

      renderer.render(scene, camera);
    }

    renderer.setAnimationLoop(tick);
  }

  boot();
})();
</script>
</body>
</html>
