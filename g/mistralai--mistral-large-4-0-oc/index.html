<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Walking Giraffe — Three.js</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0b0f14; }
  #scene { display: block; width: 100%; height: 100%; touch-action: none; }
  #ui {
    position: absolute; top: 12px; left: 12px; z-index: 10;
    background: rgba(10, 16, 22, 0.55); color: #eef3f7;
    font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: 10px 14px; border-radius: 12px; user-select: none;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.12); max-width: 300px;
  }
  #ui .title { font-weight: 650; font-size: 15px; margin-bottom: 6px; letter-spacing: .2px; }
  #ui .row { margin: 5px 0; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  #ui button {
    background: rgba(255,255,255,0.10); color: #eef3f7; border: 1px solid rgba(255,255,255,0.18);
    border-radius: 7px; padding: 3px 10px; font: inherit; cursor: pointer;
  }
  #ui button:hover { background: rgba(255,255,255,0.20); }
  #ui button.on { background: #d9822b; border-color: #d9822b; color: #14100a; font-weight: 650; }
  #ui input[type=range] { width: 130px; accent-color: #d9822b; }
  #ui .hint { margin-top: 6px; opacity: 0.65; font-size: 11.5px; }
  #ui span.val { opacity: .85; min-width: 52px; display: inline-block; }
  #err {
    position: absolute; inset: 0; display: none; place-items: center; color: #ffb4b4;
    font: 15px system-ui, sans-serif; background: #14181d; text-align: center; padding: 20px;
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="ui">
  <div class="title">🦒 Walking Giraffe</div>
  <div class="row" id="gaits">
    <button data-gait="walk" class="on">Walk</button>
    <button data-gait="trot">Trot</button>
    <button data-gait="gallop">Gallop</button>
  </div>
  <div class="row">
    <label for="speed">Speed</label>
    <input id="speed" type="range" min="0" max="4" step="0.05" value="1.15">
    <span class="val" id="speedVal">1.15 m/s</span>
  </div>
  <div class="row">
    <label><input id="follow" type="checkbox" checked> camera follows giraffe</label>
  </div>
  <div class="hint">drag&nbsp;=&nbsp;orbit &nbsp;·&nbsp; wheel&nbsp;=&nbsp;zoom &nbsp;·&nbsp; pinch&nbsp;=&nbsp;zoom<br>
  F&nbsp;=&nbsp;follow &nbsp;·&nbsp; 1/2/3&nbsp;=&nbsp;walk/trot/gallop &nbsp;·&nbsp; space&nbsp;=&nbsp;pause</div>
</div>
<div id="err"></div>
<script src="three.min.js"></script>
<script src="giraffe.js"></script>
<script>
  if (typeof THREE === 'undefined') {
    var e = document.getElementById('err');
    e.style.display = 'grid';
    e.textContent = 'Could not load three.min.js — make sure it sits next to index.html.';
  }
</script>
</body>
</html>
