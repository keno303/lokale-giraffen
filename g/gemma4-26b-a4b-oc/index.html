<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Walking Giraffe - Three.js</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #87CEEB; }
        canvas { display: block; }
    </style>
</head>
<body>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- Scene Setup ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(10, 8, 15);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // --- Lighting ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffffff, 1.0);
        sunLight.position.set(10, 20, 10);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        sunLight.shadow.camera.left = -30;
        sunLight.shadow.camera.right = 30;
        sunLight.shadow.camera.top = 30;
        sunLight.shadow.camera.bottom = -30;
        scene.add(sunLight);

        // --- Environment ---
        const groundGeom = new THREE.PlaneGeometry(200, 200);
        const groundMat = new THREE.MeshStandardMaterial({ color: 0x3a5f0b });
        const ground = new THREE.Mesh(groundGeom, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // --- Giraffe Assets ---
        
        const createGiraffeTexture = () => {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#edc9af';
            ctx.fillRect(0, 0, 512, 512);
            ctx.fillStyle = '#8b4513';
            for (let i = 0; i < 60; i++) {
                const x = Math.random() * 512;
                const y = Math.random() * 512;
                const radius = Math.random() * 30 + 10;
                ctx.beginPath();
                ctx.ellipse(x, y, radius, radius * 0.8, Math.random() * Math.PI, 0, Math.PI * 2);
                ctx.fill();
            }
            return new THREE.CanvasTexture(canvas);
        };

        const giraffeTexture = createGiraffeTexture();
        const giraffeMaterial = new THREE.MeshStandardMaterial({ map: giraffeTexture });

        class Giraffe {
            constructor() {
                this.group = new THREE.Group();
                scene.add(this.group);

                const bodyY = 2.5;

                // Body
                this.body = new THREE.Mesh(new THREE.SphereGeometry(1, 32, 32), giraffeMaterial);
                this.body.scale.set(1.6, 1, 1);
                this.body.castShadow = true;
                this.body.position.y = bodyY;
                this.group.add(this.body);

                // Neck
                this.neck = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.5, 3, 32), giraffeMaterial);
                this.neck.position.set(1.5, 1.5, 0);
                this.neck.rotation.z = -Math.PI / 8;
                this.neck.castShadow = true;
                this.neck.position.y += bodyY;
                this.group.add(this.neck);

                // Head
                this.head = new THREE.Mesh(new THREE.SphereGeometry(0.5, 32, 32), giraffeMaterial);
                this.head.scale.set(1.5, 0.8, 0.8);
                this.head.position.set(2.5, 2.8, 0);
                this.head.castShadow = true;
                this.head.position.y += bodyY;
                this.group.add(this.head);

                // Ossicones
                const ossiconeGeom = new THREE.CylinderGeometry(0.05, 0.05, 0.4, 16);
                const ossicone1 = new THREE.Mesh(ossiconeGeom, giraffeMaterial);
                ossicone1.position.set(2.5, 3.2, 0.2);
                ossicone1.rotation.x = 0.2;
                ossicone1.position.y += bodyY;
                this.group.add(ossicone1);

                const ossicone2 = new THREE.Mesh(ossiconeGeom, giraffeMaterial);
                ossicone2.position.set(2.5, 3.2, -0.2);
                ossicone2.rotation.x = -0.2;
                ossicone2.position.y += bodyY;
                this.group.add(ossicone2);

                // Eyes
                const eyeGeom = new THREE.SphereGeometry(0.05, 16, 16);
                const eyeMat = new THREE.MeshStandardMaterial({ color: 0x000000 });
                const eye1 = new THREE.Mesh(eyeGeom, eyeMat);
                eye1.position.set(3.2, 2.7, 0.2);
                eye1.position.y += bodyY;
                this.group.add(eye1);
                const eye2 = new THREE.Mesh(eyeGeom, eyeMat);
                eye2.position.set(3.2, 2.7, -0.2);
                eye2.position.y += bodyY;
                this.group.add(eye2);

                // Tail
                this.tail = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 1, 8), giraffeMaterial);
                this.tail.position.set(-1.5, 0.5, 0);
                this.tail.rotation.z = Math.PI / 4;
                this.tail.position.y += bodyY;
                this.group.add(this.tail);
                
                // Tail tuft
                const tuftGeom = new THREE.SphereGeometry(0.1, 8, 8);
                const tuftMat = new THREE.MeshStandardMaterial({ color: 0x000000 });
                const tuft = new THREE.Mesh(tuftGeom, tuftMat);
                tuft.position.set(-2.1, 0.1, 0);
                tuft.position.y += bodyY;
                this.group.add(tuft);

                // Legs
                this.legs = [];
                const legPositions = [
                    { x: 1, z: 0.6, name: 'FL' },
                    { x: 1, z: -0.6, name: 'FR' },
                    { x: -1, z: 0.6, name: 'BL' },
                    { x: -1, z: -0.6, name: 'BR' }
                ];

                legPositions.forEach(pos => {
                    const legGroup = new THREE.Group();
                    legGroup.position.set(pos.x, bodyY - 0.5, pos.z);
                    const legMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.1, 2, 16), giraffeMaterial);
                    legMesh.position.y = -1;
                    legMesh.castShadow = true;
                    legGroup.add(legMesh);
                    this.group.add(legGroup);
                    this.legs.push({ group: legGroup, name: pos.name });
                });
            }

            update(t) {
                const walkSpeed = 2.5;
                const walkAmplitude = 0.35;

                const gait1 = Math.sin(t * walkSpeed) * walkAmplitude;
                const gait2 = Math.sin(t * walkSpeed + Math.PI) * walkAmplitude;

                this.legs[0].group.rotation.x = gait1;
                this.legs[3].group.rotation.x = gait1;
                this.legs[1].group.rotation.x = gait2;
                this.legs[2].group.rotation.x = gait2;

                const bob = Math.sin(t * walkSpeed * 2) * 0.05;
                this.body.position.y = 2.5 + bob;
                this.neck.position.y = 1.5 + 2.5 + bob;
                this.head.position.y = 2.8 + 2.5 + bob;
                this.neck.rotation.z = -Math.PI / 8 + Math.sin(t * walkSpeed * 0.5) * 0.05;
                this.tail.rotation.z = Math.PI / 4 + Math.sin(t * walkSpeed * 2) * 0.1;
            }
        }

        const giraffe = new Giraffe();
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const t = clock.getElapsedTime();
            giraffe.update(t);
            controls.update();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
