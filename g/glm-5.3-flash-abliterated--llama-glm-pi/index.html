<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Walking Giraffe — Three.js</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#bfe0f2;font-family:system-ui,-apple-system,sans-serif}
  #info{position:fixed;top:12px;left:12px;background:rgba(20,32,20,.55);color:#fff;
        padding:8px 14px;border-radius:8px;font-size:14px;pointer-events:none;backdrop-filter:blur(3px)}
</style>
</head>
<body>
<div id="info">🦒 Walking Giraffe &nbsp;·&nbsp; drag to orbit · scroll to zoom</div>
<script src="three.min.js"></script>
<script>
'use strict';

/* ============================================================
   Walking Giraffe — single-file Three.js demo
   Loads with a plain double-click on index.html (file:// safe).
   ============================================================ */

// ---------- renderer / scene / camera ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xbfe0f2);
scene.fog = new THREE.Fog(0xbfe0f2, 28, 85);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 300);

// ---------- lights ----------
const hemi = new THREE.HemisphereLight(0xcfe8ff, 0x6b7a45, 0.75);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xfff2dd, 1.15);
sun.position.set(14, 20, 9);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -18; sun.shadow.camera.right = 18;
sun.shadow.camera.top = 18;   sun.shadow.camera.bottom = -18;
sun.shadow.camera.near = 2;   sun.shadow.camera.far = 60;
sun.shadow.bias = -0.0005;
scene.add(sun);
scene.add(sun.target);

// ---------- procedural giraffe skin (jittered voronoi patches) ----------
function giraffeSkinTexture() {
  const w = 1024, h = 512;
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const ctx = cv.getContext('2d');
  const cols = 13, rows = 7, cw = w / cols, ch = h / rows;
  const sites = [], siteCols = [];
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    sites.push([
      (c + 0.5 + (Math.random() - 0.5) * 0.8) * cw,
      (r + 0.5 + (Math.random() - 0.5) * 0.8) * ch
    ]);
    siteCols.push([
      150 + Math.random() * 40 | 0,
      84  + Math.random() * 28 | 0,
      30  + Math.random() * 22 | 0
    ]);
  }
  const img = ctx.createImageData(w, h), d = img.data;
  for (let y = 0; y < h; y++) {
    const ry = Math.floor(y / ch);
    for (let x = 0; x < w; x++) {
      const cx = Math.floor(x / cw);
      let d1 = 1e9, d2 = 1e9, ci = 0;
      for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
        const rr = (ry + dr + rows) % rows, cc = cx + dc;
        const s = sites[rr * cols + ((cc % cols + cols) % cols)];
        let sx = s[0], sy = s[1];
        if (cc < 0) sx -= w; else if (cc >= cols) sx += w;
        if (ry + dr < 0) sy -= h; else if (ry + dr >= rows) sy += h;
        const dx = x - sx, dy = y - sy, dd = dx * dx + dy * dy;
        if (dd < d1) { d2 = d1; d1 = dd; ci = rr * cols + cc; } else if (dd < d2) d2 = dd;
      }
      const edge = Math.sqrt(d2) - Math.sqrt(d1);
      let R, G, B;
      if (edge < 14) { R = 226; G = 186; B = 128; }          // light grooves
      else { const c = siteCols[ci]; R = c[0]; G = c[1]; B = c[2]; }
      const i = (y * w + x) * 4;
      d[i] = R; d[i + 1] = G; d[i + 2] = B; d[i + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  const tex = new THREE.CanvasTexture(cv);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(2, 1);
  return tex;
}

// subtle mottled grass texture for the ground
function grassTexture() {
  const cv = document.createElement('canvas'); cv.width = cv.height = 256;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#7ca34f'; ctx.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 900; i++) {
    ctx.fillStyle = 'rgba(' + (90 + Math.random() * 60 | 0) + ',' +
                    (120 + Math.random() * 60 | 0) + ',' + (50 + Math.random() * 40 | 0) + ',0.5)';
    ctx.beginPath();
    ctx.arc(Math.random() * 256, Math.random() * 256, 1 + Math.random() * 4, 0, 6.29);
    ctx.fill();
  }
  const tex = new THREE.CanvasTexture(cv);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(24, 24);
  return tex;
}

// ---------- materials ----------
const skinMat  = new THREE.MeshStandardMaterial({ map: giraffeSkinTexture(), roughness: 0.92, metalness: 0 });
const tanMat   = new THREE.MeshStandardMaterial({ color: 0xdcb37e, roughness: 0.95 });
const muzzleMat= new THREE.MeshStandardMaterial({ color: 0xc79a63, roughness: 0.95 });
const darkMat  = new THREE.MeshStandardMaterial({ color: 0x4c3218, roughness: 0.85 });
const eyeMat   = new THREE.MeshStandardMaterial({ color: 0x201409, roughness: 0.35 });

// ---------- ground ----------
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(70, 48),
  new THREE.MeshStandardMaterial({ map: grassTexture(), roughness: 1 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// ---------- trees & rocks ----------
function addTree(x, z, s) {
  const g = new THREE.Group();
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.16 * s, 0.26 * s, 2.4 * s, 8),
                new THREE.MeshStandardMaterial({ color: 0x6e4a2a, roughness: 1 }));
  trunk.position.y = 1.2 * s; trunk.castShadow = true; g.add(trunk);
  const leafMat = new THREE.MeshStandardMaterial({ color: 0x3f6d2a, roughness: 1 });
  const c1 = new THREE.Mesh(new THREE.SphereGeometry(1.5 * s, 12, 8), leafMat);
  c1.scale.y = 0.45; c1.position.y = 2.6 * s; c1.castShadow = true; g.add(c1);
  const c2 = new THREE.Mesh(new THREE.SphereGeometry(1.0 * s, 10, 7), leafMat);
  c2.scale.y = 0.5; c2.position.set(0.8 * s, 2.3 * s, 0.4 * s); c2.castShadow = true; g.add(c2);
  g.position.set(x, 0, z);
  scene.add(g);
}
[[0, 12, 1], [-11, -6, 1.2], [10, 9, 0.9], [-9, 11, 1.1], [13, -3, 1], [-4, -13, 0.8], [16, 6, 1.3]]
  .forEach(t => addTree(t[0], t[1], t[2]));

[[5, -10, 0.7], [-7, 8, 0.5], [12, 12, 0.9], [-14, -10, 0.6]].forEach(r => {
  const rock = new THREE.Mesh(new THREE.DodecahedronGeometry(r[2], 0),
    new THREE.MeshStandardMaterial({ color: 0x8d8d86, roughness: 1 }));
  rock.position.set(r[0], r[2] * 0.5, r[1]);
  rock.rotation.set(Math.random(), Math.random(), Math.random());
  rock.castShadow = true; rock.receiveShadow = true;
  scene.add(rock);
});

/* ============================================================
   THE GIRAFFE  (units ≈ meters, forward = +z)
   ============================================================ */
const giraffe = new THREE.Group();
scene.add(giraffe);

function shadowed(mesh) { mesh.castShadow = true; return mesh; }

// ---- torso ----
const bodyGroup = new THREE.Group();
giraffe.add(bodyGroup);

const torso = shadowed(new THREE.Mesh(new THREE.SphereGeometry(1, 32, 24), skinMat));
torso.scale.set(0.62, 0.70, 0.95);
torso.position.set(0, 2.45, 0);
bodyGroup.add(torso);

const chest = shadowed(new THREE.Mesh(new THREE.SphereGeometry(1, 24, 18), skinMat));
chest.scale.set(0.56, 0.64, 0.52);
chest.position.set(0, 2.52, 0.62);
bodyGroup.add(chest);

const rump = shadowed(new THREE.Mesh(new THREE.SphereGeometry(1, 24, 18), skinMat));
rump.scale.set(0.58, 0.62, 0.46);
rump.position.set(0, 2.42, -0.60);
bodyGroup.add(rump);

// belly (slightly lighter underside)
const belly = shadowed(new THREE.Mesh(new THREE.SphereGeometry(1, 20, 14), tanMat));
belly.scale.set(0.52, 0.42, 0.85);
belly.position.set(0, 2.22, 0);
bodyGroup.add(belly);

// ---- legs: two-segment with hoof; giraffes use a pace gait ----
const legs = [];
function addLeg(x, z, off) {
  const hip = new THREE.Group();
  hip.position.set(x, 2.18, z);
  giraffe.add(hip);

  const upper = shadowed(new THREE.Mesh(new THREE.CylinderGeometry(0.19, 0.14, 1.08, 12), tanMat));
  upper.position.y = -0.54;
  hip.add(upper);

  const knee = new THREE.Group();
  knee.position.y = -1.08;
  hip.add(knee);

  const lower = shadowed(new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.085, 1.0, 12), tanMat));
  lower.position.y = -0.50;
  knee.add(lower);

  const hoof = shadowed(new THREE.Mesh(new THREE.CylinderGeometry(0.10, 0.12, 0.20, 12), darkMat));
  hoof.position.y = -1.08;
  knee.add(hoof);

  legs.push({ hip, knee, off });
}
addLeg( 0.34, 0.55, 0.15); // left  front
addLeg(-0.34, 0.55, 0.65); // right front
addLeg( 0.36, -0.60, 0.0); // left  hind
addLeg(-0.36, -0.60, 0.5); // right hind

// ---- neck: 4 hierarchical segments, slight backward curve ----
const neckSegs = [];
let neckParent = bodyGroup, neckY = 2.66, neckZ = 0.78;
const neckLens = [0.62, 0.62, 0.62, 0.62];
const neckBaseRot = [0.95, 0.06, 0.04, 0.0];
const neckRadii = [[0.30, 0.265], [0.265, 0.23], [0.23, 0.20], [0.20, 0.175]];
for (let i = 0; i < 4; i++) {
  const seg = new THREE.Group();
  if (i === 0) seg.position.set(0, neckY, neckZ);
  else seg.position.y = neckLens[i - 1];
  neckParent.add(seg);

  const mesh = shadowed(new THREE.Mesh(
    new THREE.CylinderGeometry(neckRadii[i][0], neckRadii[i][1], neckLens[i], 14), skinMat));
  mesh.position.y = neckLens[i] / 2;
  seg.add(mesh);

  // mane ridge on the back of each segment
  const mane = shadowed(new THREE.Mesh(new THREE.BoxGeometry(0.06, neckLens[i] * 1.02, 0.08), darkMat));
  mane.position.set(0, neckLens[i] / 2, -neckRadii[i][0] * 0.92);
  seg.add(mane);

  seg.userData.baseRot = neckBaseRot[i];
  neckSegs.push(seg);
  neckParent = seg;
}

// ---- head (attached to last neck segment) ----
const head = new THREE.Group();
head.position.y = neckLens[3];
neckParent.add(head);

const skull = shadowed(new THREE.Mesh(new THREE.SphereGeometry(1, 24, 18), skinMat));
skull.scale.set(0.20, 0.24, 0.30);
skull.position.set(0, 0.06, 0.12);
head.add(skull);

const muzzle = shadowed(new THREE.Mesh(new THREE.SphereGeometry(1, 18, 14), muzzleMat));
muzzle.scale.set(0.15, 0.15, 0.20);
muzzle.position.set(0, 0.0, 0.36);
head.add(muzzle);

[-1, 1].forEach(s => {
  const eye = shadowed(new THREE.Mesh(new THREE.SphereGeometry(0.038, 12, 10), eyeMat));
  eye.position.set(s * 0.165, 0.11, 0.17);
  head.add(eye);

  // ossicone (horn) + knob
  const horn = shadowed(new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.032, 0.20, 8), tanMat));
  horn.position.set(s * 0.075, 0.32, 0.06);
  horn.rotation.z = -s * 0.18;
  head.add(horn);
  const knob = shadowed(new THREE.Mesh(new THREE.SphereGeometry(0.048, 10, 8), darkMat));
  knob.position.set(s * 0.10, 0.42, 0.06);
  head.add(knob);

  // ear
  const ear = shadowed(new THREE.Mesh(new THREE.SphereGeometry(1, 10, 8), tanMat));
  ear.scale.set(0.05, 0.10, 0.035);
  ear.position.set(s * 0.20, 0.20, 0.02);
  ear.rotation.z = s * 0.9;
  head.add(ear);
});

// ---- tail ----
const tail = new THREE.Group();
tail.position.set(0, 2.58, -0.86);
tail.rotation.x = 0.45;
bodyGroup.add(tail);
const tailMesh = shadowed(new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.028, 0.85, 8), tanMat));
tailMesh.position.y = -0.42;
tail.add(tailMesh);
const tuft = shadowed(new THREE.Mesh(new THREE.SphereGeometry(0.07, 8, 8), darkMat));
tuft.scale.y = 1.6;
tuft.position.y = -0.92;
tail.add(tuft);

/* ============================================================
   ANIMATION — pace gait (same-side leg pairs, like real giraffes)
   ============================================================ */
const WALK_FREQ = 0.85;      // steps per second
const HIP_AMP   = 0.30;      // rad
const KNEE_AMP  = 0.60;      // rad
const SPEED     = 1.1;       // m/s
const CIRCLE_R  = 7;         // walk path radius

let theta = 0;               // gait phase
let pathAng = 0;             // position on walking circle

// camera orbit state
let camYaw = 0.9, camPitch = 0.34, camDist = 9.5;
let dragging = false, lastX = 0, lastY = 0;
const followPos = new THREE.Vector3(0, 2.4, 7);
const desired = new THREE.Vector3();

renderer.domElement.addEventListener('pointerdown', e => {
  dragging = true; lastX = e.clientX; lastY = e.clientY;
});
window.addEventListener('pointerup', () => dragging = false);
window.addEventListener('pointermove', e => {
  if (!dragging) return;
  camYaw   += (e.clientX - lastX) * 0.005;
  camPitch  = Math.min(1.25, Math.max(0.06, camPitch + (e.clientY - lastY) * 0.005));
  lastX = e.clientX; lastY = e.clientY;
});
renderer.domElement.addEventListener('wheel', e => {
  camDist = Math.min(26, Math.max(3.5, camDist * (1 + e.deltaY * 0.001)));
}, { passive: true });

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;
  theta += dt * Math.PI * 2 * WALK_FREQ;

  // legs — hip swings, knee flexes during forward swing phase
  for (const leg of legs) {
    const p = theta + leg.off;
    leg.hip.rotation.x = HIP_AMP * Math.sin(p);
    leg.knee.rotation.x = 0.05 + KNEE_AMP * Math.max(0, -Math.cos(p));
  }

  // body bob & lateral sway (pace gait rolls side-to-side)
  bodyGroup.position.y = 0.035 * Math.sin(2 * theta + 0.5);
  bodyGroup.rotation.z = 0.045 * Math.sin(theta);
  bodyGroup.rotation.x = 0.02 * Math.sin(2 * theta);

  // neck sway + stabilized head
  let sumX = 0, sumY = 0;
  for (let i = 0; i < neckSegs.length; i++) {
    const s = neckSegs[i];
    s.rotation.x = s.userData.baseRot + 0.05 * Math.sin(theta + i * 0.8);
    s.rotation.y = 0.045 * Math.sin(theta + 1.5) * (1 - i * 0.15);
    sumX += s.rotation.x; sumY += s.rotation.y;
  }
  head.rotation.x = -sumX + 0.28;   // level the head, muzzle slightly down
  head.rotation.y = -sumY;
  head.rotation.z = 0.03 * Math.sin(theta + 1.0);

  // tail flicks
  tail.rotation.z = 0.28 * Math.sin(t * 1.8);
  tail.rotation.x = 0.45 + 0.10 * Math.sin(theta * 2);

  // walk along a circle
  pathAng += dt * SPEED / CIRCLE_R;
  giraffe.position.set(Math.sin(pathAng) * CIRCLE_R, 0, Math.cos(pathAng) * CIRCLE_R);
  giraffe.rotation.y = pathAng + Math.PI / 2;

  // camera follows with smooth lag
  desired.copy(giraffe.position); desired.y += 2.4;
  followPos.lerp(desired, 1 - Math.exp(-dt * 3));
  camera.position.set(
    followPos.x + camDist * Math.sin(camYaw) * Math.cos(camPitch),
    followPos.y + camDist * Math.sin(camPitch),
    followPos.z + camDist * Math.cos(camYaw) * Math.cos(camPitch)
  );
  camera.lookAt(followPos);

  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
