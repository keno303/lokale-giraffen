<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Giraffe — Three.js</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; cursor: grab; }
  canvas:active { cursor: grabbing; }
  #ui {
    position: fixed; top: 12px; left: 14px; color: #fff;
    font: 13px/1.55 system-ui, -apple-system, sans-serif;
    text-shadow: 0 1px 3px rgba(0,0,0,.65);
    user-select: none; pointer-events: none;
  }
  #ui b { font-size: 15px; letter-spacing: .3px; }
  #err {
    position: fixed; top: 0; left: 0; right: 0; z-index: 10;
    background: #4d1212; color: #ffd9d9;
    font: 12px/1.5 monospace; padding: 10px 12px;
    display: none; white-space: pre-wrap;
  }
</style>
</head>
<body>
<div id="ui">
  <b>Giraffe</b> — a walking savanna herd<br>
  drag: orbit &nbsp;·&nbsp; wheel: zoom &nbsp;·&nbsp; space: stop / go
</div>
<div id="err"></div>

<!-- Three.js r160 (UMD build, local copy — no server needed) -->
<script src="three.min.js"></script>

<script>
"use strict";
window.onerror = function (msg) {
  var e = document.getElementById('err');
  e.style.display = 'block';
  e.textContent = String(msg);
  throw new Error(msg);
};

/* =====================================================================
   Renderer / scene / camera
   ===================================================================== */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xdcc89e, 55, 330);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 900);
camera.position.set(6, 4, 12);

const SUN_DIR = new THREE.Vector3(0.45, 0.58, 0.30).normalize();

/* Lights */
const hemi = new THREE.HemisphereLight(0xcfe5ff, 0xb59a63, 0.85);
scene.add(hemi);

const sunLight = new THREE.DirectionalLight(0xffe8bd, 2.6);
sunLight.castShadow = true;
sunLight.shadow.mapSize.set(2048, 2048);
sunLight.shadow.camera.left = -18;
sunLight.shadow.camera.right = 18;
sunLight.shadow.camera.top = 18;
sunLight.shadow.camera.bottom = -18;
sunLight.shadow.camera.near = 4;
sunLight.shadow.camera.far = 160;
sunLight.shadow.bias = -0.0004;
sunLight.shadow.normalBias = 0.03;
scene.add(sunLight, sunLight.target);

/* =====================================================================
   Sky dome (vertex-color gradient) + sun disc
   ===================================================================== */
(function makeSky() {
  const R = 520;
  const geo = new THREE.SphereGeometry(R, 32, 16);
  const pos = geo.attributes.position;
  const colors = new Float32Array(pos.count * 3);
  const top = new THREE.Color(0x3d7fc4);
  const hor = new THREE.Color(0xe9d6a4);
  const low = new THREE.Color(0xd9c391);
  const c = new THREE.Color();
  for (let i = 0; i < pos.count; i++) {
    const y = pos.getY(i) / R;
    if (y >= 0) c.copy(hor).lerp(top, Math.pow(y, 0.55));
    else c.copy(hor).lerp(low, Math.min(1, -y * 5));
    colors[i * 3] = c.r * 0.82;
    colors[i * 3 + 1] = c.g * 0.82;
    colors[i * 3 + 2] = c.b * 0.82;
  }
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  const mat = new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide, fog: false, depthWrite: false });
  scene.add(new THREE.Mesh(geo, mat));

  const sun = new THREE.Mesh(
    new THREE.SphereGeometry(11, 16, 12),
    new THREE.MeshBasicMaterial({ color: 0xfff6dc, fog: false })
  );
  sun.position.copy(SUN_DIR).multiplyScalar(R * 0.85);
  scene.add(sun);
})();

/* =====================================================================
   Canvas texture helpers
   ===================================================================== */
function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return c;
}

/** Giraffe coat: cream base with irregular reticulated brown patches. */
function coatTexture() {
  const W = 1024, H = 512;
  const c = makeCanvas(W, H);
  const x = c.getContext('2d');
  x.fillStyle = '#e9d5a6';
  x.fillRect(0, 0, W, H);

  // subtle base mottling
  for (let i = 0; i < 9000; i++) {
    x.fillStyle = 'rgba(' + (120 + (Math.random() * 80 | 0)) + ',' + (95 + (Math.random() * 60 | 0)) + ',45,0.05)';
    x.fillRect(Math.random() * W, Math.random() * H, 2, 2);
  }

  const browns = ['#8a5a2b', '#7c4d24', '#96653a', '#6f4520', '#82522a', '#8e5f30'];
  const cols = 11;
  // large reticulated patches, loosely grouped into vertical rows
  for (let k = 0; k < 185; k++) {
    const cx = ((k % cols) * (W / cols)) + (Math.random() - 0.5) * 56;
    const cy = Math.random() * H;
    const r = 17 + Math.random() * 24;
    x.fillStyle = browns[(Math.random() * browns.length) | 0];
    x.beginPath();
    const n = 7 + ((Math.random() * 5) | 0);
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2 + Math.random() * 0.55;
      const rr = r * (0.6 + Math.random() * 0.8);
      const px = cx + Math.cos(a) * rr;
      const py = cy + Math.sin(a) * rr;
      if (i === 0) x.moveTo(px, py); else x.lineTo(px, py);
    }
    x.closePath();
    x.fill();
  }
  // a few lighter "star" patches (reticulated look)
  for (let k = 0; k < 6; k++) {
    x.fillStyle = 'rgba(231,210,162,0.9)';
    x.beginPath();
    const cx = Math.random() * W, cy = Math.random() * H, r = 7 + Math.random() * 9;
    const n = 4 + ((Math.random() * 3) | 0);
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2 + Math.random() * 0.5;
      const rr = r * (0.7 + Math.random() * 0.6);
      if (i === 0) x.moveTo(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr);
      else x.lineTo(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr);
    }
    x.closePath(); x.fill();
  }

  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}

/** Plain cream coat for lower legs and head. */
function creamTexture(base, band) {
  const W = 256, H = 256;
  const c = makeCanvas(W, H);
  const x = c.getContext('2d');
  x.fillStyle = base;
  x.fillRect(0, 0, W, H);
  for (let i = 0; i < 3000; i++) {
    x.fillStyle = 'rgba(150,115,60,' + (0.03 + Math.random() * 0.05).toFixed(3) + ')';
    x.fillRect(Math.random() * W, Math.random() * H, 2, 2);
  }
  if (band) { // dark ring for knee / hock
    const g = x.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0.0, band); g.addColorStop(0.10, band);
    g.addColorStop(0.16, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0)');
    x.globalCompositeOperation = 'multiply';
    x.fillStyle = g; x.fillRect(0, 0, W, H);
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

/** Dry savanna ground. */
function groundTexture() {
  const S = 512;
  const c = makeCanvas(S, S);
  const x = c.getContext('2d');
  x.fillStyle = '#b39a62';
  x.fillRect(0, 0, S, S);
  const patchCols = ['166,140,86', '150,124,72', '186,160,100', '140,116,66'];
  for (let i = 0; i < 70; i++) {
    const px = Math.random() * S, py = Math.random() * S, r = 20 + Math.random() * 80;
    const g = x.createRadialGradient(px, py, 0, px, py, r);
    const col = patchCols[(Math.random() * patchCols.length) | 0];
    g.addColorStop(0, 'rgba(' + col + ',0.28)');
    g.addColorStop(1, 'rgba(' + col + ',0)');
    x.fillStyle = g;
    x.fillRect(px - r, py - r, r * 2, r * 2);
  }
  const speckCols = ['90,75,45', '130,110,60', '190,165,105', '105,90,52'];
  for (let i = 0; i < 15000; i++) {
    x.fillStyle = 'rgba(' + speckCols[(Math.random() * speckCols.length) | 0] + ',' + (0.08 + Math.random() * 0.2).toFixed(2) + ')';
    x.fillRect(Math.random() * S, Math.random() * S, 1 + Math.random() * 2, 1 + Math.random() * 2);
  }
  x.lineWidth = 1;
  for (let i = 0; i < 1800; i++) {
    x.strokeStyle = 'rgba(110,100,55,' + (0.15 + Math.random() * 0.3).toFixed(2) + ')';
    const px = Math.random() * S, py = Math.random() * S, a = Math.random() * Math.PI;
    const l = 2 + Math.random() * 5;
    x.beginPath();
    x.moveTo(px, py);
    x.lineTo(px + Math.cos(a) * l, py + Math.sin(a) * l * 0.4);
    x.stroke();
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(28, 28);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}

/** Grass tuft for instanced blades. */
function bladeTexture() {
  const S = 128;
  const c = makeCanvas(S, S);
  const x = c.getContext('2d');
  x.clearRect(0, 0, S, S);
  const cols = ['122,124,69', '146,150,82', '168,160,95', '104,105,58'];
  for (let i = 0; i < 16; i++) {
    const bx = 10 + Math.random() * (S - 20);
    const h = 45 + Math.random() * 70;
    const lean = (Math.random() - 0.5) * 34;
    x.strokeStyle = 'rgb(' + cols[(Math.random() * cols.length) | 0] + ')';
    x.lineWidth = 2 + Math.random() * 2.2;
    x.lineCap = 'round';
    x.beginPath();
    x.moveTo(bx, S);
    x.quadraticCurveTo(bx + lean * 0.4, S - h * 0.55, bx + lean, S - h);
    x.stroke();
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

/* =====================================================================
   Ground, wear path, grass, trees, rocks, hills
   ===================================================================== */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(600, 600),
  new THREE.MeshStandardMaterial({ map: groundTexture(), roughness: 1, metalness: 0 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

/* the herd's worn walking circle (main giraffe's path) */
const MAIN_R = 7;
const pathRing = new THREE.Mesh(
  new THREE.RingGeometry(MAIN_R - 1.7, MAIN_R + 1.7, 64),
  new THREE.MeshBasicMaterial({ color: 0x9a8355, transparent: true, opacity: 0.32, depthWrite: false })
);
pathRing.rotation.x = -Math.PI / 2;
pathRing.position.y = 0.03;
scene.add(pathRing);

/* instanced dry grass tufts */
(function makeGrass() {
  const tufts = 240, perTuft = 4, count = tufts * perTuft;
  const geo = new THREE.PlaneGeometry(0.36, 0.30);
  geo.translate(0, 0.15, 0);
  const mat = new THREE.MeshStandardMaterial({
    map: bladeTexture(), alphaTest: 0.45, side: THREE.DoubleSide, roughness: 1
  });
  const inst = new THREE.InstancedMesh(geo, mat, count);
  const m4 = new THREE.Matrix4();
  const q = new THREE.Quaternion();
  const eul = new THREE.Euler();
  const sc = new THREE.Vector3();
  const p = new THREE.Vector3();
  let i = 0;
  for (let tIdx = 0; tIdx < tufts; tIdx++) {
    const a = Math.random() * Math.PI * 2;
    const rr = 1.5 + Math.pow(Math.random(), 0.8) * 40;
    p.set(Math.sin(a) * rr, 0, Math.cos(a) * rr);
    const s = 0.7 + Math.random() * 1.0;
    for (let j = 0; j < perTuft; j++) {
      eul.set((Math.random() - 0.5) * 0.2, j * (Math.PI / perTuft) + Math.random() * 0.3, (Math.random() - 0.5) * 0.2);
      q.setFromEuler(eul);
      sc.set(s, s, s);
      m4.compose(p, q, sc);
      inst.setMatrixAt(i++, m4);
    }
  }
  inst.instanceMatrix.needsUpdate = true;
  inst.receiveShadow = true;
  inst.frustumCulled = false;
  scene.add(inst);
})();

/* flat-topped acacia trees */
const barkMat = new THREE.MeshStandardMaterial({ color: 0x5a4632, roughness: 1 });
const leafMats = [0x5c6f3c, 0x6d7a44, 0x7d8248, 0x8a8452].map(col =>
  new THREE.MeshStandardMaterial({ color: col, roughness: 1 }));
function makeTree(x, z, s) {
  const g = new THREE.Group();
  g.position.set(x, 0, z);
  g.scale.setScalar(s);
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.17, 2.4, 8), barkMat);
  trunk.position.y = 1.2;
  trunk.rotation.z = (Math.random() - 0.5) * 0.16;
  trunk.castShadow = true;
  g.add(trunk);
  const nB = 4 + ((Math.random() * 3) | 0);
  for (let i = 0; i < nB; i++) {
    const b = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.06, 1.0, 6), barkMat);
    const a = (i / nB) * Math.PI * 2 + Math.random() * 0.8;
    b.position.set(Math.cos(a) * 0.34, 2.15, Math.sin(a) * 0.34);
    b.rotation.set(Math.sin(a) * 0.95, 0, -Math.cos(a) * 0.95);
    b.castShadow = true;
    g.add(b);
  }
  const nL = 6 + ((Math.random() * 4) | 0);
  for (let i = 0; i < nL; i++) {
    const l = new THREE.Mesh(new THREE.SphereGeometry(1, 10, 7), leafMats[i % leafMats.length]);
    l.scale.set(1.4 + Math.random() * 0.9, 0.32 + Math.random() * 0.22, 1.4 + Math.random() * 0.9);
    l.position.set((Math.random() - 0.5) * 1.7, 2.65 + Math.random() * 0.55, (Math.random() - 0.5) * 1.7);
    l.castShadow = true;
    g.add(l);
  }
  scene.add(g);
}
(function placeTrees() {
  // keep the herd's walking rings (R = 7, 16, 25) clear
  for (let i = 0; i < 6; i++) {
    const a = (i / 6) * Math.PI * 2 + Math.random() * 0.9;
    const rr = 30 + Math.random() * 18;
    makeTree(Math.sin(a) * rr, Math.cos(a) * rr, 0.85 + Math.random() * 0.9);
  }
  makeTree(2.6, -8.5, 0.8);
  makeTree(-9.5, 3.0, 0.9);
  makeTree(42, -18, 1.5);
  makeTree(-38, 26, 1.2);
  makeTree(18, -34, 1.3);
  makeTree(-30, -24, 1.1);
})();

/* rocks and dry shrubs */
(function placeRocks() {
  const rockMat = new THREE.MeshStandardMaterial({ color: 0x8a7a63, roughness: 1, flatShading: true });
  const shrubMat = new THREE.MeshStandardMaterial({ color: 0x77743f, roughness: 1 });
  for (let i = 0; i < 16; i++) {
    const r = 0.18 + Math.random() * 0.45;
    const rock = new THREE.Mesh(new THREE.DodecahedronGeometry(r, 0), rockMat);
    const a = Math.random() * Math.PI * 2;
    const rr = i % 2 === 0 ? 2.5 + Math.random() * 9 : 28 + Math.random() * 16;
    rock.position.set(Math.sin(a) * rr, r * 0.4, Math.cos(a) * rr);
    rock.rotation.set(Math.random() * 3, Math.random() * 3, Math.random() * 3);
    rock.castShadow = true;
    scene.add(rock);
  }
  for (let i = 0; i < 18; i++) {
    const r = 0.3 + Math.random() * 0.5;
    const sh = new THREE.Mesh(new THREE.SphereGeometry(r, 8, 6), shrubMat);
    const a = Math.random() * Math.PI * 2;
    const rr = i % 2 === 0 ? 2.5 + Math.random() * 9 : 28 + Math.random() * 16;
    sh.position.set(Math.sin(a) * rr, r * 0.42, Math.cos(a) * rr);
    sh.scale.set(1, 0.55, 1);
    sh.castShadow = true;
    scene.add(sh);
  }
})();

/* distant hazy hills */
(function makeHills() {
  const mat = new THREE.MeshStandardMaterial({ color: 0xa58a5f, roughness: 1, flatShading: true });
  for (let i = 0; i < 9; i++) {
    const a = (i / 9) * Math.PI * 2 + Math.random() * 0.5;
    const rr = 190 + Math.random() * 120;
    const r = 55 + Math.random() * 55;
    const h = 22 + Math.random() * 26;
    const hill = new THREE.Mesh(new THREE.ConeGeometry(r, h, 7), mat);
    hill.position.set(Math.sin(a) * rr, h * 0.36, Math.cos(a) * rr);
    hill.rotation.y = Math.random() * Math.PI;
    scene.add(hill);
  }
})();

/* =====================================================================
   Giraffe
   ===================================================================== */
const coatTex = coatTexture();
const coatMat = new THREE.MeshStandardMaterial({ map: coatTex, roughness: 0.85 });
const headMat = new THREE.MeshStandardMaterial({ map: creamTexture('#e9d6a8', null), roughness: 0.9 });
const lowerLegMat = new THREE.MeshStandardMaterial({ map: creamTexture('#e6d2a4', null), roughness: 0.9 });
const darkMat = new THREE.MeshStandardMaterial({ color: 0x2e1d10, roughness: 0.7 });
const maneMat = new THREE.MeshStandardMaterial({ color: 0x4a2f18, roughness: 1 });
const hoofMat = new THREE.MeshStandardMaterial({ color: 0x241811, roughness: 0.6 });
const kneeBandMat = new THREE.MeshStandardMaterial({ color: 0x3a2716, roughness: 0.9 });

function limbCapsule(r, cylLen, mat) {
  const geo = new THREE.CapsuleGeometry(r, cylLen, 6, 14);
  geo.translate(0, -(cylLen / 2 + r), 0); // pivot at the top of the limb
  const m = new THREE.Mesh(geo, mat);
  m.castShadow = true;
  return m;
}

function buildFoot() {
  const g = new THREE.Group();
  const foot = new THREE.Mesh(new THREE.SphereGeometry(0.09, 12, 10), lowerLegMat);
  foot.scale.set(0.95, 0.62, 1.55);
  foot.position.y = -0.02;
  foot.castShadow = true;
  const hoof = new THREE.Mesh(new THREE.SphereGeometry(0.075, 10, 8), hoofMat);
  hoof.scale.set(0.78, 0.45, 1.7);
  hoof.position.set(0, -0.03, 0.05);
  hoof.castShadow = true;
  g.add(foot, hoof);
  return g;
}

/**
 * Builds a giraffe. Returns { group, body, neck, head, legs, tailSegs }
 * Legs order: FL, FR, HL, HR.
 */
function buildGiraffe() {
  const group = new THREE.Group();
  const body = new THREE.Group();
  body.position.y = 1.52;
  group.add(body);

  /* torso */
  const torso = new THREE.Mesh(new THREE.CapsuleGeometry(0.52, 1.0, 8, 20), coatMat);
  torso.rotation.x = Math.PI / 2;          // capsule axis (Y) -> body axis (Z)
  torso.scale.set(1.04, 1.0, 0.95);        // local: X width, Y length, Z height
  torso.castShadow = true;
  body.add(torso);

  const chest = new THREE.Mesh(new THREE.SphereGeometry(0.5, 18, 12), coatMat);
  chest.position.set(0, -0.02, 0.72);
  chest.scale.set(0.82, 0.88, 0.72);
  chest.castShadow = true;
  body.add(chest);

  /* legs — two-jointed (hip/shoulder + knee/hock) */
  const legs = [];
  const legSpecs = [
    { x:  0.40, z:  0.70 },  // FL
    { x: -0.40, z:  0.70 },  // FR
    { x:  0.40, z: -0.70 },  // HL
    { x: -0.40, z: -0.70 }   // HR
  ];
  for (const spec of legSpecs) {
    const hip = new THREE.Group();
    hip.position.set(spec.x, -0.10, spec.z);
    body.add(hip);

    const upper = limbCapsule(0.14, 0.50, coatMat);      // total length 0.78
    hip.add(upper);

    const knee = new THREE.Group();
    knee.position.y = -0.78;
    hip.add(knee);

    const lower = limbCapsule(0.10, 0.36, lowerLegMat);  // total length 0.56
    knee.add(lower);

    // dark ring at the knee / hock
    const band = new THREE.Mesh(new THREE.CylinderGeometry(0.115, 0.115, 0.15, 12), kneeBandMat);
    band.position.y = -0.05;
    band.castShadow = true;
    knee.add(band);

    const foot = buildFoot();
    foot.position.y = -0.56;
    knee.add(foot);

    legs.push({ hip, knee });
  }

  /* neck */
  const neck = new THREE.Group();
  neck.position.set(0, 0.22, 0.55);
  neck.rotation.x = 0.75;                       // lean up & forward (~45°)
  body.add(neck);

  const neckGeo = new THREE.CylinderGeometry(0.22, 0.32, 1.95, 18, 1);
  neckGeo.translate(0, 0.975, 0);
  const neckMesh = new THREE.Mesh(neckGeo, coatMat);
  neckMesh.castShadow = true;
  neck.add(neckMesh);

  const nBase = new THREE.Mesh(new THREE.SphereGeometry(0.31, 16, 12), coatMat);
  nBase.position.y = 0.02;
  nBase.castShadow = true;
  neck.add(nBase);
  const nTop = new THREE.Mesh(new THREE.SphereGeometry(0.22, 16, 12), coatMat);
  nTop.position.y = 1.95;
  nTop.castShadow = true;
  neck.add(nTop);

  /* mane running down the back of the neck */
  for (let i = 0; i < 13; i++) {
    const t = 0.15 + i * 0.145;
    const rAt = 0.32 - 0.10 * (t / 1.95);
    const m = new THREE.Mesh(new THREE.SphereGeometry(0.055, 8, 6), maneMat);
    m.position.set(0, t, -(rAt + 0.02));
    m.castShadow = true;
    neck.add(m);
  }

  /* head (local frame: +Y along the neck axis, +Z forward of face) */
  const head = new THREE.Group();
  head.position.set(0, 1.95, 0);
  head.rotation.x = -0.16;
  neck.add(head);

  function headMesh(geo, mat, px, py, pz, sx, sy, sz) {
    const m = new THREE.Mesh(geo, mat);
    m.position.set(px, py, pz);
    m.scale.set(sx, sy, sz);
    m.castShadow = true;
    head.add(m);
    return m;
  }
  headMesh(new THREE.SphereGeometry(1, 18, 14), headMat, 0, 0.16, 0.00, 0.28, 0.30, 0.26);   // skull
  headMesh(new THREE.SphereGeometry(1, 14, 10), headMat, 0, 0.27, 0.18, 0.19, 0.20, 0.24);   // nose bridge
  headMesh(new THREE.SphereGeometry(1, 14, 10), headMat, 0, 0.14, 0.36, 0.18, 0.19, 0.20);   // muzzle
  headMesh(new THREE.SphereGeometry(1, 12, 8),  headMat, 0, 0.02, 0.28, 0.13, 0.11, 0.18);   // lower jaw
  headMesh(new THREE.SphereGeometry(1, 10, 8),  maneMat, 0, 0.36, -0.14, 0.14, 0.12, 0.09);  // forelock

  // nostrils
  headMesh(new THREE.SphereGeometry(0.024, 8, 6), darkMat,  0.055, 0.215, 0.525, 1, 0.7, 0.8);
  headMesh(new THREE.SphereGeometry(0.024, 8, 6), darkMat, -0.055, 0.215, 0.525, 1, 0.7, 0.8);
  // mouth line
  const mouth = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.012, 0.016), darkMat);
  mouth.position.set(0, 0.05, 0.44);
  head.add(mouth);

  // eyes + highlights
  headMesh(new THREE.SphereGeometry(0.05, 10, 8), darkMat,  0.215, 0.28, 0.08, 1, 1, 1);     // eye L
  headMesh(new THREE.SphereGeometry(0.05, 10, 8), darkMat, -0.215, 0.28, 0.08, 1, 1, 1);     // eye R
  headMesh(new THREE.SphereGeometry(0.014, 6, 5),
    new THREE.MeshBasicMaterial({ color: 0xffffff }), 0.235, 0.30, 0.11, 1, 1, 1);          // highlight L
  headMesh(new THREE.SphereGeometry(0.014, 6, 5),
    new THREE.MeshBasicMaterial({ color: 0xffffff }), -0.235, 0.30, 0.11, 1, 1, 1);         // highlight R

  // ossicones (the "horns")
  for (const side of [1, -1]) {
    const osc = new THREE.Group();
    osc.position.set(0.11 * side, 0.42, -0.02);
    osc.rotation.set(0.10, 0, -0.16 * side);
    const stemGeo = new THREE.CylinderGeometry(0.038, 0.046, 0.20, 8);
    stemGeo.translate(0, 0.10, 0);
    const stem = new THREE.Mesh(stemGeo, headMat);
    stem.castShadow = true;
    osc.add(stem);
    const knob = new THREE.Mesh(new THREE.SphereGeometry(0.055, 10, 8), headMat);
    knob.position.y = 0.21;
    knob.castShadow = true;
    osc.add(knob);
    head.add(osc);
  }

  // ears
  for (const side of [1, -1]) {
    const ear = headMesh(new THREE.SphereGeometry(1, 10, 8), headMat,
      0.27 * side, 0.36, -0.12, 0.15, 0.05, 0.19);
    ear.rotation.set(0, -0.55 * side, 0.35 * side);
    const inner = headMesh(new THREE.SphereGeometry(1, 8, 6), darkMat,
      0.29 * side, 0.365, -0.105, 0.09, 0.03, 0.12);
    inner.rotation.copy(ear.rotation);
  }

  /* tail — segmented chain */
  const tailBase = new THREE.Group();
  tailBase.position.set(0, -0.02, -1.00);
  body.add(tailBase);
  const tailSegs = [];
  let parent = tailBase;
  for (let i = 0; i < 6; i++) {
    const seg = new THREE.Group();
    const base = 0.30 + i * 0.055;
    seg.rotation.x = base;
    const r = 0.045 - i * 0.0045;
    const segMesh = limbCapsule(r, 0.14, coatMat);
    seg.add(segMesh);
    parent.add(seg);
    parent = seg;
    tailSegs.push({ seg, base });
  }
  const tuft = new THREE.Mesh(new THREE.SphereGeometry(1, 10, 8), maneMat);
  tuft.scale.set(0.065, 0.13, 0.065);
  tuft.position.y = -(0.14 + 0.04);
  tuft.castShadow = true;
  parent.add(tuft);

  scene.add(group);
  return { group, body, neck, head, legs, tailSegs };
}

/* ---- the herd: main giraffe + two companions on wider circuits ---- */
const herd = [
  { g: buildGiraffe(), R: MAIN_R, speed: 2.05, phase: 0,            tOffset: 0 },
  { g: buildGiraffe(), R: 16,    speed: 1.75, phase: Math.PI * 0.6, tOffset: 2.3 },
  { g: buildGiraffe(), R: 25,    speed: 1.55, phase: Math.PI * 1.4, tOffset: 5.1 }
];
for (const h of herd) h.animT = h.tOffset;

/* =====================================================================
   Walking gait (diagonal: FL+HR together, FR+HL together)
   ===================================================================== */
const W = 2 * Math.PI * 1.12;                 // stride angular frequency
const HIP_AMP = 0.36;
// leg phases: FL, FR, HL, HR
const LEG_PHASES = [0, Math.PI, Math.PI, 0];

function animateGiraffe(h, dt) {
  if (!paused) h.animT += dt;
  const t = h.animT;
  const a = h.phase + t * (h.speed / h.R);    // position angle on the circuit
  const g = h.g;

  g.group.position.set(Math.sin(a) * h.R, 0, Math.cos(a) * h.R);
  g.group.rotation.y = Math.atan2(Math.cos(a), -Math.sin(a));

  /* legs */
  for (let i = 0; i < 4; i++) {
    const leg = g.legs[i];
    const ph = W * t + LEG_PHASES[i];
    const s = Math.sin(ph);
    const cs = Math.cos(ph);
    leg.hip.rotation.x = HIP_AMP * s;
    // knee/hock: fold back when the leg trails, lift the foot on the forward swing
    const bend = 0.08 + 0.45 * Math.max(0, s) + 0.30 * Math.max(0, -cs);
    leg.knee.rotation.x = bend;
  }

  /* body bob & sway (two bounces per stride) */
  g.body.position.y = 1.52 + 0.04 * (0.5 - 0.5 * Math.cos(2 * W * t - 0.6));
  g.body.rotation.x = 0.02 * Math.sin(2 * W * t + 1.0);
  g.body.rotation.z = 0.02 * Math.sin(W * t + 0.7);

  /* neck & head nod */
  g.neck.rotation.x = 0.75 + 0.035 * Math.sin(W * t * 0.5 + 0.4);
  g.head.rotation.x = -0.18 + 0.05 * Math.sin(W * t * 0.5 + 1.6);
  g.head.rotation.y = 0.07 * Math.sin(W * t * 0.33 + 0.9);

  /* tail sway */
  for (let i = 0; i < g.tailSegs.length; i++) {
    const ts = g.tailSegs[i];
    ts.seg.rotation.x = ts.base + 0.09 * Math.sin(W * t * 0.55 + i * 0.75 + h.phase);
  }
}

/* =====================================================================
   Camera: follow the main giraffe, orbit on drag, zoom on wheel
   ===================================================================== */
const cam = { r: 10.5, th: 0.7, ph: 1.15, lastUser: -1e9 };
const camTarget = new THREE.Vector3(0, 1.9, MAIN_R);
const tmpV = new THREE.Vector3();

const el = renderer.domElement;
let dragging = false, px = 0, py = 0;
el.addEventListener('pointerdown', (e) => {
  dragging = true; px = e.clientX; py = e.clientY;
  cam.lastUser = performance.now();
  el.setPointerCapture(e.pointerId);
});
el.addEventListener('pointermove', (e) => {
  if (!dragging) return;
  const dx = e.clientX - px, dy = e.clientY - py;
  px = e.clientX; py = e.clientY;
  cam.th -= dx * 0.005;
  cam.ph = Math.min(1.5, Math.max(0.25, cam.ph + dy * 0.004));
  cam.lastUser = performance.now();
});
el.addEventListener('pointerup', () => { dragging = false; });
el.addEventListener('wheel', (e) => {
  e.preventDefault();
  cam.r = Math.min(28, Math.max(3.5, cam.r * Math.exp(e.deltaY * 0.0012)));
  cam.lastUser = performance.now();
}, { passive: false });

let paused = false;
window.addEventListener('keydown', (e) => {
  if (e.code === 'Space') { e.preventDefault(); paused = !paused; }
});

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* =====================================================================
   Main loop
   ===================================================================== */
let lastNow = performance.now();
renderer.setAnimationLoop((now) => {
  const dt = Math.min(0.05, (now - lastNow) / 1000);
  lastNow = now;

  for (const h of herd) animateGiraffe(h, dt);

  /* sun follows the herd's centre (main giraffe) so shadows stay crisp */
  const lead = herd[0].g.group.position;
  sunLight.position.copy(lead).addScaledVector(SUN_DIR, 60);
  sunLight.target.position.copy(lead);

  /* camera */
  tmpV.copy(lead).setY(1.85);
  camTarget.lerp(tmpV, 1 - Math.exp(-6 * dt));
  if (now - cam.lastUser > 6000) cam.th += 0.05 * dt;   // gentle auto-orbit
  camera.position.set(
    camTarget.x + cam.r * Math.sin(cam.ph) * Math.sin(cam.th),
    camTarget.y + cam.r * Math.cos(cam.ph),
    camTarget.z + cam.r * Math.sin(cam.ph) * Math.cos(cam.th)
  );
  camera.lookAt(camTarget);

  renderer.render(scene, camera);
});
</script>
