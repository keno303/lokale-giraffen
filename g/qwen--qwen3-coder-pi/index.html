<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realistic Walking Giraffe</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden;
            background: linear-gradient(to bottom, #87CEEB 0%, #87CEEB 50%, #87CEEB 50%, #90EE90 100%);
        }
        canvas { 
            display: block; 
        }
        #info {
            position: absolute;

<body>
    <div id="info">Realistic Walking Giraffe - Three.js Animation</div>

</html>
