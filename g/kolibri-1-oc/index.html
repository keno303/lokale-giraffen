<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Walking Giraffe Three.js</title>
  <style>
    body { margin: 0; overflow: hidden; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
</head>
<body>
<script>
  // Scene setup
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x87CEEB);
  
  const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(0, 5, 10);
  camera.lookAt(0, 0, 0);
  
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);
  
  // Lights
  const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
  scene.add(ambientLight);
  const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
  directionalLight.position.set(5, 10, 7);
  scene.add(directionalLight);
  
  // Ground
  const ground = new THREE.Mesh(
    new THREE.BoxGeometry(50, 1, 50),
    new THREE.MeshStandardMaterial({ color: 0x228B22 })
  );
  ground.position.y = -0.5;
  scene.add(ground);
  
  // Helper to create a box
  const box = (width, height, depth, color, position) => {
    const geometry = new THREE.BoxGeometry(width, height, depth);
    const material = new THREE.MeshStandardMaterial({ color });
    const mesh = new THREE.Mesh(geometry, material);
    mesh.position.copy(position);
    scene.add(mesh);
    return mesh;
  };
  
  // Giraffe group
  const giraffe = new THREE.Group();
  scene.add(giraffe);
  
  // Body
  const body = box(2, 3, 2, 0x8B4513, new THREE.Vector3(0, 1.5, 0)); // brown body
  giraffe.add(body);
  
  // Neck
  const neck = box(1.2, 4, 1.2, 0x8B4513, new THREE.Vector3(0, 5, 0));
  body.add(neck);
  
  // Head
  const head = box(1.5, 2, 1.5, 0x8B4513, new THREE.Vector3(0, 8, 0));
  neck.add(head);
  
  // Ears (small boxes)
  const ear1 = box(0.3, 0.3, 0.3, 0x5C4033, new THREE.Vector3(-0.8, 8.5, 0.5));
  head.add(ear1);
  const ear2 = box(0.3, 0.3, 0.3, 0x5C4033, new THREE.Vector3(0.8, 8.5, 0.5));
  head.add(ear2);
  
  // Eyes (small spheres)
  const eyeGeom = new THREE.SphereGeometry(0.15, 16, 16);
  const eyeMat = new THREE.MeshStandardMaterial({ color: 0x000000 });
  const eye1 = new THREE.Mesh(eyeGeom, eyeMat);
  eye1.position.set(-0.4, 9, 0.5);
  head.add(eye1);
  const eye2 = new THREE.Mesh(eyeGeom, eyeMat);
  eye2.position.set(0.4, 9, 0.5);
  head.add(eye2);
  
  // Legs (four legs)
  const legGeom = new THREE.BoxGeometry(0.4, 3, 0.4);
  const legMat = new THREE.MeshStandardMaterial({ color: 0x8B4513 });
  
  // Leg positions: x, z under body
  const legPositions = [
    { x: -1, z: -0.8 }, // front left
    { x: 1, z: -0.8 },  // front right
    { x: -1, z: 0.8 },  // back left
    { x: 1, z: 0.8 }   // back right
  ];
  
  const legGroups = [];
  legPositions.forEach((pos) => {
    const leg = new THREE.Mesh(legGeom, legMat);
    leg.position.set(pos.x, -1.5, pos.z); // center at -1.5 so top at y=0
    giraffe.add(leg);
    legGroups.push(leg);
  });
  
  // Animation
  const clock = new THREE.Clock();
  let angle = 0;
  function animate() {
    requestAnimationFrame(animate);
    const delta = clock.getDelta();
    
    // Body sway
    body.position.y = 1.5 + Math.sin(angle * 1.5) * 0.1;
    
    // Leg movement: walking gait with phase offset for each leg
    const amplitude = 0.5; // radians
    for (let i = 0; i < legGroups.length; i++) {
      // Phase offset: each leg shifted by i * Math.PI / 2
      const legSwing = Math.sin(angle * 2 + i * Math.PI / 2) * amplitude;
      legGroups[i].rotation.x = legSwing;
    }
    
    angle += delta * 1; // speed
    
    renderer.render(scene, camera);
  }
  animate();
  
  // Resize handler
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
</script>
</body>
</html>
