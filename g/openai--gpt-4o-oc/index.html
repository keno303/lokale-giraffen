<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js Walking Giraffe</title>
    <style>
        body { margin: 0; overflow: hidden; }
        canvas { display: block; }
    </style>
</head>
<body>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let scene, camera, renderer, giraffe;

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 5;

            renderer = new THREE.WebGLRenderer();
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            const giraffeGeometry = new THREE.BoxGeometry(0.5, 2, 0.5);
            const giraffeMaterial = new THREE.MeshBasicMaterial({ color: 0xffd700 });
            giraffe = new THREE.Mesh(giraffeGeometry, giraffeMaterial);
            giraffe.position.y = 1;

            const neckGeometry = new THREE.BoxGeometry(0.2, 1, 0.2);
            const neck = new THREE.Mesh(neckGeometry, giraffeMaterial);
            neck.position.y = 1.5;
            giraffe.add(neck);

            const headGeometry = new THREE.BoxGeometry(0.3, 0.3, 0.3);
            const head = new THREE.Mesh(headGeometry, giraffeMaterial);
            head.position.y = 1.9;
            giraffe.add(head);

            scene.add(giraffe);
        }

        function animate() {
            requestAnimationFrame(animate);

            giraffe.rotation.y += 0.01;

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
