<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Walking Giraffe - Three.js (no server required)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; }
    canvas { display: block; }
    #info {
      position: absolute; top: 10px; left: 10px; padding: 8px 12px; background: rgba(0,0,0,0.5);
      color: #fff; font-family: sans-serif; font-size: 12px; border-radius: 4px;
    }
  </style>
</head>
<body>
  <div id="info">Walking Giraffe - Three.js (no server required). Use the mouse to orbit the scene on touch, or just watch the gait.</div>
  <script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>
  <script>
    // Simple giraffe rig with two-segment legs and a neck, for a strolling animation.
    // Runs directly from file:// (no server required).

    // Scene setup
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xbfd1e5);

    // Camera
    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(8, 6, 12);
    camera.lookAt(0, 0, 0);

    // Renderer
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Lighting
    const ambient = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambient);
    const dir = new THREE.DirectionalLight(0xffffff, 0.8);
    dir.position.set(5, 10, 7);
    scene.add(dir);

    // Ground plane
    const groundGeo = new THREE.PlaneGeometry(40, 40);
    const groundMat = new THREE.MeshStandardMaterial({ color: 0x8a7b52, roughness: 0.6 });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // Helpers: simple grid lines for reference
    const gridHelper = new THREE.GridHelper(40, 40, 0x000000, 0x000000);
    gridHelper.material.opacity = 0.25;
    gridHelper.material.transparent = true;
    scene.add(gridHelper);

    // Material for giraffe parts
    const gMat = new THREE.MeshStandardMaterial({ color: 0xd2a36f, roughness: 0.7 });
    const gMatDark = new THREE.MeshStandardMaterial({ color: 0x8a6a3a, roughness: 0.8 });

    // Giraffe body components (simplified, but with recognizable proportions)
    const giraffe = new THREE.Group();

    // Body (long torso)
    const body = new THREE.Mesh(new THREE.BoxGeometry(2.2, 1.2, 5.0), gMat);
    body.position.set(0, 1.0, 0);
    body.name = 'body';
    giraffe.add(body);

    // Neck (two-segment live neck)
    const neckBase = new THREE.Group();
    neckBase.position.set(0, 1.9, 2.2); // attach near front-top of body

    const neckSegment1 = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.25, 1.8, 8), gMat);
    neckSegment1.rotation.z = Math.PI / 2;
    neckSegment1.position.x = 0.9; // offset outward
    neckSegment1.position.y = 1.0;

    const neckJoint = new THREE.Group();
    neckJoint.position.set(0, 0, 0);

    const neckSegment2 = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.18, 1.2, 8), gMat);
    neckSegment2.rotation.z = Math.PI / 2;
    neckSegment2.position.x = 1.7;
    neckSegment2.position.y = 1.7;

    // Head
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.42, 16, 12), gMatDark);
    head.position.set(2.2, 2.0, 4.0);

    // Neck assembly
    neckJoint.add(neckSegment2);
    neckBase.add(neckSegment1);
    neckBase.add(neckJoint);
    neckJoint.add(head);
    // Attach neck to body
    neckBase.rotation.y = -0.25;
    neckBase.position.set(-0.15, 1.95, 2.2);
    giraffe.add(neckBase);

    // Tail
    const tail = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.12, 1.2, 8), gMat);
    tail.position.set(0.75, 0.75, -3.0);
    tail.rotation.x = Math.PI / 2;
    giraffe.add(tail);

    // Legs: two-segment legs (thigh + shin) per leg
    function makeLeg(x, z) {
      const leg = new THREE.Group();
      // hip joint location relative to body
      const thigh = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.22, 1.6, 8), gMat);
      thigh.geometry.translate(0, -0.8, 0);
      thigh.position.set(x, 0.2, z);

      // knee segment
      const shin = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.18, 1.6, 8), gMat);
      shin.geometry.translate(0, -0.8, 0);
      const knee = new THREE.Group();
      knee.position.set(0, -0.8, 0);
      shin.position.set(0, -0.8, 0);
      knee.add(shin);

      leg.add(thigh);
      thigh.add(knee);

      // contact point at ground for the end of shin
      const foot = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.25, 0.5), gMatDark);
      foot.position.set(0, -2.4, 0);
      knee.add(foot);

      // set initial rotation
      thigh.rotation.z = 0;
      knee.rotation.z = 0; // knee hinge is simulated by rotating thigh and shin around their local axes
      thigh.rotation.x = 0; // allow bending in x for gait
      knee.rotation.x = 0;

      leg.userData = { thigh, knee };
      // Align leg base to body edge
      leg.position.set(0, 0, 0);
      return leg;
    }

    const legFL = makeLeg(-0.95, 1.9); // front-left
    const legFR = makeLeg(0.95, 1.9);  // front-right
    const legBL = makeLeg(-0.95, -1.9); // back-left
    const legBR = makeLeg(0.95, -1.9);  // back-right

    // Attach legs to body
    legFL.position.set(-0.93, 0, 2.2);
    legFR.position.set(0.93, 0, 2.2);
    legBL.position.set(-0.93, 0, -2.2);
    legBR.position.set(0.93, 0, -2.2);

    // Add legs to body group
    giraffe.add(legFL);
    giraffe.add(legFR);
    giraffe.add(legBL);
    giraffe.add(legBR);

    // Center giraffe on scene
    giraffe.position.set(0, 0, 0);
    scene.add(giraffe);

    // Ground shadow (simple blob) under giraffe
    const shadow = new THREE.Mesh(new THREE.PlaneGeometry(2.5, 2.5), new THREE.MeshBasicMaterial({ color: 0x000000, opacity: 0.15, transparent: true }));
    shadow.rotation.x = -Math.PI / 2;
    shadow.position.y = 0.01;
    giraffe.add(shadow);

    // Animation state
    let clock = new THREE.Clock();
    const gaitSpeed = 1.2; // cycles per second scale

    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();
      const phase = t * gaitSpeed;

      // Simple walking gait: legs swing with sine waves
      // Front-left and back-right move in phase; front-right and back-left in opposite phase
      const swing = Math.sin(phase);
      const kneeSwing = Math.cos(phase) * 0.25; // minor knee bend

      // Helper to rotate a leg's joints
      function applyLeg(leg, legIndex) {
        // legs contain a thigh (in userData) with a knee group as child
        // We'll locate thigh by traversing
        // For simplicity, we'll set transforms on the leg root (struct above)
        // We simulate hip swing by rotating the leg's local X (forward/back)
      }

      // Instead, manually apply for each leg using direct references
      // Front-left leg
      legFL.rotation.x = 0.5 * swing; // hip flex
      legFL.children[0].rotation.x = 0.5 * swing; // thigh bend
      // Knee group is at legFL.children[0].children[0]
      // The knee group is the knee (first child of thigh's child)
      if (legFL.children[0] && legFL.children[0].children.length > 0) {
        const kneeGroup = legFL.children[0].children[0];
        kneeGroup.rotation.x = -0.4 * swing;
        // foot orientation
        if (kneeGroup.children && kneeGroup.children.length > 0) {
          kneeGroup.children[0].rotation.x = 0.1 * swing;
        }
      }

      // Front-right leg (opposite phase)
      legFR.rotation.x = -0.5 * swing;
      legFR.children[0].rotation.x = -0.5 * swing;
      if (legFR.children[0] && legFR.children[0].children.length > 0) {
        const kneeGroupR = legFR.children[0].children[0];
        kneeGroupR.rotation.x = 0.4 * swing;
        if (kneeGroupR.children && kneeGroupR.children.length > 0) {
          kneeGroupR.children[0].rotation.x = -0.1 * swing;
        }
      }

      // Back-left leg
      legBL.rotation.x = -0.5 * swing;
      legBL.children[0].rotation.x = -0.5 * swing;
      if (legBL.children[0] && legBL.children[0].children.length > 0) {
        const kneeGroupBL = legBL.children[0].children[0];
        kneeGroupBL.rotation.x = 0.4 * swing;
        if (kneeGroupBL.children && kneeGroupBL.children.length > 0) {
          kneeGroupBL.children[0].rotation.x = -0.1 * swing;
        }
      }

      // Back-right leg
      legBR.rotation.x = 0.5 * swing;
      legBR.children[0].rotation.x = 0.5 * swing;
      if (legBR.children[0] && legBR.children[0].children.length > 0) {
        const kneeGroupBR = legBR.children[0].children[0];
        kneeGroupBR.rotation.x = -0.4 * swing;
        if (kneeGroupBR.children && kneeGroupBR.children.length > 0) {
          kneeGroupBR.children[0].rotation.x = 0.1 * swing;
        }
      }

      // Neck bobbing and slight head twist for realism
      neckBase.rotation.x = 0.12 * Math.sin(phase * 0.5);
      neckBase.rotation.y = -0.15 * Math.sin(phase * 0.6);
      head.rotation.y = 0.15 * Math.sin(phase * 0.6);

      // Move the giraffe slightly forward to feel alive
      giraffe.position.z += 0.0004 * swing;

      renderer.render(scene, camera);
    }

    // Start
    animate();

    // Responsive
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }, false);
  </script>
</body>
</html>
