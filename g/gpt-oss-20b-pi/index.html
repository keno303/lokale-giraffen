<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Walking Giraffe</title>
  <style>
    body{margin:0;overflow:hidden;background:#87cefa;}
  </style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/three@0.152.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.152.0/examples/js/controls/OrbitControls.js"></script>
<script>
  // Basic setup
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.1, 1000);
  camera.position.set(0, 5, 15);
  const renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);
  window.addEventListener('resize',()=>{camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight);});
  // Light
  const hemi = new THREE.HemisphereLight(0xffffff,0x444444,1.5);
  hemi.position.set(0,20,0);
  scene.add(hemi);
  const dir = new THREE.DirectionalLight(0xffffff,0.5);
  dir.position.set(-3,10,10);
  scene.add(dir);
  // Ground
  const groundGeo = new THREE.PlaneGeometry(200,200);
  const groundMat = new THREE.MeshStandardMaterial({color:0x228B22});
  const ground = new THREE.Mesh(groundGeo,groundMat);
  ground.rotation.x = -Math.PI/2;
  ground.position.y = -1;
  scene.add(ground);
  // Giraffe
  const giraffe = new THREE.Group();
  scene.add(giraffe);
  // Body
  const bodyGeo = new THREE.BoxGeometry(4,2,1.5);
  const bodyMat = new THREE.MeshStandardMaterial({color:0xFFCC00});
  const body = new THREE.Mesh(bodyGeo,bodyMat);
  body.position.set(0,1,0);
  giraffe.add(body);
  // Neck
  const neckGeo = new THREE.BoxGeometry(1.5,1,1);
  const neckMat = new THREE.MeshStandardMaterial({color:0xFFCC00});
  const neck = new THREE.Mesh(neckGeo,neckMat);
  neck.position.set(0,1.75,0);
  giraffe.add(neck);
  // Head
  const headGeo = new THREE.BoxGeometry(1,1,1);
  const headMat = new THREE.MeshStandardMaterial({color:0xFFCC00});
  const head = new THREE.Mesh(headGeo,headMat);
  head.position.set(0,0.75,0);
  neck.add(head);
  // Legs
  const legGeo = new THREE.BoxGeometry(0.5,2,0.5);
  const legMat = new THREE.MeshStandardMaterial({color:0xFFCC00});
  const legPositions = [
    {name:'frontLeft',x:-1.5,y:-1,z:0.5},
    {name:'frontRight',x:1.5,y:-1,z:0.5},
    {name:'backLeft',x:-1.5,y:-1,z:-0.5},
    {name:'backRight',x:1.5,y:-1,z:-0.5},
  ];
  const legs = {};
  legPositions.forEach(p=>{
    const leg = new THREE.Mesh(legGeo,legMat);
    leg.position.set(p.x,p.y,p.z);
    body.add(leg);
    legs[p.name]=leg;
  });
  // Animation
  const clock = new THREE.Clock();
  function animate(){
    const t = clock.getElapsedTime();
    const swing = Math.PI/6;
    legs.frontLeft.rotation.x = Math.sin(t*2)*swing;
    legs.backRight.rotation.x = Math.sin(t*2)*swing;
    legs.frontRight.rotation.x = Math.sin(t*2 + Math.PI)*swing;
    legs.backLeft.rotation.x = Math.sin(t*2 + Math.PI)*swing;
    renderer.render(scene,camera);
    requestAnimationFrame(animate);
  }
  animate();
  // Controls
  new THREE.OrbitControls(camera,renderer.domElement);
</script>
</body>
</html>
