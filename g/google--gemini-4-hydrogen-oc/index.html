<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Giraffa camelopardalis — Realistic Walking Giraffe in Three.js</title>
  <style>
    :root {
      --bg-glass: rgba(20, 16, 13, 0.62);
      --border-glass: rgba(242, 214, 174, 0.22);
      --text-main: #f7efe4;
      --text-muted: #cab8a0;
      --accent: #e5a356;
      --accent-bg: rgba(229, 163, 86, 0.22);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1a1410;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text-main);
      user-select: none;
    }

    #canvas-container {
      position: fixed;
      inset: 0;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .hud-wrapper {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-width: 310px;
    }

    .hud-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 14px;
      background: var(--bg-glass);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border-glass);
      border-radius: 12px;
    }

    .hud-title h1 {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: var(--text-main);
    }

    .hud-title p {
      font-size: 11px;
      font-style: italic;
      color: var(--text-muted);
      margin-top: 1px;
    }

    .hud-panel {
      padding: 12px 14px;
      background: var(--bg-glass);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border-glass);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      gap: 11px;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .hud-panel.collapsed {
      display: none;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .control-label {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
    }

    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    button {
      appearance: none;
      border: 1px solid rgba(255, 236, 209, 0.16);
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-main);
      font-size: 11.5px;
      font-weight: 500;
      padding: 5px 9px;
      border-radius: 7px;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    }

    button:hover {
      background: rgba(255, 255, 255, 0.14);
      border-color: rgba(242, 214, 174, 0.35);
    }

    button.active {
      background: var(--accent-bg);
      border-color: var(--accent);
      color: #ffe3bc;
    }

    .hud-hint {
      font-size: 10.5px;
      color: var(--text-muted);
      line-height: 1.4;
      border-top: 1px solid rgba(255, 236, 209, 0.1);
      padding-top: 8px;
    }

    #toggle-hud-btn {
      font-size: 11px;
      padding: 4px 8px;
      white-space: nowrap;
    }

    @media (max-width: 600px) {
      .hud-wrapper {
        max-width: calc(100vw - 24px);
        left: 12px;
        top: 12px;
      }
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>

  <div class="hud-wrapper">
    <div class="hud-header">
      <div class="hud-title">
        <h1>African Savanna Giraffe</h1>
        <p>Giraffa camelopardalis</p>
      </div>
      <button id="toggle-hud-btn" type="button">Hide (H)</button>
    </div>

    <div id="hud-panel" class="hud-panel">
      <div class="control-group">
        <div class="control-label">Camera View</div>
        <div class="btn-row">
          <button type="button" data-cam="portrait" class="active">3/4 Portrait</button>
          <button type="button" data-cam="side">Side Gait</button>
          <button type="button" data-cam="low">Low Heroic</button>
          <button type="button" data-cam="closeup">Head &amp; Neck</button>
        </div>
      </div>

      <div class="control-group">
        <div class="control-label">Locomotion (Lateral Amble)</div>
        <div class="btn-row">
          <button type="button" data-speed="0">Stand</button>
          <button type="button" data-speed="0.95">Stroll</button>
          <button type="button" data-speed="1.55" class="active">Walk</button>
          <button type="button" data-speed="2.15">Brisk</button>
        </div>
      </div>

      <div class="control-group">
        <div class="control-label">Subspecies Coat</div>
        <div class="btn-row">
          <button type="button" data-species="0" class="active">Reticulated</button>
          <button type="button" data-species="1">Masai</button>
          <button type="button" data-species="2">Rothschild</button>
        </div>
      </div>

      <div class="control-group">
        <div class="control-label">Lighting</div>
        <div class="btn-row">
          <button type="button" data-tod="golden" class="active">Golden Hour</button>
          <button type="button" data-tod="midday">Midday</button>
          <button type="button" data-tod="dusk">Dusk</button>
        </div>
      </div>

      <div class="control-group">
        <div class="control-label">Tools</div>
        <div class="btn-row">
          <button type="button" id="btn-pause">Pause</button>
          <button type="button" id="btn-treadmill">In-Place (T)</button>
          <button type="button" id="btn-skeleton">Skeleton (D)</button>
        </div>
      </div>

      <div class="hud-hint">
        Drag to orbit &bull; Scroll to zoom &bull; Right-drag to pan &bull; Space to pause
      </div>
    </div>
  </div>

  <script src="lib/three.bundle.js"></script>
  <script src="js/math-utils.js"></script>
  <script src="js/coat-shader.js"></script>
  <script src="js/giraffe-anatomy.js"></script>
  <script src="js/giraffe-gait.js"></script>
  <script src="js/savanna-env.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
