<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Walking Giraffe — Three.js</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#1a120a; }
  canvas { display:block; }
  #hud {
    position:fixed; top:0; left:0; right:0; z-index:10; pointer-events:none;
    padding:22px 30px;
    background:linear-gradient(to bottom, rgba(26,16,8,0.55), rgba(26,16,8,0));
    color:#f3e5c0; font-family:'Avenir Next','Segoe UI',system-ui,sans-serif;
  }
  #hud h1 { margin:0; font-size:22px; font-weight:600; letter-spacing:0.06em; text-shadow:0 1px 8px rgba(0,0,0,0.5); }
  #hud p  { margin:4px 0 0; font-size:12px; font-weight:400; letter-spacing:0.12em; text-transform:uppercase; color:#cbb180; }
  #pace {
    position:fixed; right:26px; bottom:22px; z-index:10; pointer-events:none;
    font-family:'Avenir Next','Segoe UI',system-ui,sans-serif; font-size:12px; letter-spacing:0.14em;
    text-transform:uppercase; color:#e8d5a4; background:rgba(26,16,8,0.45);
    border:1px solid rgba(232,213,164,0.25); border-radius:999px; padding:7px 16px;
    backdrop-filter:blur(4px);
  }
  #hint {
    position:fixed; left:26px; bottom:22px; z-index:10; pointer-events:none;
    font-family:'Avenir Next','Segoe UI',system-ui,sans-serif; font-size:11.5px; letter-spacing:0.08em;
    color:rgba(243,229,192,0.75); text-shadow:0 1px 4px rgba(0,0,0,0.6);
  }
  #err {
    position:fixed; inset:0; z-index:50; display:none;
    align-items:center; justify-content:center; color:#ffd9b0; font-family:system-ui,sans-serif;
    font-size:15px; background:rgba(20,12,6,0.92); text-align:center; padding:30px;
  }
</style>
</head>
<body>
<div id="hud">
  <h1>The Walking Giraffe</h1>
  <p>A savanna stroll &middot; Three.js</p>
</div>
<div id="hint">drag &mdash; orbit &nbsp;&middot;&nbsp; scroll &mdash; zoom &nbsp;&middot;&nbsp; space &mdash; walk / trot</div>
<div id="pace">pace: walk</div>
<div id="err"></div>
<script src="three.min.js"></script>
<script>
'use strict';
(function(){
if (typeof THREE === 'undefined') {
  document.getElementById('err').style.display='flex';
  document.getElementById('err').textContent = 'three.min.js not found next to index.html';
  return;
}
window.addEventListener('error', function(e){
  var el = document.getElementById('err');
  el.style.display='flex';
  el.textContent = 'Runtime error: ' + e.message;
});

/* ============================================================ *
 *  RENDERER / SCENE / CAMERA
 * ============================================================ */
var renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

var scene = new THREE.Scene();
var FOG_COLOR = new THREE.Color(0xdcc9a3);
scene.fog = new THREE.Fog(FOG_COLOR, 55, 390);

var camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.1, 1500);
camera.position.set(0, 3, 42);

/* ============================================================ *
 *  SKY, SUN, LIGHTS
 * ============================================================ */
var sky = new THREE.Mesh(
  new THREE.SphereGeometry(900, 32, 16),
  new THREE.ShaderMaterial({
    side: THREE.BackSide, fog:false, depthWrite:false,
    uniforms:{
      top:    { value: new THREE.Color(0x3f7cb8) },
      mid:    { value: new THREE.Color(0xa9c6da) },
      bottom: { value: new THREE.Color(0xdcc9a3) } // == fog color: seamless horizon
    },
    vertexShader: [
      'varying vec3 vP;',
      'void main(){ vP = position;',
      '  gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }'
    ].join('\n'),
    fragmentShader: [
      'uniform vec3 top; uniform vec3 mid; uniform vec3 bottom; varying vec3 vP;',
      'void main(){',
      '  float h = normalize(vP).y;',
      '  vec3 c = h > 0.10 ? mix(mid, top, smoothstep(0.10, 0.62, h))',
      '                         : mix(bottom, mid, smoothstep(-0.04, 0.10, h));',
      '  gl_FragColor = vec4(c, 1.0); }'
    ].join('\n')
  })
);
scene.add(sky);

var SUN_DIR = new THREE.Vector3(-0.52, 0.74, -0.40).normalize();

var sun = new THREE.DirectionalLight(0xffe2b3, 1.75);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 20;
sun.shadow.camera.far = 260;
var SH = 22;
sun.shadow.camera.left = -SH; sun.shadow.camera.right = SH;
sun.shadow.camera.top = SH;   sun.shadow.camera.bottom = -SH;
sun.shadow.bias = -0.0003;
sun.shadow.normalBias = 0.045;
scene.add(sun);
scene.add(sun.target);

var hemi = new THREE.HemisphereLight(0x9fb6d6, 0x8a7048, 0.55);
scene.add(hemi);
scene.add(new THREE.AmbientLight(0x40342a, 0.35));

// sun glow sprite
(function(){
  var c = document.createElement('canvas'); c.width = c.height = 256;
  var g = c.getContext('2d');
  var grd = g.createRadialGradient(128,128,0, 128,128,128);
  grd.addColorStop(0.00, 'rgba(255,244,214,1)');
  grd.addColorStop(0.18, 'rgba(255,232,180,0.85)');
  grd.addColorStop(0.45, 'rgba(255,214,140,0.28)');
  grd.addColorStop(1.00, 'rgba(255,200,120,0)');
  g.fillStyle = grd; g.fillRect(0,0,256,256);
  var tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
  var m = new THREE.SpriteMaterial({ map:tex, blending:THREE.AdditiveBlending, depthWrite:false, fog:false, opacity:0.95 });
  var s = new THREE.Sprite(m);
  s.scale.set(150, 150, 1);
  s.position.copy(SUN_DIR).multiplyScalar(780);
  scene.add(s);
})();

/* ============================================================ *
 *  PROCEDURAL TEXTURES
 * ============================================================ */
function makeGroundTexture(){
  var c = document.createElement('canvas'); c.width = c.height = 512;
  var g = c.getContext('2d');
  g.fillStyle = '#b3945a'; g.fillRect(0,0,512,512);
  var i, x, y, r, t;
  for (i=0;i<140;i++){                       // large-scale tonal variation
    x = Math.random()*512; y = Math.random()*512; r = 30 + Math.random()*90;
    var grd = g.createRadialGradient(x, y, 0, x, y, r);
    var dark = Math.random() < 0.5;
    grd.addColorStop(0, dark ? 'rgba(122,94,48,0.30)' : 'rgba(212,184,118,0.30)');
    grd.addColorStop(1, dark ? 'rgba(122,94,48,0)' : 'rgba(212,184,118,0)');
    g.fillStyle = grd;
    g.beginPath(); g.arc(x, y, r, 0, Math.PI*2); g.fill();
  }
  for (i=0;i<1100;i++){                      // mottled dry-grass patches
    x = Math.random()*512; y = Math.random()*512; r = 2 + Math.random()*15;
    t = Math.random();
    g.fillStyle = t < 0.5
      ? 'rgba(138,106,52,' + (0.10+Math.random()*0.22).toFixed(3) + ')'
      : 'rgba(208,178,112,' + (0.10+Math.random()*0.22).toFixed(3) + ')';
    g.beginPath();
    g.ellipse(x, y, r, r*(0.35+Math.random()*0.6), Math.random()*Math.PI, 0, Math.PI*2);
    g.fill();
  }
  for (i=0;i<5600;i++){                      // individual grass strokes
    x = Math.random()*512; y = Math.random()*512;
    var len = 2 + Math.random()*5.5, a = Math.random()*Math.PI;
    g.strokeStyle = 'hsl(' + (38+Math.random()*16).toFixed(0) + ',' + (30+Math.random()*25).toFixed(0) + '%,' + (36+Math.random()*26).toFixed(0) + '%)';
    g.lineWidth = 1;
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a)*len, y + Math.sin(a)*len*0.7); g.stroke();
  }
  var tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(40, 40);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return tex;
}

/* Tileable giraffe coat: irregular polygonal spots on a cream base. */
function makeCoatTexture(opts){
  opts = opts || {};
  var size = 1024, spots = opts.spots || 96, seed = opts.seed || 1;
  var c = document.createElement('canvas'); c.width = c.height = size;
  var g = c.getContext('2d');
  g.fillStyle = opts.base || '#e9cfa2'; g.fillRect(0,0,size,size);
  // faint mottling
  for (var i=0;i<420;i++){
    var mx = Math.random()*size, my = Math.random()*size, mr = 8+Math.random()*30;
    g.fillStyle = Math.random()<0.5 ? 'rgba(226,196,140,0.25)' : 'rgba(203,164,106,0.22)';
    g.beginPath(); g.arc(mx, my, mr, 0, Math.PI*2); g.fill();
  }
  function blob(cx, cy, rad, fill){
    var n = 7 + (Math.random()*5|0), pts = [], k;
    for (k=0;k<n;k++){
      var a = (k/n)*Math.PI*2 + (Math.random()-0.5)*0.4;
      var rr = rad*(0.60 + Math.random()*0.55);
      pts.push([cx + Math.cos(a)*rr, cy + Math.sin(a)*rr*(0.72+Math.random()*0.42)]);
    }
    g.beginPath();
    for (k=0;k<=n;k++){
      var p = pts[k%n], q = pts[(k+1)%n];
      var mxp = (p[0]+q[0])/2, myp = (p[1]+q[1])/2;
      if (k===0) g.moveTo(mxp, myp); else g.quadraticCurveTo(p[0], p[1], mxp, myp);
    }
    g.closePath(); g.fillStyle = fill; g.fill();
  }
  for (i=0;i<spots;i++){
    var sx = Math.random()*size, sy = Math.random()*size;
    var sr = 24 + Math.random()*62;
    var shade = 0.82 + Math.random()*0.36;
    var fill = 'rgb(' + (112*shade|0) + ',' + (66*shade|0) + ',' + (30*shade|0) + ')';
    for (var ox=-1; ox<=1; ox++)           // tileable: draw 3x3 wrap copies
      for (var oy=-1; oy<=1; oy++)
        blob(sx + ox*size, sy + oy*size, sr, fill);
  }
  // a few faint "ghost" spots
  for (i=0;i<26;i++){
    var gx = Math.random()*size, gy = Math.random()*size, gr = 20 + Math.random()*40;
    for (var px=-1; px<=1; px++)
      for (var py=-1; py<=1; py++)
        blob(gx + px*size, gy + py*size, gr, 'rgba(150,104,58,0.18)');
  }
  var tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return tex;
}

function makeRadialTexture(inner, outer){
  var c = document.createElement('canvas'); c.width = c.height = 64;
  var g = c.getContext('2d');
  var grd = g.createRadialGradient(32,32,0, 32,32,32);
  grd.addColorStop(0, inner); grd.addColorStop(1, outer);
  g.fillStyle = grd; g.fillRect(0,0,64,64);
  var t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

var coatTex   = makeCoatTexture({ spots:100 });
var legTex    = makeCoatTexture({ spots:60, seed:2 });
legTex.repeat.set(6.0, 6.5);
var neckTex   = makeCoatTexture({ spots:120, seed:3 });
neckTex.repeat.set(2.2, 1);

/* ============================================================ *
 *  GROUND & ENVIRONMENT
 * ============================================================ */
var ground = new THREE.Mesh(
  new THREE.PlaneGeometry(760, 760),
  new THREE.MeshStandardMaterial({ map: makeGroundTexture(), roughness: 1, metalness: 0 })
);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);

function rand(a, b){ return a + Math.random()*(b-a); }

function makeTree(){
  var grp = new THREE.Group();
  var bark = new THREE.MeshStandardMaterial({ color:0x6a4a2e, roughness:0.95 });
  var h = rand(3.2, 5.2);
  var trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.42, h, 7), bark);
  trunk.position.y = h/2; trunk.rotation.z = rand(-0.07, 0.07); trunk.rotation.x = rand(-0.05, 0.05);
  trunk.castShadow = true; grp.add(trunk);
  var nb = 2 + (Math.random()*2|0);
  for (var i=0;i<nb;i++){
    var bl = rand(1.6, 2.8);
    var br = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.16, bl, 6), bark);
    var ang = rand(0, Math.PI*2);
    br.position.set(Math.cos(ang)*0.5, h*rand(0.72, 0.92), Math.sin(ang)*0.5);
    br.rotation.z = Math.cos(ang)*0.7; br.rotation.x = -Math.sin(ang)*0.7;
    br.castShadow = true; grp.add(br);
  }
  var canopyMat = new THREE.MeshStandardMaterial({ color: new THREE.Color().setHSL(0.19, rand(0.28,0.4), rand(0.30,0.40)), roughness:0.95 });
  var nc = 4 + (Math.random()*3|0);
  for (i=0;i<nc;i++){
    var s = new THREE.Mesh(new THREE.IcosahedronGeometry(rand(1.6, 3.2), 1), canopyMat);
    s.scale.set(rand(1.4, 2.2), rand(0.55, 0.85), rand(1.4, 2.2));
    s.position.set(rand(-1.6, 1.6), h + rand(0.2, 0.9), rand(-1.6, 1.6));
    s.castShadow = true; grp.add(s);
  }
  var top = new THREE.Mesh(new THREE.IcosahedronGeometry(rand(2.2, 3.0), 1), canopyMat);
  top.scale.set(1.6, 0.5, 1.6);
  top.position.y = h + rand(0.8, 1.2);
  top.castShadow = true; grp.add(top);
  return grp;
}

function makeBush(){
  var grp = new THREE.Group();
  var mat = new THREE.MeshStandardMaterial({ color: new THREE.Color().setHSL(rand(0.12,0.2), rand(0.3,0.45), rand(0.32,0.45)), roughness:1 });
  var n = 3 + (Math.random()*3|0);
  for (var i=0;i<n;i++){
    var s = new THREE.Mesh(new THREE.IcosahedronGeometry(rand(0.4, 0.9), 1), mat);
    s.scale.y = rand(0.5, 0.75);
    s.position.set(rand(-0.7,0.7), rand(0.15,0.5), rand(-0.7,0.7));
    s.castShadow = true; grp.add(s);
  }
  return grp;
}

function makeRock(){
  var m = new THREE.Mesh(
    new THREE.DodecahedronGeometry(rand(0.4, 1.1), 0),
    new THREE.MeshStandardMaterial({ color: new THREE.Color().setHSL(0.09, 0.12, rand(0.42,0.58)), roughness:1, flatShading:true })
  );
  m.scale.set(rand(0.8,1.6), rand(0.5,0.9), rand(0.8,1.6));
  m.rotation.set(Math.random()*0.4, Math.random()*Math.PI*2, Math.random()*0.3);
  m.castShadow = true; m.receiveShadow = true;
  return m;
}

var PATH_R = 30;
function placeAwayFromPath(){
  // random polar position, rejected if too close to the walking circle
  for (var tries=0; tries<24; tries++){
    var a = Math.random()*Math.PI*2, r = rand(6, 95);
    if (Math.abs(r - PATH_R) < 7) continue;
    return [Math.sin(a)*r, Math.cos(a)*r];
  }
  return [rand(-80,80), rand(-80,80)];
}
var trees = [], bushes = [], rocks = [];
var occluders = [];   // canopy spheres for camera collision
for (var i=0;i<16;i++){
  var p = placeAwayFromPath();
  var tr = makeTree(); tr.position.set(p[0], 0, p[1]); tr.rotation.y = Math.random()*Math.PI*2;
  scene.add(tr); trees.push(tr);
  occluders.push({ c: new THREE.Vector3(p[0], rand(3.9, 5.6), p[1]), r: 6.2 });
}
for (i=0;i<14;i++){
  var pb = placeAwayFromPath();
  var bu = makeBush(); bu.position.set(pb[0], 0, pb[1]); scene.add(bu); bushes.push(bu);
}
for (i=0;i<8;i++){
  var pr = placeAwayFromPath();
  var rk = makeRock(); rk.position.set(pr[0], 0.1, pr[1]); scene.add(rk); rocks.push(rk);
}
// distant hazy hills
var hillMat = new THREE.MeshStandardMaterial({ color:0x5c5138, roughness:1 });
for (i=0;i<9;i++){
  var ha = (i/9)*Math.PI*2 + rand(-0.2,0.2);
  var hr = rand(175, 240);
  var hill = new THREE.Mesh(new THREE.SphereGeometry(1, 24, 14), hillMat);
  hill.scale.set(rand(45, 95), rand(12, 26), rand(45, 95));
  hill.position.set(Math.sin(ha)*hr, -12, Math.cos(ha)*hr);
  scene.add(hill);
}

// drifting clouds
var clouds = [];
(function(){
  var cm = new THREE.MeshStandardMaterial({ color:0xf2ede2, emissive:0x8d887c, emissiveIntensity:0.28, roughness:1 });
  for (var i=0;i<6;i++){
    var g = new THREE.Group();
    var n = 5 + (Math.random()*3|0);
    for (var j=0;j<n;j++){
      var s = new THREE.Mesh(new THREE.IcosahedronGeometry(rand(3,7), 1), cm);
      s.scale.set(rand(1,2.2), rand(0.35,0.6), rand(1,2.2));
      s.position.set(rand(-10,10), rand(-1.5,1.5), rand(-5,5));
      g.add(s);
    }
    g.position.set(rand(-320,320), rand(55,120), rand(-280,-40));
    scene.add(g); clouds.push(g);
  }
})();

// distant circling birds
var birds = [];
(function(){
  var bm = new THREE.MeshBasicMaterial({ color:0x241f1a, side:THREE.DoubleSide });
  for (var i=0;i<4;i++){
    var b = new THREE.Group();
    var body = new THREE.Mesh(new THREE.SphereGeometry(0.14, 6, 5), bm);
    body.scale.set(0.7, 0.6, 2.2); b.add(body);
    var wl = new THREE.Mesh(new THREE.PlaneGeometry(1.5, 0.42), bm);
    wl.geometry.rotateX(-Math.PI/2);          // horizontal wing
    wl.geometry.translate(0.75, 0, 0);
    var wr = new THREE.Mesh(new THREE.PlaneGeometry(1.5, 0.42), bm);
    wr.geometry.rotateX(-Math.PI/2);
    wr.geometry.translate(-0.75, 0, 0);
    b.add(wl); b.add(wr);
    b.userData = { r: rand(16, 34), h: rand(26, 44), sp: rand(0.12, 0.28)*(Math.random()<0.5?-1:1), ph: Math.random()*Math.PI*2, wl: wl, wr: wr };
    scene.add(b); birds.push(b);
  }
})();

/* ============================================================ *
 *  GIRAFFE
 * ============================================================ */
function taperedTube(curve, samples, sides, rStart, rEnd, vPerMeter, outFrames){
  var P = [], T = [], N = [];
  var i, j;
  for (i=0;i<=samples;i++){
    P.push(curve.getPoint(i/samples));
    T.push(curve.getTangent(i/samples).normalize());
  }
  N.push(new THREE.Vector3(0,1,0).cross(T[0]).normalize());
  if (N[0].lengthSq() < 1e-6) N[0].set(1,0,0);
  for (i=1;i<=samples;i++){
    var prev = N[i-1].clone();
    N.push(prev.sub(T[i].clone().multiplyScalar(prev.dot(T[i]))).normalize());
  }
  var pos=[], nor=[], uv=[], idx=[];
  var B = new THREE.Vector3(), dir = new THREE.Vector3();
  for (i=0;i<=samples;i++){
    var t = i/samples;
    var r = rStart + (rEnd-rStart)*THREE.MathUtils.smoothstep(t, 0, 1);
    B.crossVectors(T[i], N[i]).normalize();
    for (j=0;j<=sides;j++){
      var th = (j/sides)*Math.PI*2;
      dir.set(0,0,0).addScaledVector(N[i], Math.cos(th)).addScaledVector(B, Math.sin(th));
      pos.push(P[i].x + dir.x*r, P[i].y + dir.y*r, P[i].z + dir.z*r);
      nor.push(dir.x, dir.y, dir.z);
      uv.push(j/sides, t*curve.getLength()*vPerMeter);
    }
    if (outFrames) outFrames.push({ P:P[i], N:N[i].clone(), B:B.clone(), T:T[i].clone() });
  }
  for (i=0;i<samples;i++){
    for (j=0;j<sides;j++){
      var a = i*(sides+1)+j, b = a+(sides+1);
      idx.push(a, b, a+1,  b, b+1, a+1);
    }
  }
  var g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('normal',   new THREE.Float32BufferAttribute(nor, 3));
  g.setAttribute('uv',       new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx);
  return g;
}

var HOOF_DROP = 0.13;   // hoof mesh hangs this far below the ankle joint
var coatMat  = new THREE.MeshStandardMaterial({ map:coatTex,  roughness:0.88, metalness:0 });
var legMat   = new THREE.MeshStandardMaterial({ map:legTex,   roughness:0.88, metalness:0 });
var neckMat  = new THREE.MeshStandardMaterial({ map:neckTex,  roughness:0.88, metalness:0, side:THREE.DoubleSide });
var creamMat = new THREE.MeshStandardMaterial({ color:0xe9d7b4, roughness:0.9 });
var darkMat  = new THREE.MeshStandardMaterial({ color:0x46280f, roughness:0.65 });
var maneMat  = new THREE.MeshStandardMaterial({ color:0x2f1d0c, roughness:0.95 });
var hoofMat  = new THREE.MeshStandardMaterial({ color:0x2e2521, roughness:0.45, metalness:0.1 });
var earInMat = new THREE.MeshStandardMaterial({ color:0x9c6b42, roughness:0.9 });

function buildGiraffe(){
  var gir = new THREE.Group();          // ground-level rig (position + yaw)
  var core = new THREE.Group();         // bobbing body / neck / head / tail
  gir.add(core);

  function shadowed(m){ m.castShadow = true; m.receiveShadow = false; return m; }

  /* ---- torso (overlapping ellipsoids) ---- */
  function ellipsoid(rx, ry, rz, x, y, z, rxr){
    var m = new THREE.Mesh(new THREE.SphereGeometry(1, 28, 20), coatMat);
    m.scale.set(rx, ry, rz); m.position.set(x, y, z); m.rotation.x = rxr || 0;
    core.add(shadowed(m)); return m;
  }
  ellipsoid(0.59, 0.68, 1.30,  0, 2.36, -0.15, -0.10);  // torso
  ellipsoid(0.55, 0.66, 0.92,  0, 2.44,  0.82, -0.18);  // chest
  ellipsoid(0.53, 0.52, 0.96,  0, 2.00, -0.05, -0.08);  // belly
  ellipsoid(0.57, 0.66, 0.84,  0, 2.30, -0.92, -0.06);  // rump

  /* ---- neck (tapered tube along a curve) ---- */
  var neckCurve = new THREE.CatmullRomCurve3([
    new THREE.Vector3( 0, 2.58, 0.42),
    new THREE.Vector3( 0, 3.12, 0.92),
    new THREE.Vector3( 0, 3.65, 1.26),
    new THREE.Vector3( 0, 4.15, 1.48),
    new THREE.Vector3( 0, 4.46, 1.62)
  ]);
  var neckFrames = [];
  var neck = new THREE.Mesh(taperedTube(neckCurve, 16, 14, 0.40, 0.245, 1/5.03, neckFrames), neckMat);
  neck.castShadow = true;
  core.add(neck);

  /* ---- mane (cones along top of neck + back + head) ---- */
  var up = new THREE.Vector3();
  for (var mi=3; mi<=neckFrames.length-1; mi++){
    var f = neckFrames[mi];
    up.set(0,0,0).addScaledVector(f.N, f.N.y).addScaledVector(f.B, f.B.y);
    if (up.lengthSq() < 1e-4) up.set(0,1,0);
    up.normalize();
    var cone = new THREE.Mesh(new THREE.ConeGeometry(0.05, 0.16, 5), maneMat);
    var r = 0.40 + (0.245-0.40)*THREE.MathUtils.smoothstep(mi/neckFrames.length, 0, 1);
    cone.position.copy(f.P).addScaledVector(up, r*0.92);
    var backDir = f.T.clone().negate();
    cone.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), backDir);
    cone.rotateY(rand(-0.5, 0.5));
    core.add(shadowed(cone));
  }
  for (mi=0; mi<5; mi++){                 // back mane over rump (follows torso top)
    var bz = -1.15 + mi*0.34;
    var by = 2.77 + ((bz + 1.15)/1.45)*(2.97 - 2.77);
    var bc = new THREE.Mesh(new THREE.ConeGeometry(0.05, 0.14, 5), maneMat);
    bc.position.set(0, by, bz);
    bc.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), new THREE.Vector3(0,0,-1));
    core.add(shadowed(bc));
  }

  /* ---- head ---- */
  var head = new THREE.Group();
  head.position.set(0, 4.46, 1.62);
  core.add(head);

  var skull = new THREE.Mesh(new THREE.SphereGeometry(1, 24, 18), coatMat);
  skull.scale.set(0.30, 0.26, 0.38); skull.position.set(0, 0.05, 0.10); skull.rotation.x = 0.10;
  head.add(shadowed(skull));

  var muzzle = new THREE.Mesh(new THREE.SphereGeometry(1, 18, 14), creamMat);
  muzzle.scale.set(0.17, 0.13, 0.24); muzzle.position.set(0, -0.10, 0.40);
  head.add(shadowed(muzzle));

  var noseTip = new THREE.Mesh(new THREE.SphereGeometry(0.10, 14, 10), creamMat);
  noseTip.scale.set(1, 0.8, 0.8); noseTip.position.set(0, -0.115, 0.56);
  head.add(noseTip);

  var nostrilMat = new THREE.MeshStandardMaterial({ color:0x241812, roughness:0.6 });
  [-1, 1].forEach(function(s){
    var no = new THREE.Mesh(new THREE.SphereGeometry(0.02, 8, 6), nostrilMat);
    no.scale.set(0.8, 1.4, 0.8);
    no.position.set(s*0.062, -0.055, 0.655);
    head.add(no);
  });

  var eyeMat = new THREE.MeshStandardMaterial({ color:0x140d07, roughness:0.25 });
  var glintMat = new THREE.MeshBasicMaterial({ color:0xffffff });
  var lashMat = new THREE.MeshBasicMaterial({ color:0x1a1008 });
  [-1, 1].forEach(function(s){
    var eye = new THREE.Mesh(new THREE.SphereGeometry(0.056, 12, 10), eyeMat);
    eye.position.set(s*0.27, 0.08, 0.30);
    head.add(eye);
    var glint = new THREE.Mesh(new THREE.SphereGeometry(0.015, 8, 6), glintMat);
    glint.position.set(s*0.252, 0.114, 0.340);
    head.add(glint);
    for (var l=0;l<3;l++){                // lashes
      var lash = new THREE.Mesh(new THREE.CylinderGeometry(0.0035, 0.0035, 0.055, 4), lashMat);
      lash.position.set(s*0.255, 0.145, 0.28 - l*0.02);
      lash.rotation.z = s*(0.5 + l*0.35);
      head.add(lash);
    }
  });

  [-1, 1].forEach(function(s){            // ears
    var ear = new THREE.Mesh(new THREE.SphereGeometry(1, 14, 10), coatMat);
    ear.scale.set(0.10, 0.17, 0.045);
    ear.position.set(s*0.25, 0.24, -0.04);
    ear.rotation.set(0.25, 0, s*0.62);
    head.add(shadowed(ear));
    var inner = new THREE.Mesh(new THREE.SphereGeometry(1, 12, 8), earInMat);
    inner.scale.set(0.065, 0.12, 0.02);
    inner.position.set(s*0.265, 0.245, -0.075);
    inner.rotation.set(0.25, 0, s*0.62);
    head.add(inner);
  });

  // lighter face panel: giraffes have a pale muzzle/cheek area
  var face = new THREE.Mesh(new THREE.SphereGeometry(1, 20, 14), creamMat);
  face.scale.set(0.27, 0.21, 0.30);
  face.position.set(0, 0.01, 0.17);
  face.rotation.x = 0.08;
  head.add(face);

  [-1, 1].forEach(function(s){            // ossicones (horns)
    var og = new THREE.Group();
    og.position.set(s*0.11, 0.30, 0.10);
    og.rotation.z = s*0.10; og.rotation.x = -0.08;
    var stem = new THREE.Mesh(new THREE.CapsuleGeometry(0.045, 0.20, 4, 10), darkMat);
    stem.position.y = 0.14;
    og.add(shadowed(stem));
    var knob = new THREE.Mesh(new THREE.SphereGeometry(0.058, 12, 9), darkMat);
    knob.position.y = 0.27;
    og.add(shadowed(knob));
    head.add(og);
  });

  /* ---- tail ---- */
  var tailRoot = new THREE.Group();
  tailRoot.position.set(0, 2.88, -1.50);
  core.add(tailRoot);
  var tailSegs = [];
  (function(){
    var parent = tailRoot, lens = [0.40, 0.36, 0.32, 0.28, 0.26], rad = 0.06;
    for (var si=0; si<lens.length; si++){
      var seg = new THREE.Group();
      var m = new THREE.Mesh(new THREE.CapsuleGeometry(Math.max(0.012, rad - si*0.006), lens[si], 3, 8), coatMat);
      m.position.y = -lens[si]/2 - 0.01;
      seg.add(m);
      parent.add(seg);
      parent = seg;
      tailSegs.push(seg);
    }
    var tuft = new THREE.Mesh(new THREE.ConeGeometry(0.10, 0.42, 8), maneMat);
    tuft.rotation.x = Math.PI;
    tuft.position.y = -0.20;
    parent.add(tuft);
  })();
  tailRoot.rotation.x = 0.55;

  /* ---- legs (2-bone IK) ---- */
  var LEGS = [
    { x: 0.34, y: 2.56, z:  0.70, L1:1.15, L2:1.28, r1:0.19, r2:0.13, phase:0,          front:true  },  // FL
    { x:-0.34, y: 2.56, z:  0.70, L1:1.15, L2:1.28, r1:0.19, r2:0.13, phase:Math.PI,    front:true  },  // FR
    { x: 0.34, y: 2.36, z: -0.86, L1:1.25, L2:0.98, r1:0.21, r2:0.12, phase:0,          front:false },  // HR (diagonal with FL)
    { x:-0.34, y: 2.36, z: -0.86, L1:1.25, L2:0.98, r1:0.21, r2:0.12, phase:Math.PI,    front:false }   // HL (diagonal with FR)
  ];
  var legs = [];
  LEGS.forEach(function(L, li){
    var leg = new THREE.Group();
    leg.position.set(L.x, L.y, L.z);
    gir.add(leg);

    var upper = new THREE.Mesh(new THREE.CapsuleGeometry(L.r1, L.L1 - 2*L.r1, 4, 12), legMat);
    upper.position.y = -L.L1/2;
    leg.add(shadowed(upper));

    var knee = new THREE.Group();
    knee.position.y = -L.L1;
    leg.add(knee);

    var lower = new THREE.Mesh(new THREE.CapsuleGeometry(L.r2, L.L2 - 2*L.r2, 4, 10), legMat);
    lower.position.y = -L.L2/2;
    knee.add(shadowed(lower));

    // carpus / hock bump
    var bump = new THREE.Mesh(new THREE.SphereGeometry(L.r2*0.62, 8, 6), legMat);
    bump.position.set(0, -L.L2*0.62, L.front ? L.r2*0.85 : -L.r2*0.95);
    knee.add(bump);

    var ankle = new THREE.Group();
    ankle.position.y = -L.L2;
    knee.add(ankle);

    var hoof = new THREE.Mesh(new THREE.SphereGeometry(1, 12, 9), hoofMat);
    hoof.scale.set(0.115, 0.10, 0.16);
    hoof.position.y = -0.05;
    ankle.add(shadowed(hoof));

    legs.push({ def:L, root:leg, knee:knee, ankle:ankle, hoof:hoof,
                phase:L.phase, prevTheta:0, baseFlex: L.front ? 0.05 : 0.11 });
  });

  return {
    group: gir, core: core, head: head, tailRoot: tailRoot, tailSegs: tailSegs, legs: legs
  };
}

/* ---------- gait ---------- */
function updateGiraffe(g, t, gait){
  // gait: { P: strides elapsed, stride, lift }
  var P = gait.P, stride = gait.stride, lift = gait.lift;
  var i, th, cz;

  for (i=0;i<g.legs.length;i++){
    var leg = g.legs[i], L = leg.def;
    th = P*Math.PI*2 + leg.phase;
    var thm = th % (Math.PI*2); if (thm < 0) thm += Math.PI*2;

    // foot target (local frame of the rig)
    cz = -(stride/2)*(1 - Math.cos(th));
    var swinging = thm > Math.PI;
    var liftY = swinging ? lift*Math.sin(thm - Math.PI) : 0;
    var side = L.x > 0 ? 1 : -1;
    var xoff = side * 0.05 * liftY * 3.2;

    var S = new THREE.Vector3(L.x, L.y, L.z);
    var F = new THREE.Vector3(L.x + xoff, HOOF_DROP + liftY, L.z + cz);
    var r = F.clone().sub(S);
    var d = Math.min(Math.max(r.length(), Math.abs(L.L1 - L.L2) + 0.03), (L.L1 + L.L2)*0.995);
    r.normalize();

    // upper leg angle (rotation around x; + swings backward)
    var a1 = Math.atan2(-r.z, -r.y);
    leg.root.rotation.x = a1;
    leg.root.rotation.y = 0;
    leg.root.rotation.z = 0;

    // knee bend
    var cH = (L.L1*L.L1 + d*d - L.L2*L.L2) / (2*L.L1*d);
    var cK = (L.L1*L.L1 + L.L2*L.L2 - d*d) / (2*L.L1*L.L2);
    var bend = Math.acos(THREE.MathUtils.clamp(cK, -1, 1));
    var bendAmt = (Math.PI - bend) + leg.baseFlex;   // bend backward (+x rot)
    leg.knee.rotation.x = bendAmt;
    leg.knee.rotation.y = 0;

    // keep hoof flat
    leg.ankle.rotation.x = -(a1 + bendAmt);

    // dust on touchdown
    if (leg.prevTheta > Math.PI*1.9 && thm < Math.PI*0.1) {
      var wp = new THREE.Vector3();
      leg.hoof.getWorldPosition(wp);
      spawnDust(wp);
    }
    leg.prevTheta = thm;
  }

  // body bob & sway (two bobs per stride)
  g.core.position.y = 0.055*Math.sin(P*Math.PI*4)*gait.bobAmp;
  g.core.rotation.x = 0.022*Math.sin(P*Math.PI*4 + 0.6)*gait.bobAmp;
  g.core.rotation.z = 0.016*Math.sin(P*Math.PI*2)*gait.bobAmp;
  g.core.rotation.y = 0;

  // head sway
  g.head.rotation.y = 0.16*Math.sin(t*0.5 + 1.3);
  g.head.rotation.x = 0.05*Math.sin(P*Math.PI*4) + 0.03;
  g.head.rotation.z = 0.03*Math.sin(t*0.23);

  // tail
  g.tailRoot.rotation.x = 0.55 + 0.20*Math.sin(t*1.15);
  g.tailRoot.rotation.z = 0.14*Math.sin(t*0.63 + 1.2);
  for (i=0;i<g.tailSegs.length;i++){
    g.tailSegs[i].rotation.x = 0.12*Math.sin(t*1.9 - i*0.65)*(0.4 + i*0.25);
  }
}

/* ---------- main giraffe ---------- */
var giraffe = buildGiraffe();
scene.add(giraffe.group);

// companion giraffes standing in the distance
var companions = [];
(function(){
  var spots = [[-42, -34, 0.55, 0.8], [56, -48, 0.5, -2.1]];
  for (var i=0;i<spots.length;i++){
    var cg = buildGiraffe();
    cg.group.scale.setScalar(spots[i][2]);
    cg.group.position.set(spots[i][0], 0, spots[i][1]);
    cg.group.rotation.y = spots[i][3];
    scene.add(cg.group);
    companions.push(cg);
  }
})();

/* ============================================================ *
 *  DUST PARTICLES
 * ============================================================ */
var dustTex = makeRadialTexture('rgba(214,192,150,0.55)', 'rgba(214,192,150,0)');
var puffs = [];
for (var pi=0; pi<48; pi++){
  var sm = new THREE.SpriteMaterial({ map:dustTex, transparent:true, depthWrite:false, opacity:0 });
  var sp = new THREE.Sprite(sm);
  sp.visible = false;
  scene.add(sp);
  puffs.push({ s:sp, life:1, max:0.55 });
}
var puffCursor = 0;
function spawnDust(pos){
  for (var k=0;k<4;k++){
    var p = puffs[puffCursor]; puffCursor = (puffCursor+1) % puffs.length;
    p.life = 0; p.max = rand(0.4, 0.7);
    p.s.visible = true;
    p.s.position.set(pos.x + rand(-0.12,0.12), 0.05 + Math.random()*0.06, pos.z + rand(-0.12,0.12));
  }
}
function updateDust(dt){
  for (var i=0;i<puffs.length;i++){
    var p = puffs[i];
    if (!p.s.visible) continue;
    p.life += dt;
    var u = p.life / p.max;
    if (u >= 1){ p.s.visible = false; continue; }
    var s = 0.25 + u*1.9;
    p.s.scale.set(s, s, 1);
    p.s.material.opacity = 0.55*(1-u)*(1-u);
    p.s.position.y += dt*0.25;
  }
}

/* ============================================================ *
 *  MOVEMENT, CAMERA, INTERACTION
 * ============================================================ */
var gaitState = {
  P: 0,
  stride: 2.2, period: 0.95, lift: 0.26, bobAmp: 1,
  targetStride: 2.2, targetPeriod: 0.95, targetLift: 0.26, targetBob: 1,
  trot: false
};
function gaitSpeed(){ return gaitState.stride / gaitState.period; }

var walkDist = 0;
var userAz = 0, userEl = 0.0, userZoom = 1;
(function(){  // optional camera presets via URL, e.g. ?az=1.57&el=0.15&zoom=1.6
  var q = new URLSearchParams(location.search);
  if (q.has('az'))   userAz   = parseFloat(q.get('az'))   || 0;
  if (q.has('el'))   userEl   = parseFloat(q.get('el'))   || 0;
  if (q.has('zoom')) userZoom = parseFloat(q.get('zoom')) || 1;
})();
var dragging = false, lastX = 0, lastY = 0;
var camPos = new THREE.Vector3(0, 3, 42);
var camLook = new THREE.Vector3(0, 2.3, 0);

var dom = renderer.domElement;
dom.style.cursor = 'grab';
dom.addEventListener('pointerdown', function(e){ dragging = true; lastX = e.clientX; lastY = e.clientY; dom.style.cursor = 'grabbing'; });
window.addEventListener('pointerup', function(){ dragging = false; dom.style.cursor = 'grab'; });
window.addEventListener('pointermove', function(e){
  if (!dragging) return;
  userAz   += (e.clientX - lastX) * 0.005;
  userEl   += (e.clientY - lastY) * 0.004;
  userEl = THREE.MathUtils.clamp(userEl, -0.35, 1.0);
  lastX = e.clientX; lastY = e.clientY;
});
dom.addEventListener('wheel', function(e){
  e.preventDefault();
  userZoom *= Math.pow(1.0015, e.deltaY);
  userZoom = THREE.MathUtils.clamp(userZoom, 0.45, 2.4);
}, { passive:false });
function setTrot(on){
  gaitState.trot = on;
  if (on){ gaitState.targetStride = 3.3; gaitState.targetPeriod = 0.60; gaitState.targetLift = 0.6; gaitState.targetBob = 1.4; }
  else   { gaitState.targetStride = 2.2; gaitState.targetPeriod = 0.95; gaitState.targetLift = 0.26; gaitState.targetBob = 1; }
  document.getElementById('pace').textContent = 'pace: ' + (on ? 'trot' : 'walk');
}
(function(){
  var q = new URLSearchParams(location.search);
  if (q.get('trot') === '1') setTrot(true);
})();
window.addEventListener('keydown', function(e){
  if (e.code === 'Space'){
    e.preventDefault();
    setTrot(!gaitState.trot);
  }
});

window.addEventListener('resize', function(){
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* ============================================================ *
 *  MAIN LOOP
 * ============================================================ */
var clock = new THREE.Clock();
var girPos = new THREE.Vector3();
var tmpV = new THREE.Vector3();

function animate(){
  requestAnimationFrame(animate);
  var dt = Math.min(clock.getDelta(), 0.05);
  var t = clock.elapsedTime;

  // ease gait params
  var g = gaitState, k = 1 - Math.exp(-2.2*dt);
  g.stride += (g.targetStride - g.stride)*k;
  g.period += (g.targetPeriod - g.period)*k;
  g.lift   += (g.targetLift   - g.lift)*k;
  g.bobAmp += (g.targetBob    - g.bobAmp)*k;
  g.P += dt / g.period;

  // position along circular path
  walkDist += gaitSpeed()*dt;
  var a = walkDist / PATH_R;
  girPos.set(Math.sin(a)*PATH_R, 0, Math.cos(a)*PATH_R);
  var yaw = Math.atan2(Math.cos(a), -Math.sin(a));
  giraffe.group.position.copy(girPos);
  giraffe.group.rotation.y = yaw;

  updateGiraffe(giraffe, t, g);

  // companions: idle standing with gentle head / tail motion
  for (var ci=0; ci<companions.length; ci++){
    var cg = companions[ci];
    updateGiraffe(cg, t + ci*3.7, { P: 0, stride: 0.001, lift: 0, bobAmp: 0.12 });
  }

  // sun follows giraffe for shadows
  sun.position.copy(girPos).addScaledVector(SUN_DIR, 95);
  sun.target.position.copy(girPos);
  sun.target.updateMatrixWorld();

  // camera
  var az = yaw + Math.PI + 0.45 + userAz;
  var el = THREE.MathUtils.clamp(0.20 + userEl, 0.02, 1.05);
  var dist = 8.6 * userZoom;
  tmpV.set(Math.sin(az)*Math.cos(el), Math.sin(el), Math.cos(az)*Math.cos(el)).multiplyScalar(dist);
  var targetPos = girPos.clone().add(tmpV);
  targetPos.y = Math.max(targetPos.y, 0.8) + 2.3;
  var lookTarget = girPos.clone(); lookTarget.y = 2.35;

  // keep camera out of tree canopies (ray from look target to camera vs. spheres)
  var toCam = tmpV.set(targetPos.x - lookTarget.x, targetPos.y - lookTarget.y, targetPos.z - lookTarget.z);
  var camDist = toCam.length(); toCam.normalize();
  var bestT = 1.0, inside = false, oi;
  for (oi=0; oi<occluders.length; oi++){
    var oc = occluders[oi];
    var ocx = lookTarget.x - oc.c.x, ocy = lookTarget.y - oc.c.y, ocz = lookTarget.z - oc.c.z;
    var b = ocx*toCam.x + ocy*toCam.y + ocz*toCam.z;
    var c0 = ocx*ocx + ocy*ocy + ocz*ocz - oc.r*oc.r;
    var disc = b*b - c0;
    if (disc < 0) continue;
    var sq = Math.sqrt(disc);
    if (-b - sq < 0 && -b + sq > 0) { inside = true; break; }        // camera inside sphere
    if (-b - sq > 0 && -b - sq < camDist && -b - sq < bestT) bestT = -b - sq;
  }
  if (inside) {
    // push camera just outside the sphere, back toward the look target
    var o2 = occluders[oi];
    var dx2 = targetPos.x - o2.c.x, dy2 = targetPos.y - o2.c.y, dz2 = targetPos.z - o2.c.z;
    var dl = Math.sqrt(dx2*dx2 + dy2*dy2 + dz2*dz2) || 1;
    targetPos.set(o2.c.x + dx2/dl*(o2.r+0.3), o2.c.y + dy2/dl*(o2.r+0.3), o2.c.z + dz2/dl*(o2.r+0.3));
  } else if (bestT < 1.0) {
    targetPos.set(lookTarget.x + toCam.x*bestT*0.94,
                  lookTarget.y + toCam.y*bestT*0.94,
                  lookTarget.z + toCam.z*bestT*0.94);
  }

  var ck = 1 - Math.exp(-4.5*dt);
  camPos.lerp(targetPos, ck);
  camLook.lerp(lookTarget, ck);
  camera.position.copy(camPos);
  camera.lookAt(camLook);

  // clouds drift
  for (var i=0;i<clouds.length;i++){
    clouds[i].position.x += dt*0.55;
    if (clouds[i].position.x > 360) clouds[i].position.x = -360;
  }
  // birds circle
  for (i=0;i<birds.length;i++){
    var b = birds[i], u = b.userData;
    var ba = t*u.sp + u.ph;
    b.position.set(Math.cos(ba)*u.r, u.h + Math.sin(t*0.7+u.ph)*1.5, Math.sin(ba)*u.r);
    var dirn = u.sp >= 0 ? 1 : -1;
    b.rotation.y = Math.atan2(-dirn*Math.sin(ba), dirn*Math.cos(ba));
    var flap = Math.sin(t*9 + u.ph*3)*0.75;
    u.wl.rotation.z =  flap;
    u.wr.rotation.z = -flap;
  }

  updateDust(dt);
  renderer.render(scene, camera);
}
animate();

})();
</script>
