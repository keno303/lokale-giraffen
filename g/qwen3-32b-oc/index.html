<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Three.js Walking Giraffe</title>
    <style>body { margin: 0; }</style>
    <script src="https://cdn.jsdelivr.net/npm/three@0.155.0/build/three.min.js"></script>
</head>
<body>
<script>
    // Scene setup
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer();
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Lighting
    const light = new THREE.DirectionalLight(0xffffff, 1);
    light.position.set(5, 10, 5);
    scene.add(light);

    // Ground
    const groundGeo = new THREE.PlaneGeometry(20, 20);
    const groundMat = new THREE.MeshLambertMaterial({ color: 0x228B22 });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI/2;
    scene.add(ground);

    // Giraffe body parts
    const body = createCylinder(1, 2, 0xffa500);
    const neck = createCylinder(0.5, 3, 0xffd700);
    const head = createSphere(0.5, 0xffe5b4);
    const legs = Array(4).fill().map((_, i) => createLeg(i));

    // Assembly
    const giraffe = new THREE.Group();
    giraffe.add(body);
    attachTo(body, neck, 0, 1, 0);
    attachTo(neck, head, 0, 1.5, 0);
    legs.forEach((leg, i) => attachTo(body, leg, -0.7 + i%2*1.4, -1, 0 + Math.floor(i/2)*0.5));
    scene.add(giraffe);

    // Animation
    let time = 0;
    function animate() {
        requestAnimationFrame(animate);
        time += 0.016;
        legs.forEach((leg, i) => {
            const phase = (i % 2 === 0) ? time : time + Math.PI;
            leg.rotation.z = Math.sin(phase) * 0.5;
        });
        renderer.render(scene, camera);
    }
    animate();

    // Utils
    function createCylinder(radius, height, color) {
        const geo = new THREE.CylinderGeometry(radius, radius, height, 16);
        const mat = new THREE.MeshLambertMaterial({ color });
        return new THREE.Mesh(geo, mat);
    }
    function createSphere(radius, color) {
        const geo = new THREE.SphereGeometry(radius, 16, 16);
        const mat = new THREE.MeshLambertMaterial({ color });
        return new THREE.Mesh(geo, mat);
    }
    function createLeg(index) {
        const leg = new THREE.Group();
        const upper = createCylinder(0.15, 1, 0x8b4513);
        const lower = createCylinder(0.12, 0.8, 0x8b4513);
        lower.position.y = -0.6;
        leg.add(upper, lower);
        return leg;
    }
    function attachTo(parent, child, x, y, z) {
        child.position.set(x, y, z);
        parent.add(child);
    }

    // Camera positioning
    camera.position.set(5, 5, 10);
    camera.lookAt(giraffe.position);
</script>
</body>
</html>
