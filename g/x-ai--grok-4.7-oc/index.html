<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Giraffe</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #c9b48a;
    overflow: hidden;
  }
  canvas { display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; }
  canvas:active { cursor: grabbing; }
  #vignette {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(60, 40, 18, 0.28) 100%);
  }
  #ui {
    position: fixed;
    left: 28px;
    bottom: 22px;
    color: #fffaf0;
    font: 15px/1.45 "Iowan Old Style", Palatino, "Palatino Linotype", Georgia, serif;
    text-shadow: 0 1px 2px rgba(40, 24, 8, 0.55);
    pointer-events: none;
    user-select: none;
  }
  #ui h1 {
    font-weight: 500;
    font-size: 22px;
    margin: 0 0 2px;
    letter-spacing: 0.03em;
  }
  #ui p {
    margin: 0;
    opacity: 0.88;
    font-size: 13px;
    letter-spacing: 0.01em;
  }
</style>
</head>
<body>
<div id="vignette"></div>
<div id="ui">
  <h1>Giraffa camelopardalis</h1>
  <p>Drag to look around · Scroll to zoom</p>
</div>
<script src="vendor/three.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
