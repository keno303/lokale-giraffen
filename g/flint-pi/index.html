<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Walking Giraffe — Three.js</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #87b7e0; }
  body { font-family: sans-serif; }
</style>
</head>
<body>
<script src="lib/three.min.js"></script>
<script>
(function () {
  'use strict';

  // ---------- scene setup ----------
  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0x87b7e0);
  scene.fog = new THREE.Fog(0x87b7e0, 40, 120);

  var camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 300);
  camera.position.set(4.6, 3.0, 7.4);
  camera.lookAt(new THREE.Vector3(0, 2.6, 0.2));

  var renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.body.appendChild(renderer.domElement);

  scene.add(new THREE.HemisphereLight(0xd8efff, 0x8a7a55, 0.85));

  var sun = new THREE.DirectionalLight(0xfff0dc, 2.5);
  sun.position.set(7, 12, 5);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.camera.left = -7; sun.shadow.camera.right = 7;
  sun.shadow.camera.top = 9; sun.shadow.camera.bottom = -3;
  sun.shadow.camera.near = 1; sun.shadow.camera.far = 40;
  sun.shadow.bias = -0.0004;
  scene.add(sun);
  scene.add(sun.target);

  var ground = new THREE.Mesh(
    new THREE.PlaneGeometry(300, 300),
    new THREE.MeshStandardMaterial({ color: 0x7d9a4e, roughness: 1.0 })
  );
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);

  // ---------- materials ----------
  function makeSpotsTexture() {
    var size = 256;
    var canvas = document.createElement('canvas');
    canvas.width = canvas.height = size;
    var ctx = canvas.getContext('2d');
    ctx.fillStyle = '#c09a63';
    ctx.fillRect(0, 0, size, size);
    for (var i = 0; i < 110; i++) {
      var x = Math.random() * size;
      var y = Math.random() * size;
      var rx = 6 + Math.random() * 16;
      var ry = 4 + Math.random() * 9;
      var rot = Math.random() * Math.PI * 2;
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(rot);
      ctx.fillStyle = Math.random() < 0.18 ? '#8a5a33' : '#7c5330';
      ctx.beginPath();
      ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
    var tex = new THREE.CanvasTexture(canvas);
    tex.wrapS = tex.wrapT = THREE.ClampToEdgeWrapping;
    return tex;
  }

  var skin = new THREE.MeshStandardMaterial({ map: makeSpotsTexture(), roughness: 0.88, metalness: 0.0 });
  var darkMat = new THREE.MeshStandardMaterial({ color: 0x241709, roughness: 0.55 });

  // ---------- helpers ----------
  function cylinderBetween(parent, p1, p2, r1, r2, mat) {
    // cylinder from p1 (radius r1) to p2 (radius r2); local coords relative to parent
    var dir = new THREE.Vector3().subVectors(p2, p1);
    var geo = new THREE.CylinderGeometry(r1, r2, dir.length(), 20);
    var mesh = new THREE.Mesh(geo, mat);
    mesh.parent = parent;
    mesh.castShadow = true;
    mesh.position.copy(p1).addScaledVector(dir, 0.5);
    mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.normalize());
    return mesh;
  }

  function place(mesh, p1, p2) {
    var d = new THREE.Vector3().subVectors(p2, p1);
    mesh.position.copy(p1).addScaledVector(d, 0.5);
    mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.normalize());
  }

  // ---------- giraffe group ----------
  var giraffe = new THREE.Group();
  scene.add(giraffe);

  // body
  var body = new THREE.Mesh(new THREE.CapsuleGeometry(0.58, 0.9, 10, 40), skin);
  body.scale.set(1.0, 1.22, 0.88);
  body.position.set(0, 2.95, 0);
  body.castShadow = true;
  giraffe.add(body);

  // neck (two tapered segments + head)
  var neckPivot = new THREE.Group();
  neckPivot.position.set(0, 3.55, 0.25);
  giraffe.add(neckPivot);

  var neck1 = cylinderBetween(neckPivot, new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, 0.8, 0.1), 0.36, 0.30, skin);
  var neck2 = cylinderBetween(neckPivot, new THREE.Vector3(0, 0.8, 0.1), new THREE.Vector3(0, 1.45, 0.3), 0.30, 0.25, skin);

  var headGroup = new THREE.Group();
  headGroup.position.set(0, 1.45, 0.3);
  headGroup.rotation.x = -0.05;
  neckPivot.add(headGroup);

  var skull = new THREE.Mesh(new THREE.BoxGeometry(0.30, 0.24, 0.42), skin);
  skull.position.set(0, 0.03, 0.05);
  skull.castShadow = true;
  headGroup.add(skull);

  var muzzle = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.14, 0.22), skin);
  muzzle.position.set(0, -0.02, 0.33);
  muzzle.castShadow = true;
  headGroup.add(muzzle);

  var nose = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.07, 0.06), skin);
  nose.position.set(0, -0.01, 0.44);
  nose.castShadow = true;
  headGroup.add(nose);

  var eyeGeo = new THREE.SphereGeometry(0.05, 16, 12);
  var eyeL = new THREE.Mesh(eyeGeo, darkMat);
  eyeL.position.set(-0.12, 0.13, 0.10);
  var eyeR = new THREE.Mesh(eyeGeo, darkMat);
  eyeR.position.set(0.12, 0.13, 0.10);
  headGroup.add(eyeL, eyeR);

  var earGeo = new THREE.ConeGeometry(0.07, 0.20, 12);
  var earL = new THREE.Mesh(earGeo, skin);
  earL.position.set(-0.10, 0.24, -0.05);
  earL.rotation.x = -0.3;
  earL.castShadow = true;
  var earR = new THREE.Mesh(earGeo, skin);
  earR.position.set(0.10, 0.24, -0.05);
  earR.rotation.x = -0.3;
  earR.castShadow = true;
  headGroup.add(earL, earR);

  // tail
  var tailGroup = new THREE.Group();
  tailGroup.position.set(0, 2.95, -0.8);
  giraffe.add(tailGroup);
  var tail1 = cylinderBetween(tailGroup, new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, 0, -0.5), 0.10, 0.085, skin);
  var tail2 = cylinderBetween(tailGroup, new THREE.Vector3(0, 0, -0.5), new THREE.Vector3(0, 0, -0.95), 0.085, 0.065, skin);
  var tail3 = cylinderBetween(tailGroup, new THREE.Vector3(0, 0, -0.95), new THREE.Vector3(0, 0, -1.3), 0.065, 0.04, skin);

  // ---------- legs ----------
  function makeLeg(x, z, phase) {
    var hip = new THREE.Vector3(x, 2.4, z);
    var knee = hip.clone().addScaledVector(new THREE.Vector3(0, -1, 0), 1.4);
    var hoof = hip.clone().addScaledVector(new THREE.Vector3(0, -1, 0), 2.4);
    var thigh = cylinderBetween(giraffe, hip, knee, 0.17, 0.13, skin);
    var shin = cylinderBetween(giraffe, knee, hoof, 0.12, 0.10, skin);
    var hoofMesh = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.12, 0.28), darkMat);
    var leg = { hip: hip, thigh: thigh, shin: shin, hoof: hoofMesh, lenThigh: 1.4, lenShin: 1.0, phase: phase, amp: 0.22 };
    return leg;
  }

  var legs = [
    makeLeg(-0.38, 0.4, 0.0),    // front left
    makeLeg(0.38, 0.4, Math.PI), // front right
    makeLeg(-0.38, -0.4, Math.PI), // back left
    makeLeg(0.38, -0.4, 0.0)     // back right
  ];

  // ---------- animation ----------
  var clock = new THREE.Clock();
  var OMEGA = Math.PI * 2 * 2.0;

  function updateLeg(leg, t) {
    var th = leg.amp * Math.sin(OMEGA * t + leg.phase);
    var dirT = new THREE.Vector3(0, -Math.cos(th), Math.sin(th));
    var knee = leg.hip.clone().addScaledVector(dirT, leg.lenThigh);
    var sh = -0.55 * th;
    var dirS = new THREE.Vector3(0, -Math.cos(sh), Math.sin(sh));
    var hoof = knee.clone().addScaledVector(dirS, leg.lenShin);
    place(leg.thigh, leg.hip, knee);
    place(leg.shin, knee, hoof);
    place(leg.hoof, hoof.clone().addScaledVector(dirS, -0.05), hoof.clone().addScaledVector(dirS, 0.05));
  }

  function animate() {
    requestAnimationFrame(animate);
    var t = clock.getElapsedTime();
    for (var i = 0; i < legs.length; i++) updateLeg(legs[i], t);

    var bob = Math.sin(t * Math.PI * 4.0) * 0.07;
    headGroup.position.y = 1.45 + bob;
    tailGroup.rotation.y = 0.25 * Math.sin(t * 3.0);

    renderer.render(scene, camera);
  }
  animate();

  // ---------- resize ----------
  window.addEventListener('resize', function () {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

})();
</script>
</body>
</html>
