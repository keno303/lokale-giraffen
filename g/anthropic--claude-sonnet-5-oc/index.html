<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Walking Giraffe — Three.js</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; width: 100%; height: 100%; background: #0a0a12; }
  canvas { display: block; }
  #hud {
    position: fixed; left: 14px; top: 12px; z-index: 10;
    font-family: -apple-system, Helvetica, Arial, sans-serif;
    color: #f1ecd9; text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    pointer-events: none; user-select: none;
  }
  #hud h1 { font-size: 16px; margin: 0 0 4px 0; font-weight: 600; letter-spacing: 0.5px; }
  #hud p { font-size: 12px; margin: 0; opacity: 0.85; }
  #loading {
    position: fixed; inset: 0; background: #0a0a12; color: #f1ecd9;
    display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, Helvetica, Arial, sans-serif; font-size: 15px;
    z-index: 100; letter-spacing: 1px;
  }
</style>
</head>
<body>
<div id="loading">Loading savanna…</div>
<div id="hud">
  <h1>🦒 Walking Giraffe</h1>
  <p>Drag to orbit · Scroll to zoom · Right-drag to pan</p>
</div>

<script src="three.min.js"></script>
<script src="OrbitControls.js"></script>
<script src="giraffe.js"></script>
</body>
</html>
