<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Giraffa camelopardalis — Realistic Walking Giraffe in Three.js</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #d8b584;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #f6efe4;
      user-select: none;
      -webkit-user-select: none;
    }

    #canvas-container {
      position: fixed;
      inset: 0;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
    }
    canvas:active {
      cursor: grabbing;
    }

    /* Subtle Wildlife Study HUD */
    #hud-wrapper {
      position: fixed;
      top: 14px;
      left: 14px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-width: 310px;
      pointer-events: none;
    }

    .hud-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: rgba(24, 18, 13, 0.64);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 228, 186, 0.18);
      border-radius: 10px;
      padding: 8px 12px;
      pointer-events: auto;
      box-shadow: 0 6px 22px rgba(0, 0, 0, 0.22);
    }

    .hud-title {
      display: flex;
      flex-direction: column;
    }
    .hud-title strong {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: #fdf5e8;
    }
    .hud-title span {
      font-size: 10.5px;
      font-style: italic;
      color: #d9be96;
    }

    #hud-panel {
      background: rgba(24, 18, 13, 0.64);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 228, 186, 0.16);
      border-radius: 11px;
      padding: 11px 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: auto;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.25);
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    #hud-panel.collapsed {
      opacity: 0;
      transform: translateY(-8px);
      pointer-events: none;
      height: 0;
      padding: 0;
      overflow: hidden;
      border: none;
    }

    .section-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #cbb089;
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .pill-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    button.pill {
      appearance: none;
      border: 1px solid rgba(255, 228, 186, 0.2);
      background: rgba(255, 245, 230, 0.07);
      color: #efe3cf;
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 11px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }
    button.pill:hover {
      background: rgba(255, 232, 196, 0.18);
      border-color: rgba(255, 228, 186, 0.38);
    }
    button.pill.active {
      background: rgba(214, 134, 54, 0.85);
      border-color: #f5b971;
      color: #1a1109;
      font-weight: 600;
    }

    .slider-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
    }
    .slider-row input[type="range"] {
      flex: 1;
      accent-color: #e0913e;
      height: 4px;
      cursor: pointer;
    }
    .slider-val {
      min-width: 36px;
      text-align: right;
      font-variant-numeric: tabular-nums;
      color: #f3d7ad;
      font-size: 11px;
    }

    /* Live Lateral-Sequence Footfall Contact Indicator */
    .footfall-strip {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 5px;
      margin-top: 2px;
    }
    .foot-badge {
      font-size: 10px;
      text-align: center;
      padding: 3px 0;
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #9e8d77;
      transition: background 0.1s, color 0.1s, border-color 0.1s;
    }
    .foot-badge.stance {
      background: rgba(224, 145, 62, 0.34);
      border-color: rgba(245, 185, 113, 0.65);
      color: #fff3df;
      font-weight: 600;
    }

    .hint-bar {
      font-size: 10px;
      color: #b89f7d;
      line-height: 1.35;
      border-top: 1px solid rgba(255, 228, 186, 0.12);
      padding-top: 6px;
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>

  <div id="hud-wrapper">
    <div class="hud-header">
      <div class="hud-title">
        <strong>Savannah Giraffe</strong>
        <span>Giraffa camelopardalis · Lateral Walk</span>
      </div>
      <button id="btn-toggle-hud" class="pill" title="Toggle controls (H)">Hide [H]</button>
    </div>

    <div id="hud-panel">
      <div>
        <div class="section-label">
          <span>Camera [1–7]</span>
        </div>
        <div class="pill-grid">
          <button class="pill active" data-cam="hero">Hero 3/4</button>
          <button class="pill" data-cam="side">Side Gait</button>
          <button class="pill" data-cam="front">Front</button>
          <button class="pill" data-cam="low">Majestic Low</button>
          <button class="pill" data-cam="head">Head Macro</button>
          <button class="pill" data-cam="hooves">Hooves &amp; IK</button>
          <button class="pill" data-cam="wide">Wide</button>
          <button id="btn-turntable" class="pill">Orbit</button>
        </div>
      </div>

      <div>
        <div class="section-label">
          <span>Locomotion [Space]</span>
          <button id="btn-play" class="pill active" style="padding:2px 7px;font-size:10px;">Pause</button>
        </div>
        <div class="slider-row">
          <span>Speed</span>
          <input id="slider-speed" type="range" min="0" max="1.65" step="0.05" value="1.00" />
          <span id="val-speed" class="slider-val">1.00x</span>
        </div>
        <div class="slider-row" style="margin-top:4px;">
          <span>Stride</span>
          <input id="slider-phase" type="range" min="0" max="1" step="0.005" value="0.08" />
          <span id="val-phase" class="slider-val">8%</span>
        </div>
        <div class="footfall-strip" title="Grounded stance hooves highlighted (LH → LF → RH → RF lateral sequence)">
          <div id="foot-hl" class="foot-badge stance">LH</div>
          <div id="foot-fl" class="foot-badge stance">LF</div>
          <div id="foot-hr" class="foot-badge">RH</div>
          <div id="foot-fr" class="foot-badge stance">RF</div>
        </div>
      </div>

      <div>
        <div class="section-label"><span>Subspecies Coat</span></div>
        <div class="pill-grid">
          <button class="pill active" data-coat="reticulated">Reticulated</button>
          <button class="pill" data-coat="masai">Masai</button>
          <button class="pill" data-coat="rothschild">Rothschild's</button>
        </div>
      </div>

      <div>
        <div class="section-label"><span>Savannah Light</span></div>
        <div class="pill-grid">
          <button class="pill active" data-mood="golden">Golden Hour</button>
          <button class="pill" data-mood="midday">Serengeti Sun</button>
          <button class="pill" data-mood="overcast">Soft Overcast</button>
        </div>
      </div>

      <div class="pill-grid">
        <button id="btn-rig" class="pill">Skeleton / IK</button>
        <button id="btn-sound" class="pill">Audio: Off</button>
      </div>

      <div class="hint-bar">
        Drag to orbit · Scroll to zoom · Right-drag / Shift-drag to pan · Double-click to recenter
      </div>
    </div>
  </div>

  <!-- Direct file:// compatible script loading (works offline & online, zero server or build step) -->
  <script src="./vendor/three.min.js"></script>
  <script>
    if (!window.THREE) {
      document.write('<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"><\/script>');
    }
  </script>
  <script src="./js/math-noise.js"></script>
  <script src="./js/coat-shader.js"></script>
  <script src="./js/giraffe-anatomy.js"></script>
  <script src="./js/giraffe-gait.js"></script>
  <script src="./js/savannah-world.js"></script>
  <script src="./js/camera-controls.js"></script>
  <script src="./js/main.js"></script>
</body>
</html>
