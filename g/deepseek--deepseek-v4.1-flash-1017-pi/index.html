<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Giraffe — a walk in the savanna</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #cfc2a9; color: #f4ead6;
    font-family: ui-serif, Georgia, "Times New Roman", serif;
  }
  #app { position: fixed; inset: 0; }
  canvas { display: block; cursor: grab; }
  canvas.dragging { cursor: grabbing; }

  #vignette {
    position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(120% 90% at 50% 42%, rgba(0,0,0,0) 52%, rgba(30,22,12,0.30) 100%);
    mix-blend-mode: multiply;
  }

  #hud {
    position: fixed; left: 30px; bottom: 26px; pointer-events: none;
    text-shadow: 0 1px 12px rgba(40,28,12,0.55);
    transition: opacity .6s ease;
  }
  #hud h1 {
    margin: 0; font-size: 26px; font-weight: 400; letter-spacing: .06em;
    font-variant: small-caps;
  }
  #hud .sub {
    margin: 4px 0 0; font-size: 12.5px; letter-spacing: .14em;
    text-transform: uppercase; opacity: .72; font-family: ui-sans-serif, system-ui, sans-serif;
  }
  #hud .hint {
    margin: 14px 0 0; font-size: 12px; opacity: .55; letter-spacing: .04em;
    font-family: ui-sans-serif, system-ui, sans-serif;
  }
  #hud.hidden { opacity: 0; }

  #loader {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: #cfc2a9; z-index: 20; transition: opacity .7s ease;
    font-family: ui-sans-serif, system-ui, sans-serif; font-size: 12px;
    letter-spacing: .2em; text-transform: uppercase; color: #6a5a40;
  }
  #loader.hidden { opacity: 0; pointer-events: none; }

  #err {
    position: fixed; inset: 0; display: none; padding: 24px; z-index: 50;
    background: rgba(24, 16, 8, 0.92); color: #ffd2a0;
    font: 12px/1.5 ui-monospace, Menlo, monospace; white-space: pre-wrap;
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="vignette"></div>

<div id="hud">
  <h1>Giraffa camelopardalis</h1>
  <p class="sub">Walking · savanna study</p>
  <p class="hint">drag to orbit &nbsp;·&nbsp; scroll to zoom &nbsp;·&nbsp; space to pause &nbsp;·&nbsp; r to reset</p>
</div>

<div id="loader">assembling giraffe…</div>
<div id="err"></div>

<script src="vendor/three.min.js"></script>
<script src="js/util.js"></script>
<script src="js/textures.js"></script>
<script src="js/geometry.js"></script>
<script src="js/giraffe.js"></script>
<script src="js/world.js"></script>
<script src="js/app.js"></script>
</body>
</html>
