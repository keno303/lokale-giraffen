<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Giraffa camelopardalis — Realistic Walking Giraffe in Three.js</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1b1610;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #f6efe4;
      user-select: none;
    }

    #canvas-container {
      width: 100%;
      height: 100%;
      position: fixed;
      inset: 0;
    }

    #hud-panel {
      position: fixed;
      top: 16px;
      left: 16px;
      width: 268px;
      background: rgba(24, 18, 13, 0.66);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 224, 178, 0.16);
      border-radius: 14px;
      padding: 14px 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      transition: opacity 0.25s ease, transform 0.25s ease;
      z-index: 10;
    }

    #hud-panel.collapsed .hud-body {
      display: none;
    }

    #hud-panel.collapsed {
      width: auto;
      padding: 10px 14px;
    }

    .hud-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .hud-title {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #f3d6a4;
    }

    .hud-subtitle {
      font-size: 11px;
      color: rgba(246, 239, 228, 0.65);
      font-style: italic;
      margin-top: 2px;
    }

    #toggle-hud-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 224, 178, 0.18);
      color: #f6efe4;
      border-radius: 8px;
      padding: 4px 8px;
      font-size: 11px;
      cursor: pointer;
    }

    #toggle-hud-btn:hover {
      background: rgba(255, 224, 178, 0.18);
    }

    .hud-body {
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .control-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11.5px;
      color: rgba(246, 239, 228, 0.85);
    }

    .preset-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5px;
    }

    button.btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 224, 178, 0.16);
      color: #f6efe4;
      border-radius: 7px;
      padding: 6px 6px;
      font-size: 11px;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    button.btn:hover {
      background: rgba(255, 224, 178, 0.20);
    }

    button.btn.active {
      background: rgba(226, 166, 86, 0.36);
      border-color: rgba(243, 214, 164, 0.6);
      color: #fff6e8;
      font-weight: 600;
    }

    select {
      width: 100%;
      background: rgba(18, 13, 9, 0.78);
      border: 1px solid rgba(255, 224, 178, 0.2);
      color: #f6efe4;
      border-radius: 7px;
      padding: 6px 8px;
      font-size: 11.5px;
      outline: none;
      cursor: pointer;
    }

    input[type="range"] {
      width: 100%;
      accent-color: #e2a656;
      cursor: pointer;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11.5px;
      color: rgba(246, 239, 228, 0.82);
      cursor: pointer;
    }

    .hint {
      font-size: 10.5px;
      color: rgba(246, 239, 228, 0.5);
      border-top: 1px solid rgba(255, 224, 178, 0.1);
      padding-top: 8px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>

  <aside id="hud-panel">
    <div class="hud-header">
      <div>
        <div class="hud-title">Savannah Giraffe</div>
        <div class="hud-subtitle">Ipsilateral Ambling Gait</div>
      </div>
      <button id="toggle-hud-btn" title="Toggle Panel (H)">UI</button>
    </div>

    <div class="hud-body">
      <div class="control-group">
        <div class="control-row"><span>Camera View</span></div>
        <div class="preset-grid">
          <button class="btn active" data-camera-preset="hero">3/4 Hero</button>
          <button class="btn" data-camera-preset="side">Side</button>
          <button class="btn" data-camera-preset="front">Front</button>
          <button class="btn" data-camera-preset="head">Head</button>
          <button class="btn" data-camera-preset="hooves">Hooves</button>
        </div>
      </div>

      <div class="control-group">
        <div class="control-row">
          <span>Walk Speed</span>
          <span id="speed-val">1.35 m/s</span>
        </div>
        <input id="speed-slider" type="range" min="0" max="2.4" step="0.05" value="1.35" />
        <button id="pause-btn" class="btn">Pause Stride</button>
      </div>

      <div class="control-group">
        <div class="control-row"><span>Subspecies Coat</span></div>
        <select id="species-select">
          <option value="reticulated" selected>Reticulated (G. reticulata)</option>
          <option value="masai">Masai (G. tippelskirchi)</option>
          <option value="rothschild">Rothschild (G. camelopardalis)</option>
        </select>
      </div>

      <div class="control-group">
        <div class="control-row"><span>Locomotion Path</span></div>
        <select id="mode-select">
          <option value="savannah" selected>Roam Savannah</option>
          <option value="circle">Circular Walk</option>
          <option value="treadmill">Walk in Place</option>
        </select>
      </div>

      <div class="control-group">
        <div class="control-row"><span>Savannah Light</span></div>
        <select id="lighting-select">
          <option value="golden" selected>Golden Hour</option>
          <option value="midday">Midday Sun</option>
          <option value="dawn">Dawn Mist</option>
        </select>
      </div>

      <label class="checkbox-row">
        <input id="skel-toggle" type="checkbox" />
        <span>Show Anatomical Skeleton</span>
      </label>

      <div class="hint">
        Drag to orbit &bull; Scroll to zoom<br />
        Space: pause &bull; H: hide panel
      </div>
    </div>
  </aside>

  <script defer src="vendor/three.min.js"></script>
  <script defer src="js/math-utils.js"></script>
  <script defer src="js/coat-shader.js"></script>
  <script defer src="js/giraffe-anatomy.js"></script>
  <script defer src="js/giraffe-gait.js"></script>
  <script defer src="js/environment.js"></script>
  <script defer src="js/app.js"></script>
</body>
</html>
