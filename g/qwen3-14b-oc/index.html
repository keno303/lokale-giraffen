<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Giraffe</title>
    <style>
        body { margin: 0; overflow: hidden; }
        canvas { display: block; }
    </style>
</head>
<body>
    <script src="https://cdn.jsdelivr.net/npm/three@0.154.0/build/three.min.js"></script>
    <script>
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({antialias: true});
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const light = new THREE.DirectionalLight(0xffffff, 1);
        light.position.set(5, 10, 7.5);
        scene.add(light);

        const body = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 3, 32), new THREE.MeshStandardMaterial({ color: 0x8B4513 }));
        body.position.y = 1.5;
        scene.add(body);

        const head = new THREE.Mesh(new THREE.SphereGeometry(0.5, 32, 32), new THREE.MeshStandardMaterial({ color: 0x8B4513 }));
        head.position.y = 2.5;
        scene.add(head);

        const legGeometry = new THREE.CylinderGeometry(0.2, 0.2, 2, 32);
        const legMaterial = new THREE.MeshStandardMaterial({ color: 0x8B4513 });

        const frontLeftLeg = new THREE.Mesh(legGeometry, legMaterial);
        frontLeftLeg.position.set(-0.5, 0.5, 1.5);
        scene.add(frontLeftLeg);

        const frontRightLeg = new THREE.Mesh(legGeometry, legMaterial);
        frontRightLeg.position.set(0.5, 0.5, 1.5);
        scene.add(frontRightLeg);

        const backLeftLeg = new THREE.Mesh(legGeometry, legMaterial);
        backLeftLeg.position.set(-0.5, 0.5, -1.5);
        scene.add(backLeftLeg);

        const backRightLeg = new THREE.Mesh(legGeometry, legMaterial);
        backRightLeg.position.set(0.5, 0.5, -1.5);
        scene.add(backRightLeg);

        let time = 0;
        function animate() {
            requestAnimationFrame(animate);
            time += 0.01;

            frontLeftLeg.position.y = 0.5 + Math.sin(time) * 0.5;
            frontRightLeg.position.y = 0.5 + Math.sin(time + Math.PI) * 0.5;
            backLeftLeg.position.y = 0.5 + Math.sin(time + Math.PI) * 0.5;
            backRightLeg.position.y = 0.5 + Math.sin(time) * 0.5;

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
