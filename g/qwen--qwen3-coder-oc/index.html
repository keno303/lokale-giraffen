<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Walking Giraffe in Three.js</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden;
            background: linear-gradient(to bottom, #87CEEB 0%, #ffffff 100%);
        }
        canvas { 
            display: block; 
        }
    </style>
</head>
<body>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Main Three.js variables
        let scene, camera, renderer, giraffe;
        let clock = new THREE.Clock();
        
        // Initialize the scene
        function init() {
            // Create scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);
            
            // Create camera
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 5, 15);
            
            // Create renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);
            
            // Add lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(10, 20, 10);
            directionalLight.castShadow = true;
            scene.add(directionalLight);
            
            // Create ground
            const groundGeometry = new THREE.PlaneGeometry(100, 100);
            const groundMaterial = new THREE.MeshStandardMaterial({ 
                color: 0x90EE90,
                roughness: 0.9,
                metalness: 0.1
            });
            const ground = new THREE.Mesh(groundGeometry, groundMaterial);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);
            
            // Add some simple trees
            createTrees();
            
            // Create the giraffe
            createGiraffe();
            
            // Add event listeners
            window.addEventListener('resize', onWindowResize, false);
            
            // Start animation
            animate();
        }
        
        // Create simple trees
        function createTrees() {
            const treeCount = 20;
            for (let i = 0; i < treeCount; i++) {
                // Random position for tree
                const x = (Math.random() - 0.5) * 80;
                const z = (Math.random() - 0.5) * 80;
                
                // Skip trees too close to the center where the giraffe walks
                if (Math.abs(x) < 10 && Math.abs(z) < 10) continue;
                
                // Tree trunk
                const trunkGeometry = new THREE.CylinderGeometry(0.3, 0.4, 4, 8);
                const trunkMaterial = new THREE.MeshStandardMaterial({ color: 0x8B4513 });
                const trunk = new THREE.Mesh(trunkGeometry, trunkMaterial);
                trunk.position.set(x, 2, z);
                trunk.castShadow = true;
                scene.add(trunk);
                
                // Tree foliage
                const foliageGeometry = new THREE.ConeGeometry(2, 6, 8);
                const foliageMaterial = new THREE.MeshStandardMaterial({ color: 0x228B22 });
                const foliage = new THREE.Mesh(foliageGeometry, foliageMaterial);
                foliage.position.set(x, 6, z);
                foliage.castShadow = true;
                scene.add(foliage);
            }
        }
        
        // Create clouds
        function createClouds() {
            const cloudCount = 15;
            const cloudGroup = new THREE.Group();
            
            for (let i = 0; i < cloudCount; i++) {
                // Create a simple cloud using spheres
                const cloudPieces = 3 + Math.floor(Math.random() * 3);
                const cloud = new THREE.Group();
                
                for (let j = 0; j < cloudPieces; j++) {
                    const size = 0.5 + Math.random() * 1.5;
                    const geometry = new THREE.SphereGeometry(size, 8, 8);
                    const material = new THREE.MeshStandardMaterial({ 
                        color: 0xffffff,
                        transparent: true,
                        opacity: 0.8
                    });
                    const sphere = new THREE.Mesh(geometry, material);
                    
                    // Position spheres to form a cloud
                    sphere.position.x = (j - cloudPieces/2) * size * 0.8;
                    sphere.position.y = Math.random() * 0.5;
                    sphere.position.z = (Math.random() - 0.5) * size;
                    
                    cloud.add(sphere);
                }
                
                // Position the cloud in the sky
                cloud.position.x = (Math.random() - 0.5) * 100;
                cloud.position.y = 15 + Math.random() * 10;
                cloud.position.z = (Math.random() - 0.5) * 100;
                
                cloudGroup.add(cloud);
            }
            
            scene.add(cloudGroup);
            
            // Store for animation
            scene.clouds = cloudGroup;
        }
        
        // Create a simple giraffe using primitives
        function createGiraffe() {
            giraffe = new THREE.Group();
            
            // Body (ellipsoid)
            const bodyGeometry = new THREE.SphereGeometry(1.5, 32, 32);
            bodyGeometry.scale(1, 2, 1);
            const bodyMaterial = new THREE.MeshStandardMaterial({ 
                color: 0xD2B48C, // Tan color
                roughness: 0.7,
                metalness: 0.3
            });
            const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
            body.position.y = 3;
            body.castShadow = true;
            giraffe.add(body);
            
            // Add spots to the body
            const spotCount = 30;
            for (let i = 0; i < spotCount; i++) {
                const spotGeometry = new THREE.SphereGeometry(0.15, 8, 8);
                const spotMaterial = new THREE.MeshStandardMaterial({ color: 0x8B4513 }); // Brown spots
                const spot = new THREE.Mesh(spotGeometry, spotMaterial);
                
                // Position spots randomly on the body
                const angle = Math.random() * Math.PI * 2;
                const height = (Math.random() - 0.5) * 1.5;
                const radius = 1.4 + Math.random() * 0.1;
                
                spot.position.set(
                    Math.cos(angle) * radius,
                    3 + height,
                    Math.sin(angle) * radius
                );
                
                // Orient spots to face outward
                spot.lookAt(0, 3 + height, 0);
                spot.translateZ(0.15);
                
                spot.castShadow = true;
                giraffe.add(spot);
            }
            
            // Neck (cylinder)
            const neckGeometry = new THREE.CylinderGeometry(0.4, 0.4, 4, 32);
            const neckMaterial = new THREE.MeshStandardMaterial({ 
                color: 0xD2B48C,
                roughness: 0.7,
                metalness: 0.3
            });
            const neck = new THREE.Mesh(neckGeometry, neckMaterial);
            neck.position.y = 6;
            neck.castShadow = true;
            giraffe.add(neck);
            
            // Add spots to the neck
            const neckSpotCount = 15;
            for (let i = 0; i < neckSpotCount; i++) {
                const spotGeometry = new THREE.SphereGeometry(0.08, 8, 8);
                const spotMaterial = new THREE.MeshStandardMaterial({ color: 0x8B4513 });
                const spot = new THREE.Mesh(spotGeometry, spotMaterial);
                
                // Position spots on the neck
                const angle = Math.random() * Math.PI * 2;
                const height = (Math.random() - 0.5) * 3.5;
                const radius = 0.45;
                
                spot.position.set(
                    Math.cos(angle) * radius,
                    6 + height,
                    Math.sin(angle) * radius
                );
                
                spot.castShadow = true;
                giraffe.add(spot);
            }
            
            // Head (sphere)
            const headGeometry = new THREE.SphereGeometry(0.7, 32, 32);
            const headMaterial = new THREE.MeshStandardMaterial({ 
                color: 0xD2B48C,
                roughness: 0.7,
                metalness: 0.3
            });
            const head = new THREE.Mesh(headGeometry, headMaterial);
            head.position.y = 8.5;
            head.position.z = 0.5;
            head.castShadow = true;
            giraffe.add(head);
            
            // Horns
            const hornGeometry = new THREE.CylinderGeometry(0.05, 0.05, 0.5, 8);
            const hornMaterial = new THREE.MeshStandardMaterial({ color: 0x8B4513 });
            
            const horn1 = new THREE.Mesh(hornGeometry, hornMaterial);
            horn1.position.set(-0.2, 9, 0.7);
            horn1.castShadow = true;
            giraffe.add(horn1);
            
            const horn2 = new THREE.Mesh(hornGeometry, hornMaterial);
            horn2.position.set(0.2, 9, 0.7);
            horn2.castShadow = true;
            giraffe.add(horn2);
            
            // Legs
            const legGeometry = new THREE.CylinderGeometry(0.2, 0.2, 2.5, 16);
            const legMaterial = new THREE.MeshStandardMaterial({ 
                color: 0xD2B48C,
                roughness: 0.7,
                metalness: 0.3
            });
            
            const legPositions = [
                [-0.8, 1.75, 0.8],  // Front left
                [0.8, 1.75, 0.8],   // Front right
                [-0.8, 1.75, -0.8], // Back left
                [0.8, 1.75, -0.8]   // Back right
            ];
            
            const legs = [];
            for (let i = 0; i < 4; i++) {
                const leg = new THREE.Mesh(legGeometry, legMaterial);
                leg.position.set(legPositions[i][0], legPositions[i][1], legPositions[i][2]);
                leg.castShadow = true;
                giraffe.add(leg);
                legs.push(leg);
                
                // Add spots to each leg
                const legSpotCount = 5;
                for (let j = 0; j < legSpotCount; j++) {
                    const spotGeometry = new THREE.SphereGeometry(0.05, 8, 8);
                    const spotMaterial = new THREE.MeshStandardMaterial({ color: 0x8B4513 });
                    const spot = new THREE.Mesh(spotGeometry, spotMaterial);
                    
                    // Position spots on the leg
                    const angle = Math.random() * Math.PI * 2;
                    const height = (Math.random() - 0.5) * 2;
                    const radius = 0.22;
                    
                    spot.position.set(
                        legPositions[i][0] + Math.cos(angle) * radius,
                        legPositions[i][1] + height,
                        legPositions[i][2] + Math.sin(angle) * radius
                    );
                    
                    spot.castShadow = true;
                    giraffe.add(spot);
                }
            }
            
            // Tail
            const tailGeometry = new THREE.CylinderGeometry(0.05, 0.1, 1.5, 8);
            const tailMaterial = new THREE.MeshStandardMaterial({ 
                color: 0xD2B48C,
                roughness: 0.7,
                metalness: 0.3
            });
            const tail = new THREE.Mesh(tailGeometry, tailMaterial);
            tail.position.set(0, 3, -1.2);
            tail.rotation.x = Math.PI / 4;
            tail.castShadow = true;
            giraffe.add(tail);
            
            // Position the giraffe
            giraffe.position.y = 0;
            scene.add(giraffe);
            
            // Store references for animation
            giraffe.legs = legs;
            giraffe.head = head;
            giraffe.neck = neck;
        }
        
        // Handle window resize
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            
            const delta = clock.getDelta();
            const time = clock.getElapsedTime();
            
            // Animate the giraffe walking
            if (giraffe) {
                // Move the giraffe forward
                giraffe.position.x += 0.05;
                
                // Rotate the giraffe slightly as it walks
                giraffe.rotation.y = Math.sin(time * 0.5) * 0.1;
                
                // Animate legs for walking motion with more realistic timing
                if (giraffe.legs) {
                    // Front legs swing in opposite directions with offset
                    const frontLeftLegPhase = time * 8;
                    const frontRightLegPhase = time * 8 + Math.PI;
                    const backLeftLegPhase = time * 8 + Math.PI;
                    const backRightLegPhase = time * 8;
                    
                    // Front left leg
                    giraffe.legs[0].rotation.x = Math.sin(frontLeftLegPhase) * 0.4;
                    giraffe.legs[0].position.y = 1.75 + Math.abs(Math.sin(frontLeftLegPhase)) * 0.3;
                    
                    // Front right leg
                    giraffe.legs[1].rotation.x = Math.sin(frontRightLegPhase) * 0.4;
                    giraffe.legs[1].position.y = 1.75 + Math.abs(Math.sin(frontRightLegPhase)) * 0.3;
                    
                    // Back left leg
                    giraffe.legs[2].rotation.x = Math.sin(backLeftLegPhase) * 0.4;
                    giraffe.legs[2].position.y = 1.75 + Math.abs(Math.sin(backLeftLegPhase)) * 0.3;
                    
                    // Back right leg
                    giraffe.legs[3].rotation.x = Math.sin(backRightLegPhase) * 0.4;
                    giraffe.legs[3].position.y = 1.75 + Math.abs(Math.sin(backRightLegPhase)) * 0.3;
                }
                
                // Animate head nodding with breathing motion
                if (giraffe.head) {
                    giraffe.head.rotation.x = Math.sin(time * 2) * 0.1;
                    // Slight side-to-side movement
                    giraffe.head.rotation.z = Math.sin(time * 0.7) * 0.05;
                }
                
                // Animate neck bending with more fluid motion
                if (giraffe.neck) {
                    giraffe.neck.rotation.z = Math.sin(time * 1.5) * 0.05;
                    // Add slight vertical sway
                    giraffe.neck.rotation.x = Math.sin(time * 0.8) * 0.03;
                }
                
                // Make the giraffe walk in a gentle curve
                giraffe.position.z = Math.sin(time * 0.3) * 2;
                
                // Reset position when it goes too far
                if (giraffe.position.x > 15) {
                    giraffe.position.x = -15;
                }
            }
            
            // Animate clouds
            if (scene.clouds) {
                scene.clouds.children.forEach((cloud, index) => {
                    cloud.position.x += 0.01;
                    // Reset cloud position when it goes off screen
                    if (cloud.position.x > 50) {
                        cloud.position.x = -50;
                    }
                    // Gentle floating motion
                    cloud.position.y += Math.sin(time + index) * 0.005;
                });
            }
            
            renderer.render(scene, camera);
        }
        
        // Start everything
        init();
    </script>
</body>
</html>
