<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Giraffe — procedural walking giraffe (three.js)</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#101008; }
  #app { position:fixed; inset:0; }
  canvas { display:block; }

  #hud {
    position:fixed; top:18px; left:22px; color:#FFF6DF;
    font-family: Georgia, 'Times New Roman', serif;
    text-shadow: 0 1px 8px rgba(40,25,5,.55), 0 0 2px rgba(40,25,5,.8);
    pointer-events:none; user-select:none;
  }
  #hud h1 { margin:0; font-size:26px; letter-spacing:6px; font-weight:normal; }
  #hud .sub { margin-top:4px; font-size:12.5px; font-style:italic; opacity:.85; letter-spacing:1px; }
  #hud .sub2 { margin-top:2px; font-size:11px; font-family: Menlo, monospace; opacity:.55; letter-spacing:.5px; }

  #ctrl {
    position:fixed; left:50%; bottom:20px; transform:translateX(-50%);
    color:#FFF6DF; font-family: Georgia, serif; font-size:13px;
    background:rgba(30,20,8,.42); border:1px solid rgba(255,240,210,.25);
    border-radius:20px; padding:9px 18px 11px 18px;
    backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
    box-shadow:0 2px 14px rgba(20,12,2,.35);
    white-space:nowrap;
  }
  #ctrl input { vertical-align:middle; width:170px; accent-color:#E8C87A; margin:0 10px 0 6px; }
  #ctrl .val { display:inline-block; min-width:74px; font-family:Menlo, monospace; font-size:12px; opacity:.9; }

  #hint {
    position:fixed; right:20px; bottom:20px; color:#FFF6DF; opacity:.75;
    font-family: Georgia, serif; font-size:12px; font-style:italic;
    text-shadow:0 1px 6px rgba(40,25,5,.6); pointer-events:none;
    transition:opacity 2.5s; user-select:none;
  }

  #err {
    position:fixed; top:0; left:0; right:0; display:none;
    background:#7a1f1f; color:#fff; font-family:Menlo, monospace; font-size:13px;
    padding:10px 16px; z-index:99; white-space:pre-wrap;
  }
</style>
</head>
<body>
<div id="app"></div>

<div id="hud">
  <h1>GIRAFFE</h1>
  <div class="sub">Giraffa camelopardalis reticulata &mdash; pacing walk</div>
  <div class="sub2">procedural model &middot; three.js r147 &middot; no assets, no server</div>
</div>

<div id="ctrl">
  walking speed
  <input id="speed" type="range" min="0" max="2.3" step="0.01" value="1.5">
  <span class="val" id="speedval">1.50 m/s</span>
</div>

<div id="hint">drag&nbsp;&mdash;&nbsp;orbit &nbsp;&middot;&nbsp; scroll&nbsp;&mdash;&nbsp;zoom &nbsp;&middot;&nbsp; right-drag&nbsp;&mdash;&nbsp;pan</div>
<div id="err"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script src="main.js"></script>
</body>
</html>
