<!DOCTYPE html>
<html>
<head>
<title>Walking Giraffe</title>
<style>
body{margin:0;overflow:hidden}
canvas{display:block;width:100vw;height:100vh}
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
<script>
// Simple Three.js scene with a walking giraffe made from primitives
const canvas = document.getElementById('canvas') || document.body;
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xbfd1e5);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.set(0,3,10);
camera.lookAt(0,1,0);

// Lighting
const ambient = new THREE.AmbientLight(0x404040);
scene.add(ambient);
const dirLight = new THREE.DirectionalLight(0xffffff, 1);
dirLight.position.set(5,10,5);
scene.add(dirLight);

// Materials
const bodyMat = new THREE.MeshStandardMaterial({color:0x8b4513});
const limbMat = new THREE.MeshStandardMaterial({color:0x8b4513});
const headMat = new THREE.MeshStandardMaterial({color:0x8b4513});

// Giraffe Group
const giraffe = new THREE.Group();

// Body (box)
const bodyGeom = new THREE.BoxGeometry(2,1,1);
const bodyMesh = new THREE.Mesh(bodyGeom, bodyMat);
bodyMesh.position.y = 0.5;
giraffe.add(bodyMesh);

// Neck (cylinder)
const neckGeom = new THREE.CylinderGeometry(0.5,0.5,2,32);
const neckMesh = new THREE.Mesh(neckGeom, bodyMat);
neckMesh.position.y = 1.5;
giraffe.add(neckMesh);

// Head (sphere)
const headGeom = new THREE.SphereGeometry(0.5,32,32);
const headMesh = new THREE.Mesh(headGeom, headMat);
headMesh.position.y = 2.5;
giraffe.add(headMesh);

// Legs
const legGeom = new THREE.BoxGeometry(0.3,1,0.3);
const legPositions = [
  {x:-0.8, z:-0.4, phase:0},
  {x:0.8, z:-0.4, phase:Math.PI},
  {x:-0.8, z:0.4, phase:Math.PI},
  {x:0.8, z:0.4, phase:0}
];
const legs = [];
for (const pos of legPositions){
  const leg = new THREE.Mesh(legGeom, limbMat);
  leg.position.set(pos.x,0, pos.z);
  leg.userData.phase = pos.phase;
  giraffe.add(leg);
  legs.push(leg);
}

// Add giraffe to scene
scene.add(giraffe);

// Ground
const groundGeom = new THREE.PlaneGeometry(200,200);
const groundMat = new THREE.MeshStandardMaterial({color:0x228b22});
const ground = new THREE.Mesh(groundGeom, groundMat);
ground.rotation.x = -Math.PI/2;
ground.position.y = -0.01;
scene.add(ground);

// Animation
let startTime = null;
function animate(time){
  if (!startTime) startTime = time;
  const t = (time - startTime) / 1000;
  // Body bobbing
  giraffe.position.y = 0.5 + 0.05 * Math.sin(t*2);
  // Leg animation
  for (const leg of legs){
    const phase = leg.userData.phase;
    leg.position.y = -0.5 + 0.3 * Math.sin(t*4 + phase);
  }
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);

// Resize handling
window.addEventListener('resize', () => {
  renderer.setSize(window.innerWidth, window.innerHeight);
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
});
</script>
</body>
</html>
