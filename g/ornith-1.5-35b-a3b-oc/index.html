<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Walking Giraffe &middot; Three.js</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0d12; }
    #app { position: fixed; inset: 0; }
    canvas { display: block; }
    #hud {
      position: fixed; left: 14px; bottom: 12px;
      font: 12px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: rgba(255,255,255,0.75); background: rgba(0,0,0,0.32);
      padding: 8px 12px; border-radius: 8px; pointer-events: none;
      backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    }
    #hud b { color: #fff; font-weight: 600; }
    #hud small { color: rgba(255,255,255,0.55); }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="hud">
    <b>Walking Giraffe</b> &mdash; drag to orbit &middot; scroll to zoom &middot; right-drag to pan<br />
    <small>Three.js r128 &middot; runs entirely from file:// &mdash; no server, no build step</small>
  </div>

  <!-- Local, self-contained Three.js (r128) so this works offline from file:// -->
  <script src="three.min.js"></script>
  <script src="giraffe.js"></script>
</body>
</html>
