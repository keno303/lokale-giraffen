<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Walking Giraffe — Three.js</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #cfe3ef; font-family: system-ui, -apple-system, sans-serif; }
    canvas { display: block; cursor: grab; }
    canvas:active { cursor: grabbing; }
    #ui {
      position: fixed; left: 12px; top: 12px; color: #fff;
      background: rgba(20, 20, 20, 0.45); padding: 10px 14px; border-radius: 8px;
      font-size: 13px; line-height: 1.6; user-select: none;
    }
    #ui b { font-size: 15px; }
    #ui button {
      font: inherit; color: #fff; background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.35); border-radius: 5px; padding: 2px 8px; cursor: pointer;
    }
    #ui button:hover { background: rgba(255, 255, 255, 0.25); }
    #ui input { vertical-align: middle; width: 110px; }
  </style>
</head>
<body>
  <div id="ui">
    <b>Walking giraffe</b><br>
    Drag: orbit &middot; Wheel: zoom &middot; Double-click: reset view<br>
    <button id="pause">Pause (Space)</button>
    Speed <input id="speed" type="range" min="0.25" max="2" step="0.25" value="1">
    <span id="speedLabel">1.00×</span>
  </div>
  <script src="vendor/three.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
