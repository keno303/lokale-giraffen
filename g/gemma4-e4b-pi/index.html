<!DOCTYPE html>
<html>
<head>
    <title>Walking Giraffe</title>
    <style>
        body { margin: 0; overflow: hidden; }
        canvas { display: block; }
    </style>
</head>
<body>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Global variables for scene components
        let scene, camera, renderer;
        let giraffe;
        let clock = new THREE.Clock();
        let walkSpeed = 0; // Will be manipulated in animate loop

        // --- Giraffe Geometry and Setup ---

        function createGiraffe() {
            // This is a simplified, blocky representation for complexity management
            const group = new THREE.Group();

            // 1. Body (Cylinder/Box)
            const bodyGeometry = new THREE.CylinderGeometry(0.5, 0.5, 3, 16);
            const bodyMaterial = new THREE.MeshPhongMaterial({ color: 0x8B4513 }); // Brown
            const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
            body.position.y = 1.5;
            group.add(body);

            // 2. Neck (Long Cylinder)
            const neckGeometry = new THREE.CylinderGeometry(0.3, 0.3, 8, 12);
            const neck = new THREE.Mesh(neckGeometry, bodyMaterial);
            neck.position.set(0, 3.5, 0);
            group.add(neck);

            // 3. Head (Sphere)
            const headGeometry = new THREE.SphereGeometry(0.4, 16, 16);
            const head = new THREE.Mesh(headGeometry, bodyMaterial);
            head.position.set(0, 9.5, 0);
            group.add(head);

            // 4. Legs (Simple Cubes/Cylinders for simplification)
            const legMaterial = new THREE.MeshPhongMaterial({ color: 0x654321 });
            const legGeometry = new THREE.BoxGeometry(0.3, 1.5, 0.3);

            const legPositions = [
                { x: 0.5, z: 0.5 }, // Front Right
                { x: 0.5, z: -0.5 }, // Front Left
                { x: -0.5, z: 0.5 }, // Back Right
                { x: -0.5, z: -0.5 } // Back Left
            ];
            const legs = [];

            legPositions.forEach(pos => {
                const leg = new THREE.Mesh(legGeometry, legMaterial);
                leg.position.set(pos.x, 0.75, pos.z);
                // Attach legs to the body pivot point
                group.add(leg);
                legs.push(leg);
            });

            // Store legs for animation
            group.legs = legs;
            group.legs.forEach(leg => {
                leg.userData.swingAngle = 0; // For animation state
            });

            return group;
        }

        // --- Animation Logic ---

        function updateGiraffe(deltaTime) {
            const legs = giraffe.legs;
            const speedFactor = 3; // Controls animation speed

            // Simple four-leg gait cycle
            // Leg 1 (Front Right) and Leg 3 (Back Left) swing together (A)
            // Leg 2 (Front Left) and Leg 4 (Back Right) swing together (B)

            // Calculate phase based on time and speed
            const time = clock.getElapsedTime() * speedFactor;

            // Swing function (using sine wave for smooth motion)
            const swing = (time) => Math.sin(time);
            
            // Apply rotation (we rotate around the X-axis locally for forward/backward swing)
            
            // Group A (FR and BL)
            legs[0].rotation.x = swing(time + 0).toFixed(2) * 0.5; // Front Right
            legs[2].rotation.x = swing(time + Math.PI).toFixed(2) * 0.5; // Back Left

            // Group B (FL and BR)
            legs[1].rotation.x = swing(time + Math.PI / 2).toFixed(2) * 0.5; // Front Left
            legs[3].rotation.x = swing(time + 3 * Math.PI / 2).toFixed(2) * 0.5; // Back Right
            
            // Move the entire group forward slightly (simulating walking movement)
            giraffe.position.z -= 0.5 * deltaTime * 0.5;
        }

        // --- Three.js Initialization ---

        function init() {
            // Scene setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB); // Sky blue

            // Camera setup
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 8, 15);
            camera.lookAt(0, 4, 0);

            // Renderer setup
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0x606060); // Soft white light
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(10, 20, 10);
            scene.add(directionalLight);

            // Ground Plane
            const groundGeometry = new THREE.PlaneGeometry(50, 50);
            const groundMaterial = new THREE.MeshPhongMaterial({ color: 0x4CAF50 }); // Green ground
            const ground = new THREE.Mesh(groundGeometry, groundMaterial);
            ground.rotation.x = -Math.PI / 2;
            ground.position.y = 0;
            scene.add(ground);

            // Giraffe creation and addition
            giraffe = createGiraffe();
            scene.add(giraffe);

            // Handle window resizing
            window.addEventListener('resize', onWindowResize, false);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- Animation Loop ---

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();
            
            // Update the giraffe's pose and position
            updateGiraffe(delta);

            renderer.render(scene, camera);
        }

        // Start everything
        init();
        animate();
    </script>
</body>
</html>
