<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realistic Walking Giraffe - Three.js</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            overflow: hidden; 
            background: linear-gradient(to bottom, #87CEEB 0%, #E0F7FA 100%);
        }
        canvas { display: block; }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #333;
            font-family: Arial, sans-serif;
            background: rgba(255,255,255,0.7);
            padding: 10px 15px;
            border-radius: 5px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div id="info">Realistic Walking Giraffe - Three.js | Click to toggle animation</div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Scene setup
        const scene = new THREE.Scene();
        scene.fog = new THREE.Fog(0x87CEEB, 80, 300);
        scene.background = new THREE.Color(0x87CEEB);
        
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2.5, 12);
        camera.lookAt(0, 2, 0);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);
        
        // Lighting
        const ambientLight = new THREE.AmbientLight(0x404040, 0.5);
        scene.add(ambientLight);
        
        // Main directional light (sun)
        const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
        directionalLight.position.set(10, 20, 15);
        directionalLight.castShadow = true;
        directionalLight.shadow.mapSize.width = 4096;
        directionalLight.shadow.mapSize.height = 4096;
        directionalLight.shadow.camera.near = 0.5;
        directionalLight.shadow.camera.far = 100;
        directionalLight.shadow.camera.left = -50;
        directionalLight.shadow.camera.right = 50;
        directionalLight.shadow.camera.top = 50;
        directionalLight.shadow.camera.bottom = -50;
        directionalLight.shadow.bias = -0.0001;
        scene.add(directionalLight);
        
        // Fill light for softer shadows
        const fillLight = new THREE.DirectionalLight(0xfff5eb, 0.3);
        fillLight.position.set(-5, 10, -5);
        scene.add(fillLight);
        
        // Back light for rim lighting
        const backLight = new THREE.DirectionalLight(0x87CEEB, 0.2);
        backLight.position.set(0, 5, -10);
        scene.add(backLight);
        
        // Ground with grass texture
        const groundGeometry = new THREE.PlaneGeometry(200, 200);
        const groundMaterial = new THREE.MeshStandardMaterial({
            color: 0x4a7c59,
            roughness: 0.95,
            metalness: 0.05
        });
        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);
        
        // Add some distant trees for depth
        createDistantTrees();
        
        // Add a few bushes
        createBushes();
        
        // Sky gradient
        const skyGeometry = new THREE.SphereGeometry(200, 32, 32);
        const skyMaterial = new THREE.ShaderMaterial({
            uniforms: {
                topColor: { value: new THREE.Color(0x87CEEB) },
                bottomColor: { value: new THREE.Color(0xE0F7FA) },
                offset: { value: 20 },
                exponent: { value: 0.6 }
            },
            vertexShader: `
                varying vec3 vWorldPosition;
                void main() {
                    vec4 worldPosition = modelMatrix * vec4(position, 1.0);
                    vWorldPosition = worldPosition.xyz;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform vec3 topColor;
                uniform vec3 bottomColor;
                uniform float offset;
                uniform float exponent;
                varying vec3 vWorldPosition;
                void main() {
                    float h = normalize(vWorldPosition + offset).y;
                    gl_FragColor = vec4(mix(bottomColor, topColor, max(pow(max(h, 0.0), exponent), 0.0)), 1.0);
                }
            `,
            side: THREE.BackSide
        });
        const sky = new THREE.Mesh(skyGeometry, skyMaterial);
        scene.add(sky);
        
        // Add some clouds
        createClouds();
        
        // Create giraffe group
        const giraffeGroup = new THREE.Group();
        giraffeGroup.position.set(0, 0, 0);
        scene.add(giraffeGroup);
        
        function createDistantTrees() {
            const treeMaterial = new THREE.MeshStandardMaterial({
                color: 0x228B22,
                roughness: 0.8
            });
            const trunkMaterial = new THREE.MeshStandardMaterial({
                color: 0x8B4513,
                roughness: 0.7
            });
            
            for (let i = 0; i < 20; i++) {
                const angle = Math.random() * Math.PI * 2;
                const distance = 50 + Math.random() * 100;
                const x = Math.cos(angle) * distance;
                const z = Math.sin(angle) * distance;
                
                const treeGroup = new THREE.Group();
                treeGroup.position.set(x, 0, z);
                
                // Trunk
                const trunkGeometry = new THREE.CylinderGeometry(0.2, 0.3, 3 + Math.random() * 2, 8);
                const trunk = new THREE.Mesh(trunkGeometry, trunkMaterial);
                trunk.castShadow = true;
                trunk.receiveShadow = true;
                trunk.position.y = 3 / 2;
                treeGroup.add(trunk);
                
                // Canopy
                const canopyGeometry = new THREE.ConeGeometry(1 + Math.random() * 0.5, 4 + Math.random() * 2, 16);
                const canopy = new THREE.Mesh(canopyGeometry, treeMaterial);
                canopy.castShadow = true;
                canopy.receiveShadow = true;
                canopy.position.y = 3 + (4 + Math.random() * 2) / 2;
                canopy.rotation.x = Math.random() * 0.2 - 0.1;
                canopy.rotation.z = Math.random() * 0.2 - 0.1;
                treeGroup.add(canopy);
                
                scene.add(treeGroup);
            }
        }
        
        function createBushes() {
            const bushMaterial = new THREE.MeshStandardMaterial({
                color: 0x32CD32,
                roughness: 0.85
            });
            
            for (let i = 0; i < 15; i++) {
                const angle = Math.random() * Math.PI * 2;
                const distance = 20 + Math.random() * 40;
                const x = Math.cos(angle) * distance;
                const z = Math.sin(angle) * distance;
                
                const bushGroup = new THREE.Group();
                bushGroup.position.set(x, 0, z);
                bushGroup.rotation.y = Math.random() * Math.PI * 2;
                
                // Multiple spheres for bush
                for (let j = 0; j < 5; j++) {
                    const bushGeometry = new THREE.SphereGeometry(0.3 + Math.random() * 0.2, 16, 16);
                    const bush = new THREE.Mesh(bushGeometry, bushMaterial);
                    bush.castShadow = true;
                    bush.receiveShadow = true;
                    bush.position.set(
                        (Math.random() - 0.5) * 0.8,
                        0.2 + Math.random() * 0.4,
                        (Math.random() - 0.5) * 0.8
                    );
                    bushGroup.add(bush);
                }
                
                scene.add(bushGroup);
            }
        }
        
        function createClouds() {
            const cloudMaterial = new THREE.MeshStandardMaterial({
                color: 0xFFFFFF,
                roughness: 1,
                metalness: 0
            });
            
            for (let i = 0; i < 10; i++) {
                const angle = Math.random() * Math.PI * 2;
                const distance = 80 + Math.random() * 60;
                const x = Math.cos(angle) * distance;
                const z = Math.sin(angle) * distance;
                const y = 10 + Math.random() * 15;
                
                const cloudGroup = new THREE.Group();
                cloudGroup.position.set(x, y, z);
                
                // Multiple ellipsoids for cloud
                for (let j = 0; j < 8; j++) {
                    const cloudGeometry = new THREE.SphereGeometry(0.8 + Math.random() * 0.5, 16, 16);
                    const cloud = new THREE.Mesh(cloudGeometry, cloudMaterial);
                    cloud.position.set(
                        (Math.random() - 0.5) * 3,
                        (Math.random() - 0.5) * 0.5,
                        (Math.random() - 0.5) * 3
                    );
                    cloudGroup.add(cloud);
                }
                
                scene.add(cloudGroup);
            }
        }
        
        // Giraffe body parts
        const giraffeParts = {
            body: null,
            neck: null,
            head: null,
            legs: [],
            spots: [],
            mane: null,
            tail: null
        };
        
        // Create giraffe body with realistic proportions
        function createGiraffe() {
            // Body - more tapered and realistic shape
            const bodyGeometry = new THREE.CylinderGeometry(0.45, 0.55, 2.0, 32, 32);
            const bodyMaterial = new THREE.MeshStandardMaterial({
                color: 0xf4d03f,
                roughness: 0.65,
                metalness: 0.08
            });
            giraffeParts.body = new THREE.Mesh(bodyGeometry, bodyMaterial);
            giraffeParts.body.castShadow = true;
            giraffeParts.body.receiveShadow = true;
            giraffeParts.body.position.y = 2.0 / 2 + 0.1;
            giraffeParts.body.rotation.x = Math.PI / 8;
            giraffeGroup.add(giraffeParts.body);
            
            // Add spots to body with more realistic pattern
            addRealisticSpots(giraffeParts.body, 0.45, 0.55, 2.0, 25);
            
            // Neck - more realistic, longer and tapering
            const neckGeometry = new THREE.CylinderGeometry(0.28, 0.22, 2.8, 32, 32);
            const neckMaterial = new THREE.MeshStandardMaterial({
                color: 0xf4d03f,
                roughness: 0.65,
                metalness: 0.08
            });
            giraffeParts.neck = new THREE.Mesh(neckGeometry, neckMaterial);
            giraffeParts.neck.castShadow = true;
            giraffeParts.neck.receiveShadow = true;
            giraffeParts.neck.position.y = 2.0 + 2.8 / 2 - 0.05;
            giraffeParts.neck.rotation.x = Math.PI / 5;
            giraffeGroup.add(giraffeParts.neck);
            
            // Add spots to neck with realistic pattern
            addRealisticSpots(giraffeParts.neck, 0.28, 0.22, 2.8, 20);
            
            // Head - more realistic shape
            const headGeometry = new THREE.BoxGeometry(0.4, 0.45, 0.5);
            const headMaterial = new THREE.MeshStandardMaterial({
                color: 0xf4d03f,
                roughness: 0.65,
                metalness: 0.08
            });
            giraffeParts.head = new THREE.Mesh(headGeometry, headMaterial);
            giraffeParts.head.castShadow = true;
            giraffeParts.head.receiveShadow = true;
            giraffeParts.head.position.y = 2.0 + 2.8 + 0.45 / 2 - 0.15;
            giraffeParts.head.position.z = -0.05;
            giraffeGroup.add(giraffeParts.head);
            
            // Add spots to head with realistic pattern
            addRealisticSpots(giraffeParts.head, 0.4, 0.45, 0.5, 8);
            
            // Ossicones (horns) - more realistic
            const ossiconeMaterial = new THREE.MeshStandardMaterial({
                color: 0x2c1810,
                roughness: 0.35,
                metalness: 0.15
            });
            
            // Ossicones have a knobbed end
            const ossiconeBaseGeometry = new THREE.CylinderGeometry(0.035, 0.045, 0.18, 16);
            const ossiconeTipGeometry = new THREE.ConeGeometry(0.045, 0.07, 16);
            
            const leftOssiconeGroup = new THREE.Group();
            const leftOssiconeBase = new THREE.Mesh(ossiconeBaseGeometry, ossiconeMaterial);
            leftOssiconeBase.castShadow = true;
            leftOssiconeGroup.add(leftOssiconeBase);
            const leftOssiconeTip = new THREE.Mesh(ossiconeTipGeometry, ossiconeMaterial);
            leftOssiconeTip.castShadow = true;
            leftOssiconeTip.position.y = 0.18 + 0.07 / 2;
            leftOssiconeGroup.add(leftOssiconeTip);
            leftOssiconeGroup.position.set(-0.14, 2.0 + 2.8 + 0.45 + 0.15 - 0.1, -0.12);
            leftOssiconeGroup.rotation.z = Math.PI / 6;
            leftOssiconeGroup.rotation.x = -0.1;
            giraffeGroup.add(leftOssiconeGroup);
            
            const rightOssiconeGroup = new THREE.Group();
            const rightOssiconeBase = new THREE.Mesh(ossiconeBaseGeometry, ossiconeMaterial);
            rightOssiconeBase.castShadow = true;
            rightOssiconeGroup.add(rightOssiconeBase);
            const rightOssiconeTip = new THREE.Mesh(ossiconeTipGeometry, ossiconeMaterial);
            rightOssiconeTip.castShadow = true;
            rightOssiconeTip.position.y = 0.18 + 0.07 / 2;
            rightOssiconeGroup.add(rightOssiconeTip);
            rightOssiconeGroup.position.set(0.14, 2.0 + 2.8 + 0.45 + 0.15 - 0.1, -0.12);
            rightOssiconeGroup.rotation.z = -Math.PI / 6;
            rightOssiconeGroup.rotation.x = -0.1;
            giraffeGroup.add(rightOssiconeGroup);
            
            // Hair tuft between ossicones
            const hairTuftGeometry = new THREE.ConeGeometry(0.04, 0.2, 16);
            const hairTuftMaterial = new THREE.MeshStandardMaterial({
                color: 0x2c1810,
                roughness: 0.9
            });
            const hairTuft = new THREE.Mesh(hairTuftGeometry, hairTuftMaterial);
            hairTuft.castShadow = true;
            hairTuft.position.set(0, 2.0 + 2.8 + 0.45 + 0.2 / 2 - 0.08, -0.15);
            hairTuft.rotation.x = Math.PI / 2 + 0.1;
            giraffeGroup.add(hairTuft);
            
            // Eyes - with more detail
            const eyeSocketGeometry = new THREE.SphereGeometry(0.05, 16, 16);
            const eyeSocketMaterial = new THREE.MeshStandardMaterial({
                color: 0xFFFFFF,
                roughness: 0.1
            });
            
            const eyeGeometry = new THREE.SphereGeometry(0.035, 16, 16);
            const eyeMaterial = new THREE.MeshStandardMaterial({
                color: 0x2c1810,
                roughness: 0.05,
                metalness: 0.25
            });
            
            const pupilGeometry = new THREE.SphereGeometry(0.015, 16, 16);
            const pupilMaterial = new THREE.MeshStandardMaterial({
                color: 0x000000,
                roughness: 0.01
            });
            
            const leftEyeSocket = new THREE.Mesh(eyeSocketGeometry, eyeSocketMaterial);
            leftEyeSocket.castShadow = true;
            leftEyeSocket.position.set(-0.15, 2.0 + 2.8 + 0.45 / 2 - 0.08, 0.22);
            giraffeGroup.add(leftEyeSocket);
            
            const leftEye = new THREE.Mesh(eyeGeometry, eyeMaterial);
            leftEye.castShadow = true;
            leftEye.position.set(-0.15, 2.0 + 2.8 + 0.45 / 2 - 0.08, 0.22);
            giraffeGroup.add(leftEye);
            
            const leftPupil = new THREE.Mesh(pupilGeometry, pupilMaterial);
            leftPupil.castShadow = true;
            leftPupil.position.set(-0.15, 2.0 + 2.8 + 0.45 / 2 - 0.08, 0.24);
            giraffeGroup.add(leftPupil);
            
            const rightEyeSocket = new THREE.Mesh(eyeSocketGeometry, eyeSocketMaterial);
            rightEyeSocket.castShadow = true;
            rightEyeSocket.position.set(0.15, 2.0 + 2.8 + 0.45 / 2 - 0.08, 0.22);
            giraffeGroup.add(rightEyeSocket);
            
            const rightEye = new THREE.Mesh(eyeGeometry, eyeMaterial);
            rightEye.castShadow = true;
            rightEye.position.set(0.15, 2.0 + 2.8 + 0.45 / 2 - 0.08, 0.22);
            giraffeGroup.add(rightEye);
            
            const rightPupil = new THREE.Mesh(pupilGeometry, pupilMaterial);
            rightPupil.castShadow = true;
            rightPupil.position.set(0.15, 2.0 + 2.8 + 0.45 / 2 - 0.08, 0.24);
            giraffeGroup.add(rightPupil);
            
            // Ears - more realistic shape
            const earMaterial = new THREE.MeshStandardMaterial({
                color: 0xf4d03f,
                roughness: 0.7
            });
            
            const earInnerMaterial = new THREE.MeshStandardMaterial({
                color: 0xe74c3c,
                roughness: 0.8
            });
            
            const leftEarGroup = new THREE.Group();
            const leftEarGeometry = new THREE.ConeGeometry(0.09, 0.25, 16);
            const leftEar = new THREE.Mesh(leftEarGeometry, earMaterial);
            leftEar.castShadow = true;
            leftEarGroup.add(leftEar);
            const leftEarInner = new THREE.Mesh(new THREE.ConeGeometry(0.06, 0.15, 16), earInnerMaterial);
            leftEarInner.castShadow = true;
            leftEarInner.position.set(0, 0, -0.02);
            leftEarInner.rotation.z = Math.PI;
            leftEarGroup.add(leftEarInner);
            leftEarGroup.position.set(-0.22, 2.0 + 2.8 + 0.45 / 2 - 0.05, 0.15);
            leftEarGroup.rotation.z = Math.PI / 2;
            leftEarGroup.rotation.y = Math.PI / 2;
            leftEarGroup.rotation.x = -0.1;
            giraffeGroup.add(leftEarGroup);
            
            const rightEarGroup = new THREE.Group();
            const rightEarGeometry = new THREE.ConeGeometry(0.09, 0.25, 16);
            const rightEar = new THREE.Mesh(rightEarGeometry, earMaterial);
            rightEar.castShadow = true;
            rightEarGroup.add(rightEar);
            const rightEarInner = new THREE.Mesh(new THREE.ConeGeometry(0.06, 0.15, 16), earInnerMaterial);
            rightEarInner.castShadow = true;
            rightEarInner.position.set(0, 0, -0.02);
            rightEarInner.rotation.z = Math.PI;
            rightEarGroup.add(rightEarInner);
            rightEarGroup.position.set(0.22, 2.0 + 2.8 + 0.45 / 2 - 0.05, 0.15);
            rightEarGroup.rotation.z = -Math.PI / 2;
            rightEarGroup.rotation.y = -Math.PI / 2;
            rightEarGroup.rotation.x = -0.1;
            giraffeGroup.add(rightEarGroup);
            
            // Nose and mouth
            const noseMaterial = new THREE.MeshStandardMaterial({
                color: 0x2c1810,
                roughness: 0.35
            });
            const noseBaseGeometry = new THREE.CylinderGeometry(0.045, 0.055, 0.15, 16);
            const noseTipGeometry = new THREE.ConeGeometry(0.055, 0.08, 16);
            
            const noseGroup = new THREE.Group();
            const noseBase = new THREE.Mesh(noseBaseGeometry, noseMaterial);
            noseBase.castShadow = true;
            noseGroup.add(noseBase);
            const noseTip = new THREE.Mesh(noseTipGeometry, noseMaterial);
            noseTip.castShadow = true;
            noseTip.position.y = 0.15 + 0.08 / 2;
            noseGroup.add(noseTip);
            noseGroup.position.set(0, 2.0 + 2.8 + 0.45 / 2 - 0.12, -0.28);
            noseGroup.rotation.x = -Math.PI / 5;
            giraffeGroup.add(noseGroup);
            
            // Nostrils
            const nostrilGeometry = new THREE.TorusGeometry(0.02, 0.01, 8, 16);
            const nostrilMaterial = new THREE.MeshStandardMaterial({
                color: 0x000000,
                roughness: 0.1
            });
            const leftNostril = new THREE.Mesh(nostrilGeometry, nostrilMaterial);
            leftNostril.castShadow = true;
            leftNostril.position.set(-0.03, 2.0 + 2.8 + 0.45 / 2 - 0.12, -0.32);
            leftNostril.rotation.x = Math.PI / 2;
            giraffeGroup.add(leftNostril);
            const rightNostril = new THREE.Mesh(nostrilGeometry, nostrilMaterial);
            rightNostril.castShadow = true;
            rightNostril.position.set(0.03, 2.0 + 2.8 + 0.45 / 2 - 0.12, -0.32);
            rightNostril.rotation.x = Math.PI / 2;
            giraffeGroup.add(rightNostril);
            
            // Mouth
            const mouthMaterial = new THREE.MeshStandardMaterial({
                color: 0x2c1810,
                roughness: 0.4
            });
            const mouthGeometry = new THREE.BoxGeometry(0.12, 0.04, 0.06);
            const mouth = new THREE.Mesh(mouthGeometry, mouthMaterial);
            mouth.castShadow = true;
            mouth.position.set(0, 2.0 + 2.8 + 0.45 / 2 - 0.18, -0.25);
            mouth.rotation.x = -0.1;
            giraffeGroup.add(mouth);
            
            // Lips
            const lipGeometry = new THREE.CylinderGeometry(0.055, 0.055, 0.03, 16, 8, true);
            const lipMaterial = new THREE.MeshStandardMaterial({
                color: 0x2c1810,
                roughness: 0.5
            });
            const upperLip = new THREE.Mesh(lipGeometry, lipMaterial);
            upperLip.castShadow = true;
            upperLip.position.set(0, 2.0 + 2.8 + 0.45 / 2 - 0.15, -0.26);
            upperLip.rotation.x = -0.2;
            // Open the cylinder to create a lip shape
            upperLip.geometry = new THREE.CylinderGeometry(0.055, 0.055, 0.03, 16, 8, false, Math.PI * 1.5, Math.PI * 0.5);
            giraffeGroup.add(upperLip);
            
            // Tongue (slightly visible)
            const tongueGeometry = new THREE.ConeGeometry(0.025, 0.1, 16);
            const tongueMaterial = new THREE.MeshStandardMaterial({
                color: 0x8b4513,
                roughness: 0.8
            });
            const tongue = new THREE.Mesh(tongueGeometry, tongueMaterial);
            tongue.castShadow = true;
            tongue.position.set(0, 2.0 + 2.8 + 0.45 / 2 - 0.2, -0.3);
            tongue.rotation.x = -Math.PI / 4;
            giraffeGroup.add(tongue);
            
            // Mane (more realistic)
            createMane();
            
            // Tail (more realistic)
            createTail();
            
            // Legs
            createLegs();
        }
        
        function addRealisticSpots(parent, radiusTop, radiusBottom, height, count) {
            const spots = [];
            const spotMaterial = new THREE.MeshStandardMaterial({
                color: 0x2c1810,
                roughness: 0.65,
                metalness: 0.05
            });
            
            for (let i = 0; i < count; i++) {
                // Create irregular spot shapes
                const spotGeometry = new THREE.SphereGeometry(0.025 + Math.random() * 0.02, 16, 16);
                const spot = new THREE.Mesh(spotGeometry, spotMaterial);
                spot.castShadow = true;
                spot.receiveShadow = true;
                
                // Position spots more carefully for realistic pattern
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.random() * Math.PI;
                const r = radiusTop + (radiusBottom - radiusTop) * Math.random();
                
                spot.position.x = Math.cos(theta) * r * 0.85;
                spot.position.y = (Math.random() - 0.5) * height * 0.9;
                spot.position.z = Math.sin(theta) * r * 0.85;
                
                // Slightly scale spots to create irregular shapes
                spot.scale.set(
                    0.8 + Math.random() * 0.4,
                    0.8 + Math.random() * 0.4,
                    1
                );
                
                parent.add(spot);
                spots.push(spot);
            }
            giraffeParts.spots = giraffeParts.spots.concat(spots);
            
            return spots;
        }
        
        function addSpots(parent, radiusTop, radiusBottom, height, count) {
            return addRealisticSpots(parent, radiusTop, radiusBottom, height, count);
        }
        
        function createMane() {
            const maneGroup = new THREE.Group();
            giraffeGroup.add(maneGroup);
            giraffeParts.mane = maneGroup;
            
            const maneMaterial = new THREE.MeshStandardMaterial({
                color: 0x2c1810,
                roughness: 0.85
            });
            
            // Mane along the neck - more dense and realistic
            for (let i = 0; i < 12; i++) {
                const segmentHeight = 2.8 / 12;
                const yPos = 2.0 + i * segmentHeight + segmentHeight / 2;
                
                // Create a strip of hair
                for (let j = 0; j < 3; j++) {
                    const hairGeometry = new THREE.ConeGeometry(0.02 + Math.random() * 0.01, 0.12 + Math.random() * 0.05, 16);
                    const hair = new THREE.Mesh(hairGeometry, maneMaterial);
                    hair.castShadow = true;
                    hair.position.set(
                        (Math.random() - 0.5) * 0.1,
                        yPos - 0.05,
                        -0.22 + (Math.random() - 0.5) * 0.05
                    );
                    hair.rotation.x = Math.PI / 2 + (Math.random() - 0.5) * 0.15;
                    hair.rotation.z = (Math.random() - 0.5) * 0.2;
                    maneGroup.add(hair);
                }
            }
            
            // Mane on top of head
            for (let i = 0; i < 8; i++) {
                const hairGeometry = new THREE.ConeGeometry(0.02 + Math.random() * 0.01, 0.1 + Math.random() * 0.05, 16);
                const hair = new THREE.Mesh(hairGeometry, maneMaterial);
                hair.castShadow = true;
                hair.position.set(
                    (Math.random() - 0.5) * 0.25,
                    2.0 + 2.8 + 0.45 / 2 + 0.03 - 0.08,
                    -0.18 + (Math.random() - 0.5) * 0.15
                );
                hair.rotation.x = Math.PI / 2 + (Math.random() - 0.5) * 0.25;
                hair.rotation.z = (Math.random() - 0.5) * 0.3;
                maneGroup.add(hair);
            }
            
            // Forehead tuft
            for (let i = 0; i < 5; i++) {
                const hairGeometry = new THREE.ConeGeometry(0.025, 0.15, 16);
                const hair = new THREE.Mesh(hairGeometry, maneMaterial);
                hair.castShadow = true;
                hair.position.set(
                    (Math.random() - 0.5) * 0.1,
                    2.0 + 2.8 + 0.45 + 0.05 - 0.12,
                    -0.2 + (Math.random() - 0.5) * 0.05
                );
                hair.rotation.x = Math.PI / 2 + (Math.random() - 0.5) * 0.2;
                maneGroup.add(hair);
            }
        }
        
        function createTail() {
            const tailGroup = new THREE.Group();
            giraffeGroup.add(tailGroup);
            giraffeParts.tail = tailGroup;
            
            const tailMaterial = new THREE.MeshStandardMaterial({
                color: 0x2c1810,
                roughness: 0.85
            });
            
            // Tail base
            const tailBaseGeometry = new THREE.CylinderGeometry(0.045, 0.035, 0.5, 16);
            const tailBase = new THREE.Mesh(tailBaseGeometry, tailMaterial);
            tailBase.castShadow = true;
            tailBase.position.set(0, 0.9, -0.45);
            tailBase.rotation.x = Math.PI / 6;
            tailGroup.add(tailBase);
            
            // Tail segments
            const tailMidGeometry = new THREE.CylinderGeometry(0.035, 0.025, 0.6, 16);
            const tailMid = new THREE.Mesh(tailMidGeometry, tailMaterial);
            tailMid.castShadow = true;
            tailMid.position.set(0, 0.5 - 0.6 / 2, -0.45 - 0.5 / 2);
            tailMid.rotation.x = Math.PI / 8;
            tailGroup.add(tailMid);
            
            // Tail tip
            const tailTipGeometry = new THREE.ConeGeometry(0.025, 0.7, 16);
            const tailTip = new THREE.Mesh(tailTipGeometry, tailMaterial);
            tailTip.castShadow = true;
            tailTip.position.set(0, 0.5 - 0.6 - 0.7 / 2, -0.45 - 0.5 / 2 - 0.6 / 2);
            tailTip.rotation.x = Math.PI / 8;
            tailGroup.add(tailTip);
            
            // Long hair at the end (tassel)
            for (let i = 0; i < 15; i++) {
                const hairGeometry = new THREE.CylinderGeometry(0.01 + Math.random() * 0.005, 0.003, 0.4 + Math.random() * 0.2, 8);
                const hair = new THREE.Mesh(hairGeometry, tailMaterial);
                hair.castShadow = true;
                hair.position.set(
                    (Math.random() - 0.5) * 0.06,
                    0.5 - 0.6 - 0.7 - Math.random() * 0.1,
                    -0.45 - 0.5 / 2 - 0.6 / 2 - Math.random() * 0.1
                );
                hair.rotation.x = Math.PI / 6 + (Math.random() - 0.5) * 0.2;
                hair.rotation.z = (Math.random() - 0.5) * 0.1;
                tailGroup.add(hair);
            }
        }
        
        function createLegs() {
            const legMaterial = new THREE.MeshStandardMaterial({
                color: 0xf4d03f,
                roughness: 0.65,
                metalness: 0.08
            });
            
            // Front legs - slightly shorter and positioned forward
            const frontLegPositions = [
                { x: -0.28, z: 0.35 },
                { x: 0.28, z: 0.35 }
            ];
            
            // Back legs - longer and positioned backward
            const backLegPositions = [
                { x: -0.32, z: -0.5 },
                { x: 0.32, z: -0.5 }
            ];
            
            // Create front legs
            frontLegPositions.forEach((pos, idx) => {
                const leg = createLeg(pos.x, pos.z, 1.7, legMaterial);
                giraffeParts.legs.push(leg);
                giraffeGroup.add(leg);
                
                // Add spots to front legs
                const spots = createLegSpots(leg, 1.7, 10);
                giraffeParts.spots = giraffeParts.spots.concat(spots);
            });
            
            // Create back legs
            backLegPositions.forEach((pos, idx) => {
                const leg = createLeg(pos.x, pos.z, 1.9, legMaterial);
                giraffeParts.legs.push(leg);
                giraffeGroup.add(leg);
                
                // Add spots to back legs
                const spots = createLegSpots(leg, 1.9, 12);
                giraffeParts.spots = giraffeParts.spots.concat(spots);
            });
            
            // Hooves - more realistic shape
            const hoofMaterial = new THREE.MeshStandardMaterial({
                color: 0x1a120b,
                roughness: 0.25,
                metalness: 0.1
            });
            
            const legPositions = [...frontLegPositions, ...backLegPositions];
            legPositions.forEach((pos, idx) => {
                // Hoof base
                const hoofGeometry = new THREE.CylinderGeometry(0.06, 0.07, 0.08, 16);
                const hoof = new THREE.Mesh(hoofGeometry, hoofMaterial);
                hoof.castShadow = true;
                hoof.position.set(pos.x, 0.04, pos.z);
                hoof.rotation.x = Math.PI / 2;
                giraffeGroup.add(hoof);
                
                // Hoof tip (toe)
                const hoofTipGeometry = new THREE.ConeGeometry(0.07, 0.05, 16);
                const hoofTip = new THREE.Mesh(hoofTipGeometry, hoofMaterial);
                hoofTip.castShadow = true;
                hoofTip.position.set(pos.x, 0.04 - 0.08 / 2, pos.z);
                hoofTip.rotation.x = -Math.PI / 2;
                giraffeGroup.add(hoofTip);
            });
        }
        
        function createLeg(x, z, length, material) {
            const legGroup = new THREE.Group();
            legGroup.position.set(x, 0, z);
            
            // Upper leg (thigh)
            const upperLegGeometry = new THREE.CylinderGeometry(0.085, 0.075, length * 0.4, 16);
            const upperLeg = new THREE.Mesh(upperLegGeometry, material);
            upperLeg.castShadow = true;
            upperLeg.receiveShadow = true;
            upperLeg.position.y = length * 0.4 / 2;
            legGroup.add(upperLeg);
            
            // Knee joint area
            const kneeGeometry = new THREE.SphereGeometry(0.075, 16, 16);
            const knee = new THREE.Mesh(kneeGeometry, material);
            knee.castShadow = true;
            knee.receiveShadow = true;
            knee.position.y = length * 0.4 - 0.075;
            legGroup.add(knee);
            
            // Lower leg
            const lowerLegGeometry = new THREE.CylinderGeometry(0.07, 0.06, length * 0.4, 16);
            const lowerLeg = new THREE.Mesh(lowerLegGeometry, material);
            lowerLeg.castShadow = true;
            lowerLeg.receiveShadow = true;
            lowerLeg.position.y = length * 0.4 - length * 0.4 / 2;
            legGroup.add(lowerLeg);
            
            // Ankle joint
            const ankleGeometry = new THREE.SphereGeometry(0.06, 16, 16);
            const ankle = new THREE.Mesh(ankleGeometry, material);
            ankle.castShadow = true;
            ankle.receiveShadow = true;
            ankle.position.y = length * 0.4 - length * 0.4 - 0.06;
            legGroup.add(ankle);
            
            // Lower leg part 2 (from ankle to hoof)
            const lowerLeg2Geometry = new THREE.CylinderGeometry(0.055, 0.06, length * 0.2, 16);
            const lowerLeg2 = new THREE.Mesh(lowerLeg2Geometry, material);
            lowerLeg2.castShadow = true;
            lowerLeg2.receiveShadow = true;
            lowerLeg2.position.y = length * 0.4 - length * 0.4 - length * 0.2 / 2;
            legGroup.add(lowerLeg2);
            
            return legGroup;
        }
        
        function createLegSpots(legGroup, length, count) {
            const spots = [];
            const spotMaterial = new THREE.MeshStandardMaterial({
                color: 0x2c1810,
                roughness: 0.65,
                metalness: 0.05
            });
            
            for (let i = 0; i < count; i++) {
                const spotGeometry = new THREE.SphereGeometry(0.02 + Math.random() * 0.012, 16, 16);
                const spot = new THREE.Mesh(spotGeometry, spotMaterial);
                spot.castShadow = true;
                
                // Position spots along the leg in a more natural pattern
                spot.position.x = (Math.random() - 0.5) * 0.12;
                spot.position.y = Math.random() * length * 0.95;
                spot.position.z = (Math.random() - 0.5) * 0.12;
                
                // Vary scale for irregular spots
                spot.scale.set(
                    0.8 + Math.random() * 0.4,
                    0.8 + Math.random() * 0.4,
                    1
                );
                
                legGroup.add(spot);
                spots.push(spot);
            }
            
            return spots;
        }
        
        // Animation
        let animationEnabled = true;
        let time = 0;
        let walkSpeed = 0.008;
        let neckSwayTime = 0;
        let headBobTime = 0;
        let tailSwingTime = 0;
        let giraffePosition = 0;
        let walkDirection = 1;
        
        function animate() {
            requestAnimationFrame(animate);
            
            if (animationEnabled) {
                time += walkSpeed;
                neckSwayTime += 0.003;
                headBobTime += 0.004;
                tailSwingTime += 0.005;
                
                // Walking motion with proper gait
                // Giraffes walk with a pacing gait: both legs on same side move together
                const frontLeftPhase = Math.sin(time * 2);
                const frontRightPhase = Math.sin(time * 2 + Math.PI);
                const backLeftPhase = Math.sin(time * 2 + Math.PI);
                const backRightPhase = Math.sin(time * 2);
                
                // Animate legs for walking
                if (giraffeParts.legs.length >= 4) {
                    // Front left leg (children: upperLeg, knee, lowerLeg, ankle, lowerLeg2)
                    const frontLeftLeg = giraffeParts.legs[0];
                    frontLeftLeg.children[0].rotation.x = frontLeftPhase * 0.25;  // Upper leg
                    frontLeftLeg.children[2].rotation.x = frontLeftPhase * 0.3;   // Lower leg
                    frontLeftLeg.children[4].rotation.x = frontLeftPhase * 0.2;   // Lower leg 2
                    
                    // Front right leg
                    const frontRightLeg = giraffeParts.legs[1];
                    frontRightLeg.children[0].rotation.x = frontRightPhase * 0.25;
                    frontRightLeg.children[2].rotation.x = frontRightPhase * 0.3;
                    frontRightLeg.children[4].rotation.x = frontRightPhase * 0.2;
                    
                    // Back left leg
                    const backLeftLeg = giraffeParts.legs[2];
                    backLeftLeg.children[0].rotation.x = backLeftPhase * 0.25;
                    backLeftLeg.children[2].rotation.x = backLeftPhase * 0.3;
                    backLeftLeg.children[4].rotation.x = backLeftPhase * 0.2;
                    
                    // Back right leg
                    const backRightLeg = giraffeParts.legs[3];
                    backRightLeg.children[0].rotation.x = backRightPhase * 0.25;
                    backRightLeg.children[2].rotation.x = backRightPhase * 0.3;
                    backRightLeg.children[4].rotation.x = backRightPhase * 0.2;
                }
                
                // Body sway - subtle side to side
                giraffeParts.body.rotation.z = Math.sin(time * 0.8) * 0.03;
                
                // Body slight up and down
                giraffeGroup.position.y = 0.01 + Math.sin(time * 1.5) * 0.005;
                
                // Neck sway (realistic giraffe movement - slow and graceful)
                giraffeParts.neck.rotation.z = Math.sin(neckSwayTime) * 0.08;
                giraffeParts.neck.rotation.x = Math.PI / 5 + Math.sin(neckSwayTime * 0.7) * 0.02;
                
                // Head movement
                giraffeParts.head.rotation.z = giraffeParts.neck.rotation.z + Math.sin(headBobTime) * 0.03;
                giraffeParts.head.rotation.x = giraffeParts.neck.rotation.x + Math.sin(headBobTime * 1.3) * 0.02;
                giraffeParts.head.position.z = -0.05 + Math.sin(headBobTime * 0.8) * 0.01;
                
                // Ear movement (twitch occasionally)
                const earTwitch = Math.sin(headBobTime * 3) * 0.05;
                giraffeGroup.children.forEach(child => {
                    if (child.children && child.children[0] && child.children[0].geometry && child.children[0].geometry.type === 'ConeGeometry') {
                        if (child.position.x < -0.2) {  // Left ear
                            child.rotation.z = Math.PI / 2 + earTwitch;
                        } else if (child.position.x > 0.2) {  // Right ear
                            child.rotation.z = -Math.PI / 2 - earTwitch * 0.7;
                        }
                    }
                });
                
                // Move giraffe forward in a gentle arc
                giraffePosition += walkDirection * 0.001;
                if (giraffePosition > 2) walkDirection = -1;
                if (giraffePosition < -2) walkDirection = 1;
                giraffeGroup.position.z = giraffePosition;
                
                // Rotate giraffe slightly to follow the arc
                giraffeGroup.rotation.y = giraffePosition * 0.1;
                
                // Tail movement - swings side to side
                if (giraffeParts.tail) {
                    giraffeParts.tail.rotation.x = -0.1 + Math.sin(tailSwingTime) * 0.08;
                    giraffeParts.tail.rotation.z = Math.sin(tailSwingTime * 0.8) * 0.05;
                }
                
                // Mane movement - slight sway
                if (giraffeParts.mane) {
                    giraffeParts.mane.rotation.z = Math.sin(neckSwayTime * 0.9) * 0.02;
                }
            }
            
            renderer.render(scene, camera);
        }
        
        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        // Toggle animation on click
        window.addEventListener('click', () => {
            animationEnabled = !animationEnabled;
            document.getElementById('info').textContent = 
                animationEnabled 
                    ? 'Realistic Walking Giraffe - Three.js | Click to pause animation'
                    : 'Realistic Walking Giraffe - Three.js | Click to resume animation';
        });
        
        // Add keyboard controls for camera
        document.addEventListener('keydown', (event) => {
            const cameraMoveSpeed = 0.5;
            switch (event.key) {
                case 'w':
                case 'W':
                    camera.position.z -= cameraMoveSpeed;
                    break;
                case 's':
                case 'S':
                    camera.position.z += cameraMoveSpeed;
                    break;
                case 'a':
                case 'A':
                    camera.position.x -= cameraMoveSpeed;
                    break;
                case 'd':
                case 'D':
                    camera.position.x += cameraMoveSpeed;
                    break;
                case 'q':
                case 'Q':
                    camera.position.y += cameraMoveSpeed;
                    break;
                case 'e':
                case 'E':
                    camera.position.y -= cameraMoveSpeed;
                    break;
            }
            camera.lookAt(giraffeGroup.position);
        });
        
        // Mouse drag to rotate camera
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        
        document.addEventListener('mousedown', (event) => {
            isDragging = true;
            previousMousePosition = { x: event.clientX, y: event.clientY };
        });
        
        document.addEventListener('mousemove', (event) => {
            if (!isDragging) return;
            
            const deltaX = event.clientX - previousMousePosition.x;
            const deltaY = event.clientY - previousMousePosition.y;
            
            const rotationSpeed = 0.01;
            
            // Rotate camera around giraffe
            const radius = Math.sqrt(
                Math.pow(camera.position.x - giraffeGroup.position.x, 2) +
                Math.pow(camera.position.z - giraffeGroup.position.z, 2)
            );
            
            const currentAngle = Math.atan2(
                camera.position.z - giraffeGroup.position.z,
                camera.position.x - giraffeGroup.position.x
            );
            
            const newAngle = currentAngle + deltaX * rotationSpeed;
            
            camera.position.x = giraffeGroup.position.x + Math.cos(newAngle) * radius;
            camera.position.z = giraffeGroup.position.z + Math.sin(newAngle) * radius;
            
            // Adjust height
            camera.position.y = Math.max(0.5, Math.min(20, camera.position.y - deltaY * rotationSpeed * radius * 0.1));
            
            camera.lookAt(giraffeGroup.position);
            
            previousMousePosition = { x: event.clientX, y: event.clientY };
        });
        
        document.addEventListener('mouseup', () => {
            isDragging = false;
        });
        document.addEventListener('mouseleave', () => {
            isDragging = false;
        });
        
        // Initialize
        createGiraffe();
        animate();
    </script>
</body>
</html>
