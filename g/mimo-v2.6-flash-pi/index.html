<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Giraffe &mdash; procedural walk cycle (Three.js)</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="scene"></canvas>

<div id="hud">
  <div id="card">
    <h1>Giraffe</h1>
    <p>Procedural anatomy &amp; walk cycle &middot; Three.js r<span id="rev">-</span></p>
    <p class="keys">
      drag&nbsp;orbit &middot; scroll&nbsp;zoom &middot; shift+drag&nbsp;pan<br>
      <kbd>1</kbd> side &nbsp;<kbd>2</kbd> three-quarter &nbsp;<kbd>3</kbd> head &nbsp;
      <kbd>4</kbd> rear &nbsp;<kbd>5</kbd> wide &nbsp;<kbd>6</kbd> low<br>
      <kbd>space</kbd> pause &nbsp;<kbd>&larr;</kbd><kbd>&rarr;</kbd> speed &nbsp;<kbd>o</kbd> auto-orbit
    </p>
  </div>

  <div id="panel">
    <div class="row">
      <label for="speed">walk speed</label>
      <input id="speed" type="range" min="0" max="2.6" step="0.05" value="1.4">
      <span id="speedVal" class="val">1.40 m/s</span>
    </div>
    <div class="row btns">
      <button data-view="side">side</button>
      <button data-view="front34">3/4</button>
      <button data-view="head">head</button>
      <button data-view="rear">rear</button>
      <button data-view="wide">wide</button>
      <button data-view="low">low</button>
      <button id="orbitBtn" class="toggle">auto-orbit</button>
    </div>
    <div class="row stats">
      <span id="fps">-- fps</span>
      <span id="gait">cycle --</span>
      <span id="pauseState"></span>
    </div>
  </div>
</div>

<div id="loading"><div class="spin"></div><span>building the giraffe&hellip;</span></div>

<script src="vendor/three.min.js"></script>
<script src="js/util.js"></script>
<script src="js/coat.js"></script>
<script src="js/chain.js"></script>
<script src="js/ik.js"></script>
<script src="js/giraffe.js"></script>
<script src="js/anim.js"></script>
<script src="js/scenery.js"></script>
<script src="js/controls.js"></script>
<script src="js/main.js"></script>
</body>
</html>
