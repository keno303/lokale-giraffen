<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Walking Giraffe — Three.js</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #cfe6f5;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #1a2a3a;
  }
  #app { position: fixed; inset: 0; }
  #info {
    position: fixed;
    top: 14px;
    left: 14px;
    background: rgba(255, 255, 255, 0.78);
    padding: 10px 14px;
    border-radius: 10px;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
    font-size: 13px;
    line-height: 1.4;
    pointer-events: none;
    user-select: none;
    max-width: 320px;
  }
  #info h1 {
    margin: 0 0 4px 0;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.3px;
  }
  #info span { opacity: 0.75; }
  #loading {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #cfe6f5;
    font-size: 14px;
    z-index: 10;
    transition: opacity 0.6s ease;
  }
  #loading.hidden { opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<div id="loading">Loading scene…</div>
<div id="app"></div>
<div id="info">
  <h1>Walking Giraffe</h1>
  <span>Three.js · procedural model · drag to orbit · scroll to zoom</span>
</div>

<!--
  Uses the non-module Three.js build (window.THREE) and an inline OrbitControls
  so the file runs by double-clicking index.html (file://) with no server.
  Three.js r150 — © three.js authors (MIT).
-->
<script>/* suppress three.js r150 deprecation noise */ var console = console; var origWarn = console.warn; console.warn = function(){};</script>
<script src="three.min.js"></script>
<script src="OrbitControls.inline.js"></script>

<script>
// restore console.warn for our own messages
console.warn = origWarn;

'use strict';

/* -----------------------------------------------------------
   Renderer / Scene / Camera
----------------------------------------------------------- */
const container = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xcfe6f5);
scene.fog = new THREE.Fog(0xcfe6f5, 30, 90);

const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(9.5, 5.0, 11.5);
camera.lookAt(0, 3.8, 0.8);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 3.8, 0.8);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 5;
controls.maxDistance = 40;
controls.maxPolarAngle = Math.PI * 0.49;

/* -----------------------------------------------------------
   Sky gradient (large inverted sphere)
----------------------------------------------------------- */
{
  const skyGeo = new THREE.SphereGeometry(100, 32, 16);
  const skyMat = new THREE.ShaderMaterial({
    side: THREE.BackSide,
    depthWrite: false,
    uniforms: {
      topColor:    { value: new THREE.Color(0x6fb6e8) },
      bottomColor: { value: new THREE.Color(0xf5ecd9) },
      offset:      { value: 33 },
      exponent:    { value: 0.7 },
    },
    vertexShader: `
      varying vec3 vWorldPos;
      void main(){
        vec4 wp = modelMatrix * vec4(position, 1.0);
        vWorldPos = wp.xyz;
        gl_Position = projectionMatrix * viewMatrix * wp;
      }
    `,
    fragmentShader: `
      uniform vec3 topColor;
      uniform vec3 bottomColor;
      uniform float offset;
      uniform float exponent;
      varying vec3 vWorldPos;
      void main(){
        float h = normalize(vWorldPos + vec3(0.0, offset, 0.0)).y;
        gl_FragColor = vec4(mix(bottomColor, topColor, max(pow(max(h, 0.0), exponent), 0.0)), 1.0);
      }
    `,
  });
  scene.add(new THREE.Mesh(skyGeo, skyMat));
}

/* -----------------------------------------------------------
   Lights
----------------------------------------------------------- */
const hemi = new THREE.HemisphereLight(0xffffff, 0x6b8e5a, 0.55);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xfff1d6, 1.6);
sun.position.set(12, 18, 8);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 60;
sun.shadow.camera.left = -15;
sun.shadow.camera.right = 15;
sun.shadow.camera.top = 15;
sun.shadow.camera.bottom = -15;
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.04;
scene.add(sun);

const fill = new THREE.DirectionalLight(0xa9c8e0, 0.35);
fill.position.set(-8, 6, -4);
scene.add(fill);

/* -----------------------------------------------------------
   Ground (savanna-like)
----------------------------------------------------------- */
function buildGroundTexture() {
  const size = 1024;
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext('2d');

  // base dry-grass gradient
  const g = ctx.createRadialGradient(size/2, size/2, size*0.1, size/2, size/2, size*0.7);
  g.addColorStop(0, '#c8a96a');
  g.addColorStop(0.6, '#a98a52');
  g.addColorStop(1, '#8a6f3e');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, size, size);

  // dry grass blades
  for (let i = 0; i < 9000; i++) {
    const x = Math.random() * size;
    const y = Math.random() * size;
    const a = Math.random() * 0.6 + 0.1;
    const len = 2 + Math.random() * 4;
    const shade = 30 + Math.random() * 50;
    ctx.strokeStyle = `rgba(${shade+90}, ${shade+90}, ${shade+30}, ${a})`;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + (Math.random()-0.5)*1.4, y - len);
    ctx.stroke();
  }

  // small darker tufts
  for (let i = 0; i < 400; i++) {
    const x = Math.random() * size;
    const y = Math.random() * size;
    const r = 4 + Math.random() * 10;
    const grad = ctx.createRadialGradient(x, y, 0, x, y, r);
    grad.addColorStop(0, 'rgba(70, 55, 30, 0.35)');
    grad.addColorStop(1, 'rgba(70, 55, 30, 0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI*2);
    ctx.fill();
  }

  const tex = new THREE.CanvasTexture(canvas);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(8, 8);
  tex.anisotropy = 8;
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

const groundGeo = new THREE.PlaneGeometry(120, 120, 64, 64);
// gentle terrain bumps
{
  const pos = groundGeo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i);
    const y = pos.getY(i);
    const r = Math.sqrt(x*x + y*y);
    const h = Math.sin(x*0.12)*0.08 + Math.cos(y*0.15)*0.06 + Math.sin((x+y)*0.05)*0.05;
    pos.setZ(i, h * Math.min(1, r/4) * 0.4);
  }
  pos.needsUpdate = true;
  groundGeo.computeVertexNormals();
}
const groundMat = new THREE.MeshStandardMaterial({
  map: buildGroundTexture(),
  roughness: 0.95,
  metalness: 0.0,
});
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// Distant acacia-like silhouettes
function makeAcacia(x, z, scale) {
  const g = new THREE.Group();
  const trunkMat = new THREE.MeshStandardMaterial({ color: 0x4a3520, roughness: 0.95 });
  const leafMat  = new THREE.MeshStandardMaterial({ color: 0x4a6a3a, roughness: 0.9 });
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.12*scale, 0.18*scale, 2.2*scale, 8), trunkMat);
  trunk.position.y = 1.1*scale;
  trunk.castShadow = true;
  g.add(trunk);
  const top = new THREE.Mesh(new THREE.SphereGeometry(1.4*scale, 12, 8), leafMat);
  top.position.y = 2.5*scale;
  top.scale.set(1, 0.35, 1);
  top.castShadow = true;
  g.add(top);
  g.position.set(x, 0, z);
  return g;
}
scene.add(makeAcacia(-18, -10, 1.4));
scene.add(makeAcacia(20, -14, 1.2));
scene.add(makeAcacia(-22, 8, 1.6));
scene.add(makeAcacia(24, 6, 1.3));

/* -----------------------------------------------------------
   Giraffe spotted texture (canvas-based)
----------------------------------------------------------- */
function buildGiraffeTexture(opts) {
  const { width = 1024, height = 1024, density = 1.0, edgeFade = 0.0, contrast = 1.0 } = opts || {};
  const canvas = document.createElement('canvas');
  canvas.width = width;
  canvas.height = height;
  const ctx = canvas.getContext('2d');

  // base coat: warm cream
  const base = ctx.createLinearGradient(0, 0, 0, height);
  base.addColorStop(0, '#f6dcae');
  base.addColorStop(0.5, '#f0c98e');
  base.addColorStop(1, '#e2b274');
  ctx.fillStyle = base;
  ctx.fillRect(0, 0, width, height);

  // soft belly lightening
  const belly = ctx.createLinearGradient(0, height*0.55, 0, height);
  belly.addColorStop(0, 'rgba(250, 230, 190, 0)');
  belly.addColorStop(1, 'rgba(250, 230, 190, 0.55)');
  ctx.fillStyle = belly;
  ctx.fillRect(0, 0, width, height);

  // spots: irregular brown patches with darker outline
  const spotCount = Math.floor(160 * density);
  for (let i = 0; i < spotCount; i++) {
    const cx = Math.random() * width;
    const cy = Math.random() * height;
    const baseR = 26 + Math.random() * 55;
    const irregularity = 0.45;

    // build a soft blob path
    const points = 10 + Math.floor(Math.random()*6);
    const radii = [];
    for (let k = 0; k < points; k++) radii.push(baseR * (1 - irregularity*Math.random()*0.7));

    // outer soft halo (lighter, less harsh)
    ctx.fillStyle = 'rgba(120, 80, 40, 0.32)';
    ctx.beginPath();
    for (let k = 0; k < points; k++) {
      const a = (k / points) * Math.PI * 2;
      const x = cx + Math.cos(a) * radii[k] * 1.18;
      const y = cy + Math.sin(a) * radii[k] * 1.18;
      if (k === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.fill();

    // main spot — warm chestnut brown (lighter than before)
    const grad = ctx.createRadialGradient(cx - baseR*0.2, cy - baseR*0.2, 1, cx, cy, baseR);
    grad.addColorStop(0, `rgba(${Math.floor(150*contrast)}, ${Math.floor(95*contrast)}, ${Math.floor(55*contrast)}, 1)`);
    grad.addColorStop(0.6, `rgba(${Math.floor(120*contrast)}, ${Math.floor(72*contrast)}, ${Math.floor(38*contrast)}, 1)`);
    grad.addColorStop(1, `rgba(${Math.floor(85*contrast)}, ${Math.floor(48*contrast)}, ${Math.floor(22*contrast)}, 1)`);
    ctx.fillStyle = grad;
    ctx.beginPath();
    for (let k = 0; k < points; k++) {
      const a = (k / points) * Math.PI * 2;
      const x = cx + Math.cos(a) * radii[k];
      const y = cy + Math.sin(a) * radii[k];
      if (k === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.fill();

    // tiny inner highlight
    ctx.fillStyle = 'rgba(170, 120, 70, 0.35)';
    ctx.beginPath();
    ctx.arc(cx - baseR*0.28, cy - baseR*0.28, baseR*0.22, 0, Math.PI*2);
    ctx.fill();
  }

  // fine hair noise
  for (let i = 0; i < 4000; i++) {
    const x = Math.random() * width;
    const y = Math.random() * height;
    ctx.fillStyle = `rgba(90, 60, 30, ${Math.random()*0.05})`;
    ctx.fillRect(x, y, 1, 1);
  }

  // edge fade (for parts like legs where we want soft top/bottom)
  if (edgeFade > 0) {
    const fade = ctx.createLinearGradient(0, 0, 0, height);
    fade.addColorStop(0, `rgba(250, 220, 175, ${edgeFade})`);
    fade.addColorStop(0.5, 'rgba(250, 220, 175, 0)');
    fade.addColorStop(1, `rgba(250, 220, 175, ${edgeFade})`);
    ctx.fillStyle = fade;
    ctx.fillRect(0, 0, width, height);
  }

  const tex = new THREE.CanvasTexture(canvas);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.anisotropy = 8;
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

// shared textures — body has rich pattern, legs/head/neck a bit lighter
const TEX_BODY = buildGiraffeTexture({ width: 1024, height: 1024, density: 1.0, contrast: 1.0 });
const TEX_NECK = buildGiraffeTexture({ width: 512,  height: 1024, density: 0.45, edgeFade: 0.0, contrast: 0.75 });
const TEX_LEG  = buildGiraffeTexture({ width: 512,  height: 1024, density: 0.55, edgeFade: 0.55, contrast: 0.85 });
const TEX_HEAD = buildGiraffeTexture({ width: 512,  height: 512,  density: 0.85, contrast: 0.9 });

// Mane texture: dark stripe
function buildManeTexture() {
  const canvas = document.createElement('canvas');
  canvas.width = 64; canvas.height = 512;
  const ctx = canvas.getContext('2d');
  const g = ctx.createLinearGradient(0, 0, 64, 0);
  g.addColorStop(0, 'rgba(70, 40, 18, 0)');
  g.addColorStop(0.4, 'rgba(70, 40, 18, 1)');
  g.addColorStop(0.6, 'rgba(70, 40, 18, 1)');
  g.addColorStop(1, 'rgba(70, 40, 18, 0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 64, 512);
  // short hair strokes
  for (let i = 0; i < 200; i++) {
    const y = Math.random() * 512;
    ctx.strokeStyle = `rgba(40, 22, 10, ${0.4 + Math.random()*0.5})`;
    ctx.lineWidth = 1 + Math.random()*1.5;
    ctx.beginPath();
    ctx.moveTo(28 + Math.random()*8, y);
    ctx.lineTo(20 + Math.random()*24, y + 4 + Math.random()*8);
    ctx.stroke();
  }
  const t = new THREE.CanvasTexture(canvas);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const TEX_MANE = buildManeTexture();

/* -----------------------------------------------------------
   Materials
----------------------------------------------------------- */
const matBody = new THREE.MeshStandardMaterial({
  map: TEX_BODY,
  roughness: 0.78,
  metalness: 0.02,
  color: 0xffffff,
});
const matLeg = new THREE.MeshStandardMaterial({
  map: TEX_LEG,
  roughness: 0.82,
  metalness: 0.02,
  color: 0xffffff,
});
const matHead = new THREE.MeshStandardMaterial({
  map: TEX_HEAD,
  roughness: 0.75,
  metalness: 0.02,
  color: 0xffffff,
});
const matNeck = new THREE.MeshStandardMaterial({
  map: TEX_NECK,
  roughness: 0.8,
  metalness: 0.02,
  color: 0xffffff,
});
const matHoof = new THREE.MeshStandardMaterial({
  color: 0x2a1a0c,
  roughness: 0.55,
  metalness: 0.05,
});
const matHorn = new THREE.MeshStandardMaterial({
  color: 0x3a2410,
  roughness: 0.6,
  metalness: 0.1,
});
const matHornTip = new THREE.MeshStandardMaterial({
  color: 0x1a0f06,
  roughness: 0.4,
  metalness: 0.2,
});
const matMane = new THREE.MeshStandardMaterial({
  map: TEX_MANE,
  roughness: 0.9,
  metalness: 0.0,
  transparent: true,
  alphaTest: 0.4,
  side: THREE.DoubleSide,
});
const matEyeWhite = new THREE.MeshStandardMaterial({
  color: 0xf2ead8,
  roughness: 0.4,
});
const matEyeDark = new THREE.MeshStandardMaterial({
  color: 0x0a0805,
  roughness: 0.2,
  metalness: 0.4,
});
const matNostril = new THREE.MeshStandardMaterial({
  color: 0x1a0e05,
  roughness: 0.7,
});
const matMouth = new THREE.MeshStandardMaterial({
  color: 0x4a2a15,
  roughness: 0.6,
});

/* -----------------------------------------------------------
   Giraffe construction
----------------------------------------------------------- */
const giraffe = new THREE.Group();
scene.add(giraffe);

// Body — longer than tall, like a real giraffe
const BODY_W = 0.60;   // half-width (x)
const BODY_H = 0.40;   // half-height (y)
const BODY_L = 1.50;   // half-length (z)
const BODY_Y = 3.05;   // center height

// Build body from an elongated capsule-like shape (sphere stretched along Z)
const bodyGeo = new THREE.SphereGeometry(1, 48, 32);
const body = new THREE.Mesh(bodyGeo, matBody);
body.scale.set(BODY_W, BODY_H, BODY_L);
body.position.set(0, BODY_Y, 0);
body.castShadow = true;
body.receiveShadow = true;
giraffe.add(body);

// Subtle chest fillet (front, slightly fuller)
const chestGeo = new THREE.SphereGeometry(1, 28, 20);
const chest = new THREE.Mesh(chestGeo, matBody);
chest.scale.set(0.46, 0.48, 0.30);
chest.position.set(0, BODY_Y - 0.06, BODY_L * 0.94);
chest.castShadow = true;
giraffe.add(chest);

// Subtle rump fillet (back)
const rumpGeo = new THREE.SphereGeometry(1, 28, 20);
const rump = new THREE.Mesh(rumpGeo, matBody);
rump.scale.set(0.44, 0.48, 0.30);
rump.position.set(0, BODY_Y - 0.04, -BODY_L * 0.94);
rump.castShadow = true;
giraffe.add(rump);

// Shoulder hump (withers) - slight rise behind neck base
const withersGeo = new THREE.SphereGeometry(1, 24, 16);
const withers = new THREE.Mesh(withersGeo, matBody);
withers.scale.set(0.34, 0.16, 0.30);
withers.position.set(0, BODY_Y + BODY_H * 0.88, BODY_L * 0.55);
withers.castShadow = true;
giraffe.add(withers);

/* -----------------------------------------------------------
   Neck (long, slightly curved forward)
----------------------------------------------------------- */
const NECK_BASE_Z = BODY_L * 0.72;   // front-ish attach (inside body)
const NECK_BASE_Y = BODY_Y + BODY_H * 0.55;  // lower so neck starts inside body
const NECK_TIP_Y  = 6.55;
const NECK_TIP_Z  = NECK_BASE_Z + 1.75;
const NECK_LEN    = Math.hypot(NECK_TIP_Z - NECK_BASE_Z, NECK_TIP_Y - NECK_BASE_Y);

const neckGroup = new THREE.Group();
neckGroup.position.set(0, NECK_BASE_Y, NECK_BASE_Z);
// rotate so the local +Y axis points from base to tip
const neckAngle = Math.atan2(NECK_TIP_Z - NECK_BASE_Z, NECK_TIP_Y - NECK_BASE_Y);
// Positive X rotation tilts local +Y toward +Z (forward).
neckGroup.rotation.x = neckAngle;
giraffe.add(neckGroup);

// Build the neck as a tapered tube along local Y from 0..NECK_LEN
function buildNeck() {
  const segments = 24;
  const path = [];
  for (let i = 0; i <= segments; i++) {
    const t = i / segments;
    // slight S-curve
    const offset = Math.sin(t * Math.PI) * 0.10;
    path.push(new THREE.Vector3(offset, t * NECK_LEN, 0));
  }
  const curve = new THREE.CatmullRomCurve3(path);

  // Tube geometry with varying radius via custom radius function
  // Three.js TubeGeometry doesn't support per-segment radius, so we build manually.
  const tubularSegments = 48;
  const radialSegments = 20;
  const frames = curve.computeFrenetFrames(tubularSegments, false);
  const positions = [];
  const normals = [];
  const uvs = [];
  const indices = [];

  const radiusAt = (t) => {
    // smooth taper from base to tip, with subtle mid-bulge
    const base = 0.42;   // base radius (blends into body)
    const mid  = 0.30;   // mid radius
    const tip  = 0.17;   // tip radius
    const bulge = Math.sin(t * Math.PI) * 0.015;
    if (t < 0.12) {
      // gentle flare at very base to blend into body
      const k = t / 0.12;
      return base * (1 - k * 0.15) + mid * (k * 0.15);
    }
    const k = (t - 0.12) / 0.88;
    return mid * (1 - k) + tip * k + bulge;
  };

  for (let i = 0; i <= tubularSegments; i++) {
    const t = i / tubularSegments;
    const p = curve.getPointAt(t);
    const N = frames.normals[i];
    const B = frames.binormals[i];
    const r = radiusAt(t);
    for (let j = 0; j <= radialSegments; j++) {
      const u = j / radialSegments;
      const a = u * Math.PI * 2;
      const cx = Math.cos(a), sy = Math.sin(a);
      const nx = (cx * N.x + sy * B.x) * r;
      const ny = (cx * N.y + sy * B.y) * r;
      const nz = (cx * N.z + sy * B.z) * r;
      positions.push(p.x + nx, p.y + ny, p.z + nz);
      normals.push(N.x * cx + B.x * sy, N.y * cx + B.y * sy, N.z * cx + B.z * sy);
      uvs.push(t, u);
    }
  }
  for (let i = 0; i < tubularSegments; i++) {
    for (let j = 0; j < radialSegments; j++) {
      const a = i * (radialSegments + 1) + j;
      const b = (i + 1) * (radialSegments + 1) + j;
      const c = (i + 1) * (radialSegments + 1) + (j + 1);
      const d = i * (radialSegments + 1) + (j + 1);
      indices.push(a, b, d, b, c, d);
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geo.setAttribute('normal',   new THREE.Float32BufferAttribute(normals, 3));
  geo.setAttribute('uv',       new THREE.Float32BufferAttribute(uvs, 2));
  geo.setIndex(indices);
  geo.computeVertexNormals();
  return geo;
}
const neckMesh = new THREE.Mesh(buildNeck(), matNeck);
neckMesh.castShadow = true;
neckMesh.receiveShadow = true;
neckMesh.position.y = -0.55; // sink neck base deep into body to hide seam
neckGroup.add(neckMesh);

// Mane along the back of the neck
{
  const neckRadiusAt = (t) => {
    const base = 0.42, mid = 0.30, tip = 0.17;
    const bulge = Math.sin(t * Math.PI) * 0.015;
    if (t < 0.12) {
      const k = t / 0.12;
      return base * (1 - k * 0.15) + mid * (k * 0.15);
    }
    const k = (t - 0.12) / 0.88;
    return mid * (1 - k) + tip * k + bulge;
  };
  const maneShape = new THREE.PlaneGeometry(0.18, NECK_LEN * 0.95, 1, 24);
  // bend along the neck curve
  const pos = maneShape.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const y = pos.getY(i) + NECK_LEN/2; // 0..NECK_LEN
    const t = Math.max(0, Math.min(1, y / NECK_LEN));
    const r = neckRadiusAt(t);
    pos.setX(i, pos.getX(i));
    pos.setY(i, y);
    pos.setZ(i, -r - 0.01);
  }
  pos.needsUpdate = true;
  maneShape.computeVertexNormals();
  const mane = new THREE.Mesh(maneShape, matMane);
  mane.position.y = 0.05;
  mane.castShadow = true;
  neckGroup.add(mane);

  // short dark tufts along the mane top (lying flat, not spiky)
  const tuftMat = new THREE.MeshStandardMaterial({ color: 0x2a1808, roughness: 0.95 });
  for (let i = 0; i < 22; i++) {
    const t = 0.04 + i / 22 * 0.94;
    const r = neckRadiusAt(t);
    const tuft = new THREE.Mesh(
      new THREE.ConeGeometry(0.022, 0.09 + Math.random()*0.04, 4),
      tuftMat
    );
    // place along the back of the neck, lying flat (rotated to lie along -Z)
    tuft.position.set(
      (Math.random()-0.5) * 0.04,
      t * NECK_LEN - 0.01,
      -r - 0.03
    );
    tuft.rotation.x = -Math.PI/2 + (Math.random()-0.5)*0.15;
    tuft.rotation.z = (Math.random()-0.5) * 0.2;
    neckGroup.add(tuft);
  }
}

/* -----------------------------------------------------------
   Head
----------------------------------------------------------- */
const headGroup = new THREE.Group();
headGroup.position.set(0, NECK_LEN, 0);
neckGroup.add(headGroup);

// Skull (elongated, tapered toward muzzle)
const skullGeo = new THREE.SphereGeometry(1, 32, 24);
const skull = new THREE.Mesh(skullGeo, matHead);
skull.scale.set(0.32, 0.33, 0.60);
skull.position.set(0, 0.02, 0.20);
skull.castShadow = true;
headGroup.add(skull);

// Forehead bump (slight)
{
  const fGeo = new THREE.SphereGeometry(1, 20, 14);
  const f = new THREE.Mesh(fGeo, matHead);
  f.scale.set(0.26, 0.18, 0.26);
  f.position.set(0, 0.20, 0.06);
  headGroup.add(f);
}

// Muzzle (front, lower) — more elongated
const muzzleGeo = new THREE.SphereGeometry(1, 24, 18);
const muzzle = new THREE.Mesh(muzzleGeo, matHead);
muzzle.scale.set(0.25, 0.24, 0.40);
muzzle.position.set(0, -0.18, 0.62);
muzzle.castShadow = true;

// Upper lip ridge
{
  const lipGeo = new THREE.SphereGeometry(1, 16, 12);
  const lip = new THREE.Mesh(lipGeo, matHead);
  lip.scale.set(0.20, 0.06, 0.20);
  lip.position.set(0, -0.08, 0.96);
  headGroup.add(lip);
}

// Lower jaw
{
  const jawGeo = new THREE.SphereGeometry(1, 16, 12);
  const jaw = new THREE.Mesh(jawGeo, matHead);
  jaw.scale.set(0.22, 0.08, 0.28);
  jaw.position.set(0, -0.31, 0.60);

}

// Nostrils
for (const sx of [-1, 1]) {
  const n = new THREE.Mesh(new THREE.SphereGeometry(0.038, 12, 8), matNostril);
  n.scale.set(1.1, 0.6, 1.5);

}

// Mouth line
{
  const mouthGeo = new THREE.BoxGeometry(0.24, 0.014, 0.005);
  const mouth = new THREE.Mesh(mouthGeo, matMouth);
  mouth.position.set(0, -0.29, 0.90);

}

// Eyes (with lids)
for (const sx of [-1, 1]) {
  const eye = new THREE.Group();
  eye.position.set(sx * 0.30, 0.06, 0.30);

  // eye white
  const white = new THREE.Mesh(new THREE.SphereGeometry(0.055, 18, 14), matEyeWhite);
  white.scale.set(1, 1.15, 0.6);
  eye.add(white);

  // iris
  const iris = new THREE.Mesh(new THREE.SphereGeometry(0.038, 18, 14), matEyeDark);
  iris.scale.set(1, 1.05, 0.5);
  iris.position.set(0, 0, 0.015);
  eye.add(iris);

  // highlight
  const hl = new THREE.Mesh(
    new THREE.SphereGeometry(0.012, 8, 8),

  );
  hl.position.set(sx * -0.01, 0.012, 0.03);

  lid.rotation.z = sx * -0.2;
  lid.position.set(0, 0.005, 0.005);
  eye.add(lid);

  // long eyelashes (a few thin cones)
  for (let i = 0; i < 5; i++) {
    const lash = new THREE.Mesh(
      new THREE.ConeGeometry(0.005, 0.06, 4),
      new THREE.MeshStandardMaterial({ color: 0x1a0e05, roughness: 0.6 })
    );
    const t = (i - 2) / 2;
    lash.position.set(t * 0.04, 0.04, 0.025);
    lash.rotation.z = t * 0.4 + sx * 0.05;

}

// Ossicones (horn-like) — bigger, more visible
for (const sx of [-1, 1]) {
  const ossicone = new THREE.Group();
  ossicone.position.set(sx * 0.16, 0.32, 0.06);

  const base = new THREE.Mesh(

// Ears (large, leaf-shaped)
for (const sx of [-1, 1]) {
  const ear = new THREE.Group();

// Head rotation pivot for animation
const headPivot = headGroup; // already positioned at end of neck

/* -----------------------------------------------------------
   Tail
----------------------------------------------------------- */
const tailGroup = new THREE.Group();
tailGroup.position.set(0, BODY_Y + 0.18, -BODY_L * 0.95);
giraffe.add(tailGroup);

{
  const tailSegments = 14;
  const tailPath = [];
  for (let i = 0; i <= tailSegments; i++) {
    const t = i / tailSegments;
    tailPath.push(new THREE.Vector3(
      0,
      -t * 1.15 - 0.04 * t * t,
      -t * 0.55
    ));
  }
  const tailCurve = new THREE.CatmullRomCurve3(tailPath);
  const tubularSegments = 24;
  const radialSegments = 10;
  const frames = tailCurve.computeFrenetFrames(tubularSegments, false);
  const positions = [];
  const indices = [];
  const radiusAt = (t) => 0.065 * (1 - t * 0.65);
  for (let i = 0; i <= tubularSegments; i++) {
    const t = i / tubularSegments;
    const p = tailCurve.getPointAt(t);
    const N = frames.normals[i];
    const B = frames.binormals[i];
    const r = radiusAt(t);
    for (let j = 0; j <= radialSegments; j++) {
      const u = j / radialSegments;
      const a = u * Math.PI * 2;
      const cx = Math.cos(a), sy = Math.sin(a);
      positions.push(
        p.x + (cx*N.x + sy*B.x)*r,
        p.y + (cx*N.y + sy*B.y)*r,
        p.z + (cx*N.z + sy*B.z)*r
      );
    }
  }
  for (let i = 0; i < tubularSegments; i++) {
    for (let j = 0; j < radialSegments; j++) {
      const a = i * (radialSegments+1) + j;
      const b = (i+1)*(radialSegments+1) + j;
      const c = (i+1)*(radialSegments+1) + (j+1);
      const d = i*(radialSegments+1) + (j+1);
      indices.push(a, b, d, b, c, d);
    }
  }
  const tg = new THREE.BufferGeometry();
  tg.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  tg.setIndex(indices);
  tg.computeVertexNormals();
  const tailMesh = new THREE.Mesh(tg, matBody);
  tailMesh.castShadow = true;
  tailGroup.add(tailMesh);

  // tail tuft (long dark hair)
  const tuftMat = new THREE.MeshStandardMaterial({ color: 0x1a0e05, roughness: 0.95 });
  const tuft = new THREE.Mesh(
    new THREE.SphereGeometry(0.13, 14, 10),
    tuftMat
  );
  tuft.scale.set(0.9, 1.6, 0.9);
  tuft.position.set(0, -1.18, -0.58);
  tuft.castShadow = true;
  tailGroup.add(tuft);

  // long tuft strands
  for (let i = 0; i < 14; i++) {
    const strand = new THREE.Mesh(
      new THREE.CylinderGeometry(0.006, 0.002, 0.35 + Math.random()*0.15, 4),
      tuftMat
    );
    const a = (i / 14) * Math.PI * 2;
    strand.position.set(Math.cos(a)*0.08, -1.22, -0.58 + Math.sin(a)*0.08);
    strand.rotation.z = Math.cos(a) * 0.25;
    strand.rotation.x = Math.sin(a) * 0.25;
    tailGroup.add(strand);
  }
}

/* -----------------------------------------------------------
   Legs
----------------------------------------------------------- */
const HIP_Y = BODY_Y - BODY_H * 0.78;   // attach height (just inside body bottom)
const LEG_LEN_UPPER = 1.10;  // thigh
const LEG_LEN_LOWER = 1.40;  // shin (giraffe lower leg is longer than upper)
const HOOF_BOTTOM_Y = 0.04;  // target y for hoof bottom
const KNEE_Y = HIP_Y - LEG_LEN_UPPER;

const legPositions = [
  // x, z, side (front/back), isFront
  { x:  0.32, z:  BODY_L * 0.82, name: 'FR', phase: 0 },            // front right
  { x: -0.32, z:  BODY_L * 0.82, name: 'FL', phase: Math.PI },      // front left
  { x:  0.32, z: -BODY_L * 0.82, name: 'BR', phase: Math.PI },      // back right
  { x: -0.32, z: -BODY_L * 0.82, name: 'BL', phase: 0 },            // back left
];

const legs = [];

function buildLeg(x, z, isFront) {
  const legGroup = new THREE.Group();
  legGroup.position.set(x, HIP_Y, z);
  giraffe.add(legGroup);

  // pivot for thigh swing (around hip)
  const hipPivot = new THREE.Group();
  legGroup.add(hipPivot);

  // UPPER leg (thigh) - slightly tapered, points down
  const upperGeo = new THREE.CylinderGeometry(0.125, 0.16, LEG_LEN_UPPER, 20);
  // shift so top is at y=0, bottom at y=-LEG_LEN_UPPER
  upperGeo.translate(0, -LEG_LEN_UPPER / 2, 0);
  const upper = new THREE.Mesh(upperGeo, matLeg);
  upper.castShadow = true;
  upper.receiveShadow = true;
  hipPivot.add(upper);

  // knee joint (subtle bulge, not a ball)
  const knee = new THREE.Mesh(
    new THREE.SphereGeometry(0.105, 16, 12),
    matLeg
  );
  knee.position.y = -LEG_LEN_UPPER + 0.01;
  knee.scale.set(1.0, 0.75, 1.0);
  knee.castShadow = true;
  hipPivot.add(knee);

  // Knee pivot for lower leg
  const kneePivot = new THREE.Group();
  kneePivot.position.y = -LEG_LEN_UPPER + 0.02;
  hipPivot.add(kneePivot);

  // LOWER leg (shin/cannon) - longer, thinner
  const lowerGeo = new THREE.CylinderGeometry(0.10, 0.125, LEG_LEN_LOWER, 18);
  lowerGeo.translate(0, -LEG_LEN_LOWER / 2, 0);
  const lower = new THREE.Mesh(lowerGeo, matLeg);
  lower.castShadow = true;
  lower.receiveShadow = true;
  kneePivot.add(lower);

  // ankle joint (subtle)
  const ankle = new THREE.Mesh(
    new THREE.SphereGeometry(0.085, 14, 10),
    matLeg
  );
  ankle.position.y = -LEG_LEN_LOWER + 0.01;
  ankle.scale.set(1.0, 0.7, 1.0);
  kneePivot.add(ankle);

  // hoof (cloven)
  const hoofGroup = new THREE.Group();
  hoofGroup.position.y = -LEG_LEN_LOWER;
  kneePivot.add(hoofGroup);

  const hoofMat = matHoof;
  // single cloven hoof (two halves)
  for (const sx of [-1, 1]) {
    const hoof = new THREE.Mesh(
      new THREE.BoxGeometry(0.11, 0.10, 0.20),
      hoofMat
    );
    hoof.position.set(sx * 0.04, -0.05, 0.015);
    hoof.castShadow = true;
    hoofGroup.add(hoof);

    // rounded front
    const front = new THREE.Mesh(
      new THREE.CylinderGeometry(0.055, 0.055, 0.20, 12),
      hoofMat
    );
    front.rotation.x = Math.PI / 2;
    front.position.set(sx * 0.04, -0.05, 0.115);
    hoofGroup.add(front);
  }

  // dewclaw hint (back of leg, small)
  // (skipped for cleanliness)

  return {
    group: legGroup,
    hip: hipPivot,
    knee: kneePivot,
    phase: 0,
    isFront,
  };
}

for (const lp of legPositions) {
  const leg = buildLeg(lp.x, lp.z, lp.z > 0);
  leg.phase = lp.phase;
  leg.name = lp.name;
  legs.push(leg);
}

/* -----------------------------------------------------------
   Walk cycle
----------------------------------------------------------- */
const clock = new THREE.Clock();
const WALK_SPEED = 1.4;       // radians/sec for leg cycle
const STRIDE = 0.32;           // thigh swing amplitude (rad)
const KNEE_BEND = 0.85;        // max knee bend (rad)
const BODY_BOB = 0.045;        // vertical bob amplitude
const BODY_ROLL = 0.025;       // side-to-side roll
const BODY_YAW = 0.02;         // slight yaw
const NECK_SWING = 0.04;       // neck sway
const NECK_PITCH = 0.025;      // neck bob
const HEAD_PITCH = 0.06;
const HEAD_YAW = 0.05;
const EAR_FLICK = 0.25;
const TAIL_SWING = 0.18;

const walkDir = new THREE.Vector3(1, 0, 0);  // giraffe walks along +X
let walkPhase = 0;
let giraffeX = 0;

function updateLeg(leg, t, isFront) {
  // t in [0, 2π)
  const swing = Math.sin(t);
  // thigh: forward when sin>0 (front), back when sin<0
  // back legs have slightly different timing
  const phaseShift = isFront ? 0 : 0.08;
  const s = Math.sin(t + phaseShift);

  // hip swing (rotate around X for forward/back motion)
  leg.hip.rotation.x = -STRIDE * s;

  // knee bend: only when leg is being lifted forward (swing phase)
  // sin > 0 means leg is moving forward -> lift -> knee bends back
  // We want knee to bend so foot lifts off ground
  // bend = positive rotation around X (so lower leg kicks back relative to upper)
  const lift = Math.max(0, s);
  leg.knee.rotation.x = KNEE_BEND * lift;

  // back legs have slightly more bend
  if (!isFront) leg.knee.rotation.x *= 1.05;

  // very slight outward angle (X-axis spread) for natural look
  // already baked into x position
}

function animate() {
  const dt = Math.min(clock.getDelta(), 1/30);
  walkPhase += dt * WALK_SPEED;
  const t = walkPhase;

  // legs
  for (const leg of legs) {
    updateLeg(leg, t + leg.phase, leg.isFront);
  }

  // body bob: two beats per leg cycle (since diagonals pair)
  giraffe.position.y = BODY_BOB * (0.5 + 0.5 * Math.cos(2 * t));
  // body roll (side to side) - in phase with one diagonal
  giraffe.rotation.z = BODY_ROLL * Math.sin(t);
  // body yaw - subtle
  giraffe.rotation.y = BODY_YAW * Math.sin(t * 0.5);

  // gentle forward motion (giraffe walks in place; we move camera-tracked ground)
  // To keep giraffe centered, we move the ground texture instead of the giraffe.
  // (simpler: keep giraffe at origin and slowly drift world.)
  giraffeX += dt * 0.4;

  // neck sway (counter to legs)
  neckGroup.rotation.x = neckAngle + NECK_PITCH * Math.sin(t * 2 + Math.PI/2);
  neckGroup.rotation.z = NECK_SWING * Math.sin(t + Math.PI/2);

  // head bob & sway
  headGroup.rotation.x = HEAD_PITCH * Math.sin(t * 2);
  headGroup.rotation.y = HEAD_YAW * Math.sin(t * 0.5 + 0.3);
  headGroup.rotation.z = NECK_SWING * 0.5 * Math.sin(t + Math.PI/2 + 0.2);

  // ear flicks (occasional)
  const flick = Math.sin(t * 0.7) > 0.95 ? Math.sin(t * 30) * 0.15 : 0;
  // (ears are children of headGroup, no separate ref needed for visual subtlety)

  // tail swing
  tailGroup.rotation.x = TAIL_SWING * Math.sin(t * 0.8);
  tailGroup.rotation.z = TAIL_SWING * 0.3 * Math.sin(t * 0.8 + 1);

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}

// gentle ground drift to simulate walking
let groundTexOffset = 0;
const groundTex = ground.material.map;
function driftGround() {
  // done in animate via tex offset
}

/* -----------------------------------------------------------
   Resize
----------------------------------------------------------- */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// kick off
requestAnimationFrame(() => {
  document.getElementById('loading').classList.add('hidden');
  setTimeout(() => document.getElementById('loading').remove(), 700);
  animate();
});

// expose for debugging
window.__giraffe = { giraffe, legs, scene, camera };
</script>
