<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />

<title>Walking Giraffe — Three.js</title>
<style>
  html, body {
    margin: 0;
    padding: 0;

  #ui h1 {

<body>
<div id="loading">Loading…</div>
<div id="ui">
  <h1>Walking Giraffe</h1>
  <p>Drag to orbit · Scroll to zoom · Right-drag to pan</p>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ==========================================================================
// Renderer, scene, camera
// ==========================================================================
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9cc4e3);
scene.fog = new THREE.Fog(0xbcd4e6, 35, 110);

const camera = new THREE.PerspectiveCamera(
  45, window.innerWidth / window.innerHeight, 0.1, 300
);
camera.position.set(9, 5.5, 10);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 3.2, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 5;
controls.maxDistance = 40;
controls.maxPolarAngle = Math.PI * 0.49;
controls.update();

// ==========================================================================
// Lighting
// ==========================================================================
const hemi = new THREE.HemisphereLight(0xfff1d0, 0x5a4a30, 0.55);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xfff0c8, 2.6);
sun.position.set(14, 22, 10);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -18;
sun.shadow.camera.right = 18;
sun.shadow.camera.top = 18;
sun.shadow.camera.bottom = -18;
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 60;
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.02;
scene.add(sun);

// Subtle fill light from opposite side
const fill = new THREE.DirectionalLight(0x9ab4d0, 0.4);
fill.position.set(-10, 8, -6);
scene.add(fill);

// ==========================================================================
// Procedural textures
// ==========================================================================
function makeSpotsTexture() {
  const c = document.createElement('canvas');
  c.width = 512; c.height = 512;
  const ctx = c.getContext('2d');

  // Base coat: warm tan with vertical gradient (lighter belly)
  const grad = ctx.createLinearGradient(0, 0, 0, 512);
  grad.addColorStop(0.0, '#a87838');
  grad.addColorStop(0.5, '#d4a05a');
  grad.addColorStop(1.0, '#e8c285');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 512, 512);

  // Subtle noise
  const img = ctx.getImageData(0, 0, 512, 512);
  for (let i = 0; i < img.data.length; i += 4) {
    const n = (Math.random() - 0.5) * 18;
    img.data[i]     = Math.max(0, Math.min(255, img.data[i]     + n));
    img.data[i + 1] = Math.max(0, Math.min(255, img.data[i + 1] + n * 0.9));
    img.data[i + 2] = Math.max(0, Math.min(255, img.data[i + 2] + n * 0.7));
  }
  ctx.putImageData(img, 0, 0);

  // Spots: irregular polygons with soft edges
  for (let i = 0; i < 140; i++) {
    const x = Math.random() * 512;
    const y = Math.random() * 512;
    const r = 10 + Math.random() * 28;
    const sg = ctx.createRadialGradient(x, y, 0, x, y, r);
    sg.addColorStop(0.0, 'rgba(55, 28, 8, 0.92)');
    sg.addColorStop(0.55, 'rgba(70, 36, 12, 0.7)');
    sg.addColorStop(0.85, 'rgba(90, 50, 18, 0.25)');
    sg.addColorStop(1.0, 'rgba(90, 50, 18, 0)');
    ctx.fillStyle = sg;
    ctx.beginPath();
    // Irregular blob
    const points = 8 + Math.floor(Math.random() * 5);
    ctx.moveTo(x + r, y);
    for (let k = 1; k <= points; k++) {
      const a = (k / points) * Math.PI * 2;
      const rr = r * (0.75 + Math.random() * 0.5);
      ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
    }
    ctx.closePath();
    ctx.fill();
  }

  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.anisotropy = 8;
  return tex;
}

function makeGroundTexture() {
  const c = document.createElement('canvas');
  c.width = 512; c.height = 512;
  const ctx = c.getContext('2d');

  // Dry savanna ground
  const grad = ctx.createRadialGradient(256, 256, 50, 256, 256, 360);
  grad.addColorStop(0, '#a89060');
  grad.addColorStop(1, '#7a6840');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 512, 512);

  // Grass tufts and pebbles
  for (let i = 0; i < 600; i++) {
    const x = Math.random() * 512;
    const y = Math.random() * 512;
    const r = 1 + Math.random() * 4;
    const g = 80 + Math.random() * 60;
    const r2 = 120 + Math.random() * 60;
    ctx.fillStyle = `rgba(${r2}, ${g}, ${40 + Math.random() * 40}, ${0.3 + Math.random() * 0.5})`;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }

  // Sparse grass blades
  for (let i = 0; i < 80; i++) {
    const x = Math.random() * 512;
    const y = Math.random() * 512;
    ctx.strokeStyle = `rgba(${80 + Math.random() * 40}, ${100 + Math.random() * 60}, ${40 + Math.random() * 30}, 0.6)`;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + (Math.random() - 0.5) * 4, y - 4 - Math.random() * 6);
    ctx.stroke();
  }

  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(30, 30);
  tex.anisotropy = 8;
  return tex;
}

const spotsTex = makeSpotsTexture();
const groundTex = makeGroundTexture();

// ==========================================================================
// Materials
// ==========================================================================
const coatMat = new THREE.MeshStandardMaterial({
  map: spotsTex,
  color: 0xd0a060,
  roughness: 0.72,
  metalness: 0.0,
});
const darkMat = new THREE.MeshStandardMaterial({
  color: 0x3a2008,
  roughness: 0.6,
  metalness: 0.0,
});
const hoofMat = new THREE.MeshStandardMaterial({
  color: 0x1f1404,
  roughness: 0.45,
  metalness: 0.05,
});
const eyeWhiteMat = new THREE.MeshStandardMaterial({
  color: 0xf6e8c8,
  roughness: 0.25,
  metalness: 0.0,
});
const eyeMat = new THREE.MeshStandardMaterial({
  color: 0x140a04,
  roughness: 0.15,
  metalness: 0.1,
});
const noseMat = new THREE.MeshStandardMaterial({
  color: 0x2a1808,
  roughness: 0.4,
});
const innerEarMat = new THREE.MeshStandardMaterial({
  color: 0xc88a55,
  roughness: 0.7,
});

// ==========================================================================
// Ground
// ==========================================================================
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(400, 400, 1, 1),
  new THREE.MeshStandardMaterial({
    map: groundTex,
    roughness: 0.95,
    metalness: 0.0,
  })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// ==========================================================================
// Giraffe
// ==========================================================================
const giraffe = new THREE.Group();
scene.add(giraffe);

// Container for body parts that move with breathing/bobbing
const bodyGroup = new THREE.Group();
giraffe.add(bodyGroup);

// --- Body (chest + torso + hip) ----------------------------------------
const body = new THREE.Mesh(
  new THREE.SphereGeometry(1, 28, 20),
  coatMat
);
body.scale.set(1.55, 0.88, 0.92);
body.position.set(0, 3.0, 0);
body.castShadow = true;
body.receiveShadow = true;
bodyGroup.add(body);

const chest = new THREE.Mesh(
  new THREE.SphereGeometry(0.92, 24, 18),
  coatMat
);
chest.scale.set(1.05, 0.95, 0.92);
chest.position.set(1.05, 2.92, 0);
chest.castShadow = true;
bodyGroup.add(chest);

const hip = new THREE.Mesh(
  new THREE.SphereGeometry(1.0, 24, 18),
  coatMat
);
hip.scale.set(1.05, 0.95, 0.98);
hip.position.set(-1.25, 3.08, 0);
hip.castShadow = true;
bodyGroup.add(hip);

// Shoulder hump (giraffes have a pronounced shoulder)
const shoulder = new THREE.Mesh(
  new THREE.SphereGeometry(0.7, 20, 16),
  coatMat
);
shoulder.scale.set(1.0, 1.0, 0.95);
shoulder.position.set(1.45, 3.45, 0);
shoulder.castShadow = true;
bodyGroup.add(shoulder);

// Belly (slight bulge underneath)
const belly = new THREE.Mesh(
  new THREE.SphereGeometry(0.85, 22, 16),
  coatMat
);
belly.scale.set(1.4, 0.55, 0.85);
belly.position.set(0.0, 2.35, 0);
belly.castShadow = true;
bodyGroup.add(belly);

// --- Neck ----------------------------------------------------------------
const neckGroup = new THREE.Group();
neckGroup.position.set(1.5, 3.55, 0);
neckGroup.rotation.z = -Math.PI * 0.30;  // tilt forward
bodyGroup.add(neckGroup);

const neckLen = 2.1;
const neck = new THREE.Mesh(
  new THREE.CylinderGeometry(0.32, 0.55, neckLen, 18, 6),
  coatMat
);
neck.position.y = neckLen / 2;
neck.castShadow = true;
neckGroup.add(neck);

// Mane (short fur along top of neck)
const mane = new THREE.Mesh(
  new THREE.BoxGeometry(0.18, neckLen * 0.92, 0.32),
  darkMat
);
mane.position.set(0.05, neckLen / 2, 0);
mane.castShadow = true;
neckGroup.add(mane);

// Mane tufts (irregular bumps along the top)
for (let i = 0; i < 7; i++) {
  const t = 0.15 + i * 0.11;
  const tuft = new THREE.Mesh(
    new THREE.SphereGeometry(0.09, 8, 6),
    darkMat
  );
  tuft.position.set(0.12, neckLen * t, 0);
  tuft.scale.set(1.0, 0.7, 1.4);
  neckGroup.add(tuft);
}

// --- Head ----------------------------------------------------------------
const headGroup = new THREE.Group();
headGroup.position.y = neckLen;
neckGroup.add(headGroup);

// Skull (elongated)
const skull = new THREE.Mesh(
  new THREE.SphereGeometry(0.42, 22, 18),
  coatMat
);
skull.scale.set(1.4, 0.92, 0.95);
skull.castShadow = true;
headGroup.add(skull);

// Muzzle (forward elongated part)
const muzzle = new THREE.Mesh(
  new THREE.SphereGeometry(0.34, 20, 16),
  coatMat
);
muzzle.scale.set(1.35, 0.82, 0.82);
muzzle.position.set(0.5, -0.12, 0);
muzzle.castShadow = true;
headGroup.add(muzzle);

// Lower lip / chin
const chin = new THREE.Mesh(
  new THREE.SphereGeometry(0.18, 16, 12),
  coatMat
);
chin.scale.set(1.0, 0.7, 0.85);
chin.position.set(0.55, -0.32, 0);
headGroup.add(chin);

// Nose tip
const noseTip = new THREE.Mesh(
  new THREE.SphereGeometry(0.1, 14, 10),
  noseMat
);
noseTip.scale.set(1.3, 0.9, 0.9);
noseTip.position.set(0.78, -0.04, 0);
headGroup.add(noseTip);

// Nostrils
[-1, 1].forEach(s => {
  const nostril = new THREE.Mesh(
    new THREE.SphereGeometry(0.035, 10, 8),
    noseMat
  );
  nostril.position.set(0.78, -0.08, s * 0.08);
  headGroup.add(nostril);
});

// Mouth line (thin dark strip)
const mouth = new THREE.Mesh(
  new THREE.BoxGeometry(0.18, 0.015, 0.16),
  noseMat
);
mouth.position.set(0.68, -0.22, 0);
headGroup.add(mouth);

// Eyes
[-1, 1].forEach(s => {
  const eyeSocket = new THREE.Mesh(
    new THREE.SphereGeometry(0.13, 16, 12),
    coatMat
  );
  eyeSocket.scale.set(0.9, 1.0, 1.0);
  eyeSocket.position.set(0.32, 0.18, s * 0.30);
  headGroup.add(eyeSocket);

  const eyeWhite = new THREE.Mesh(
    new THREE.SphereGeometry(0.095, 14, 10),
    eyeWhiteMat
  );
  eyeWhite.scale.set(1.15, 1.0, 1.0);
  eyeWhite.position.set(0.40, 0.16, s * 0.30);
  headGroup.add(eyeWhite);

  const pupil = new THREE.Mesh(
    new THREE.SphereGeometry(0.055, 12, 10),
    eyeMat
  );
  pupil.scale.set(1.1, 1.0, 1.0);
  pupil.position.set(0.47, 0.16, s * 0.30);
  headGroup.add(pupil);

  // Eyelashes (small dark ridge above)
  const lash = new THREE.Mesh(
    new THREE.BoxGeometry(0.05, 0.02, 0.12),
    noseMat
  );
  lash.position.set(0.45, 0.24, s * 0.30);
  headGroup.add(lash);
});

// Ears
[-1, 1].forEach(s => {
  const ear = new THREE.Mesh(
    new THREE.SphereGeometry(0.16, 14, 10),
    coatMat
  );
  ear.scale.set(0.45, 1.05, 1.5);
  ear.position.set(-0.12, 0.32, s * 0.36);
  ear.rotation.z = -0.25;
  ear.castShadow = true;
  headGroup.add(ear);

  const earInner = new THREE.Mesh(
    new THREE.SphereGeometry(0.09, 12, 8),
    innerEarMat
  );
  earInner.scale.set(0.4, 0.85, 1.05);
  earInner.position.set(-0.06, 0.32, s * 0.41);
  headGroup.add(earInner);
});

// Ossicones (the horn-like protrusions)
[-1, 1].forEach(s => {
  const base = new THREE.Mesh(
    new THREE.CylinderGeometry(0.085, 0.11, 0.18, 12),
    coatMat
  );
  base.position.set(-0.02, 0.50, s * 0.20);
  base.castShadow = true;
  headGroup.add(base);

  const horn = new THREE.Mesh(
    new THREE.CylinderGeometry(0.04, 0.075, 0.32, 10),
    darkMat
  );
  horn.position.set(0.0, 0.74, s * 0.20);
  horn.castShadow = true;
  headGroup.add(horn);

  // Horn tip tuft
  const tip = new THREE.Mesh(
    new THREE.SphereGeometry(0.075, 12, 10),
    darkMat
  );
  tip.scale.set(1.0, 1.2, 1.0);
  tip.position.set(0.02, 0.92, s * 0.20);
  headGroup.add(tip);
});

// Forehead bump (giraffes have a prominent frontal bone)
const forehead = new THREE.Mesh(
  new THREE.SphereGeometry(0.22, 16, 12),
  coatMat
);
forehead.scale.set(0.9, 0.8, 1.0);
forehead.position.set(0.18, 0.38, 0);
headGroup.add(forehead);

// ========================================================================
// Legs
// ========================================================================
function makeLeg(x, z, isFront) {
  const legGroup = new THREE.Group();
  legGroup.position.set(x, 2.45, z);
  giraffe.add(legGroup);

  const upperLen = isFront ? 1.30 : 1.35;
  const lowerLen = isFront ? 1.25 : 1.30;

  // Upper leg
  const upper = new THREE.Mesh(
    new THREE.CylinderGeometry(0.19, 0.16, upperLen, 14, 4),
    coatMat
  );
  upper.position.y = -upperLen / 2;
  upper.castShadow = true;
  legGroup.add(upper);

  // Knee joint
  const knee = new THREE.Mesh(
    new THREE.SphereGeometry(0.20, 14, 10),
    coatMat
  );
  knee.position.y = -upperLen;
  knee.castShadow = true;
  legGroup.add(knee);

  // Knee spot (darker patch)
  const kneeSpot = new THREE.Mesh(
    new THREE.SphereGeometry(0.11, 10, 8),
    darkMat
  );
  kneeSpot.scale.set(1.2, 0.8, 1.0);
  kneeSpot.position.set(0.0, -upperLen + 0.05, 0.16);
  legGroup.add(kneeSpot);

  // Lower leg (rotates around knee)
  const lowerGroup = new THREE.Group();
  lowerGroup.position.y = -upperLen;
  legGroup.add(lowerGroup);

  const lower = new THREE.Mesh(
    new THREE.CylinderGeometry(0.135, 0.115, lowerLen, 14, 4),
    coatMat
  );
  lower.position.y = -lowerLen / 2;
  lower.castShadow = true;
  lowerGroup.add(lower);

  // Pastern / ankle (small bulge)
  const pastern = new THREE.Mesh(
    new THREE.SphereGeometry(0.13, 12, 10),
    coatMat
  );
  pastern.position.y = -lowerLen + 0.05;
  lowerGroup.add(pastern);

  // Hoof (cloven)
  const hoof = new THREE.Mesh(
    new THREE.CylinderGeometry(0.155, 0.14, 0.20, 14),
    hoofMat
  );
  hoof.position.y = -lowerLen - 0.06;
  hoof.castShadow = true;
  lowerGroup.add(hoof);

  // Hoof split line (subtle)
  const split = new THREE.Mesh(
    new THREE.BoxGeometry(0.005, 0.18, 0.15),
    new THREE.MeshStandardMaterial({ color: 0x0a0500, roughness: 0.9 })
  );
  split.position.y = -lowerLen - 0.06;
  lowerGroup.add(split);

  return { group: legGroup, lowerGroup };
}

const legFL = makeLeg( 0.95,  0.38, true);
const legFR = makeLeg( 0.95, -0.38, true);
const legBL = makeLeg(-1.10,  0.40, false);
const legBR = makeLeg(-1.10, -0.40, false);

// ========================================================================
// Tail
// ========================================================================
const tailGroup = new THREE.Group();
tailGroup.position.set(-1.75, 2.95, 0);
tailGroup.rotation.z = 0.18;  // slight outward droop
bodyGroup.add(tailGroup);

const tailLen = 1.25;
const tail = new THREE.Mesh(
  new THREE.CylinderGeometry(0.055, 0.085, tailLen, 10, 4),
  coatMat
);
tail.position.y = -tailLen / 2;
tail.castShadow = true;
tailGroup.add(tail);

// Tail tuft (black hair at the end)
const tailTuft = new THREE.Mesh(
  new THREE.SphereGeometry(0.16, 14, 10),
  darkMat
);
tailTuft.scale.set(1.0, 1.5, 1.0);
tailTuft.position.y = -tailLen - 0.08;
tailTuft.castShadow = true;
tailGroup.add(tailTuft);

// Stray hair strands
for (let i = 0; i < 6; i++) {
  const strand = new THREE.Mesh(
    new THREE.CylinderGeometry(0.008, 0.005, 0.35, 6),
    darkMat
  );
  const a = (i / 6) * Math.PI * 2;
  strand.position.set(
    Math.cos(a) * 0.08,
    -tailLen - 0.15,
    Math.sin(a) * 0.08
  );
  strand.rotation.z = Math.cos(a) * 0.3;
  strand.rotation.x = Math.sin(a) * 0.3;
  tailGroup.add(strand);
}

// ========================================================================
// Scenery — acacia trees in the distance
// ========================================================================
function makeAcacia(x, z, scale = 1) {
  const tree = new THREE.Group();
  tree.position.set(x, 0, z);
  tree.scale.setScalar(scale);

  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(0.28, 0.55, 4.2, 10),
    new THREE.MeshStandardMaterial({ color: 0x6b4423, roughness: 0.95 })
  );
  trunk.position.y = 2.1;
  trunk.castShadow = true;
  tree.add(trunk);

  // A few branches
  for (let i = 0; i < 4; i++) {
    const branch = new THREE.Mesh(
      new THREE.CylinderGeometry(0.06, 0.12, 1.2, 6),
      new THREE.MeshStandardMaterial({ color: 0x6b4423, roughness: 0.95 })
    );
    const a = (i / 4) * Math.PI * 2 + Math.random() * 0.3;
    branch.position.set(
      Math.cos(a) * 0.5,
      3.5 + Math.random() * 0.3,
      Math.sin(a) * 0.5
    );
    branch.rotation.z = Math.cos(a) * 0.8;
    branch.rotation.x = -Math.sin(a) * 0.8;
    tree.add(branch);
  }

  // Flat-top canopy (characteristic of acacia)
  const canopy = new THREE.Mesh(
    new THREE.SphereGeometry(2.8, 18, 12),
    new THREE.MeshStandardMaterial({ color: 0x6b8e3d, roughness: 0.85 })
  );
  canopy.position.y = 4.6;
  canopy.scale.set(1.0, 0.22, 1.0);
  canopy.castShadow = true;
  tree.add(canopy);

  // Secondary canopy layer
  const canopy2 = new THREE.Mesh(
    new THREE.SphereGeometry(2.2, 16, 10),
    new THREE.MeshStandardMaterial({ color: 0x7ba046, roughness: 0.85 })
  );
  canopy2.position.y = 4.9;
  canopy2.scale.set(1.0, 0.18, 1.0);
  canopy2.castShadow = true;
  tree.add(canopy2);

  scene.add(tree);
}

makeAcacia(-22, -14, 1.0);
makeAcacia(28, -16, 1.2);
makeAcacia(-18, 18, 0.9);
makeAcacia(32, 14, 1.1);
makeAcacia(-30, 2, 0.85);
makeAcacia(15, -28, 1.05);
makeAcacia(-8, 26, 0.95);
makeAcacia(38, -2, 1.0);

// Distant bush
function makeBush(x, z, s = 1) {
  const bush = new THREE.Mesh(
    new THREE.SphereGeometry(0.8 * s, 12, 10),
    new THREE.MeshStandardMaterial({ color: 0x7a8a3a, roughness: 0.9 })
  );
  bush.position.set(x, 0.5 * s, z);
  bush.scale.set(1.0, 0.7, 1.0);
  bush.castShadow = true;
  scene.add(bush);
}
makeBush(-6, -7, 1.0);
makeBush(8, -5, 0.8);
makeBush(-10, 6, 0.9);
makeBush(12, 8, 0.7);
makeBush(3, -10, 1.1);

// ========================================================================
// Walking animation
// ========================================================================
const clock = new THREE.Clock();
const walkSpeed = 3.2;       // rad/s for leg cycle
const strideAmp = 0.42;      // hip swing amplitude (rad)
const kneeAmp = 0.85;        // knee bend amplitude (rad)
const legs = [legFL, legFR, legBL, legBR];
// Diagonal pairs: FL+BR (phase 0), FR+BL (phase π)
const legPhase = [0, Math.PI, Math.PI, 0];

function animateLeg(leg, phase, t) {
  const s = Math.sin(t + phase);
  // Hip swing: forward (+) during swing, back (-) during stance
  leg.group.rotation.z = s * strideAmp;

  // Knee bends only during forward swing (foot lifted)
  // Bend is max at peak forward, zero at full back
  const bend = Math.max(0, s);
  leg.lowerGroup.rotation.z = bend * kneeAmp;
}

function animate() {
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.getElapsedTime() * walkSpeed;

  // Legs
  for (let i = 0; i < 4; i++) {
    animateLeg(legs[i], legPhase[i], t);
  }

  // Subtle body bob (twice per cycle, on each footfall)
  bodyGroup.position.y = Math.abs(Math.sin(t * 2)) * 0.045;

  // Body lateral sway (once per cycle for natural weight shift)
  bodyGroup.rotation.z = Math.sin(t) * 0.018;
  bodyGroup.rotation.x = Math.sin(t) * 0.012;

  // Neck sway (counter-phase to body, smaller)
  neckGroup.rotation.x = Math.sin(t * 2 + Math.PI) * 0.025;
  neckGroup.rotation.z = -Math.PI * 0.30 + Math.sin(t) * 0.022;

  // Head bob with stride
  headGroup.rotation.x = Math.sin(t * 2) * 0.04;
  headGroup.rotation.z = Math.sin(t + Math.PI / 2) * 0.03;

  // Tail sway
  tailGroup.rotation.x = Math.sin(t * 0.5 + Math.PI / 2) * 0.18;
  tailGroup.rotation.z = 0.18 + Math.sin(t) * 0.12;

  // Ear flick
  // (omitted — would need ear refs)

  // Ground scroll (illusion of forward motion)
  groundTex.offset.x -= dt * 0.6;

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}

// ========================================================================
// Resize handling
// ========================================================================
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ========================================================================
// Boot
// ========================================================================
// Hide loading overlay once first frame renders
requestAnimationFrame(() => {
  animate();
  setTimeout(() => {
    document.getElementById('loading').classList.add('hidden');
  }, 50);
});
</script>
