<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Walking Giraffe — Three.js</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    width: 100%;
    height: 100%;
    background: #cfe8f5;
    font-family: Arial, Helvetica, sans-serif;
  }
  #info {
    position: absolute;
    top: 10px;
    left: 12px;
    color: #203040;
    font-size: 13px;
    background: rgba(255,255,255,0.55);
    padding: 8px 12px;
    border-radius: 8px;
    line-height: 1.4;
    pointer-events: none;
    z-index: 10;
  }
  canvas { display: block; }
</style>
</head>
<body>
<div id="info">
  <b>Walking Giraffe</b><br>
  Drag to orbit &middot; Scroll to zoom &middot; Right-drag to pan
</div>

<script src="js/three.min.js"></script>
<script src="js/OrbitControls.js"></script>
<script src="js/giraffe.js"></script>
<script src="js/main.js"></script>
</body>
</html>
