<div id="info">🦒 Walking Giraffe · Three.js<br>Drag to orbit · Scroll to zoom</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ================================================================
   GLOBALS
   ================================================================ */
let scene, camera, renderer, controls, clock;
let giraffeGroup;

const WALK_SPEED  = 1.6;
const STRIDE_FREQ = 0.9;   // gait cycles per second
const TURN_RATE   = 0.06;  // rad/s for gentle circle

/* ================================================================
   INIT
   ================================================================ */
function init() {
  clock = new THREE.Clock();

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  document.body.appendChild(renderer.domElement);

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x7EC8E3);
  scene.fog = new THREE.FogExp2(0xC8DAEB, 0.006);

  camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 600);
  camera.position.set(14, 7, 20);

  controls = new OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 5, 0);
  controls.enableDamping = true;
  controls.dampingFactor = 0.07;
  controls.minDistance = 4;
  controls.maxDistance = 60;
  controls.maxPolarAngle = Math.PI / 2 - 0.02;
  controls.update();

  buildLights();
  buildSky();
  buildGround();
  buildVegetation();
  giraffeGroup = buildGiraffe();
  scene.add(giraffeGroup);

  initDust();

  window.addEventListener('resize', onResize);
  loop();
}

/* ================================================================
   LIGHTS
   ================================================================ */
function buildLights() {
  scene.add(new THREE.AmbientLight(0xfff0dd, 0.35));
  scene.add(new THREE.HemisphereLight(0x87CEEB, 0x8B7355, 0.55));

  const sun = new THREE.DirectionalLight(0xfffae5, 2.0);
  sun.position.set(25, 35, 20);
  sun.castShadow = true;
  const s = sun.shadow;
  s.mapSize.set(2048, 2048);
  s.camera.near = 1; s.camera.far = 100;
  s.camera.left = -30; s.camera.right = 30;
  s.camera.top = 30; s.camera.bottom = -30;
  s.bias = -0.0005;
  s.normalBias = 0.02;
  scene.add(sun);

  // Subtle fill from opposite side
  const fill = new THREE.DirectionalLight(0xaaddff, 0.3);
  fill.position.set(-15, 10, -10);
  scene.add(fill);
}

/* ================================================================
   SKY
   ================================================================ */
function buildSky() {
  const geo = new THREE.SphereGeometry(250, 32, 16);
  const mat = new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false,
    uniforms: {
      uTop:    { value: new THREE.Color(0x1a6baa) },
      uMid:    { value: new THREE.Color(0x87CEEB) },
      uBot:    { value: new THREE.Color(0xfde8c9) },
    },
    vertexShader: `
      varying vec3 vWP;
      void main(){
        vWP = (modelMatrix * vec4(position,1.)).xyz;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.);
      }`,
    fragmentShader: `
      uniform vec3 uTop, uMid, uBot;
      varying vec3 vWP;
      void main(){
        float h = normalize(vWP).y;
        vec3 col = h > 0.0 ? mix(uMid, uTop, pow(h, 0.7)) : mix(uMid, uBot, pow(-h, 0.4));
        gl_FragColor = vec4(col, 1.);
      }`
  });
  scene.add(new THREE.Mesh(geo, mat));

  // Simple sun glow
  const sunGeo = new THREE.CircleGeometry(6, 32);
  const sunMat = new THREE.MeshBasicMaterial({ color: 0xFFF8E0, transparent: true, opacity: 0.7 });
  const sunMesh = new THREE.Mesh(sunGeo, sunMat);
  sunMesh.position.set(60, 80, -40);
  sunMesh.lookAt(0, 0, 0);
  scene.add(sunMesh);
}

/* ================================================================
   GROUND
   ================================================================ */
function buildGround() {
  const sz = 1024;
  const c = document.createElement('canvas');
  c.width = c.height = sz;
  const ctx = c.getContext('2d');

  // Base
  ctx.fillStyle = '#9B8B4C';
  ctx.fillRect(0, 0, sz, sz);

  // Layered noise-like patches
  const cols = ['#8B7B3C','#A89B5C','#7B6B2C','#B8A868','#6B5B1C','#C8B878'];
  for (let pass = 0; pass < 3; pass++) {
    for (let i = 0; i < 4000; i++) {
      ctx.fillStyle = cols[Math.random() * cols.length | 0];
      const x = Math.random() * sz, y = Math.random() * sz;
      const w = 2 + Math.random() * 6, h = 1 + Math.random() * 3;
      ctx.globalAlpha = 0.3 + Math.random() * 0.4;
      ctx.fillRect(x, y, w, h);
    }
  }
  ctx.globalAlpha = 1;

  // Grass blades
  for (let i = 0; i < 8000; i++) {
    ctx.strokeStyle = Math.random() > 0.5 ? '#7B7B2C' : '#A09040';
    ctx.lineWidth = 0.5 + Math.random();
    ctx.globalAlpha = 0.4 + Math.random() * 0.4;
    const x = Math.random() * sz, y = Math.random() * sz;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + (Math.random() - 0.5) * 4, y - 2 - Math.random() * 5);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;

  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(16, 16);
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();

  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(400, 400),
    new THREE.MeshStandardMaterial({ map: tex, roughness: 0.92, metalness: 0 })
  );
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);
}

/* ================================================================
   VEGETATION – Acacia trees + grass clumps
   ================================================================ */
function buildVegetation() {
  const trunkMat = new THREE.MeshStandardMaterial({ color: 0x5C3D1E, roughness: 0.92 });
  const leafMat  = new THREE.MeshStandardMaterial({ color: 0x3D6B1A, roughness: 0.85 });
  const darkLeaf = new THREE.MeshStandardMaterial({ color: 0x2E5210, roughness: 0.85 });

  function acacia(x, z, s) {
    const g = new THREE.Group();
    // Trunk – slightly bent
    const trunkGeo = new THREE.CylinderGeometry(0.12 * s, 0.22 * s, 3.5 * s, 8, 3);
    // Bend trunk slightly
    const pos = trunkGeo.attributes.position;
    for (let i = 0; i < pos.count; i++) {
      const y = pos.getY(i);
      pos.setX(i, pos.getX(i) + Math.sin(y * 0.3) * 0.15 * s);
    }
    pos.needsUpdate = true;
    trunkGeo.computeVertexNormals();
    const trunk = new THREE.Mesh(trunkGeo, trunkMat);
    trunk.position.y = 1.75 * s;
    trunk.castShadow = true;
    g.add(trunk);

    // Canopy – flattened hemisphere (acacia shape)
    const canGeo = new THREE.SphereGeometry(2.2 * s, 14, 8, 0, Math.PI * 2, 0, Math.PI * 0.45);
    const canopy = new THREE.Mesh(canGeo, Math.random() > 0.5 ? leafMat : darkLeaf);
    canopy.position.y = 3.8 * s;
    canopy.scale.y = 0.45;
    canopy.castShadow = true;
    canopy.receiveShadow = true;
    g.add(canopy);

    // Bottom canopy cover
    const discGeo = new THREE.CircleGeometry(2.15 * s, 14);
    const disc = new THREE.Mesh(discGeo, leafMat);
    disc.rotation.x = -Math.PI / 2;
    disc.position.y = 3.75 * s;
    g.add(disc);

    g.position.set(x, 0, z);
    scene.add(g);
  }

  acacia(-18, -12, 1.3);
  acacia(22, -20, 1.1);
  acacia(-28, 6, 1.6);
  acacia(32, 15, 1.0);
  acacia(12, -35, 1.2);
  acacia(-10, 28, 1.4);
  acacia(40, -8, 0.9);
  acacia(-35, -25, 1.1);

  // Grass clumps (billboard approach)
  const grassMat = new THREE.MeshStandardMaterial({
    color: 0x8B9B40, roughness: 0.9, side: THREE.DoubleSide,
    alphaTest: 0.3,
  });
  for (let i = 0; i < 100; i++) {
    const x = (Math.random() - 0.5) * 80;
    const z = (Math.random() - 0.5) * 80;
    const s = 0.3 + Math.random() * 0.5;
    const clump = new THREE.Mesh(
      new THREE.PlaneGeometry(s, s * 1.5),
      grassMat
    );
    clump.position.set(x, s * 0.75, z);
    clump.rotation.y = Math.random() * Math.PI;
    scene.add(clump);
  }
}

/* ================================================================
   GIRAFFE TEXTURE GENERATION
   ================================================================ */
function giraffeSpotTexture(w, h, spotSize, spotCount, lowerFade) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');

  // Base
  ctx.fillStyle = '#DAB055';
  ctx.fillRect(0, 0, w, h);

  // Subtle warm variation
  for (let i = 0; i < 600; i++) {
    ctx.fillStyle = `rgba(${190 + Math.random()*30|0},${155 + Math.random()*30|0},${60 + Math.random()*30|0},0.15)`;
    ctx.fillRect(Math.random()*w, Math.random()*h, 3+Math.random()*8, 3+Math.random()*8);
  }

  // Reticulated spots
  for (let i = 0; i < spotCount; i++) {
    const sx = Math.random() * w;
    const sy = Math.random() * h;

    // Fade spots toward bottom if requested
    let alpha = 1;
    if (lowerFade) {
      alpha = 1 - (sy / h) * 0.8;
    }
    if (alpha < 0.1) continue;

    const shade = Math.random();
    const r = shade > 0.6 ? 100 : shade > 0.3 ? 85 : 115;
    const g = shade > 0.6 ? 55 : shade > 0.3 ? 45 : 65;
    const b = shade > 0.6 ? 25 : shade > 0.3 ? 18 : 32;

    ctx.fillStyle = `rgba(${r},${g},${b},${alpha.toFixed(2)})`;
    ctx.beginPath();

    // Irregular polygon
    const npts = 5 + (Math.random() * 4 | 0);
    const baseR = spotSize * (0.6 + Math.random() * 0.8);
    for (let p = 0; p < npts; p++) {
      const a = (p / npts) * Math.PI * 2 + Math.random() * 0.3;
      const rr = baseR * (0.65 + Math.random() * 0.7);
      const px = sx + Math.cos(a) * rr;
      const py = sy + Math.sin(a) * rr;
      p === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fill();

    // Cream border (reticulated network)
    ctx.strokeStyle = `rgba(218,176,85,${(alpha * 0.6).toFixed(2)})`;
    ctx.lineWidth = 1.5 + Math.random();
    ctx.stroke();
  }

  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.ClampToEdgeWrapping;
  return tex;
}

/* ================================================================
   SMOOTH LATHE / SPLINE SHAPES
   ================================================================ */
function latheMesh(points, segments, mat) {
  // points: array of [radius, height]
  const curve = [];
  for (const [r, y] of points) {
    curve.push(new THREE.Vector2(r, y));
  }
  const geo = new THREE.LatheGeometry(curve, segments);
  const m = new THREE.Mesh(geo, mat);
  m.castShadow = true;
  return m;
}

function tubeMesh(path, radius, radialSeg, mat) {
  const curve = new THREE.CatmullRomCurve3(path.map(p => new THREE.Vector3(...p)));
  const geo = new THREE.TubeGeometry(curve, 20, radius, radialSeg, false);
  const m = new THREE.Mesh(geo, mat);
  m.castShadow = true;
  return m;
}

/* ================================================================
   BUILD GIRAFFE
   ================================================================ */
function buildGiraffe() {
  const root = new THREE.Group();
  root.name = 'giraffe';

  // Materials
  const bodyTex = giraffeSpotTexture(512, 512, 22, 200, false);
  const bodyMat = new THREE.MeshStandardMaterial({ map: bodyTex, roughness: 0.72 });

  const neckTex = giraffeSpotTexture(256, 512, 14, 120, false);
  const neckMat = new THREE.MeshStandardMaterial({ map: neckTex, roughness: 0.72 });

  const legTex  = giraffeSpotTexture(128, 256, 10, 40, true);
  const legMat  = new THREE.MeshStandardMaterial({ map: legTex, roughness: 0.78 });

  const hoofMat = new THREE.MeshStandardMaterial({ color: 0x1A0E05, roughness: 0.85 });
  const eyeMat  = new THREE.MeshStandardMaterial({ color: 0x100800, roughness: 0.2, metalness: 0.1 });
  const noseMat = new THREE.MeshStandardMaterial({ color: 0x3A2515, roughness: 0.85 });
  const maneMat = new THREE.MeshStandardMaterial({ color: 0x5A3015, roughness: 0.9 });
  const hornMat = new THREE.MeshStandardMaterial({ color: 0x6B4420, roughness: 0.75 });
  const hornTip = new THREE.MeshStandardMaterial({ color: 0x1A0E05, roughness: 0.7 });
  const tailMat = new THREE.MeshStandardMaterial({ color: 0xC0982E, roughness: 0.8 });
  const tailTip = new THREE.MeshStandardMaterial({ color: 0x1A0E05, roughness: 0.85 });
  const earMat  = new THREE.MeshStandardMaterial({ color: 0xC49A40, roughness: 0.75 });
  const innerEarMat = new THREE.MeshStandardMaterial({ color: 0xE8C0A0, roughness: 0.8 });
  const tongueMat = new THREE.MeshStandardMaterial({ color: 0x2A1A3A, roughness: 0.6 }); // dark purple

  /* ── Body Pivot ─────────────────────────────────────────── */
  const bodyPivot = new THREE.Group();
  bodyPivot.name = 'bodyPivot';
  bodyPivot.position.y = 5.5;

  // Torso – lathe shape for smooth organic form
  const torso = latheMesh([
    [0, -1.8],
    [0.85, -1.7],
    [1.05, -1.2],
    [1.15, -0.5],
    [1.18, 0.0],
    [1.15, 0.5],
    [1.05, 1.0],
    [0.9, 1.5],
    [0.7, 1.7],
    [0, 1.8],
  ], 16, bodyMat);
  torso.rotation.z = Math.PI / 2;
  torso.scale.set(1, 1, 0.85); // slightly flatter sides
  bodyPivot.add(torso);

  // Shoulder hump
  const shoulderGeo = new THREE.SphereGeometry(0.6, 10, 8);
  const shoulder = new THREE.Mesh(shoulderGeo, bodyMat);
  shoulder.position.set(1.4, 0.5, 0);
  shoulder.scale.set(0.7, 0.8, 0.9);
  shoulder.castShadow = true;
  bodyPivot.add(shoulder);

  /* ── Neck ───────────────────────────────────────────────── */
  const neckPivot = new THREE.Group();
  neckPivot.name = 'neckPivot';
  neckPivot.position.set(1.5, 0.6, 0);

  // Neck as tube along curved path
  const neckTube = tubeMesh([
    [0, 0, 0],
    [0.15, 1.2, 0],
    [0.25, 2.4, 0],
    [0.3, 3.6, 0],
    [0.25, 4.8, 0],
  ], 0.42, 10, neckMat);
  neckPivot.add(neckTube);

  // Neck back ridge (thicker at base)
  const ridgeGeo = new THREE.CylinderGeometry(0.08, 0.2, 4.6, 6);
  const ridge = new THREE.Mesh(ridgeGeo, bodyMat);
  ridge.position.set(-0.3, 2.3, 0);
  ridge.castShadow = true;
  neckPivot.add(ridge);

  // Mane – row of hair tufts
  for (let i = 0; i < 16; i++) {
    const t = i / 15;
    const my = 0.3 + t * 4.3;
    const mx = -0.42 + Math.sin(t * Math.PI * 0.3) * 0.05;
    const maneGeo = new THREE.BoxGeometry(0.15, 0.2, 0.08);
    const mane = new THREE.Mesh(maneGeo, maneMat);
    mane.position.set(mx, my, 0);
    neckPivot.add(mane);
  }

  /* ── Head ───────────────────────────────────────────────── */
  const headPivot = new THREE.Group();
  headPivot.name = 'headPivot';
  headPivot.position.set(0.25, 4.8, 0);

  // Skull – elongated rounded box
  const skullGeo = new THREE.BoxGeometry(0.9, 0.5, 0.58);
  // Round edges with bevel segments
  const skull = new THREE.Mesh(
    new THREE.BoxGeometry(0.9, 0.5, 0.58, 3, 3, 3),
    neckMat
  );
  // Smooth the skull a bit
  spherifyBox(skull.geometry, 0.12);
  skull.castShadow = true;
  headPivot.add(skull);

  // Snout – tapered
  const snoutGeo = new THREE.BoxGeometry(0.6, 0.38, 0.48, 3, 3, 3);
  spherifyBox(snoutGeo, 0.1);
  const snout = new THREE.Mesh(snoutGeo, neckMat);
  snout.position.set(0.55, -0.04, 0);
  snout.castShadow = true;
  headPivot.add(snout);

  // Nose pad
  const nosePad = new THREE.Mesh(new THREE.SphereGeometry(0.16, 8, 6), noseMat);
  nosePad.position.set(0.88, -0.05, 0);
  nosePad.scale.set(0.8, 0.6, 1.1);
  headPivot.add(nosePad);

  // Nostrils
  [-1, 1].forEach(s => {
    const nostril = new THREE.Mesh(
      new THREE.SphereGeometry(0.04, 6, 4),
      new THREE.MeshStandardMaterial({ color: 0x0A0500, roughness: 0.9 })
    );
    nostril.position.set(0.92, -0.06, s * 0.1);
    headPivot.add(nostril);
  });

  // Mouth line
  const mouthGeo = new THREE.BoxGeometry(0.4, 0.015, 0.3);
  const mouth = new THREE.Mesh(mouthGeo, new THREE.MeshStandardMaterial({ color: 0x3A2A1A }));
  mouth.position.set(0.6, -0.18, 0);
  headPivot.add(mouth);

  // Lower jaw
  const jawGeo = new THREE.BoxGeometry(0.5, 0.18, 0.4, 2, 2, 2);
  spherifyBox(jawGeo, 0.06);
  const jaw = new THREE.Mesh(jawGeo, neckMat);
  jaw.position.set(0.45, -0.25, 0);
  jaw.castShadow = true;
  headPivot.add(jaw);

  // Eyes
  [-1, 1].forEach(s => {
    // Eye socket (slight indent)
    const socket = new THREE.Mesh(
      new THREE.SphereGeometry(0.11, 8, 6),
      new THREE.MeshStandardMaterial({ color: 0xC09030, roughness: 0.7 })
    );
    socket.position.set(0.18, 0.08, s * 0.3);
    headPivot.add(socket);

    // Eyeball
    const eye = new THREE.Mesh(new THREE.SphereGeometry(0.075, 10, 8), eyeMat);
    eye.position.set(0.22, 0.09, s * 0.31);
    headPivot.add(eye);

    // Specular highlight
    const hl = new THREE.Mesh(
      new THREE.SphereGeometry(0.025, 6, 4),
      new THREE.MeshBasicMaterial({ color: 0xffffff })
    );
    hl.position.set(0.25, 0.11, s * 0.325);
    headPivot.add(hl);

    // Eyelash/brow ridge
    const brow = new THREE.Mesh(
      new THREE.BoxGeometry(0.12, 0.03, 0.08),
      maneMat
    );
    brow.position.set(0.2, 0.16, s * 0.3);
    headPivot.add(brow);
  });

  // Ears
  [-1, 1].forEach(s => {
    const earGroup = new THREE.Group();
    // Outer ear
    const earOuter = new THREE.Mesh(
      new THREE.ConeGeometry(0.1, 0.28, 6),
      earMat
    );
    earGroup.add(earOuter);
    // Inner ear
    const earInner = new THREE.Mesh(
      new THREE.ConeGeometry(0.06, 0.2, 5),
      innerEarMat
    );
    earInner.position.set(0.01, 0, s * 0.01);
    earGroup.add(earInner);

    earGroup.position.set(-0.08, 0.32, s * 0.25);
    earGroup.rotation.z = s * 0.5;
    earGroup.rotation.x = s * -0.3;
    headPivot.add(earGroup);
  });

  // Ossicones (horns)
  [-1, 1].forEach(s => {
    const ossicone = new THREE.Group();
    // Shaft
    const shaft = new THREE.Mesh(
      new THREE.CylinderGeometry(0.035, 0.045, 0.5, 8),
      hornMat
    );
    shaft.position.y = 0.25;
    ossicone.add(shaft);
    // Knob
    const knob = new THREE.Mesh(new THREE.SphereGeometry(0.06, 8, 6), hornTip);
    knob.position.y = 0.52;
    ossicone.add(knob);

    ossicone.position.set(0.02, 0.25, s * 0.14);
    ossicone.rotation.z = s * 0.08;
    headPivot.add(ossicone);
  });

  // Center "horn" bump (some giraffes have this)
  const centerHorn = new THREE.Mesh(
    new THREE.ConeGeometry(0.05, 0.15, 6),
    hornMat
  );
  centerHorn.position.set(0.25, 0.3, 0);
  headPivot.add(centerHorn);

  neckPivot.add(headPivot);
  neckPivot.rotation.z = 0.2; // tilt forward
  bodyPivot.add(neckPivot);

  /* ── Legs ───────────────────────────────────────────────── */
  const legDefs = [
    { name: 'FL', x:  1.15, z:  0.55, front: true  },
    { name: 'FR', x:  1.15, z: -0.55, front: true  },
    { name: 'RL', x: -1.15, z:  0.55, front: false },
    { name: 'RR', x: -1.15, z: -0.55, front: false },
  ];

  const legs = {};
  const upperLen = 2.4;
  const lowerLen = 2.5;

  legDefs.forEach(def => {
    // ── Hip / shoulder pivot ──
    const hipPivot = new THREE.Group();
    hipPivot.name = `hip_${def.name}`;
    hipPivot.position.set(def.x, -0.55, def.z);

    // Muscle bulge at hip/shoulder
    const muscleBulge = new THREE.Mesh(
      new THREE.SphereGeometry(0.28, 8, 6),
      bodyMat
    );
    muscleBulge.scale.set(0.8, 1, 0.9);
    muscleBulge.position.y = 0.1;
    muscleBulge.castShadow = true;
    hipPivot.add(muscleBulge);

    // Upper leg (thigh)
    const upperGeo = new THREE.CylinderGeometry(0.15, 0.18, upperLen, 10);
    // Taper shape
    const upos = upperGeo.attributes.position;
    for (let i = 0; i < upos.count; i++) {
      const y = upos.getY(i);
      const t = (y + upperLen / 2) / upperLen; // 0 bottom, 1 top
      const scale = 0.85 + t * 0.3;
      upos.setX(i, upos.getX(i) * scale);
      upos.setZ(i, upos.getZ(i) * scale);
    }
    upos.needsUpdate = true;
    upperGeo.computeVertexNormals();
    const upperLeg = new THREE.Mesh(upperGeo, legMat);
    upperLeg.position.y = -upperLen / 2;
    upperLeg.castShadow = true;
    hipPivot.add(upperLeg);

    // ── Knee pivot ──
    const kneePivot = new THREE.Group();
    kneePivot.name = `knee_${def.name}`;
    kneePivot.position.y = -upperLen;

    // Knee bulge
    const kneeBulge = new THREE.Mesh(
      new THREE.SphereGeometry(0.16, 8, 6),
      legMat
    );
    kneeBulge.castShadow = true;
    kneePivot.add(kneeBulge);

    // Lower leg (shin)
    const lowerGeo = new THREE.CylinderGeometry(0.09, 0.13, lowerLen, 10);
    const lower = new THREE.Mesh(lowerGeo, legMat);
    lower.position.y = -lowerLen / 2;
    lower.castShadow = true;
    kneePivot.add(lower);

    // ── Hoof pivot ──
    const hoofPivot = new THREE.Group();
    hoofPivot.name = `hoof_${def.name}`;
    hoofPivot.position.y = -lowerLen;

    // Hoof
    const hoofGeo = new THREE.CylinderGeometry(0.1, 0.13, 0.22, 8);
    const hoof = new THREE.Mesh(hoofGeo, hoofMat);
    hoof.position.y = -0.11;
    hoof.castShadow = true;
    hoofPivot.add(hoof);

    // Hoof split line
    const splitGeo = new THREE.BoxGeometry(0.005, 0.22, 0.14);
    const split = new THREE.Mesh(splitGeo, new THREE.MeshStandardMaterial({ color: 0x0A0500 }));
    split.position.set(0.01, -0.11, 0);
    hoofPivot.add(split);

    kneePivot.add(hoofPivot);
    hipPivot.add(kneePivot);
    bodyPivot.add(hipPivot);

    legs[def.name] = { hipPivot, kneePivot, hoofPivot, front: def.front };
  });

  /* ── Tail ───────────────────────────────────────────────── */
  const tailPivot = new THREE.Group();
  tailPivot.name = 'tailPivot';
  tailPivot.position.set(-1.85, 0.2, 0);

  const tailCurve = tubeMesh([
    [0, 0, 0],
    [-0.05, -0.5, 0],
    [-0.1, -1.0, 0.02],
    [-0.08, -1.4, 0],
  ], 0.035, 6, tailMat);
  tailPivot.add(tailCurve);

  // Tail tuft
  const tuft = new THREE.Mesh(
    new THREE.SphereGeometry(0.08, 8, 6),
    tailTip
  );
  tuft.position.set(-0.08, -1.4, 0);
  tuft.scale.set(0.8, 2.2, 0.8);
  tailPivot.add(tuft);

  // Extra hair strands on tuft
  for (let i = 0; i < 5; i++) {
    const strand = new THREE.Mesh(
      new THREE.CylinderGeometry(0.008, 0.015, 0.2, 4),
      tailTip
    );
    strand.position.set(
      -0.08 + (Math.random() - 0.5) * 0.08,
      -1.55 - Math.random() * 0.1,
      (Math.random() - 0.5) * 0.08
    );
    strand.rotation.z = (Math.random() - 0.5) * 0.4;
    tailPivot.add(strand);
  }

  tailPivot.rotation.z = -0.3;
  bodyPivot.add(tailPivot);

  root.add(bodyPivot);

  // Store refs
  root.userData = { bodyPivot, neckPivot, headPivot, tailPivot, legs };
  return root;
}

/* Helper: round the corners of a box geometry (Minkowski sum approach) */
function spherifyBox(geo, r) {
  const pos = geo.attributes.position;
  const hw = geo.parameters.width  / 2;
  const hh = geo.parameters.height / 2;
  const hd = geo.parameters.depth  / 2;
  const v = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i);
    // Clamp to inner box, get offset direction
    const cx = Math.max(-hw + r, Math.min(hw - r, v.x));
    const cy = Math.max(-hh + r, Math.min(hh - r, v.y));
    const cz = Math.max(-hd + r, Math.min(hd - r, v.z));
    const dx = v.x - cx, dy = v.y - cy, dz = v.z - cz;
    const dl = Math.sqrt(dx*dx + dy*dy + dz*dz);
    if (dl > 0.0001) {
      v.x = cx + (dx / dl) * r;
      v.y = cy + (dy / dl) * r;
      v.z = cz + (dz / dl) * r;
    }
    pos.setXYZ(i, v.x, v.y, v.z);
  }
  pos.needsUpdate = true;
  geo.computeVertexNormals();
}

/* ================================================================
   WALK ANIMATION
   ================================================================ */
function animateWalk(dt, elapsed) {
  const d = giraffeGroup.userData;
  const t = elapsed * STRIDE_FREQ * Math.PI * 2;

  // ── Locomotion: walk in a gentle circle ──
  giraffeGroup.rotation.y += TURN_RATE * dt;
  const dir = giraffeGroup.rotation.y;
  giraffeGroup.position.x += Math.sin(dir) * WALK_SPEED * dt;
  giraffeGroup.position.z += Math.cos(dir) * WALK_SPEED * dt;

  // ── Body dynamics ──
  // Pacers sway laterally – signature giraffe movement
  const bodyBob = Math.sin(t * 2) * 0.04;
  const bodyPitch = Math.sin(t) * 0.01;  // fore-aft rock
  const bodySway = Math.sin(t) * 0.035;  // lateral sway (pacing)
  const bodyRoll = Math.sin(t) * 0.02;   // roll with sway
  d.bodyPivot.position.y = 5.5 + bodyBob;
  d.bodyPivot.position.x = bodySway * 0.08; // slight lateral shift
  d.bodyPivot.rotation.z = bodyPitch;
  d.bodyPivot.rotation.x = bodyRoll;

  // ── Neck dynamics ──
  // Giraffes counter-swing their necks when walking for balance
  d.neckPivot.rotation.z = 0.2 + Math.sin(t) * 0.035 + Math.sin(t * 0.5) * 0.015;
  d.neckPivot.rotation.x = Math.sin(t * 0.7) * 0.025; // lateral sway
  d.neckPivot.rotation.y = Math.sin(t) * 0.02; // slight twist

  // ── Head dynamics ──
  // Head bobs counter to neck motion for stabilization (like a pigeon!)
  d.headPivot.rotation.z = -Math.sin(t * 1.0) * 0.04 + Math.sin(t * 0.3) * 0.02;
  d.headPivot.rotation.y = Math.sin(t * 0.5) * 0.04;
  d.headPivot.rotation.x = Math.sin(t * 0.7) * 0.02;

  // ── Tail dynamics ──
  d.tailPivot.rotation.z = -0.3 + Math.sin(t * 1.4 + 1) * 0.3;
  d.tailPivot.rotation.x = Math.sin(t * 1.1) * 0.2;

  // ── Giraffe pacing gait (amble) ──
  // Giraffes are pacers: both legs on the SAME side move together!
  // This is what gives them their characteristic lateral sway.
  // Left pair (FL+RL) and Right pair (FR+RR) are in anti-phase.
  // Within a pair, front leads rear slightly.
  const gaitPhases = {
    FL: 0,             // left front
    RL: 0.25,          // left rear (slightly behind)
    FR: Math.PI,       // right front (opposite phase)
    RR: Math.PI + 0.25,// right rear (slightly behind right front)
  };

  const HIP_AMPLITUDE  = 0.38;
  const KNEE_MAX_FLEX  = 0.55;

  for (const [name, phase] of Object.entries(gaitPhases)) {
    const leg = d.legs[name];
    const a = t + phase;
    const sinA = Math.sin(a);
    const cosA = Math.cos(a);

    // ── Hip/shoulder rotation ──
    const hipAngle = sinA * HIP_AMPLITUDE;
    leg.hipPivot.rotation.z = hipAngle;

    // Slight lateral splay during swing
    leg.hipPivot.rotation.x = Math.abs(sinA) * 0.02;

    // ── Knee flexion ──
    // During swing phase (sin > 0): knee bends to lift foot
    // During stance phase (sin < 0): knee nearly straight
    let kneeFlex;
    if (sinA > 0) {
      // Swing phase – lift foot
      kneeFlex = KNEE_MAX_FLEX * sinA;
      // Extra quick lift at mid-swing
      kneeFlex += 0.12 * Math.max(0, Math.sin(a * 2));
    } else {
      // Stance phase – slight flex for natural look
      kneeFlex = 0.04 + 0.03 * Math.abs(sinA);
    }

    // Front legs: knees bend forward. Rear legs: knees bend backward.
    // In our rig, positive Z rotation = forward bend for all
    // But anatomically, front knees go backward (like ours), rear go forward
    // However, giraffes' "knees" on front are actually wrists, and they bend forward!
    // Rear hocks bend backward.
    if (leg.front) {
      leg.kneePivot.rotation.z = kneeFlex;
    } else {
      leg.kneePivot.rotation.z = -kneeFlex * 0.7;
    }

    // ── Hoof angle: compensate to keep flat-ish on ground ──
    // Counter-rotate hoof slightly
    if (leg.hoofPivot) {
      leg.hoofPivot.rotation.z = leg.front ? -kneeFlex * 0.3 : kneeFlex * 0.2;
    }
  }
}

/* ================================================================
   RENDER LOOP
   ================================================================ */
function loop() {
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), 0.05);
  const elapsed = clock.getElapsedTime();

  animateWalk(dt, elapsed);
  updateDust(dt, elapsed);

  // Camera gently follows
  const tgt = new THREE.Vector3(
    giraffeGroup.position.x,
    5.5,
    giraffeGroup.position.z
  );
  controls.target.lerp(tgt, 0.025);
  controls.update();

  renderer.render(scene, camera);
}

function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

/* ================================================================
   DUST PARTICLES (kicked up by hooves)
   ================================================================ */
let dustParticles;
function initDust() {
  const count = 60;
  const geo = new THREE.BufferGeometry();
  const positions = new Float32Array(count * 3);
  const velocities = new Float32Array(count * 3);
  const lifetimes  = new Float32Array(count);
  const sizes      = new Float32Array(count);

  for (let i = 0; i < count; i++) {
    positions[i*3] = positions[i*3+1] = positions[i*3+2] = 0;
    lifetimes[i] = -1; // inactive
    sizes[i] = 0.1 + Math.random() * 0.15;
  }

  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geo.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

  const dustMat = new THREE.PointsMaterial({
    color: 0xC8B888,
    size: 0.15,
    transparent: true,
    opacity: 0.4,
    depthWrite: false,
    sizeAttenuation: true,
  });

  dustParticles = new THREE.Points(geo, dustMat);
  dustParticles.userData = { velocities, lifetimes, nextSpawn: 0 };
  scene.add(dustParticles);
}

function updateDust(dt, elapsed) {
  if (!dustParticles) return;
  const pos = dustParticles.geometry.attributes.position;
  const { velocities, lifetimes } = dustParticles.userData;
  const count = lifetimes.length;

  // Spawn new particles near giraffe feet
  dustParticles.userData.nextSpawn -= dt;
  if (dustParticles.userData.nextSpawn <= 0) {
    dustParticles.userData.nextSpawn = 0.08;
    for (let i = 0; i < count; i++) {
      if (lifetimes[i] <= 0) {
        const gx = giraffeGroup.position.x + (Math.random() - 0.5) * 2;
        const gz = giraffeGroup.position.z + (Math.random() - 0.5) * 2;
        pos.setXYZ(i, gx, 0.05, gz);
        velocities[i*3]   = (Math.random() - 0.5) * 0.5;
        velocities[i*3+1] = 0.2 + Math.random() * 0.4;
        velocities[i*3+2] = (Math.random() - 0.5) * 0.5;
        lifetimes[i] = 0.8 + Math.random() * 0.6;
        break;
      }
    }
  }

  // Update
  for (let i = 0; i < count; i++) {
    if (lifetimes[i] > 0) {
      lifetimes[i] -= dt;
      const x = pos.getX(i) + velocities[i*3] * dt;
      const y = pos.getY(i) + velocities[i*3+1] * dt;
      const z = pos.getZ(i) + velocities[i*3+2] * dt;
      velocities[i*3+1] -= 0.3 * dt; // gravity
      pos.setXYZ(i, x, Math.max(0, y), z);
    } else {
      pos.setXYZ(i, 0, -10, 0); // hide
    }
  }
  pos.needsUpdate = true;
}

/* ════════════════════════════════════════════════════════════════ */
init();
</script>
