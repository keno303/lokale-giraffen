<html lang="en">
<head>

<div id="info">🦒 Giraffe · drag to orbit · scroll to zoom</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ═══════════════════════════════════════════════════════════════
//  SCENE, CAMERA, RENDERER
// ═══════════════════════════════════════════════════════════════

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x7ec8e3);
scene.fog = new THREE.Fog(0x7ec8e3, 40, 120);

const camera = new THREE.PerspectiveCamera(42, window.innerWidth/window.innerHeight, 0.5, 200);
camera.position.set(9, 6.5, 13);
camera.lookAt(0, 3.2, 0);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

// ═══════════════════════════════════════════════════════════════
//  LIGHTING
// ═══════════════════════════════════════════════════════════════

const ambient = new THREE.AmbientLight(0x8899bb, 0.6);
scene.add(ambient);

const hemi = new THREE.HemisphereLight(0x87ceeb, 0x8b7355, 0.4);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xfff8e7, 3.5);
sun.position.set(15, 22, 8);
sun.castShadow = true;
sun.shadow.mapSize.width = 2048;
sun.shadow.mapSize.height = 2048;
sun.shadow.camera.near = 0.5;
sun.shadow.camera.far = 80;
sun.shadow.camera.left = -18;
sun.shadow.camera.right = 18;
sun.shadow.camera.top = 18;
sun.shadow.camera.bottom = -18;
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.02;
scene.add(sun);

// ═══════════════════════════════════════════════════════════════
//  GROUND — procedural savanna texture
// ═══════════════════════════════════════════════════════════════

function createGroundTexture(size) {
  const c = document.createElement('canvas');
  c.width = size; c.height = size;
  const ctx = c.getContext('2d');

  // base sandy tan
  ctx.fillStyle = '#c8a96e';
  ctx.fillRect(0, 0, size, size);

  // large low-frequency patches
  for (let i = 0; i < 60; i++) {
    const x = Math.random()*size, y = Math.random()*size;
    const r = 20 + Math.random()*70;
    const shade = 180 + Math.floor(Math.random()*50);
    ctx.fillStyle = `rgb(${shade},${Math.floor(shade*0.68)},${Math.floor(shade*0.35)})`;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill();
  }

  // small pebbles / detail
  for (let i = 0; i < 300; i++) {
    const x = Math.random()*size, y = Math.random()*size;
    const r = 1 + Math.random()*3;
    const v = 130 + Math.floor(Math.random()*40);
    ctx.fillStyle = `rgb(${v},${Math.floor(v*0.7)},${Math.floor(v*0.35)})`;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill();
  }

  // faint grass-like strokes
  ctx.strokeStyle = 'rgba(120,150,60,0.15)';
  ctx.lineWidth = 0.8;
  for (let i = 0; i < 800; i++) {
    const x = Math.random()*size, y = Math.random()*size;
    ctx.beginPath(); ctx.moveTo(x, y);
    ctx.lineTo(x+Math.random()*6-3, y-Math.random()*5);
    ctx.stroke();
  }

  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(6, 6);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

const groundGeo = new THREE.PlaneGeometry(80, 80);
const groundMat = new THREE.MeshStandardMaterial({
  map: createGroundTexture(512),
  roughness: 0.92,
  metalness: 0.02,
});
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);

// subtle terrain undulation via a second mesh
const bumpGeo = new THREE.PlaneGeometry(80, 80, 40, 40);
const positions = bumpGeo.attributes.position.array;
for (let i = 0; i < positions.length; i+=3) {
  const x = positions[i], y = positions[i+1];
  positions[i+2] = (Math.sin(x*0.6)*Math.cos(y*0.7) + Math.sin(x*1.3+y*0.9)*0.5) * 0.25;
}
bumpGeo.computeVertexNormals();
const bumpMesh = new THREE.Mesh(bumpGeo, new THREE.MeshStandardMaterial({
  color: 0xc8a96e, roughness:0.95, metalness:0,
}));
bumpMesh.rotation.x = -Math.PI/2;
bumpMesh.position.y = 0.02;
bumpMesh.receiveShadow = true;
scene.add(bumpMesh);

// ═══════════════════════════════════════════════════════════════
//  ACACIA TREES
// ═══════════════════════════════════════════════════════════════

function createAcacia(x, z, h) {
  const g = new THREE.Group();
  const barkMat = new THREE.MeshStandardMaterial({ color:0x8b7355, roughness:0.85 });
  const leafMat = new THREE.MeshStandardMaterial({ color:0x5a8f4a, roughness:0.7 });

  // trunk — slightly bent
  const trunkGeo = new THREE.CylinderGeometry(0.12, 0.2, h, 8, 4);
  const trunk = new THREE.Mesh(trunkGeo, barkMat);
  trunk.position.y = h/2;
  trunk.castShadow = true; trunk.receiveShadow = true;
  // slight random lean
  trunk.rotation.x = (Math.random()-0.5)*0.15;
  trunk.rotation.z = (Math.random()-0.5)*0.15;
  g.add(trunk);

  // main canopy — flat umbrella
  const canopyGeo = new THREE.SphereGeometry(h*0.32, 8, 6);
  const canopy = new THREE.Mesh(canopyGeo, leafMat);
  canopy.scale.set(1, 0.28, 1);
  canopy.position.y = h;
  canopy.castShadow = true;
  g.add(canopy);

  // smaller surrounding canopy clumps
  for (let i=0; i<5; i++) {
    const clump = new THREE.Mesh(
      new THREE.SphereGeometry(h*0.18+Math.random()*0.06, 6, 4),
      leafMat
    );
    const a = (i/5)*Math.PI*2 + Math.random()*0.5;
    const dist = h*0.12+Math.random()*h*0.1;
    clump.position.set(Math.cos(a)*dist, h*0.92, Math.sin(a)*dist);
    clump.castShadow = true;
    g.add(clump);
  }

  g.position.set(x, 0, z);
  return g;
}

const treePositions = [
  [-10,-8,4.5],[12,-10,5.5],[-14,9,6],[8,12,4],[-7,-14,5.8],
  [16,16,3.8],[-18,-5,5.2],[19,-7,4.2],[-16,7,6.2],[-9,15,4.8],
];
treePositions.forEach(([x,z,h]) => scene.add(createAcacia(x,z,h)));

// some small bushes / scrub
for (let i=0; i<25; i++) {
  const bx = (Math.random()-0.5)*50;
  const bz = (Math.random()-0.5)*50;
  const bush = new THREE.Mesh(
    new THREE.SphereGeometry(0.3+Math.random()*0.5, 6, 4),
    new THREE.MeshStandardMaterial({ color:new THREE.Color().setHSL(0.22+Math.random()*0.08, 0.4, 0.3+Math.random()*0.2), roughness:0.8 })
  );
  bush.position.set(bx, 0.2, bz);
  bush.scale.y = 0.5+Math.random()*0.3;
  bush.castShadow = true; bush.receiveShadow = true;
  scene.add(bush);
}

// ═══════════════════════════════════════════════════════════════
//  TEXTURES — giraffe spots
// ═══════════════════════════════════════════════════════════════

function createSpotTexture(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');

  // warm tan base
  ctx.fillStyle = '#c8956a';
  ctx.fillRect(0, 0, w, h);

  // subtle base variation
  for (let i=0; i<200; i++) {
    const x=Math.random()*w, y=Math.random()*h;
    const r=5+Math.random()*15;
    const v=180+Math.floor(Math.random()*25);
    ctx.fillStyle=`rgba(${v},${Math.floor(v*0.65)},${Math.floor(v*0.3)},0.2)`;
    ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
  }

  // dark irregular spots
  ctx.fillStyle = '#5c3317';
  for (let i=0; i<55; i++) {
    const x=Math.random()*w, y=Math.random()*h;
    const rx=8+Math.random()*22, ry=6+Math.random()*18;
    ctx.save();
    ctx.translate(x,y);
    ctx.rotate(Math.random()*Math.PI);
    // irregular shape via bezier curves
    ctx.beginPath();
    const n=5+Math.floor(Math.random()*4);
    for (let j=0;j<n;j++){
      const a=(j/n)*Math.PI*2;
      const r=rx+(Math.random()-0.5)*rx*0.3;
      if(j===0)ctx.moveTo(Math.cos(a)*r,Math.sin(a)*r*ry/rx);
      else ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r*ry/rx);
    }
    ctx.closePath();ctx.fill();
    ctx.restore();
  }

  // smaller spots in between
  ctx.fillStyle = '#4a2810';
  for (let i=0; i<35; i++) {
    const x=Math.random()*w, y=Math.random()*h;
    ctx.beginPath();ctx.arc(x,y,2+Math.random()*6,0,Math.PI*2);ctx.fill();
  }

  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

const spotTex = createSpotTexture(512, 256);

// ═══════════════════════════════════════════════════════════════
//  GIRAFFE CONSTRUCTION
// ═══════════════════════════════════════════════════════════════

const giraffe = new THREE.Group();
scene.add(giraffe);

// Materials
const bodyMat = new THREE.MeshStandardMaterial({
  map: spotTex, roughness: 0.55, metalness: 0.02,
});
const neckMat = new THREE.MeshStandardMaterial({
  map: spotTex, roughness: 0.55, metalness: 0.02,
});
const legUpperMat = new THREE.MeshStandardMaterial({
  color: 0xd4a574, roughness: 0.5, metalness: 0.02,
});
const legLowerMat = new THREE.MeshStandardMaterial({
  color: 0xe8d5b7, roughness: 0.5, metalness: 0.02,
});
const hoofMat = new THREE.MeshStandardMaterial({
  color: 0x2a1a0a, roughness: 0.7, metalness: 0.05,
});
const headMat = new THREE.MeshStandardMaterial({
  color: 0xd4a574, roughness: 0.5, metalness: 0.02,
});
const muzzleMat = new THREE.MeshStandardMaterial({
  color: 0xc4956a, roughness: 0.55, metalness: 0.02,
});
const ossiconeMat = new THREE.MeshStandardMaterial({
  color: 0x8b6914, roughness: 0.6, metalness: 0.02,
});
const eyeMat = new THREE.MeshStandardMaterial({
  color: 0x0a0a0a, roughness: 0.2, metalness: 0.1,
});
const earInnerMat = new THREE.MeshStandardMaterial({
  color: 0xd4a0a0, roughness: 0.6, metalness: 0,
});
const tailMat = new THREE.MeshStandardMaterial({
  color: 0x8b6914, roughness: 0.7, metalness: 0.02,
});

// --- BODY ---
const bodyGroup = new THREE.Group();
bodyGroup.position.set(0, 2.82, 0);
bodyGroup.rotation.z = 0.08; // slight slope — shoulders higher
giraffe.add(bodyGroup);

// main torso — elongated sphere
const torsoGeo = new THREE.SphereGeometry(0.72, 32, 24);
torsoGeo.scale(1.8, 0.88, 0.72);
const torso = new THREE.Mesh(torsoGeo, bodyMat);
torso.castShadow = true; torso.receiveShadow = true;
bodyGroup.add(torso);

// belly — slightly lighter underside
const bellyGeo = new THREE.SphereGeometry(0.7, 24, 16);
bellyGeo.scale(1.5, 0.5, 0.55);
const belly = new THREE.Mesh(bellyGeo, new THREE.MeshStandardMaterial({
  color: 0xddc4a0, roughness: 0.6, metalness: 0.01,
}));
belly.position.y = -0.35;
belly.castShadow = true;
bodyGroup.add(belly);

// --- LEG HELPER ---
function createLeg(x, y, z, isFront) {
  const upperLen = isFront ? 1.18 : 1.12;
  const lowerLen = isFront ? 1.08 : 1.02;
  const upperTopR = 0.16;
  const upperBotR = 0.14;
  const lowerTopR = 0.13;
  const lowerBotR = 0.09;

  const hipPivot = new THREE.Group();
  hipPivot.position.set(x, y, z);
  bodyGroup.add(hipPivot);

  // upper leg
  const upperGeo = new THREE.CylinderGeometry(upperTopR, upperBotR, upperLen, 12);
  const upperLeg = new THREE.Mesh(upperGeo, legUpperMat);
  upperLeg.position.y = -upperLen/2;
  upperLeg.castShadow = true;
  hipPivot.add(upperLeg);

  // knee knob
  const kneeKnobGeo = new THREE.SphereGeometry(0.1, 8, 6);
  const kneeKnob = new THREE.Mesh(kneeKnobGeo, legUpperMat);
  kneeKnob.position.y = -upperLen;
  kneeKnob.castShadow = true;
  hipPivot.add(kneeKnob);

  // knee pivot
  const kneePivot = new THREE.Group();
  kneePivot.position.y = -upperLen;
  hipPivot.add(kneePivot);

  // lower leg
  const lowerGeo = new THREE.CylinderGeometry(lowerTopR, lowerBotR, lowerLen, 12);
  const lowerLeg = new THREE.Mesh(lowerGeo, legLowerMat);
  lowerLeg.position.y = -lowerLen/2;
  lowerLeg.castShadow = true;
  kneePivot.add(lowerLeg);

  // hoof
  const hoofGeo = new THREE.BoxGeometry(0.16, 0.1, 0.18);
  const hoof = new THREE.Mesh(hoofGeo, hoofMat);
  hoof.position.y = -lowerLen - 0.02;
  hoof.castShadow = true;
  kneePivot.add(hoof);

  // pastern (slight widening above hoof)
  const pasternGeo = new THREE.CylinderGeometry(0.1, 0.12, 0.15, 8);
  const pastern = new THREE.Mesh(pasternGeo, legLowerMat);
  pastern.position.y = -lowerLen + 0.08;
  kneePivot.add(pastern);

  return { hipPivot, kneePivot };
}

// Hips attach below body center; legs extend downward to ground (y≈0)
const fl = createLeg( 0.85, -0.50,  0.38, true);   // front left
const fr = createLeg( 0.85, -0.50, -0.38, true);   // front right
const bl = createLeg(-0.85, -0.62,  0.38, false);  // back left
const br = createLeg(-0.85, -0.62, -0.38, false);  // back right

// --- NECK ---
const neckPivot = new THREE.Group();
neckPivot.position.set(0.75, 0.55, 0); // at front-top of body
neckPivot.rotation.z = -0.28; // lean forward ~16°
bodyGroup.add(neckPivot);

const neckLen = 2.6;
const neckGeo = new THREE.CylinderGeometry(0.13, 0.22, neckLen, 16);
const neck = new THREE.Mesh(neckGeo, neckMat);
neck.position.y = neckLen/2;
neck.castShadow = true; neck.receiveShadow = true;
neckPivot.add(neck);

// mane — ridge along back of neck
const maneGeo = new THREE.BoxGeometry(0.04, neckLen, 0.06);
const mane = new THREE.Mesh(maneGeo, new THREE.MeshStandardMaterial({
  color: 0x5c3317, roughness: 0.7,
}));
mane.position.set(0, neckLen/2, -0.15);
mane.castShadow = true;
neckPivot.add(mane);

// --- HEAD ---
const headPivot = new THREE.Group();
headPivot.position.set(0, neckLen, 0);
headPivot.rotation.z = 0.35; // head angles forward from neck
neckPivot.add(headPivot);

// main head box
const headGeo = new THREE.BoxGeometry(0.65, 0.38, 0.42);
const head = new THREE.Mesh(headGeo, headMat);
head.position.set(0.3, 0, 0);
head.castShadow = true;
headPivot.add(head);

// muzzle
const muzzleGeo = new THREE.BoxGeometry(0.28, 0.3, 0.32);
const muzzle = new THREE.Mesh(muzzleGeo, muzzleMat);
muzzle.position.set(0.62, -0.04, 0);
muzzle.castShadow = true;
headPivot.add(muzzle);

// jaw
const jawGeo = new THREE.BoxGeometry(0.35, 0.15, 0.28);
const jaw = new THREE.Mesh(jawGeo, headMat);
jaw.position.set(0.32, -0.2, 0);
headPivot.add(jaw);

// eyes
[0.13, -0.13].forEach(z => {
  const eyeBall = new THREE.Mesh(new THREE.SphereGeometry(0.06, 8, 6), eyeMat);
  eyeBall.position.set(0.42, 0.06, z);
  headPivot.add(eyeBall);

  // eye highlight
  const highlight = new THREE.Mesh(
    new THREE.SphereGeometry(0.025, 6, 4),
    new THREE.MeshStandardMaterial({ color:0xffffff, roughness:0.1, emissive:0x333333, emissiveIntensity:0.3 })
  );
  highlight.position.set(0.44, 0.09, z-0.01);
  headPivot.add(highlight);
});

// nostrils
[-0.08, 0.08].forEach(z => {
  const nostril = new THREE.Mesh(new THREE.SphereGeometry(0.025, 6, 4), eyeMat);
  nostril.position.set(0.74, -0.06, z);
  headPivot.add(nostril);
});

// ossicones (horn-like)
function createOssicone(x, z) {
  const g = new THREE.Group();
  const coneGeo = new THREE.CylinderGeometry(0.03, 0.06, 0.35, 8);
  const cone = new THREE.Mesh(coneGeo, ossiconeMat);
  cone.position.y = 0.17;
  cone.castShadow = true;
  g.add(cone);

  // tuft on top
  const tuft = new THREE.Mesh(
    new THREE.SphereGeometry(0.05, 8, 4),
    new THREE.MeshStandardMaterial({ color:0x3a1f0a, roughness:0.8 })
  );
  tuft.position.y = 0.35;
  g.add(tuft);

  g.position.set(x, 0.3, z);
  g.rotation.z = 0.1;
  headPivot.add(g);
}
createOssicone(0.08, 0.12);
createOssicone(0.08, -0.12);

// ears
function createEar(z) {
  const g = new THREE.Group();
  const earGeo = new THREE.ConeGeometry(0.07, 0.22, 8, 4);
  const ear = new THREE.Mesh(earGeo, headMat);
  ear.rotation.z = z>0 ? -0.6 : 0.6;
  ear.rotation.x = z>0 ? -0.3 : -0.3;
  ear.position.set(0.15, 0.25, z*1.4);
  ear.castShadow = true;
  g.add(ear);

  // inner ear
  const innerGeo = new THREE.ConeGeometry(0.04, 0.16, 8, 4);
  const inner = new THREE.Mesh(innerGeo, earInnerMat);
  inner.rotation.copy(ear.rotation);
  inner.position.copy(ear.position);
  inner.position.z += z>0 ? 0.02 : -0.02;
  g.add(inner);

  headPivot.add(g);
}
createEar(0.14);
createEar(-0.14);

// --- TAIL ---
const tailPivot = new THREE.Group();
tailPivot.position.set(-1.1, 0.35, 0);
bodyGroup.add(tailPivot);

const tailGeo = new THREE.CylinderGeometry(0.03, 0.06, 1.0, 8);
const tail = new THREE.Mesh(tailGeo, tailMat);
tail.position.y = -0.5;
tail.castShadow = true;
tailPivot.add(tail);

// tail tuft
const tuftGeo = new THREE.SphereGeometry(0.07, 8, 4);
const tuftMesh = new THREE.Mesh(tuftGeo, new THREE.MeshStandardMaterial({
  color: 0x2a1808, roughness: 0.8,
}));
tuftMesh.position.y = -1.0;
tailPivot.add(tuftMesh);

// ═══════════════════════════════════════════════════════════════
//  ORBIT CONTROLS
// ═══════════════════════════════════════════════════════════════

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 3.0, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.4;
controls.minDistance = 5;
controls.maxDistance = 25;
controls.maxPolarAngle = Math.PI * 0.75;
controls.update();

// ═══════════════════════════════════════════════════════════════
//  ANIMATION — walk cycle
// ═══════════════════════════════════════════════════════════════

const clock = new THREE.Clock();
const walkSpeed = 1.4;          // cycles per second
const hipAmp = 0.42;            // hip swing amplitude (radians)
const kneeAmp = 0.65;           // knee bend amplitude

// phase offsets — diagonal pairs move together
const PH_FL = 0;
const PH_FR = Math.PI;
const PH_BL = Math.PI;
const PH_BR = 0;

// store references for animation
const legs = [
  { hip:fl.hipPivot, knee:fl.kneePivot, phase:PH_FL },
  { hip:fr.hipPivot, knee:fr.kneePivot, phase:PH_FR },
  { hip:bl.hipPivot, knee:bl.kneePivot, phase:PH_BL },
  { hip:br.hipPivot, knee:br.kneePivot, phase:PH_BR },
];

function animate() {
  requestAnimationFrame(animate);

  clock.getDelta(); // consume delta, keep clock ticking
  const t = clock.getElapsedTime();

  // --- walk cycle ---
  legs.forEach(leg => {
    const phase = t * walkSpeed * Math.PI * 2 + leg.phase;
    const hipAngle = Math.sin(phase) * hipAmp;

    // knee bends backward during swing phase (leg off ground), straight during stance
    const swing = Math.sin(phase);
    // knee folds back when hip is swinging backward (swing < 0), straightens forward
    const kneeAngle = Math.min(0, swing) * kneeAmp;

    leg.hip.rotation.z = hipAngle;
    leg.knee.rotation.z = kneeAngle;
  });

  // --- body bob ---
  const bob = Math.abs(Math.sin(t * walkSpeed * Math.PI * 2)) * 0.12;
  bodyGroup.position.y = 2.82 - bob * 0.5;

  // --- neck sway ---
  neckPivot.rotation.z = -0.28 + Math.sin(t * 0.55) * 0.06;
  neckPivot.rotation.x = Math.cos(t * 0.55 + 0.8) * 0.04;

  // --- head micro-movement ---
  headPivot.rotation.z = 0.35 + Math.sin(t * 0.7 + 0.5) * 0.04;

  // --- tail swish ---
  tailPivot.rotation.z = Math.sin(t * 1.3 + 1.5) * 0.35;
  tailPivot.rotation.x = Math.cos(t * 1.1 + 0.7) * 0.2;

  // --- gentle body sway ---
  bodyGroup.rotation.y = Math.sin(t * 0.3) * 0.03;

  controls.update();
  renderer.render(scene, camera);
}

// ═══════════════════════════════════════════════════════════════
//  RESIZE
// ═══════════════════════════════════════════════════════════════

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ═══════════════════════════════════════════════════════════════
//  START
// ═══════════════════════════════════════════════════════════════

animate();
console.log('🦒 Giraffe is walking! Drag to orbit, scroll to zoom.');
</script>
