<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Walking Giraffe - Three.js</title>
    <style>
        body { margin: 0; overflow: hidden; }
        canvas { display: block; }
    </style>
</head>
<body>
    <!-- Three.js will be loaded via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // --- Global variables ---
        let scene, camera, renderer;
        let giraffe;
        const clock = new THREE.Clock();
        let walkCycle = 0;

        // --- Initialization function ---
        function init() {
            // 1. Scene setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb); // Sky blue background

            // 2. Camera setup
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 5, 15);
            camera.lookAt(0, 3, 0);

            // 3. Renderer setup
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // 4. Lighting
            const ambientLight = new THREE.AmbientLight(0x404040, 2); // Soft white light
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 1.5);
            directionalLight.position.set(5, 10, 7.5);
            scene.add(directionalLight);

            // 5. Create the giraffe
            giraffe = createGiraffe();
            scene.add(giraffe);

            // 6. Ground plane
            const groundGeometry = new THREE.PlaneGeometry(50, 50);
            const groundMaterial = new THREE.MeshLambertMaterial({ color: 0x4CAF50 }); // Green ground
            const ground = new THREE.Mesh(groundGeometry, groundMaterial);
            ground.rotation.x = -Math.PI / 2;
            scene.add(ground);

            // 7. Event listeners
            window.addEventListener('resize', onWindowResize, false);

            // Start the animation loop
            animate();
        }

        // --- Giraffe Geometry Creator ---
        function createGiraffe() {
            const giraffeGroup = new THREE.Group();
            
            // Materials
            const bodyMaterial = new THREE.MeshStandardMaterial({ color: 0xF4A460 }); // Tan/Orange
            const legMaterial = new THREE.MeshStandardMaterial({ color: 0x654321 }); // Dark Brown

            // 1. Body (Simple cylinder)
            const bodyGeometry = new THREE.CylinderGeometry(1.5, 1.5, 8, 16);
            const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
            body.position.y = 4;
            giraffeGroup.add(body);

            // 2. Neck and Head (Simplified structure)
            const neckGeometry = new THREE.CylinderGeometry(0.8, 0.6, 6, 16);
            const neck = new THREE.Mesh(neckGeometry, bodyMaterial);
            neck.position.y = 4 + 8 + 3; // Position above the body
            neck.rotation.z = -Math.PI / 10; // Slight curve
            giraffeGroup.add(neck);

            const headGeometry = new THREE.SphereGeometry(0.8, 16, 16);
            const head = new THREE.Mesh(headGeometry, bodyMaterial);
            head.position.set(0, 6 + 3, 0);
            giraffeGroup.add(head);
            
            // 3. Legs (Four cylinders)
            const legGeometry = new THREE.CylinderGeometry(0.4, 0.4, 4, 8);
            const legMaterialInstance = new THREE.MeshStandardMaterial({ color: 0x654321 });
            
            // Legs positions relative to the body center (x, z)
            const legPositions = [
                { x: 1.0, z: 0.8 },  // Front Right
                { x: -1.0, z: 0.8 }, // Front Left
                { x: 1.0, z: -0.8 }, // Back Right
                { x: -1.0, z: -0.8 } // Back Left
            ];

            let legs = [];
            legPositions.forEach(pos => {
                const leg = new THREE.Mesh(legGeometry, legMaterialInstance);
                // Position the leg base slightly below the body center (y=2)
                leg.position.set(pos.x, 2, pos.z);
                giraffeGroup.add(leg);
                legs.push(leg);
            });

            giraffeGroup.userData.legs = legs; // Store legs for animation

            return giraffeGroup;
        }

        // --- Animation Loop ---
        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();
            
            // Update walking animation
            updateGait(delta);

            // Render the scene
            renderer.render(scene, camera);
        }

        // --- Gait Simulation ---
        function updateGait(delta) {
            const legs = giraffe.userData.legs;
            if (!legs || legs.length !== 4) return;

            // Simple cyclical gait pattern (trot/walk simulation)
            // We will use sine waves to simulate up/down and forward/backward motion.
            const walkSpeed = 5; // Controls how fast the cycle repeats
            
            // Calculate phase based on time
            walkCycle = (walkCycle + delta * walkSpeed) % (2 * Math.PI);

            // Apply movement to each leg
            legs.forEach((leg, i) => {
                // Simple alternating motion
                // Leg 1 & 3 (Front/Back Right): Cycle 0 -> 2PI
                // Leg 2 & 4 (Front/Back Left): Cycle PI -> 3PI (offset by PI)

                let phaseOffset = (i % 2 === 0) ? 0 : Math.PI; // Alternating start point
                
                // Y movement (up and down)
                // Simulates the swing of the leg
                let y_swing = Math.sin((walkCycle + phaseOffset) * 1.5) * 0.5; 
                
                // X movement (forward/backward displacement relative to the hip/body)
                let x_shift = Math.cos((walkCycle + phaseOffset) * 1.5) * 0.3; 
                
                // Apply the calculated shift
                leg.position.y = 2 + y_swing; // Base Y position (2) + swing
                leg.position.x += x_shift * (i % 2 === 0 ? 1 : -1) * 0.5; // Simple forward/backward motion based on side
            });
        }

        // --- Window Resize Handler ---
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Start the application
        init();
    </script>
</body>
</html>
