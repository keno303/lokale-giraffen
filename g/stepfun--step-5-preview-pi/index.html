<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Walking Giraffe — Three.js</title>
<style>
  :root {
    --panel: rgba(24, 22, 18, 0.72);
    --edge: rgba(255, 255, 255, 0.14);
    --text: #f2ece0;
    --dim: #b9b2a2;
    --accent: #e0a94e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #10130f; }
  body {
    font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text);
  }
  #view { position: fixed; inset: 0; display: block; touch-action: none; cursor: grab; }
  #view:active { cursor: grabbing; }

  .card {
    position: fixed;
    background: var(--panel);
    border: 1px solid var(--edge);
    border-radius: 12px;
    backdrop-filter: blur(14px) saturate(1.2);
    -webkit-backdrop-filter: blur(14px) saturate(1.2);
    box-shadow: 0 10px 34px rgba(0, 0, 0, 0.35);
  }
  #title { top: 16px; left: 16px; padding: 12px 16px 11px; max-width: 330px; }
  #title h1 {
    margin: 0 0 3px; font-size: 15px; font-weight: 650; letter-spacing: 0.2px;
  }
  #title h1 span { color: var(--accent); }
  #title p { margin: 0; color: var(--dim); font-size: 11.5px; }
  #title kbd {
    font: 10.5px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    background: rgba(255, 255, 255, 0.1); border: 1px solid var(--edge);
    border-radius: 4px; padding: 1px 4px; color: var(--text);
  }

  #panel { top: 16px; right: 16px; padding: 12px; width: 226px; }
  #panel .row { display: flex; gap: 6px; margin-bottom: 8px; }
  #panel .row:last-child { margin-bottom: 0; }
  button, select {
    flex: 1; appearance: none; font: inherit; font-size: 12px; color: var(--text);
    background: rgba(255, 255, 255, 0.08); border: 1px solid var(--edge);
    border-radius: 8px; padding: 7px 8px; cursor: pointer; transition: background .15s, border-color .15s;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  button:hover, select:hover { background: rgba(255, 255, 255, 0.16); }
  button.on { background: rgba(224, 169, 78, 0.24); border-color: rgba(224, 169, 78, 0.6); color: #ffe6bb; }
  select { width: 100%; }
  label.lbl { display: block; color: var(--dim); font-size: 11px; margin: 2px 0 5px; }
  input[type=range] { width: 100%; accent-color: var(--accent); margin: 0 0 2px; }
  #speed-val { color: var(--dim); font-size: 11px; }
  .hint { color: var(--dim); font-size: 11px; margin-top: 9px; line-height: 1.5; }
  #fps {
    position: fixed; left: 16px; bottom: 14px; color: var(--dim);
    font: 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
  }
  #nogl {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: #14160f; text-align: center; padding: 30px; z-index: 10;
  }
  @media (max-width: 720px) {
    #panel { width: 180px; padding: 10px; }
    #title { max-width: 220px; }
    #title p { display: none; }
  }
</style>
</head>
<body>
<canvas id="view"></canvas>

<div id="title" class="card">
  <h1>Walking <span>Giraffe</span></h1>
  <p>Procedural giraffe — real-time IK gait, no baked animation.<br>
     <kbd>drag</kbd> orbit · <kbd>wheel</kbd> zoom · <kbd>space</kbd> stand/walk · <kbd>C</kbd> coat</p>
</div>

<div id="panel" class="card">
  <div class="row">
    <button id="btn-walk" class="on">Walking</button>
    <button id="btn-orbit" class="on">Auto-orbit</button>
  </div>
  <div class="row">
    <button data-preset="full" class="on">Full</button>
    <button data-preset="side">Side</button>
  </div>
  <div class="row">
    <button data-preset="head">Head</button>
    <button data-preset="legs">Legs</button>
    <button data-preset="top">Top</button>
  </div>
  <div class="row">
    <select id="coat">
      <option value="masai">Masai giraffe</option>
      <option value="reticulated">Reticulated giraffe</option>
      <option value="southern">Southern giraffe</option>
      <option value="rothschild">Rothschild's giraffe</option>
    </select>
  </div>
  <label class="lbl" for="speed">Walking speed — <span id="speed-val">1.15 m/s</span></label>
  <input id="speed" type="range" min="0.25" max="1.6" step="0.01" value="1.15">
  <div class="hint">Keys: <kbd>1</kbd>–<kbd>5</kbd> views · <kbd>space</kbd> stand · <kbd>O</kbd> orbit · <kbd>C</kbd> coat</div>
</div>

<div id="fps"></div>
<div id="nogl"><div>
  <h2>WebGL unavailable</h2>
  <p>This page needs WebGL to render the giraffe.</p>
</div></div>

<script src="lib/three.global.js"></script>
<script src="js/geom.js"></script>
<script src="js/textures.js"></script>
<script src="js/giraffe.js"></script>
<script src="js/environment.js"></script>
<script src="js/main.js"></script>
</body>
</html>
