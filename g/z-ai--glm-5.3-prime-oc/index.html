<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================
   0. small utilities
============================================================ */
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = t => t * t * (3 - 2 * t);
const TAU = Math.PI * 2;

function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* ============================================================
   1. pure gait + IK math  (kept standalone & dependency-free
      so it can be unit-tested outside the browser)
============================================================ */
const GAIT = {
  T: 1.18,          // stride cycle duration [s]
  dutyF: 0.65,      // stance fraction, front legs
  dutyH: 0.73,      // stance fraction, hind legs (longer stance, bigger stride)
  v: 1.4,           // forward speed [m/s]
  liftF: 0.24,      // swing lift, front [m]
  liftH: 0.27,      // swing lift, hind [m]
  R: 16,            // radius of walking circle [m]
  // lateral-sequence walk (like giraffes): LH, LF, RH, RF footfalls
  offsets: { LH: 0.0, LF: 0.25, RH: 0.5, RF: 0.75 },
  standY: 0.105,    // ankle(=top of hoof) height when planted
};

// amplitude of the stance sweep, so that the planted foot moves
// backwards in the body frame at exactly -v (=> no foot sliding)
function strideAmp(v, duty, T) { return v * duty * T * 0.5; }

// foot position (x,y) in the giraffe's local frame for one leg.
// neutralX: resting x under the hip; v: current speed.
// swingFromX: x where the swing actually started (defaults to neutralX - A).
function footTarget(phase, neutralX, v, duty, T, lift, swingFromX) {
  const A = strideAmp(v, duty, T);
  const p = phase - Math.floor(phase);
  let x, y;
  if (p < duty) {                       // stance: slide back at speed v
    const s = p / duty;                 // 0 = just landed, 1 = about to lift
    x = neutralX + A * (1 - 2 * s);
    y = GAIT.standY;
  } else {                              // swing: lift and carry forward
    // Hermite curve whose slope matches the stance velocity at BOTH ends:
    // the hoof leaves the ground moving backwards relative to the body and
    // touches down already stationary in the world (no landing skid). The
    // slope constraint naturally produces the slight protraction overshoot
    // real legs show just before touchdown.
    const s = (p - duty) / (1 - duty);  // 0 = liftoff, 1 = touchdown
    const m = -v * (1 - duty) * T;      // dx/ds at both endpoints
    const x0 = (swingFromX === undefined || swingFromX === null) ? neutralX - A : swingFromX;
    const s2 = s * s, s3 = s2 * s;
    x = x0 * (2 * s3 - 3 * s2 + 1) + m * (s3 - 2 * s2 + s)
      + (neutralX + A) * (-2 * s3 + 3 * s2) + m * (s3 - s2);
    y = GAIT.standY + lift * Math.sin(Math.PI * s) ** 2;  // gentle leave & land
  }
  return { x, y };
}

// 2-bone analytic IK in the sagittal (x,y) plane.
// bend: +1 -> knee bulges toward +x side of hip->foot line, -1 -> -x side.
function solveIK2(hipx, hipy, footx, footy, L1, L2, bend) {
  let dx = footx - hipx, dy = footy - hipy;
  let d = Math.hypot(dx, dy);
  const maxD = (L1 + L2) * 0.9995, minD = Math.abs(L1 - L2) * 1.0005;
  if (d > maxD) { const s = maxD / d; dx *= s; dy *= s; d = maxD; }
  if (d < minD) { const s = minD / Math.max(d, 1e-6); dx *= s; dy *= s; d = minD; }
  const a = Math.atan2(dy, dx);
  const cosB = clamp((L1 * L1 + d * d - L2 * L2) / (2 * L1 * d), -1, 1);
  const B = Math.acos(cosB);
  const t1 = a + bend * B;              // absolute angle of bone 1
  const kx = hipx + L1 * Math.cos(t1);
  const ky = hipy + L1 * Math.sin(t1);
  return { t1, kx, ky, clamped: d >= maxD || d <= minD };
}

/* ============================================================
   2. procedural textures (canvas)
============================================================ */
function canvasTexture(canvas, { srgb = true, repeat = null } = {}) {
  const t = new THREE.CanvasTexture(canvas);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat[0], repeat[1]); }
  return t;
}

// seamless (torus-wrapped) jittered-grid Voronoi → reticulated coat
function makeCoatTexture({ size = 1024, grid = 13, lineW = 2, seed = 7,
                           patch = [128, 82, 40], patchVar = 26, line = [241, 226, 195] }) {
  const rng = mulberry32(seed);
  const cell = size / grid;
  const seeds = new Float32Array(grid * grid * 2);
  const tint = new Float32Array(grid * grid);
  for (let i = 0; i < grid * grid; i++) {
    const gx = i % grid, gy = (i / grid) | 0;
    seeds[i * 2] = (gx + 0.15 + 0.7 * rng()) * cell;
    seeds[i * 2 + 1] = (gy + 0.15 + 0.7 * rng()) * cell;
    tint[i] = rng();
  }
  const idx = new Int16Array(size * size);
  const wrapD = (d, m) => d - m * Math.round(d / m);
  for (let y = 0; y < size; y++) {
    const gy = (y / cell) | 0;
    for (let x = 0; x < size; x++) {
      const gx = (x / cell) | 0;
      let best = 1e18, bi = 0;
      for (let oy = -1; oy <= 1; oy++) {
        const cy = (gy + oy + grid) % grid;
        for (let ox = -1; ox <= 1; ox++) {
          const cx = (gx + ox + grid) % grid;
          const si = (cy * grid + cx) * 2;
          const dx = wrapD(seeds[si] - x, size);
          const dy = wrapD(seeds[si + 1] - y, size);
          const d2 = dx * dx + dy * dy;
          if (d2 < best) { best = d2; bi = cy * grid + cx; }
        }
      }
      idx[y * size + x] = bi;
    }
  }
  const cv = document.createElement('canvas'); cv.width = cv.height = size;
  const ctx = cv.getContext('2d');
  const img = ctx.createImageData(size, size);
  const data = img.data;
  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      const i = y * size + x;
      const here = idx[i];
      let isLine = false;
      for (let oy = -lineW; oy <= lineW && !isLine; oy++) {
        for (let ox = -lineW; ox <= lineW; ox++) {
          const j = ((y + oy + size) % size) * size + ((x + ox + size) % size);
          if (idx[j] !== here) { isLine = true; break; }
        }
      }
      const n = (Math.sin(x * 12.9898 + y * 78.233) * 43758.5453) % 1; // fine grain
      const nz = (n - Math.floor(n) - 0.5) * 0.10;
      const o = i * 4;
      if (isLine) {
        data[o] = line[0] * (1 + nz); data[o + 1] = line[1] * (1 + nz);
        data[o + 2] = line[2] * (1 + nz); data[o + 3] = 255;
      } else {
        const tv = (tint[here] - 0.5) * patchVar;
        data[o] = patch[0] + tv + nz * 255 * 0.5;
        data[o + 1] = patch[1] + tv * 0.8 + nz * 255 * 0.5;
        data[o + 2] = patch[2] + tv * 0.6 + nz * 255 * 0.5;
        data[o + 3] = 255;
      }
    }
  }
  ctx.putImageData(img, 0, 0);
  return cv;
}

// seamless value-noise fbm savanna ground
function makeGroundTexture(size = 2048, seed = 11) {
  const rng = mulberry32(seed);
  const hash = (ix, iy, p) => {
    let h = (ix * 127.1 + iy * 311.7 + seed * 0.01) % 43758.5453;
    h = Math.sin(h) * 43758.5453;
    return h - Math.floor(h);
  };
  const vnoise = (x, y, p) => {
    const ix = Math.floor(x), iy = Math.floor(y);
    const fx = smooth(x - ix), fy = smooth(y - iy);
    const w = (i, j) => hash(((i % p) + p) % p, ((j % p) + p) % p, p);
    const a = w(ix, iy), b = w(ix + 1, iy), c = w(ix, iy + 1), d = w(ix + 1, iy + 1);
    return lerp(lerp(a, b, fx), lerp(c, d, fx), fy);
  };
  const cv = document.createElement('canvas'); cv.width = cv.height = size;
  const ctx = cv.getContext('2d');
  const img = ctx.createImageData(size, size);
  const data = img.data;
  const dry = [176, 155, 104], green = [122, 138, 78], dirt = [150, 122, 82];
  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      const u = x / size, v = y / size;
      const n1 = vnoise(u * 6, v * 6, 6) * 0.55 + vnoise(u * 12, v * 12, 12) * 0.30 + vnoise(u * 24, v * 24, 24) * 0.15;
      const n2 = vnoise(u * 90, v * 90, 90);
      const n3 = vnoise(u * 360 + 5, v * 360 + 9, 360);
      const g = smooth(clamp((n1 - 0.42) * 3.2, 0, 1)); // grass blotches
      const dr = smooth(clamp((n1 - 0.30) * -2.2, 0, 1)) * 0.6; // bare dirt dips
      const sp = (rng() - 0.5) * 14 + (n3 - 0.5) * 20;
      const o = (y * size + x) * 4;
      for (let ch = 0; ch < 3; ch++) {
        let c = lerp(dry[ch], green[ch], g);
        c = lerp(c, dirt[ch], dr);
        data[o + ch] = clamp(c + sp, 0, 255);
      }
      data[o + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  return cv;
}

function makeGrassBladeTexture(size = 128) {
  const rng = mulberry32(23);
  const cv = document.createElement('canvas'); cv.width = cv.height = size;
  const ctx = cv.getContext('2d');
  ctx.clearRect(0, 0, size, size);
  ctx.lineCap = 'round';
  for (let i = 0; i < 11; i++) {
    const x0 = size * (0.3 + 0.4 * rng());
    const lean = (rng() - 0.5) * 34;
    const top = size * (0.12 + 0.30 * rng());
    const greens = ['#6f7f3a', '#87924a', '#9aa050', '#5d6c33', '#a3a05a'];
    ctx.strokeStyle = greens[(rng() * greens.length) | 0];
    ctx.lineWidth = 2.2 + rng() * 2.4;
    ctx.beginPath();
    ctx.moveTo(x0, size);
    ctx.quadraticCurveTo(x0 + lean * 0.3, size * 0.55, x0 + lean, top);
    ctx.stroke();
  }
  // a few pale seed heads
  for (let i = 0; i < 6; i++) {
    const x0 = size * (0.25 + 0.5 * rng()), top = size * (0.1 + 0.2 * rng());
    ctx.fillStyle = 'rgba(214,196,130,0.9)';
    ctx.beginPath(); ctx.arc(x0 + (rng() - 0.5) * 20, top, 1.6 + rng() * 1.6, 0, TAU); ctx.fill();
  }
  return cv;
}

function makeDustTexture(size = 64) {
  const cv = document.createElement('canvas'); cv.width = cv.height = size;
  const ctx = cv.getContext('2d');
  const g = ctx.createRadialGradient(size / 2, size / 2, 1, size / 2, size / 2, size / 2);
  g.addColorStop(0, 'rgba(196,176,146,0.55)');
  g.addColorStop(0.55, 'rgba(186,166,136,0.22)');
  g.addColorStop(1, 'rgba(186,166,136,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, size, size);
  return cv;
}

function makeSkyTexture() {
  const cv = document.createElement('canvas'); cv.width = 16; cv.height = 512;
  const ctx = cv.getContext('2d');
  const g = ctx.createLinearGradient(0, 0, 0, 512);
  g.addColorStop(0.0, '#7fa8cf');   // zenith
  g.addColorStop(0.45, '#a8c4dc');
  g.addColorStop(0.72, '#d5dcd2');
  g.addColorStop(0.88, '#ead9ba');  // warm horizon haze
  g.addColorStop(1.0, '#e6d3ac');
  ctx.fillStyle = g; ctx.fillRect(0, 0, 16, 512);
  return cv;
}

/* ============================================================
   3. renderer / scene / camera / lights
============================================================ */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = canvasTexture(makeSkyTexture());
scene.fog = new THREE.Fog(0xe6d3ac, 55, 240);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 800);
camera.position.set(4, 3.0, 21);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.maxPolarAngle = 1.53;
controls.minDistance = 3.5;
controls.maxDistance = 55;
controls.target.set(12, 2.6, 10);

const hemi = new THREE.HemisphereLight(0xcfe0ee, 0xa08560, 0.85);
scene.add(hemi);
const sunGroup = new THREE.Group();
scene.add(sunGroup);
const sun = new THREE.DirectionalLight(0xffe9c4, 2.9);
sun.position.set(18, 14, 10);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 90;
sun.shadow.camera.left = -8; sun.shadow.camera.right = 8;
sun.shadow.camera.top = 8; sun.shadow.camera.bottom = -8;
sun.shadow.bias = -0.0002;
sun.shadow.normalBias = 0.035;
sunGroup.add(sun);
sunGroup.add(sun.target); // target at group origin

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* ============================================================
   4. environment — savanna
============================================================ */
const groundCanvas = makeGroundTexture(2048);
const groundTex = canvasTexture(groundCanvas, { repeat: [22, 22] });
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(220, 72),
  new THREE.MeshStandardMaterial({ map: groundTex, bumpMap: groundTex, bumpScale: 0.35, roughness: 1 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// worn dirt path under the walking circle (soft edges so the mesh boundary shows)
const ringCv = document.createElement('canvas'); ringCv.width = ringCv.height = 256;
{
  const c = ringCv.getContext('2d');
  const rng = mulberry32(31);
  const outerPx = 128, innerPx = 128 * (GAIT.R - 3.4) / (GAIT.R + 3.4);
  const fade = (r, a, b) => clamp((r - a) / (b - a), 0, 1);
  for (let y = 0; y < 256; y++) for (let x = 0; x < 256; x++) {
    const r = Math.hypot(x - 128, y - 128);
    const t = fade(r, innerPx, innerPx + 16) * (1 - fade(r, outerPx - 14, outerPx));
    if (t > 0.01) {
      const n = 0.82 + 0.34 * (rng() - 0.5);
      c.fillStyle = `rgba(${(160 * n) | 0},${(133 * n) | 0},${(97 * n) | 0},${t})`;
      c.fillRect(x, y, 1, 1);
    }
  }
}
const ring = new THREE.Mesh(
  new THREE.RingGeometry(GAIT.R - 3.4, GAIT.R + 3.4, 96),
  new THREE.MeshStandardMaterial({
    map: canvasTexture(ringCv), transparent: true, depthWrite: false,
    roughness: 1, polygonOffset: true, polygonOffsetFactor: -1
  })
);
ring.rotation.x = -Math.PI / 2;
ring.position.y = 0.012;
ring.receiveShadow = true;
scene.add(ring);

// distant hills, half-swallowed by haze
const hillMat = new THREE.MeshStandardMaterial({ color: 0x9aa37a, roughness: 1 });
for (let i = 0; i < 6; i++) {
  const a = i * 1.05 + 0.4;
  const r = 175 + 55 * Math.sin(i * 2.3);
  const h = new THREE.Mesh(new THREE.SphereGeometry(46 + 26 * Math.sin(i * 1.7), 24, 12), hillMat);
  h.scale.set(1.9, 0.30 + 0.10 * Math.sin(i * 3.1), 1.2);
  h.position.set(r * Math.cos(a), -8, r * Math.sin(a));
  scene.add(h);
}

// acacia trees
const trunkMat = new THREE.MeshStandardMaterial({ color: 0x6b4f33, roughness: 1 });
const canopyMats = [0x4a5c2e, 0x556b33, 0x61713a].map(c =>
  new THREE.MeshStandardMaterial({ color: c, roughness: 1 }));
function makeTree(s) {
  const g = new THREE.Group();
  const lower = new THREE.Mesh(new THREE.CylinderGeometry(0.10, 0.16, 2.6, 8), trunkMat);
  lower.position.y = 1.3; lower.castShadow = true; g.add(lower);
  const upper = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.10, 1.5, 8), trunkMat);
  upper.position.set(0.15, 3.3, 0); upper.rotation.z = 0.14; upper.castShadow = true; g.add(upper);
  for (let i = 0; i < 3; i++) {
    const br = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.045, 1.4, 6), trunkMat);
    br.position.set(0.1, 3.9, 0);
    br.rotation.z = 0.9 * Math.cos(i * 2.1);
    br.rotation.x = 0.9 * Math.sin(i * 2.1);
    br.castShadow = true; g.add(br);
  }
  const blob = [[0, 4.4, 0, 2.1, 0.36], [1.35, 4.1, 0.7, 1.5, 0.30], [-1.2, 4.25, -0.6, 1.7, 0.32], [0.2, 4.7, -1.1, 1.3, 0.28]];
  blob.forEach((b, i) => {
    const m = new THREE.Mesh(new THREE.SphereGeometry(b[3], 20, 12), canopyMats[i % 3]);
    m.position.set(b[0], b[1], b[2]);
    m.scale.set(1, b[4], 0.85);
    m.castShadow = true; g.add(m);
  });
  g.scale.setScalar(s);
  return g;
}
const treeSpots = [
  [19, 1.5, 1.15], [-22, 0.6, 0.95], [8, -21, 1.05], [-14, -19, 0.8], [30, 14, 1.25], [-33, 10, 0.9], [24, -26, 1.1]
];
treeSpots.forEach(([x, z, s]) => { const t = makeTree(s); t.position.set(x, 0, z); t.rotation.y = x * 1.7 + z; scene.add(t); });

// a few rocks
const rockMat = new THREE.MeshStandardMaterial({ color: 0x8a8177, roughness: 1, flatShading: true });
for (let i = 0; i < 6; i++) {
  const a = i * 1.9 + 0.8, r = 9 + 30 * ((i * 0.37) % 1);
  const rk = new THREE.Mesh(new THREE.DodecahedronGeometry(0.35 + 0.3 * (i % 3) * 0.5, 0), rockMat);
  rk.position.set(r * Math.cos(a), 0.12, r * Math.sin(a));
  rk.scale.set(1 + (i % 2), 0.7, 1);
  rk.rotation.set(i, i * 2, 0);
  rk.castShadow = rk.receiveShadow = true;
  scene.add(rk);
}

// grass tufts — two crossed quads per tuft, instanced
const bladeTex = canvasTexture(makeGrassBladeTexture());
function crossedQuadGeometry(w, h) {
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array([
    -w / 2, 0, 0,  w / 2, 0, 0,  w / 2, h, 0,  -w / 2, h, 0,      // quad A (XY)

/* ============================================================
   8. animation — gait controller, IK, secondary motion
============================================================ */
const clock = new THREE.Clock();
let phi = 0;                       // gait phase 0..1
let vCur = 0;                      // eased forward speed
let speedMul = 1;                  // from UI slider
let walking = true;                // from UI pause button
let followCam = true;
let circleA = 0.9;                 // position on walking circle
let state = 'walk', stateT = 0, stateDur = 21;
let blinkT = 0, nextBlink = 2.5;
const earFlick = [{ t: 0, next: 3 }, { t: 0, next: 5 }];
let tailSwishT = 99, nextSwish = 5;
const prevRootPos = new THREE.Vector3();
giraffe.position.set(GAIT.R * Math.sin(circleA), 0, GAIT.R * Math.cos(circleA));
giraffe.rotation.y = circleA;
prevRootPos.copy(giraffe.position);

const tmpV = new THREE.Vector3();

function setState(s) {
  state = s; stateT = 0;
  stateDur = s === 'walk' ? 16 + Math.random() * 12 : 5 + Math.random() * 4;
}

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  // ---- behaviour state machine --------------------------------
  stateT += dt;
  if (stateT > stateDur) setState(state === 'walk' ? 'pause' : 'walk');
  const vTarget = (walking && state === 'walk') ? GAIT.v * speedMul : 0;
  vCur += (vTarget - vCur) * Math.min(1, dt * 1.6);
  if (vCur < 0.001) vCur = 0;
  const amp = clamp(vCur / GAIT.v, 0, 1.4);   // amplitude follows speed

  // ---- gait phase ---------------------------------------------
  phi = (phi + dt / GAIT.T) % 1;

  // ---- body motion (bob / sway / roll) ------------------------
  const bob = 0.014 * Math.cos(4 * Math.PI * (phi - 0.12)) * amp; // low at front extremes
  body.position.y = bob;
  body.position.z = 0.05 * Math.sin(2 * Math.PI * phi) * amp; // lateral sway (pacing gait)
  body.rotation.x = 0.028 * Math.sin(2 * Math.PI * phi) * amp;
  body.rotation.z = 0.010 * Math.cos(4 * Math.PI * phi + 0.7) * amp;

  // ---- root motion along the circle ---------------------------
  circleA += (vCur / GAIT.R) * dt;
  giraffe.position.set(GAIT.R * Math.sin(circleA), 0, GAIT.R * Math.cos(circleA));
  giraffe.rotation.y = circleA;

  // ---- legs: foot targets + IK ---------------------------------
  for (const leg of LEGS) {
    const p = (phi + leg.offset) % 1;
    const landed = p < leg.prevPhase;            // phase wrapped -> touchdown
    if (landed) {
      leg.swingFromX = undefined;
      if (vCur > 0.4) {                          // dust puff at hoof-down
        leg.fetlock.getWorldPosition(tmpV);
        spawnDust(tmpV);
      }
    }

    let ft;
    if (p < leg.duty) {                          // stance: foot fixed in world
      if (landed) {
        const fx = leg.neutralX + strideAmp(vCur, leg.duty, GAIT.T);
        const ca = Math.cos(circleA), sa = Math.sin(circleA);
        leg.plantedW = {
          x: giraffe.position.x + fx * ca + leg.hipZ * sa,
          z: giraffe.position.z - fx * sa + leg.hipZ * ca,
        };
      }
      if (leg.plantedW) {
        const dx = leg.plantedW.x - giraffe.position.x;
        const dz = leg.plantedW.z - giraffe.position.z;
        const ca = Math.cos(circleA), sa = Math.sin(circleA);
        ft = { x: dx * ca - dz * sa, y: GAIT.standY };
        // the planted point also drifts laterally in the local frame as the
        // body yaws — let the leg track it (legs splay slightly on a curve)
        const lz = dx * sa + dz * ca;
        leg.legRoot.position.z = leg.hipZ + clamp(lz - leg.hipZ, -0.09, 0.09);
      } else {
        ft = footTarget(p, leg.neutralX, vCur, leg.duty, GAIT.T, leg.lift);
      }
      leg.lastStanceX = ft.x;
    } else {                                     // swing
      if (leg.prevPhase < leg.duty && leg.lastStanceX !== undefined) {
        leg.swingFromX = leg.lastStanceX;        // continue from where it lifted
      }
      leg.legRoot.position.z += (leg.hipZ - leg.legRoot.position.z) * Math.min(1, dt * 4);
      ft = footTarget(p, leg.neutralX, vCur, leg.duty, GAIT.T, leg.lift, leg.swingFromX);
    }
    leg.prevPhase = p;

    const hipY = leg.hipY + bob;
    const ik = solveIK2(leg.hipX, hipY, ft.x, ft.y, leg.L1, leg.L2, -1); // bend: joint behind the line

    // rotate the rigid upper assembly so its hip->knee vector matches IK bone 1
    const phiA = Math.atan2(leg.kneeLocal.y, leg.kneeLocal.x);
    leg.assembly.rotation.z = ik.t1 - phiA;

    // cannon: from knee to foot
    const psi = Math.atan2(ft.y - ik.ky, ft.x - ik.kx);      // world angle knee->foot
    const cannonWorld = Math.atan2(Math.cos(psi), -Math.sin(psi)); // -Y-axis bone
    leg.cannon.rotation.z = cannonWorld - leg.assembly.rotation.z;

    // fetlock/hoof: toe droops during swing, heel lifts late in stance
    let hRot = 0;
    if (p >= leg.duty) hRot += 0.38 * Math.sin(Math.PI * (p - leg.duty) / (1 - leg.duty)) * (0.4 + 0.6 * amp);
    else if (p > leg.duty * 0.75) hRot += 0.25 * ((p / leg.duty - 0.75) / 0.25) * amp;
    leg.fetlock.rotation.z = -hRot;   // negative = toe tips down
  }

  // ---- neck & head ----------------------------------------------
  const neckOsc = 0.030 * Math.sin(4 * Math.PI * phi + 0.8) * amp;
  const neckIdle = 0.05 * Math.sin(t * 0.31) + 0.03 * Math.sin(t * 0.13 + 2);
  neckSegs[0].rotation.z = -0.55 + neckOsc + neckIdle * 0.6;
  neckSegs[1].rotation.z = -0.12 + 0.4 * neckOsc;
  neckSegs[2].rotation.z = 0.10 + 0.25 * neckOsc;
  neckSegs[0].rotation.y = 0.03 * Math.sin(2 * Math.PI * phi + 0.5) * amp;

  // head: partially stabilises against neck+body motion
  let headZ = 0.50 - 0.55 * neckOsc - 0.8 * body.rotation.z + 0.02 * Math.sin(t * 0.9);
  let headY = 0;
  if (state === 'pause') {
    // look around; occasionally toward the camera
    const lookW = clamp(stateT / 1.2, 0, 1) * clamp((stateDur - stateT) / 0.8, 0, 1);
    const gaze = 0.35 * Math.sin(t * 0.45) + 0.2 * Math.sin(t * 0.9 + 1.3);
    headY = lerp(headY, gaze, lookW);
    neckSegs[0].rotation.y = lerp(neckSegs[0].rotation.y, gaze * 0.5, lookW);
    tmpV.copy(camera.position);
    giraffe.worldToLocal(tmpV);
    const dx = tmpV.x - 1.3, dz = tmpV.z;
    const camYaw = clamp(Math.atan2(-dz, dx), -0.75, 0.75);
    if (Math.sin(t * 0.18) > 0.15) {   // glances at the viewer now and then
      headY = lerp(headY, camYaw * 0.6, lookW);
      neckSegs[0].rotation.y = lerp(neckSegs[0].rotation.y, camYaw * 0.35, lookW);
    }
    headZ += 0.10 * lookW;             // lowers the head a touch while idling
    neckSegs[0].rotation.z -= 0.12 * lookW;  // neck dips gently
  }
  head.rotation.z = headZ;
  head.rotation.y = headY;

  // ---- blink -----------------------------------------------------
  blinkT += dt;
  if (blinkT > nextBlink) { blinkT = 0; nextBlink = 2.5 + Math.random() * 4.5; }
  const bl = blinkT < 0.22 ? 1 - 0.94 * Math.sin(Math.PI * blinkT / 0.22) : 1;
  eyes.forEach(e => { e.scale.y = bl; });

  // ---- ear flicks --------------------------------------------------
  earFlick.forEach((ef, i) => {
    if (ef.t > 0) ef.t += dt;
    if (ef.t === 0 && t > ef.next) ef.t = 0.0001;
    if (ef.t > 0.7) { ef.t = 0; ef.next = t + 2 + Math.random() * 6; }
    const e = Math.exp(-5 * ef.t) * Math.sin(18 * ef.t) * 0.55 * (ef.t > 0 ? 1 : 0);
    ears[i].rotation.x = ears[i].userData.baseX + e;
  });

  // ---- tail --------------------------------------------------------
  tailSwishT += dt;
  if (tailSwishT > nextSwish) { tailSwishT = 0; nextSwish = 3.5 + Math.random() * 5; }
  const swish = tailSwishT < 0.9 ? 0.8 * Math.sin(Math.PI * tailSwishT / 0.9) : 0;
  const sway = 0.4 * Math.sin(TAU * 0.55 * t) + swish * Math.sin(TAU * 3.2 * t);
  tailSegs[0].rotation.x = sway;
  for (let i = 1; i < 4; i++) {
    tailSegs[i].rotation.x = 0.55 * Math.sin(TAU * 0.55 * t - 0.7 * i) + swish * Math.sin(TAU * 3.2 * t - 1.1 * i);
  }

  // ---- dust, birds, sun, camera ------------------------------------
  updateDust(dt);
  for (const b of birds) {
    const u = b.userData;
    u.a += u.w * dt;
    b.position.set(u.r * Math.cos(u.a), u.h + 1.5 * Math.sin(u.a * 2.7), u.r * Math.sin(u.a));
  }
  sunGroup.position.copy(giraffe.position);
  if (followCam) {
    tmpV.copy(giraffe.position).sub(prevRootPos);
    camera.position.add(tmpV);
    controls.target.add(tmpV);
  }
  prevRootPos.copy(giraffe.position);
  controls.update();
  renderer.render(scene, camera);
}

/* ============================================================
   9. UI wiring + boot
============================================================ */
window.__booted = true;
document.getElementById('btnPause').addEventListener('click', (e) => {
  walking = !walking;
  e.target.textContent = walking ? 'Pause walk' : 'Resume walk';
  e.target.classList.toggle('active', walking);
  if (!walking && state === 'walk') stateDur = Math.min(stateDur, stateT + 0.4);
});
document.getElementById('btnFollow').addEventListener('click', (e) => {
  followCam = !followCam;
  e.target.classList.toggle('active', followCam);
});
document.getElementById('speed').addEventListener('input', (e) => {
  speedMul = parseFloat(e.target.value);
});

setState('walk');
animate();
const loadingEl = document.getElementById('loading');
loadingEl.style.opacity = '0';
setTimeout(() => loadingEl.remove(), 900);
</script>
